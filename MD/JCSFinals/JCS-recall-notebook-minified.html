 with cough and SOB \n \nTake focus Hx \n \nFocus and general examination \n \nDDx  (bronchiectasis, asthma, COPD…) \n \nManagement (according to the most likely diagnosis) \n \nSTATION 2# (cardiology) \n35 yrs old gentleman present with palpitation and SOB  \n \nTake focus Hx \n \nFocus  examination \n \nDDx   \n \nManagement  \n(NOTE: has metallic valve mitral valve replacement) \n \nSTATION 3# (neurology) TIA \n65 yrs old gentleman present with right side weakness since today morning  \n \nTake focus Hx \n \nDDx   \n \nManagement plan \n \nSTATION 4# (infectious control) \n33 yrs old businessman present with fever and he came from Congo \n \nTake focus Hx \n \nDDx   \n \nManagement  plan (investigation and medication anti-malarial chloroquine, \nmefloquine…) \nNOTE: there is microscopic picture of causative organism malaria \nExaminer will ask about the causative organism of malariap.malaria, p.vivax, p.ovale… \n \n \n \n",22:"ALL THE BEST \n \nMaryam Al-Jabri \n \nSTATION 5# (pediatrics) CYSTIC FIBROSIS \n25 ys old lady came to genetic clinic with her husband (their daughter has cystic fibrosis) \ngenetic counseling  \n \nTake focus Hx \n \nDraw family pedigree  \n \nCounsel them about risk of inheritance for next child \n \n  \nSTATION 6# (pediatrics) DARK URINE \nMother of 5 yrs old boy brought her child bcz of dark urine since 3 days , her child has sore \nthroat 2 weeks back \n \n Take focus Hx \n \n DDx   \n \n Management  plan \n \n \nSTATION 7# (pediatrics) CROUP \nMother of 3 yrs old child brought her child bcz of difficulty in breathinghas stridor, barking \ncough \n \nTake focus Hx \n \nDDx (croup, trachitis, retropharyngeal abscess,…) \n \nManagement plan \n \n \nSTATION 8# (pediatrics) LIMPING \n5 yrs old child present with limping since 4 weeks (the informant is his mother) \n \nTake focus Hx \n \nDDx  ( IgA, SLE, JIA, septic arthritis..) \n \nManagement  plan \n \n \n \n \n \n \n \n \n \n \n",23:"ALL THE BEST \n \nMaryam Al-Jabri \n \n \nSURGERY & ALLIED \nSTATION 1# (ORTHOPEDICS) \nPatient present with fracture of tibia and fibula (interarticular fracture) bcz of accident \n \nTake focus Hx \n \n How you will manage the patient \n \nComplication of fracture (most common complication is compartment syndrome) \n \nRead the X-ray of the patient \n \nSTATION 2# (ORTHOPEDICS) carpal tunnel syndrome \n27 yrs old lady present with hand pain… \n \nTake focus Hx \n \nExamination ( neurological + orthopedics ) \n \nDDx  \n \nManagement  plan \nNOTE: in history do not forget to ask about dominant hand and the job of the patient \nIn physical examination do full sensory and motor examination of both hand \n \nSTATION 3# (ANESTHESIA) \n60 yrs old man present with SOB and chest pain .. has Hx of ischemic heart disease \n \nTake focus Hx \n \nHow to maintain airway (apply bag mask and connect it with IPPV) \nNOTE: patient will be full down during taking Hx  do not be fear \n \nSTATION 4# (ophthalmology) \n26 yrs old lady present with diplopia  \n \nTake focus Hx \n \nExamination (apply fundosope do not forget to dim the light) \n \nDDx (6th nerve palsy, stroke, …..) \n \nManagement plan \n(NOTE: patient will ask you  can I drive in this situation ,  so advice the patient) \n \n \n \n",24:"ALL THE BEST \n \nMaryam Al-Jabri \n \nSTATION 5# (general surgery) Thyroid \n66 yrs old gentleman present with neck swelling (most likely grave’s disease) \n \nTake focus Hx \n \nThyroid Examination  \n \nDiscuss the management with the examiner \n \nSTATION 6# (general surgery) Breast \n28 yrs old lady present with left side breast pain since 1 year (most likely fibroadenoma) \n \nTake focus Hx \n \nbreast examination on manikin  \n \nDDx \n \nDiscuss the management with the examiner \n \n(NOTE: describe the mass during examination) \n \n \nSTATION 7# (urology) prostate \n66 yrs old gentleman present with poor urine stream \n \nTake focus Hx \n \nPer rectal examination on manikin (position prone)  \n \nDDx \n \nDiscuss the management with the examiner \n \n(NOTE: do not forget to ask about chaperone before examination) \n \nSTATION 8# (general surgery) GIT \n23 yrs old gentleman present with abdominal pain (cholecystitis murphy’s sign +ve)  \n \nTake focus Hx \n \nFocus abdominal examination  \n \nDDx \n \nDiscuss the management with the examiner \n \n(NOTE: examiner will ask about the proper time to do emergent cholecystectomy) within 72 \nhrs \nا\nلحمدهلل الذي تتم بنعمته الصالحا\nت \nدعوااتك\nم \n \n",25:"OSCE 2019 day 1\nFatma Al-Ajmi\n",26:"On each door, this is what was written\n• Take history from the parent\n• Ddx\n• Mx\n• You had to ask for physical examination results if weren’t supposed to \ndo the physical examination\n• Ask for the investigations\n• Bring a paper along\n",27:"• Resp distress \n• Poor feeding baby\n• Normal CVS examination\n• You have to say: I want to order a CXR, CBC looking for infection and \nblood culture to rule of pneumonia\n• Diffuse reticulogranular ground glass opacities with air bronchograms\n• Resp distress syndrome\n• The mother will ask why: Surfactant deficiency\n• Rx\n",28:"• Bipolar symptoms\n• Stop his fluoxetine and start him on antipsychotics and mood \nstabalizers\n• Side effects of meds\n• Pt: Why don’t I have schizophrenia\n• https://drive.google.com/drive/my-drive\n",29:"• Do mental state examination\n• Side effects of medications\n",30:"• ADHD \n• Attend the psychiatry revision\n• Hearing test\n• Developmental history\n• ADHD and Autism, ask about both\n• 2 settings, duration and age less than 12\n• Mx? Sth weird in Arabic, some kind of school or center or sth\n• Pt: My son doesn’t sleep? I don’t want medications\n• Sleep hygiene\n",31:"• Resp examination\n• Use your time usely\n• Bronchiectasis\n• He was a smoker, he could have copd و من كثر ال\n• Infections he got Bronchiectasis\n• Creps and clubbing\n",32:"• Prosthetic valves: He was a policeman who works in SQUH\n• What makes you say it is? The click\n• Target INR range of warfarin in aortic and mitral valve\n• Before a dental procedure should be given? Antibiotics\n• Surgery: When? \n• Ask about warfarin and heparin\n• Look for the scar and location: Median sternotomy\n• How will differentiate between a mitral and aortic valve? Echo\n",33:"• A women who traveled with her husband, she was eating from \noutside\n• She had yellowish discoloration\n• She had hepatomegaly or hepatic tenderness\n• You gotta ask for everything: CBC, LFT, hepatititis serology \n• Hep A Ig M high\n• Pt: Rx? It is painful, so what analgesia will you give\n• Pt: Is there a chance I will go into liver failure and what symptoms will \nI have?\n",34:"Ped\n• Pallor and jaundice \n• Iron deficiency anemia\n• Ask for CBC\n• Hb low, high RDW, PLT reactive\n• Ask for iron study results: Transferrin sat low\n• Ask for ferritin most accurate for iron def and it was alone, if you \ndidn’t ask you won’t be given: Ferritin was low\n",35:"Peds: Otitis media\n• Mx: Self-limiting\n• Pt: Nothing will be given to my son, she kept on insisting to be given \nsth\n• Not responding to paracetamol\n• Know the doses and duration for paracetamol and ibuprofen, children \nand adults, they ask :)) \n",36:"Day 2 OSCE\n",37:"On each door, this is what was written\n• Take history from the parent\n• Ddx\n• Mx\n• You had to ask for physical examination results if weren’t supposed to \ndo the physical examination\n• Ask for the investigations\n• Bring a paper along\n",38:"• Hydrocele\n• Transillumating\n• What are the 4 causes of hydrocele\n• Why is it not a varicocele\n• Is it tumor? He was 37 years (Young)\n• Lots of Qs were asked\n",39:"• Abdominal examination of someone who had left sided pain or \nswelling\n",40:"• Abdominal swelling\n• Incisional hernia \n",41:"• Knee examination\n• Ligament tear\n• MRI\n• Management: If MCL \n• Not severe: Support\n• Severe: Operation\n• Physio\n",42:"• Shoulder examination\n• A guy who goes to the gym and lifts weights\n• Pain on all movements\n• Rotator cuff tendon tear\n• Physio\n",43:"• Anaethesia\n• Pt is talking then he loses consciousness\n• Call for help\n• When putting the nasal airway bring many and measure the distance\n• Hold the BVM using the C- and E-shape techniques.\n• When to put and LMA and what size\n",44:"• Dysuria and suprapubic pain\n• She had a stone\n",45:"• Low back pain\n• Do sensory examination: Cotton wool, vibration and mono-filament \ntest\n• Straight leg raise\n",46:"Derma \n• Atopic dermatitis\n• Other Ddx: Lichen planus, contact dermatitis, irritant dermatitis, \ninsect bite\n• Moisturizer and steroids\n• The type of steroid\n• Wear 100% cotton and ditch the nylon\n• Cut his nails\n",47:"Final OSCE Examination \n(Junior Clerkship)\ndate: 23-25/1/2021\n\nTotal stations: 18\n\nEach block with 6 stations\n\nThe exam conducted into 2 days (each day 9 stations)\n\nFirst day was (Surgery & Allied + FAMCO)\n\nSecond day was (Medicine & Allied + Psychiatry)\n",48:"Day 1\nTotal of 9 stations:\n1. General surgery (3 stations)\n2. FAMCO (2 stations)\n3. Orthopedic (2 stations)\n4. Ophthalmology (1 station)\n5. Oral Health (1 station)\n",49:"1. General Surgery- Flank Pain\n• A 30s year old gentleman presented with right flank pain since 2 years \nback.\n1. Take focused Hx.\n2.\nDo Examinations (costovertebral angle)\n3.\nDDx & the most Dx.\n4. Management.\nImaging showed renal calculi in the mid left ureter, size 7 mm. associate \nwith pyelonephritis, mild left hydronephrosis.\n",50:"31-year-old lady presented with breast lump since 8 months back.\n1. Take focused Hx.\n2. Do Examinations (on manikin)\n3. DDx & the most Dx.\n4. Management.\nAll the features suggest “fibroadenoma”\n2. General Surgery- Beast Lump\n",51:"3. General Surgery- Acute limp pain\n35-year-old male presented with \nacute severe left leg pain. \n1. Take focused Hx.\n2. DDx & the most Dx.\n3. Management.\nThey gave a picture like this, the only \nabnormality is the color.\n",52:"4. FAMCO- Headache\n• 25-year-old lady presented with bad-like headache.\n1. Take focused Hx.\n2. DDx & the most Dx.\n3. Management.\nAt the end the patient asked for MRI, but examination & history were \nunremarkable should we reassure her???\n",53:"5. FAMCO- Antenatal Care (ANC)\n• A 31-year-old lady comes for boking for her pregnancy.\n1. Take focused Hx.\n2. Can’t remember the rest\nThe positive Ix findings were: Anemia, +Nitrite in the urine, +Rubella.\n",54:"6. Orthopedic- Back Pain\n• An athlete presented with low back pain after lifting heavy thing in \nthe gym.\n1. Take focused Hx.\n2. Do Examinations\n3. DDx & the most Dx.\n4. Management.\n",55:"• A 28-year-old gentleman presented with right elbow pain (was \nsince ~2 years).\n1. Take focused Hx.\n2. Do Examinations\n3. DDx & the most Dx.\n4. Management.\nIt was tennis elbow\n7. Orthopedic- Chronic Elbow Pain\n",56:"8. Ophthalmology- Red Eye\n• A 35-year-old Lady presented with unilateral red eye \nsince 2 days back.\n1. Take focused Hx.\n2. Do Examinations & explain to the patient the \nfindings.\n3. DDx & the most Dx.\n4. Management (both Ix & Rx)\nExactly this picture (Copy/Paste)\n",57:"9. Oral Health- Oral Ulcer\n• A father brought his 6-year-old child \nwith oral ulcers since 2 days back.\n1. Take focused Hx.\n2. DDx & the most Dx.\n3. Management (both Ix & Rx)\nThe father asked: “is it contagious” ?\nExactly this picture (Copy/Paste)\n",58:"Day 2\nTotal of 9 stations:\n1. Medicine (3 stations)\n2. Pediatric (3 stations)\n3. Psychiatry (3 stations)\n",59:"1. Medicine- Breathlessness & Cough\n• 55-year-old male presented with SOB & \ncough since 2 years back.\n1. Take a focused history.\n2. Formulate your DDx & the most Dx.\n3. Management plan & advice.\n",60:"2. Medicine- Thyroid swelling\n• 24-year-old lady presented with \npalpitation & neck swelling & \npalpitations.\n1. Take a focused history.\n2. Formulate your DDx & the most Dx.\n3. Management plan & advice.\nAll features: Hx/Ix/PE suggestable for Grave’s\n",61:"• 25-year-old lady presented with joint \nswelling in small joints of both hands \nand feet.\n1. Take a focused history.\n2. Formulate your DDx & the most Dx.\n3. Management plan & advice.\n• The doctor asked about the SEs of NSAIDs & \nSteroids.\n3. Medicine- Multiple Joint Pain\nExactly this picture (Copy/Paste) \n",62:"4. Pediatric- Persistent fever\n• 9-year-old child with persistent fever for 2 months!.\n1. Take a focused history from the mother\n2. Formulate your DDx & the most Dx.\n3. Management plan & advice.\nN.B.: this topic is from fever of unknown origin (FUO), the hint was from travel Hx (drinking cow milk \nfrom Salalah). So, complete taking full Hx is important.\n",63:"5. Pediatric- Infant Vomiting\n• 6-week-old infant presented with vomiting since 2 weeks.\n1. Take a focused history from the mother\n2. Formulate your DDx & the most Dx.\n3. Management plan & advice.\nInitially, the vomiting was only spitting up milk, then progressed to projectile \nvomiting after 30 minutes post-feed. Vomitus was non-bilious, no blood, only milk \ncontent.\n",64:"6. Pediatric- Eye Puffiness \n• 5-year-old child with history of early morning face puffiness since \n3 days back.\n1. Take a focused history from the mother\n2. Formulate your DDx & the most Dx.\n3. Management plan & advice.\n• The mother asked about the prognosis: “ is this disease curable?”\n",65:"7. Psychiatry- Poor Sleep\n• 44-year-old gentleman presented with poor sleep (sleeps 3 \nhrs./day).\n1. Take a focused history from the mother\n2. Formulate your DDx & the most Dx.\n3. Management plan & advice.\nN.B.: he was on Lithium, therefore this was Bipolar disorder. This was depressive \nepisode.\n",66:"8. Psychiatry- OCD (can’t remember the presenting compliant)\n• Repetitive hand washing, …\n1. Take a focused history from the mother\n2. Formulate your DDx & the most Dx.\n3. Management plan & advice.\n",67:"9. Psychiatry- Deliberate self harm\n• 22-year-old lady with history of self harm (superficial hand \ncutting) since 2 weeks. But with anger and easily arousable since \nage of 17 years.\n1. Take a focused history from the mother\n2. Formulate your DDx & the most Dx.\n3. Management plan & advice.\nThe main aim of the theme was risk assessment.\n",68:"OSCE Medicine& Allied, Psychiatry \n(JCS 2022, cohort 2016) \n \n(For all stations you are asked to take focused history, ask to examine [you will be given the findings], \norder investigations, discuss the differentials and management plan for the patient.) \n \n1. 34 years old female presents with 2 month history of urinary frequency.  \n(Type 2 DM. questions that could be asked: why did I develop it? What are the \ncomplications? What medications will you give me? Which medications could be given \nto protect against proteinuria? My father is on haemodialysis how can I prevent \nreaching that stage?) \n2. Female presents with 3 months history of SOB.  \n(Asthma. What medications will you give me?) \n3. 45 years old male presents with history of chest pain.  \n(Aortic stenosis; HOCM. What is the management? Until the time of surgery which \nmedications will you give the patient?) \n4. 8 years old girl is brought with abdominal pain.  \n(Long standing history of constipation since 2 years, diet is low in fibers and fluid. \nDevelopmentally doing well. Her sister has the same issue. No history of illnesses, \npassed meconium.) \n5. 9 months old boy presents with abnormal movements.  \n(Bacterial meningitis. How will you manage the patient? Will he develop these abnormal \nmovements in future? How can I prevent them?) \n6. 3 years old boy presents with epistaxis.  \n(ITP. What are the differentials? How will you mange? Will you admit? He is in the \nemergency how will you manage the epistaxis?) \n7. Patient presents with 6 months history of worrying about getting HIV.  \n8. 24 years old female presents with poor feeding. (anorexia nervosa) (how will you \nmanage me? Any investigations to be done? Will you admit me) \n9. Patient presents with poor sleep. (depression) \n \n \n \n \n \n",69:"OSCE Surgery& Allied, FAMCO \n(JCS 2022, cohort 2016) \n \n1. Patient presents with right lower quadrant pain. (Appendicitis. What are your \ndifferentials? How will you manage?) \n2. Patient presents with rectal bleeding. (Anal fissure. What are your differentials? How \nwill you manage? What is the surgical procedure that could be done? How is the \nsurgery done? Counsel the patient regarding the surgery? What are the primary and \nsecondary causes of this condition?) \n3. Patient brought to the emergency after MVC. Perform ABCDE. (What investigations \nwill you order? How will you manage open book fracture? What is the next step \nafter pelvic binder if patient remains unstable?) \n4. 65 years old male with IHD. Assess airway. (Patient will collapse and you have to \nmaintain airway. What are the causes for the collapse in this patient?) \n5. Patient presents with hand pain. (Scaphoid fracture. What are the complications? \nHow will you manage?) \n6. Patient presents with neck pain. (Cervical spondylosis) \n7. 35 years old female with 4 months history of amenorrhea. (PCOS) \n8. Female presents with palpitation. (Atrial fibrillation) \n9. Female presents with 2 months history of pruritic rash. (Scabies. How will you \nmanage? What are the side effects?) \n \n \nDay 1: Surgery + Orthopedics + FAMCO + Oral + Ophthalmology  \n \nStation 1: \n40 year old man presenting with acute epigastric pain for 4 days. \n1. Take a focused history \n2. Perform an abdominal examination \n3. Discuss possible differential diagnoses  \n4. Outline your management plan \n \nDx: Acute pancreatitis \n \n",70:" \nStation 2: \n42 year old man presenting with groin swelling \n1. Take a focused history \n2. Examine the groin \n3. Discuss possible differential diagnoses \n4. Outline your management plan \n \nDx: Right inguinal hernia \n \n \nStation 3: \n30 year old woman presenting with breast pain and swelling (Note: on examination there wasn’t any \nswelling. This wasn’t written on the exam paper) \n1. Take a focused history \n2. Examine the breast \n3. Discuss possible differential diagnoses \n4. Outline your management plan \n \nDx: Mastitis  \n \n \nStation 4: \n35 year old man post MVC humeral shaft fracture presenting to the clinic \n1. Take a focused history \n2. Examine the relevant joint \n3. Discuss management plan  \n \nDx: Radial nerve injury (wrist drop) \n \n \nStation 5: \n25 year old man presenting with knee giving way \n",71:"1. Take focused history \n2. Examine the knee joint \n3. Discuss management plan \n \nDx: ACL tear \n \n \nStation 6: \n60 year old woman presenting with blurred vision and intermittent headache. Examination revealed  \nanterior chamber was normal and the edema in the optic disc  \n1. Take focused history \n2. Examine visual fields \n3. Discuss with the patient the differential diagnosis and management plan \n \nDx: Bitemporal hemianopia (pituitary adenoma) \n \n \nStation 7: \n35 year old woman presenting with dry mouth and burning sensation \n1. Take focused history \n2. Discuss possible differential diagnoses with the patient \n3. Discuss the management plan with the patient \n \nDx: Drug induced xerostomia (amitriptyline)  \n \n \nStation 8: \n45 year old woman presented to the clinic with elevated bp \n1. Take focused history \n2. Conduct relevant investigations \n3. Discuss management plan with the patient \n \nDx: White coat hypertension \n",72:" \n \nStation 9:  \n23 year old woman presented to the clinic with burning sensation during micturition \n4. Take focused history \n5. Discuss possible differential diagnoses with the patient \n6. Discuss the management plan with the patient \n \nDx: UTI \n \n \nDay 2: Medicine + Pediatrics + Psychiatry \n \n \nStation 1: Malaria \n \nStation 2: Infective endocarditis \n \nStation 3: Lung cancer \n \nStation 4: Celiac disease \n \nStation 5: Anaphylaxis  \n \nStation 6: Septic arthritis \n \nStation 7: GAD \n \nStation 8: ADHD \n \n",73:"Station 9: Dementia (Alzheimers)  \n \nJunior clerkship final OSCE 2023 cohort 2018  \n \n❖ Medicine   \n1. 35 years old women presented with one week history of jaundice.  \na) Take focused history. \nb) Discuss DDx. \nc) Management.  \n(it was a case of hepatitis A for a lady who just came back from India with \nintake of contaminated food and water, they asked for interpreting serology \nof hepatitis viruses) \n2. 45 years old man presented with chronic cough.  \na) Take focused history.  \nb) Perform respiratory examination.  \nc) Discuss DDx.  \nd) Management.  \n(case of bronchiectasis) \n3. 55 years old man presented with weakness.  \na) Take focused history. \nb) Discuss DDx. \nc) Management.  \n(case of TIA) \n \n❖ Pediatric  \n1.  5 days old child presented with cyanosis.  \na) Take focused history. \nb) Discuss DDx. \nc) Management.  \n",74:"(case of transposition of great arteries) \n \n2. 4 years old child presented with fever and fuzziness.  \na) Take focused history. \nb) Discuss DDx. \nc) Management.  \n(case of meningitis) \n3. 18 months old child presented with fever.  \na) Take focused history. \nb) Discuss DDx. \nc) Management.  \n(case of pyelonephritis) \n \n \n❖ Psychiatry  \n1. A 3-year-old child with speech delay. \na) Take focused history. \nb) Discuss DDx. \nc) Management and counsel the mother.  \n(case of ASD)  \n2. 35y man with sleep disturbance for the past 3 weeks. \na) Take focused history. \nb) Discuss DDx. \nc) Management.  \n(case of bipolar disorder) \n3. 40y Man with 8 months history of worrying thoughts. \na) Take focused history. \nb) Discuss DDx. \nc) Management.  \n",75:"(case of OCD) \n \n❖ FAMCO  \n1. 32-year-old women with headache. \na) Take focused history. \nb) Discuss DDx. \nc) Management and counsel the patient.  \n(case of migraine headache)  \n2. 45-year-old women with abnormal blood sugar reading (random). \nd) Take focused history. \ne) ed revision outlines, not official solutions or validated mark schemes.\n            Independent clinical review is pending. Confirm current local protocols and prescribing\n            details. Practise intimate/invasive procedures only with consent and appropriate supervision\n            or on models. Station-specific safety issues and source discrepancies remain in the answers.\n          </p>\n          <h3>Storage</h3>\n          <p>\n            Offline, with no analytics or account. Reviewed markers stay in this\n            browser${storageOK?"":"; storage is blocked here, so markers last only for this session"}.\n            The shuffle draws each matching entry once before restarting.\n          </p>\n          <details class="source-details">\n            <summary>References</summary>\n            <div class="refs">\n              ${Object.values(DB.references).map(r=>`\n                    <a href="${r.url}" target="_blank" rel="noopener noreferrer">${esc(r.name)} ↗</a>\n                  `).join("")}\n            </div>\n          </details>\n          <div class="modal-actions" style="flex-wrap:wrap">\n            <button class="btn small" data-action="export">${icon("download")}Export bank</button>\n            <button class="btn small" data-action="reset-reviewed">Reset reviewed</button>\n            <button class="btn primary small" data-action="close-modal">Close</button>\n          </div>\n        `)}function download(name,text,mime){const u=URL.createObjectURL(new Blob([text],{type:mime}));const a=document.createElement("a");a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2e3)}document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b||b.disabled)return;const d=b.dataset;switch(d.action){case"home":libraryNavigation("browse");break;case"mode":if(state.mode!==d.value||state.view!=="library")libraryNavigation(d.value);break;case"theme":toggleTheme();break;case"a Reviewed markers reset.");break}});let searchTimer;document.addEventListener("input",e=>{if(e.target.id!=="search")return;clearTimeout(searchTimer);const wasFiltered=hasFilters();const value=e.target.value;state.query=value;state.page=1;state.selected=null;state.view="library";commitFilters(wasFiltered);searchTimer=setTimeout(()=>{render();const input=$("#search");input?.focus();input?.setSelectionRange(value.length,value.length)},100)});document.addEventListener("change",e=>{if(e.target.id==="year"||e.target.id==="rotation"){clearTimeout(searchTimer);const wasFiltered=hasFilters();state[e.target.id]=e.target.value;state.page=1;state.selected=null;state.view="library";state.revealed=false;commitFilters(wasFiltered);render()}if(e.target.id==="sort"){state.sort=e.target.value;state.page=1;saveHistory("replace");render()}});document.addEventListener("keydown",e=>{const m=$(".modal");if(m){if(e.key==="Escape"){closeModal();return}if(e.key==="Tab"){const f=[...m.querySelectorAll("button,a[href],input,select")].filter(x=>!x.disabled),first=f[0],last=f.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===m)){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}return}if(["INPUT","TEXTAREA","SELECT","BUTTON","A","SUMMARY"].includes(document.activeElement?.tagName))return;if(state.view==="station"){if(e.code==="Space"){e.preventDefault();toggleAnswer()}if(e.key.toLowerCase()==="n"){e.preventDefault();draw()}}});applyTheme();if(history.state?.jcs&&history.state.screen){Object.assign(state,history.state.screen)}else{saveHistory("replace")}render()</script> </body> </html>
