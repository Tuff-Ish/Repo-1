atment (headache/hypotension/irritation considerations), botulinum toxin or selected surgery through colorectal team.","Lateral internal sphincterotomy divides a controlled portion of internal sphincter to reduce spasm; discuss healing benefit, bleeding/infection and important continence risk/alternatives—not a do-it-yourself procedural guide."]}]}],pages:[69],note:"",adapted:false,set:"2022 · cohort 2016",images:[]},{id:"jcs-224",year:"2022",rotation:"Surgery",topic:"trauma",title:"A patient arrives after a motor vehicle collision. Perform a primary survey and discuss persistent instability after a pelvic binder",case:"A patient arrives after a motor vehicle collision. Perform a primary survey and discuss persistent instability after a pelvic binder.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Obtain AMPLE history only after immediate threats: allergies, medicines, past history/pregnancy, last meal and events/mechanism."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Expose safely, control external bleeding, assess airway/breathing, chest movement/sounds, perfusion, neurological status and hidden injuries, preventing hypothermia."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Prioritise airway obstruction, tension pneumothorax, massive haemothorax, tamponade and haemorrhage; pelvic fracture can conceal major blood loss."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["CABCDE/ABCDE with haemorrhage control, monitoring and repeated assessment; eFAST and bedside chest/pelvic imaging when appropriate.","Trauma CT only when stable enough; blood gas/lactate, blood count/coagulation and crossmatch; do not delay life-saving intervention for imaging."]},{heading:"Management",points:["Activate trauma/massive-haemorrhage response, protect cervical spine as indicated, oxygenation/airway support and balanced blood-product resuscitation per pathway.","Suspected unstable pelvic injury: binder over greater trochanters, avoid repeated pelvic springing; persistent instability requires urgent haemorrhage control with trauma/IR/surgery (packing/embolisation/fixation as appropriate), not simply another fluid bolus.","Clinically significant traumatic haemothorax may require chest drain by trained staff and urgent surgery for massive/ongoing bleeding; treat associated injuries."]}]}],pages:[69],note:"",adapted:false,set:"2022 · cohort 2016",images:[]},{id:"jcs-225",year:"2022",rotation:"Anaesthesia",topic:"airway",title:"A 65-year-old man with ischaemic heart disease requires airway assessment, then collapses",case:"A 65-year-old man with ischaemic heart disease requires airway assessment, then collapses.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Before collapse, obtain key chest-pain/dyspnoea, cardiac/respiratory, allergy, medicine and event history if time permits.","Once collapse occurs, stop routine history and assess responsiveness and breathing immediately."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Rapidly assess airway noises/patency, breathing effort, chest movement and perfusion; do not delay life-saving action for formal introduction."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Cardiac arrest/ACS/arrhythmia, hypoxia, airway obstruction, severe asthma/anaphylaxis, PE or metabolic causes according to context."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Call emergency/resuscitation team, assess ABCDE, attach monitoring/defibrillator; glucose and ECG as appropriate.","If unresponsive and not breathing normally, start CPR/use defibrillator per current training—ventilation alone is not sufficient."]},{heading:"Management",points:["Model-only, trained practice: position airway appropriately (jaw thrust/manual in-line support for suspected cervical injury), remove visible obstruction/suction, oxygen and correct mask size.","Use effective seal and jaw lift (two-person BVM preferred when possible), ventilate to visible chest rise without excessive rate/volume, reassess chest rise/oxygenation/capnography if available.","OPA for deeply unresponsive patient without gag; NPA sizing/contraindications per training (avoid suspected skull-base/major facial injury). Use a suitable supraglottic device/LMA when indicated and escalate failed oxygenation.","Intubation needs trained staff, equipment checks, backup plan, monitoring and waveform capnography confirmation; device sizes depend on device and patient, not one universal size."]}]}],pages:[69],note:"",adapted:false,set:"2022 · cohort 2016",images:[]},{id:"jcs-226",year:"2022",rotation:"Orthopaedics",topic:"scaphoid",title:"A patient presents with hand pain. Discuss diagnosis, treatment and fracture complications",case:"A patient presents with hand pain. Discuss diagnosis, treatment and fracture complications.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask FOOSH, radial-sided pain, timing, dominant hand, function and prior injury; assess trauma elsewhere."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect swelling, assess anatomical snuffbox and scaphoid tubercle tenderness gently, wrist movement only as safe, and distal neurovascular status."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Scaphoid versus distal radius/other carpal fracture or ligament injury; normal initial X-ray does not exclude scaphoid fracture."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Appropriate wrist/scaphoid imaging; MRI is considered early when suspicion persists per pathway; CT for selected union/displacement questions."]},{heading:"Management",points:["Immobilise if suspected and arrange timely fracture/hand review even if initial radiographs are normal.","Management depends on site/displacement/vascular risk; selected injuries need fixation.","Discuss nonunion, avascular necrosis (particularly proximal pole), collapse and arthritis; smoking cessation helps healing."]}]}],pages:[69],note:"",adapted:false,set:"2022 · cohort 2016",images:[]},{id:"jcs-227",year:"2022",rotation:"Orthopaedics",topic:"cervical",title:"A patient presents with neck pain",case:"A patient presents with neck pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask neck pain/radiation, dermatomal numbness, weakness, trauma, hand clumsiness, gait imbalance and bladder/bowel change.","Assess infection/cancer and inflammatory risks; clarify functional impact."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect/palpate neck and assess comfortable movement, arm power/reflexes/sensation and relevant peripheral nerves.","Assess legs/reflexes/gait for cord signs; use provocative tests only if appropriate and trained."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Cervical radiculopathy from disc/spondylosis versus peripheral nerve disease, shoulder pathology or cervical myelopathy."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Neurological assessment; no routine imaging for uncomplicated improving pain, but MRI for progressive deficit, myelopathy or other red flags."]},{heading:"Management",points:["Conservative activity/posture advice, appropriate analgesia and physiotherapy if safe.","Progressive weakness, myelopathy or traumatic instability needs urgent spine assessment; avoid forceful neck manipulation."]}]}],pages:[69],note:"",adapted:false,set:"2022 · cohort 2016",images:[]},{id:"jcs-228",year:"2022",rotation:"FAMCO",topic:"pcos",title:"A 35-year-old woman has four months of amenorrhoea",case:"A 35-year-old woman has four months of amenorrhoea.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Exclude pregnancy; ask cycle pattern, hirsutism/acne, weight change, galactorrhoea, headaches/vision, exercise/restriction, stress and medicines."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["With consent assess relevant BP/metabolic/androgen signs; pelvic examination only if indicated with safeguards."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Pregnancy, PCOS, hypothalamic causes, thyroid/prolactin disease and ovarian insufficiency; rapid virilisation suggests another urgent endocrine cause."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Pregnancy test first; targeted TSH/prolactin/androgen and other tests; assess metabolic risk.","Use current adult/adolescent diagnostic criteria; ultrasound is not necessary or diagnostic in every case and adolescent assessment differs."]},{heading:"Management",points:["Address symptoms and reproductive goals, endometrial protection for prolonged anovulation, metabolic/lifestyle support without stigma.","Hormonal contraception/cyclic progestogen, selected metformin or fertility treatment through appropriate clinician after contraindication/pregnancy review.","Explain long-term follow-up, not a diagnosis from four months amenorrhoea alone."]}]}],pages:[69],note:"",adapted:false,set:"2022 · cohort 2016",images:[]},{id:"jcs-229",year:"2022",rotation:"FAMCO",topic:"af",title:"A woman presents with palpitations",case:"A woman presents with palpitations.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask onset/duration/irregularity, dizziness/syncope, chest pain, dyspnoea, triggers, thyroid symptoms and alcohol.","Review cardiac history, stroke/bleeding risks and medicines."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Pulse rhythm/rate and BP/perfusion, cardiovascular signs, thyroid and heart-failure assessment."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["AF versus ectopy/SVT and non-arrhythmic causes such as anaemia, anxiety and hyperthyroidism."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["ECG confirmation; ambulatory recording if intermittent; FBC/renal/electrolytes/thyroid and echo when indicated."]},{heading:"Management",points:["Haemodynamic instability from arrhythmia: emergency resuscitation/cardioversion pathway.","Stable AF: rate/rhythm strategy and stroke prevention after formal stroke/bleeding assessment and preferences.","Anticoagulant choice depends on context; mechanical valves/significant rheumatic mitral stenosis require different anticoagulation considerations than usual non-valvular AF."]}]}],pages:[69],note:"",adapted:false,set:"2022 · cohort 2016",images:[]},{id:"jcs-230",year:"2022",rotation:"Dermatology",topic:"scabies",title:"A woman has a pruritic rash for two months. Discuss treatment and adverse effects",case:"A woman has a pruritic rash for two months. Discuss treatment and adverse effects.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask nocturnal itch, household/sexual contacts, onset, distribution, previous treatment and institutional exposure.","Assess infants, pregnancy, immunosuppression, crusted lesions and secondary infection."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect relevant sites with privacy/chaperone as needed; look for crusted scabies and infection."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Scabies versus eczema/contact dermatitis, insect bites and other pruritic dermatoses."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Examine burrows and characteristic finger-web/wrist/waist/genital distribution with consent; dermoscopy/scraping if needed."]},{heading:"Management",points:["Topical permethrin 5% is commonly used; apply to all recommended sites, leave for the specified time and repeat as directed (often after 7 days); age/pregnancy-specific instructions matter.","Treat close household/sexual contacts simultaneously even if asymptomatic; wash/isolate clothing/bedding according to local advice.","Oral ivermectin is an option in selected cases through appropriate prescribing; restrictions differ in pregnancy/small children. Treat secondary infection when present."]}]}],pages:[69],note:"",adapted:false,set:"2022 · cohort 2016",images:[]},{id:"jcs-231",year:"Unstated",rotation:"Surgery",topic:"pancreatitis",title:"A 40-year-old man has acute epigastric pain for four days",case:"A 40-year-old man has acute epigastric pain for four days.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask epigastric pain/radiation to back, vomiting, gallstones, alcohol, medicines, trauma and prior episodes; assess organ failure symptoms."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Vitals, hydration/perfusion, respiratory assessment and gentle abdominal tenderness/guarding; absence of rare skin signs does not exclude disease."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Pancreatitis versus ulcer/perforation, biliary disease, ACS and vascular emergencies; diagnosis usually needs 2 of characteristic pain, enzymes ≥3× upper limit, or characteristic imaging."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Lipase/amylase, FBC/renal/liver profile, glucose, calcium and triglycerides when appropriate; ultrasound for gallstones.","CT when diagnosis/complications warrant, not routinely immediately for every typical case; assess severity over time."]},{heading:"Management",points:["ABCDE, analgesia and individually titrated IV fluids with reassessment; monitor urine/oxygenation and seek senior input for organ dysfunction.","Early oral/enteral nutrition as tolerated rather than prolonged routine starvation; antibiotics not routinely for sterile pancreatitis.","Treat cause; urgent ERCP for appropriate biliary obstruction/cholangitis and cholecystectomy planning for biliary disease."]}]}],pages:[69,78],note:"This set has no printed year. Identical repeat merged; do not infer a year from adjacent sections.",adapted:false,set:"Undated · repeated day 1 / day 2 set",images:[]},{id:"jcs-232",year:"Unstated",rotation:"Surgery",topic:"hernia",title:"A 42-year-old man presents with groin swelling",case:"A 42-year-old man presents with groin swelling.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask swelling onset, relation to cough/strain/standing, reducibility, pain, vomiting, distension and bowel obstruction.","Assess prior repair, chronic cough/constipation, occupation and surgical fitness."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Model/supervised intimate exam: consent/chaperone and draping; inspect both groins standing only if safe and supine, locate relative to pubic tubercle/inguinal ligament.","Gently assess cough impulse/reducibility only if safe, tenderness/skin change, opposite groin and indicated scrotal/abdominal findings."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Inguinal/femoral hernia, lymph node, saphena varix, lipoma and scrotal pathology; clinical direct/indirect distinction is imperfect."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Usually clinical; ultrasound if uncertain, further imaging when indicated; preoperative assessment tailored to patient."]},{heading:"Management",points:["Painful irreducible tender swelling, obstruction or systemic illness: urgent surgery; no forceful reduction.","Discuss elective repair versus selected observation, symptoms, incarceration risk, anaesthetic fitness and mesh/non-mesh options with surgeon.","Explain recurrence, chronic pain, bleeding/infection and injury risks as appropriate."]}]}],pages:[70,78],note:"",adapted:false,set:"Undated · repeated day 1 / day 2 set",images:[]},{id:"jcs-233",year:"Unstated",rotation:"Surgery",topic:"mastitis",title:"A 30-year-old woman has breast pain and perceived swelling; the recall notes no swelling on examination",case:"A 30-year-old woman has breast pain and perceived swelling; the recall notes no swelling on examination.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask lactation/postpartum timing, fever, focal pain/redness, feeding problems, nipple trauma, lump, discharge and recurrent/non-lactating symptoms."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Consent/chaperone/draping; inspect redness/swelling and gently palpate tenderness, fluctuance, mass/nodes. The recall states no swelling was actually seen—do not invent it."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Lactational inflammatory/bacterial mastitis, abscess, blocked duct and malignancy including inflammatory cancer if atypical/non-resolving."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Vitals and breast assessment; ultrasound if abscess suspected; culture in selected recurrent/severe/nonresponding cases."]},{heading:"Management",points:["Assess sepsis; supportive analgesia, breastfeeding/expressing advice with skilled lactation support and antibiotics if bacterial disease/severity indicates.","Drain an abscess through the appropriate team; persistent non-lactational/recurrent or atypical symptoms need breast assessment.","Avoid aggressive massage or unnecessarily stopping breastfeeding without appropriate advice."]}]}],pages:[70,78],note:"",adapted:false,set:"Undated · repeated day 1 / day 2 set",images:[]},{id:"jcs-234",year:"Unstated",rotation:"Orthopaedics",topic:"radial",title:"A 35-year-old man attends after an MVC-related humeral shaft fracture and has a relevant neurological deficit",case:"A 35-year-old man attends after an MVC-related humeral shaft fracture and has a relevant neurological deficit.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask humeral fracture/trauma timing, onset before/after splint/surgery, weakness, dorsal hand numbness and other injury."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Test wrist/finger/thumb extension and relevant proximal power; sensation at dorsal first web space; compare median/ulnar function and circulation."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Review fracture imaging and pre/post-treatment neurological records; specialist neurophysiology/imaging if indicated by time course."]},{heading:"Management",points:["Immobilise fracture and document repeated neurovascular findings; wrist support splint and rehabilitation.","Urgent orthopaedic review for open injury, vascular injury or new/progressive deficit; exploration versus observation depends on injury context, not all palsies need immediate surgery."]}]}],pages:[70,78],note:"",adapted:false,set:"Undated · repeated day 1 / day 2 set",images:[]},{id:"jcs-235",year:"Unstated",rotation:"Orthopaedics",topic:"knee",title:"A 25-year-old man says his knee gives way",case:"A 25-year-old man says his knee gives way.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask mechanism (twist/contact/hyperextension), pop, immediate/delayed swelling, instability, locking, weight-bearing and prior injury.","Check fracture, infection and neurovascular red flags; assess sport/work goals."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect gait/alignment if safe then swelling/wasting, warmth/tenderness, effusion and comfortable active/passive range.","Assess Lachman/anterior drawer, posterior drawer and collateral stress when tolerated and trained; meniscal tests only if useful, not forced in an acutely painful joint.","Assess distal neurovascular status and adjacent joints; document findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Plain films when fracture criteria/clinical concern indicate; MRI for selected soft-tissue assessment and management planning."]},{heading:"Management",points:["Analgesia, protection/support and early appropriate rehabilitation; urgent referral for dislocation/neurovascular compromise, locked knee or major instability.","MCL injuries are often treated nonoperatively; surgery is reserved for selected severe/combined injuries, not all “severe” tears automatically.","ACL reconstruction versus rehabilitation depends on instability, activity and associated injury; shared orthopaedic plan."]}]}],pages:[70,71,78,79],note:"",adapted:false,set:"Undated · repeated day 1 / day 2 set",images:[]},{id:"jcs-236",year:"Unstated",rotation:"Ophthalmology",topic:"visualfield",title:"A 60-year-old woman has blurred vision and intermittent headache; normal anterior chamber and optic-disc oedema were recalled",case:"A 60-year-old woman has blurred vision and intermittent headache; normal anterior chamber and optic-disc oedema were recalled.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask visual onset/progression, peripheral loss, headache, diplopia and pituitary hormone symptoms (menses, libido, galactorrhoea, body changes)."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Test each eye separately, match eye level/distance, ensure fixation, compare quadrants with finger counting/movement/appropriate target; assess blind spot if required.","State limitations of confrontation and need for formal fields; do not infer the field solely from symptom wording."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Explain the crossing optic fibres/chiasm simply; advise on driving safety and local licensing requirements pending assessment.","Urgent eye/endocrine/neurosurgical review for field defect; sudden severe headache/vision loss/ophthalmoplegia suggests pituitary apoplexy and is an emergency.","Management (medicine/surgery/surveillance) depends on tumour type and compression; do not presume all pituitary lesions need the same operation."]}]}],pages:[71,79],note:"Bitemporal field loss/pituitary adenoma is recalled, but optic-disc oedema and symptoms need urgent assessment; original field image absent.",adapted:false,set:"Undated · repeated day 1 / day 2 set",images:[]},{id:"jcs-237",year:"Unstated",rotation:"Oral health",topic:"xerostomia",title:"A 35-year-old woman has dry mouth and a burning sensation; amitriptyline use was recalled",case:"A 35-year-old woman has dry mouth and a burning sensation; amitriptyline use was recalled.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask dryness duration, dry eyes, swallowing/speech/taste difficulties, dental pain, parotid swelling and fluid intake.","Review anticholinergics (e.g. amitriptyline), other medicines, SLE/autoimmune symptoms, diabetes, radiation and tobacco."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Medicine-induced dryness, Sjögren syndrome (including with SLE), dehydration, diabetes and other salivary disease."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Oral/dental assessment and salivary/eye assessment as indicated; cause-directed glucose/autoimmune work-up with specialists.","Examine for caries, candidiasis and mucosal injury; do not infer Sjögren solely from SLE plus dry mouth."]},{heading:"Management",points:["Review/change offending medicine only with prescriber; frequent water sips, sugar-free gum if suitable and saliva substitutes.","High-fluoride preventive dental care as advised, regular dental review and treat caries/candidiasis when present.","Avoid sugary/acidic drinks, alcohol-containing mouthwash and smoking; refer suspected systemic disease."]}]}],pages:[71,79],note:"",adapted:false,set:"Undated · repeated day 1 / day 2 set",images:[]},{id:"jcs-238",year:"Unstated",rotation:"FAMCO",topic:"whitecoat",title:"A 45-year-old woman attends with elevated clinic blood pressure",case:"A 45-year-old woman attends with elevated clinic blood pressure.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask previous readings, home/ambulatory results, technique, medicines/adherence, NSAIDs/decongestants/stimulants, family risk and lifestyle.","Assess headache/vision change, chest pain, dyspnoea, neurological symptoms and renal/endocrine secondary-cause clues."]}]},{key:"i",label:"Select and interpret relevant investigations",sections:[{heading:"Important points",points:["Repeat standardised clinic BP with correct cuff; arrange ABPM/HBPM according to pathway.","Assess urine ACR/haematuria, renal function/electrolytes, glucose/lipids, ECG and target-organ effects as appropriate."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Repeat standardised clinic BP with correct cuff; arrange ABPM/HBPM according to pathway.","Assess urine ACR/haematuria, renal function/electrolytes, glucose/lipids, ECG and target-organ effects as appropriate."]},{heading:"Management",points:["Acute symptoms/signs of end-organ injury with markedly elevated BP: emergency assessment.","Confirm diagnosis and cardiovascular risk before long-term medication decisions; lifestyle support and monitoring if isolated white-coat pattern.","Confirmed hypertension: guideline-based medicines with comorbidity, pregnancy and monitoring considered."]}]}],pages:[71,79],note:"",adapted:false,set:"Undated · repeated day 1 / day 2 set",images:[]},{id:"jcs-239",year:"Unstated",rotation:"FAMCO",topic:"uti",title:"A 23-year-old woman has burning on urination",case:"A 23-year-old woman has burning on urination.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask dysuria, frequency, urgency, suprapubic pain, haematuria, duration, fever/flank pain, pregnancy, discharge/STI risk, stones and previous cultures."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Lower UTI versus pyelonephritis, urethritis/STI, vaginitis and stone; symptoms in the 2019 recall were attributed to a stone, so do not assume infection."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Urine testing/culture according to sex/pregnancy/age/complexity and local policy; pregnancy/STI testing when relevant.","Fever/obstruction concern: renal tests and appropriate imaging; consider stone imaging if clinical pattern suggests."]},{heading:"Management",points:["Pregnancy, male/paediatric or complicated disease needs an appropriate specific pathway; choose antibiotics using local resistance/culture, renal function and allergy.","Simple lower UTI may be treated with first-line local options, analgesia/hydration and review; fever, vomiting or sepsis requires urgent assessment.","Stone with infected obstruction needs urgent drainage/urology, not antibiotics alone."]}]}],pages:[72,79],note:"",adapted:false,set:"Undated · repeated day 1 / day 2 set",images:[]},{id:"jcs-240",year:"Unstated",rotation:"Medicine",topic:"malaria",title:"A patient returns from travel with fever",case:"A patient returns from travel with fever.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Obtain exact countries/regions/dates, exposures, prophylaxis/adherence, fever pattern, headache, GI symptoms, jaundice, dark urine and neurological/respiratory symptoms.","Assess pregnancy, prior malaria, comorbidity and sepsis risks."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Malaria (especially falciparum after Congo/sub-Saharan travel), enteric fever, dengue/other imported infection and non-travel infection."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Urgent thick/thin blood films or approved rapid test with microscopy for species/parasitaemia; repeat testing if strong suspicion with initial negative per pathway.","FBC, glucose, renal/liver profile, lactate/blood gas and cultures as appropriate; assess severe disease."]},{heading:"Management",points:["Urgent infectious-disease input; severe malaria is a medical emergency treated with IV artesunate and monitored care per current protocol.","Uncomplicated therapy depends on species, region/resistance, pregnancy and current local guidance; an effective ACT is commonly used for falciparum.","Do not copy the old recall’s chloroquine suggestion for presumed African falciparum; widespread resistance matters. Vivax/ovale anti-relapse treatment requires G6PD assessment and specialist pregnancy precautions."]}]}],pages:[72,80],note:"Topic-only recall: no patient age, case details or objectives were recorded. The practice stem and objectives are added, not quoted from an original exam. Clear duplicate topic list merged.",adapted:true,set:"Undated · repeated day 1 / day 2 set",images:[]},{id:"jcs-241",year:"Unstated",rotation:"Medicine",topic:"ie",title:"A patient has fever and a possible new murmur",case:"A patient has fever and a possible new murmur.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask persistent fever, sweats, fatigue, valve/prosthesis or congenital disease, prior endocarditis, dental/skin infection, invasive procedures and injecting exposure sensitively.","Ask heart failure, embolic neurological/limb symptoms, back pain and previous antibiotics."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Infective endocarditis versus another infection with an old murmur or non-infective valve disease; absent peripheral stigmata does not exclude it."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Multiple blood-culture sets before antibiotics if feasible without delaying urgent sepsis treatment; echo (TTE/TOE selected by team), ECG, FBC/renal/inflammatory tests and complication imaging as indicated."]},{heading:"Management",points:["Urgent cardiology/infectious-disease care and sepsis/heart-failure treatment if unstable.","Prolonged targeted antibiotics depend on organism, valve type, allergies and susceptibilities; surgery considered for selected valve failure, uncontrolled infection or embolic risk.","Do not diagnose solely from a murmur or assume all dental procedures require prophylaxis."]}]}],pages:[72,80],note:"Topic-only recall: no patient age, case details or objectives were recorded. The practice stem and objectives are added, not quoted from an original exam. Clear duplicate topic list merged.",adapted:true,set:"Undated · repeated day 1 / day 2 set",images:[]},{id:"jcs-242",year:"Unstated",rotation:"Medicine",topic:"lungcancer",title:"A patient has persistent respiratory symptoms requiring assessment",case:"A patient has persistent respiratory symptoms requiring assessment.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask cough/haemoptysis, weight loss, dyspnoea, chest pain, hoarseness and recurrent infection; smoking/occupation/asbestos and functional status.","Assess metastasis, SVC obstruction and spinal compression symptoms."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Lung malignancy versus TB/infection, bronchiectasis and other chest disease; the source gives a topic only, not a confirmed subtype."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Urgent chest imaging and respiratory/cancer pathway; contrast CT and tissue diagnosis/staging chosen by multidisciplinary team."]},{heading:"Management",points:["Address emergencies, symptoms and smoking support; treatment depends on histology/stage, molecular profile and fitness: surgery/radiotherapy/systemic/supportive care.","Do not promise a specific prognosis or treatment without diagnosis/stage."]}]}],pages:[72,80],note:"Topic-only recall: no patient age, case details or objectives were recorded. The practice stem and objectives are added, not quoted from an original exam. Clear duplicate topic list merged.",adapted:true,set:"Undated · repeated day 1 / day 2 set",images:[]},{id:"jcs-243",year:"Unstated",rotation:"Paediatrics",topic:"coeliac",title:"A child has chronic gastrointestinal symptoms or poor growth",case:"A child has chronic gastrointestinal symptoms or poor growth.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask chronic diarrhoea/steatorrhoea, distension, pain, weight/growth, gluten exposure, anaemia, family/autoimmune history and diet."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Coeliac disease versus CF, chronic infection, food-protein disease, IBD and other malabsorption; age and gluten exposure matter."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Growth chart, FBC/ferritin and nutritional assessment; total IgA and tTG-IgA while eating gluten, with alternative tests if IgA deficient.","Paediatric/gastroenterology confirmation pathway (selected children may meet no-biopsy criteria; others need biopsy)."]},{heading:"Management",points:["Do not start a gluten-free diet before appropriate diagnostic testing unless advised by specialist.","After confirmation: lifelong gluten-free diet with dietitian, correct deficiencies, monitor growth/serology and family risk testing as appropriate."]}]}],pages:[72,80],note:"Topic-only recall: no patient age, case details or objectives were recorded. The practice stem and objectives are added, not quoted from an original exam. Clear duplicate topic list merged.",adapted:true,set:"Undated · repeated day 1 / day 2 set",images:[]},{id:"jcs-244",year:"Unstated",rotation:"Paediatrics",topic:"anaphylaxis",title:"A child develops an acute reaction with airway, breathing or circulation concerns",case:"A child develops an acute reaction with airway, breathing or circulation concerns.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Rapidly ask exposure/time, previous allergy, medicines/food/sting and prior reactions only if this does not delay care."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Sudden airway/breathing/circulation compromise after exposure supports anaphylaxis, with or without skin signs; compare asthma/vasovagal/other shock."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Clinical emergency diagnosis; monitor ABCDE and response. Tryptase at appropriate times after stabilisation must not delay treatment."]},{heading:"Management",points:["Call emergency help, appropriate positioning (do not stand/walk with circulatory compromise), prompt IM adrenaline in anterolateral thigh per current age/weight protocol.","Oxygen/airway support and IV fluid as indicated, repeated adrenaline and escalation under resuscitation algorithm.","Antihistamines do not treat airway obstruction/shock; observation, allergy referral, trigger avoidance, autoinjector training and written plan after recovery."]}]}],pages:[72,80],note:"Topic-only recall: no patient age, case details or objectives were recorded. The practice stem and objectives are added, not quoted from an original exam. Clear duplicate topic list merged.",adapted:true,set:"Undated · repeated day 1 / day 2 set",images:[]},{id:"jcs-245",year:"Unstated",rotation:"Paediatrics",topic:"septicjoint",title:"A child presents with an acutely painful swollen joint",case:"A child presents with an acutely painful swollen joint.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask acute joint pain/swelling, fever, inability to bear weight, infection/trauma, prosthetic joint, immune risks and antibiotics."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Septic arthritis versus crystal/inflammatory arthritis, trauma and adjacent osteomyelitis; a hot joint is urgent."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Urgent senior/orthopaedic/paediatric assessment, blood cultures and aspiration by trained staff for microscopy/culture/crystals when safe.","Blood inflammatory tests and imaging support assessment; crystals do not exclude simultaneous infection."]},{heading:"Management",points:["Prompt appropriate IV antibiotics after cultures if feasible without delaying treatment in an unstable patient; urgent drainage/source control through team.","Analgesia, sepsis management and later rehabilitation; do not repeatedly force movement."]}]}],pages:[72,80],note:"Topic-only recall: no patient age, case details or objectives were recorded. The practice stem and objectives are added, not quoted from an original exam. Clear duplicate topic list merged.",adapted:true,set:"Undated · repeated day 1 / day 2 set",images:[]},{id:"jcs-246",year:"Unstated",rotation:"Psychiatry",topic:"gad",title:"A patient has persistent excessive worry",case:"A patient has persistent excessive worry.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask domains, duration, uncontrollability, restlessness, muscle tension, sleep, irritability, concentration and function.","Ask panic, OCD, depression/suicidality, trauma, caffeine/substances and physical/medicine causes."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["GAD versus adjustment/stress, depression, panic/OCD, hyperthyroidism and substance effects.","A three-month recall alone does not establish the duration criterion of every diagnostic system; assess fully."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["MSE and targeted physical/thyroid/other tests if symptoms suggest a medical cause."]},{heading:"Management",points:["Psychoeducation, self-help and CBT/applied relaxation; consider an SSRI based on persistent impairment and shared decisions.","Discuss activation, GI/sexual side effects, delayed benefit and follow-up; avoid routine long-term benzodiazepine dependence."]}]}],pages:[72,80],note:"Topic-only recall: no patient age, case details or objectives were recorded. The practice stem and objectives are added, not quoted from an original exam. Clear duplicate topic list merged.",adapted:true,set:"Undated · repeated day 1 / day 2 set",images:[]},{id:"jcs-247",year:"Unstated",rotation:"Psychiatry",topic:"adhd",title:"A child has attention and activity concerns",case:"A child has attention and activity concerns.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Assess inattention and hyperactivity/impulsivity with examples, onset before age 12, persistence and impairment in at least two settings.","Obtain parent/school reports, developmental/hearing/vision history, sleep, learning, autism, anxiety, trauma and family history."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["ADHD versus sleep deprivation, hearing/learning difficulties, autism, anxiety, mood disorders and environmental stressors; evaluate comorbidity."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Specialist developmental/ADHD assessment with structured rating information across settings; no single blood test or IQ test confirms ADHD.","Before medication, assess height/weight, pulse/BP, cardiac/family history and other baseline requirements."]},{heading:"Management",points:["Parent/carer training and school/environmental adjustments, predictable routines and sleep support.","Medication for persistent significant impairment through specialists: stimulants such as methylphenidate and selected non-stimulants such as atomoxetine/guanfacine according to age/local pathway.","Monitor response, appetite/growth, sleep, pulse/BP and mood; not every family must begin with medication."]}]}],pages:[72,80],note:"Topic-only recall: no patient age, case details or objectives were recorded. The practice stem and objectives are added, not quoted from an original exam. Clear duplicate topic list merged.",adapted:true,set:"Undated · repeated day 1 / day 2 set",images:[]},{id:"jcs-248",year:"Unstated",rotation:"Psychiatry",topic:"dementia",title:"An older person has progressive memory difficulty",case:"An older person has progressive memory difficulty.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Obtain patient and collateral accounts with permission: gradual versus acute/fluctuating onset, memory/language/executive changes and daily function.","Ask mood, psychosis, medicines, alcohol, neurological events, sensory problems, driving, finances, medication safety and caregiver needs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Alzheimer disease, vascular/mixed and other dementias; exclude delirium, depression and reversible medical/drug causes.","A history of stroke alone does not establish vascular dementia; time course and neurological/cognitive pattern matter."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Physical/neurological exam, validated language/culture-appropriate cognitive assessment, sensory review and collateral.","Reversible-cause blood tests and specialist-selected structural imaging; refer to memory/neurology service as appropriate."]},{heading:"Management",points:["Agree support, medication simplification, safeguarding/driving assessment and advance planning while preserving autonomy.","Specialist subtype-based medication: cholinesterase inhibitors and/or memantine when indicated; discuss adverse effects and limits.","Support caregivers and arrange community/functional assessment."]}]}],pages:[72,73,80],note:"Topic-only recall: no patient age, case details or objectives were recorded. The practice stem and objectives are added, not quoted from an original exam. Clear duplicate topic list merged.",adapted:true,set:"Undated · repeated day 1 / day 2 set",images:[]},{id:"jcs-249",year:"2023",rotation:"Medicine",topic:"hepa",title:"A 35-year-old woman has one week of jaundice after returning from India and possible contaminated food/water. Interpret hepatitis serology",case:"A 35-year-old woman has one week of jaundice after returning from India and possible contaminated food/water. Interpret hepatitis serology.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask jaundice, dark urine/pale stool, itching, RUQ pain, nausea, fever, exposure timing, travel/food/water/contacts, medicines/alcohol and other hepatitis risks."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Acute viral hepatitis A versus other hepatitis, drug injury, biliary obstruction and haemolysis."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Liver profile, bilirubin, INR, glucose and renal function; anti-HAV IgM supports recent infection, IgG indicates past infection/vaccination.","Interpret HBV using HBsAg, anti-HBc IgM/total and anti-HBs pattern; HCV antibody may need RNA confirmation. Ultrasound if obstruction possible."]},{heading:"Management",points:["Most uncomplicated hepatitis A: supportive fluids/nutrition, avoid alcohol/hepatotoxic medicines and appropriate symptom relief.","Analgesic choice/dose must consider liver injury; do not automatically give full-dose paracetamol or NSAIDs without clinical assessment.","Encephalopathy, bleeding/prolonged INR, hypoglycaemia or worsening illness needs urgent liver/emergency assessment; public-health/contact prophylaxis per policy."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Explain faeco-oral spread, hand hygiene and vaccination/contact advice; most recover but liver failure warnings include confusion, abnormal bleeding and severe deterioration.","Most uncomplicated hepatitis A: supportive fluids/nutrition, avoid alcohol/hepatotoxic medicines and appropriate symptom relief.","Analgesic choice/dose must consider liver injury; do not automatically give full-dose paracetamol or NSAIDs without clinical assessment.","Encephalopathy, bleeding/prolonged INR, hypoglycaemia or worsening illness needs urgent liver/emergency assessment; public-health/contact prophylaxis per policy."]}]}],pages:[73],note:"",adapted:false,set:"2023 · cohort 2018",images:[]},{id:"jcs-250",year:"2023",rotation:"Medicine",topic:"bronchiectasis",title:"A 45-year-old man has chronic cough",case:"A 45-year-old man has chronic cough.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Characterise chronic cough, daily sputum volume/purulence, recurrent infection, haemoptysis, breathlessness and exacerbations.","Ask childhood disease/CF, aspiration, immune/connective-tissue disease, smoking, TB exposure and previous cultures/treatment."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect work of breathing and sputum, clubbing, pulse and SpO2; examine trachea and expansion.","Compare percussion, auscultation and vocal resonance anteriorly/posteriorly including bases; describe coarse crackles/wheeze without inventing signs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Bronchiectasis is suggested by chronic productive cough with coarse crackles/clubbing; consider COPD, TB, lung cancer and interstitial disease."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Observations/SpO2, sputum culture and chest radiograph initially.","High-resolution CT confirms bronchiectasis; spirometry and cause-directed immune/CF testing as appropriate."]},{heading:"Management",points:["Assess exacerbation severity and sepsis; culture-guided antibiotics according to previous organisms and local policy.","Airway clearance with physiotherapy, vaccinations, exercise and smoking cessation.","Specialist management for frequent exacerbations or chronic colonisation; significant haemoptysis is urgent."]}]}],pages:[73],note:"",adapted:false,set:"2023 · cohort 2018",images:[]},{id:"jcs-251",year:"2023",rotation:"Medicine",topic:"tia",title:"A 55-year-old man presents with weakness",case:"A 55-year-old man presents with weakness.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Establish exact onset/last known well, symptom duration/resolution, face/limb/speech/vision/balance symptoms and residual deficit.","Ask AF/vascular risks, anticoagulation, seizure/migraine and glucose-related symptoms."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Ongoing focal deficit: possible acute stroke, not TIA. Transient focal symptoms may be TIA but mimics need assessment."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["ABCDE, glucose, focused neurological exam and immediate stroke pathway if ongoing/recent deficit.","Specialist TIA/stroke assessment, brain/vascular imaging as indicated, ECG/rhythm and risk-factor tests; do not use ABCD2 alone to decide urgency."]},{heading:"Management",points:["Acute stroke requires time-critical specialist reperfusion/haemorrhage evaluation; no oral intake before swallow safety assessment.","Suspected resolved TIA needs urgent specialist assessment (often within 24 hours); antiplatelet and prevention per current pathway and contraindications.","Address AF, carotids, BP/lipids, smoking and driving guidance after diagnosis."]}]}],pages:[73],note:"TIA is recalled, but symptom duration/resolution is unspecified; ongoing deficit requires the acute stroke pathway.",adapted:false,set:"2023 · cohort 2018",images:[]},{id:"jcs-252",year:"2023",rotation:"Paediatrics",topic:"tga",title:"A five-day-old newborn presents with cyanosis",case:"A five-day-old newborn presents with cyanosis.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Establish early neonatal cyanosis, feeding distress, timing after birth and antenatal/birth history; assess fever/poor perfusion."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["TGA is an important cause of severe early cyanosis; compare other cyanotic CHD, pulmonary disease and sepsis."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Immediate pre/postductal oxygenation assessment, glucose/blood gas and urgent echo; ECG/CXR support but do not exclude disease."]},{heading:"Management",points:["Urgent neonatal/cardiology stabilisation and transfer; specialist-directed prostaglandin to maintain ductal patency when indicated.","Inadequate mixing may require urgent balloon atrial septostomy; definitive correction is usually an arterial switch procedure."]}]}],pages:[73,74],note:"",adapted:false,set:"2023 · cohort 2018",images:[]},{id:"jcs-253",year:"2023",rotation:"Paediatrics",topic:"meningitis",title:"A four-year-old has fever and fussiness",case:"A four-year-old has fever and fussiness.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask fever duration, feeding, irritability/lethargy, rash, neck symptoms, vomiting, seizures (duration/focality/recovery), immunisation and exposure.","In infants consider subtle poor feeding, apnoea or reduced responsiveness; do not require neck stiffness."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Bacterial meningitis/encephalitis versus febrile seizure, sepsis and metabolic disease; meningitis-associated seizures are not simply labelled benign febrile seizures."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["ABCDE, glucose, blood cultures and urgent blood tests; CSF only when safe and without delaying treatment; imaging according to indication."]},{heading:"Management",points:["Immediate senior paediatric/emergency care, age-appropriate empirical IV antimicrobials per protocol and seizure treatment if prolonged; do not wait for LP.","Manage shock/glucose/airway and monitor; isolate/public-health measures and contact prophylaxis for relevant organisms.","Arrange hearing/neurodevelopmental follow-up; discuss potential seizures/sequelae without guaranteeing epilepsy or no sequelae."]}]}],pages:[74],note:"",adapted:false,set:"2023 · cohort 2018",images:[]},{id:"jcs-254",year:"2023",rotation:"Paediatrics",topic:"uti",title:"An 18-month-old has fever",case:"An 18-month-old has fever.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask dysuria, frequency, urgency, suprapubic pain, haematuria, duration, fever/flank pain, pregnancy, discharge/STI risk, stones and previous cultures."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Lower UTI versus pyelonephritis, urethritis/STI, vaginitis and stone; symptoms in the 2019 recall were attributed to a stone, so do not assume infection."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Urine testing/culture according to sex/pregnancy/age/complexity and local policy; pregnancy/STI testing when relevant.","Fever/obstruction concern: renal tests and appropriate imaging; consider stone imaging if clinical pattern suggests."]},{heading:"Management",points:["Pregnancy, male/paediatric or complicated disease needs an appropriate specific pathway; choose antibiotics using local resistance/culture, renal function and allergy.","Simple lower UTI may be treated with first-line local options, analgesia/hydration and review; fever, vomiting or sepsis requires urgent assessment.","Stone with infected obstruction needs urgent drainage/urology, not antibiotics alone."]},{heading:"Paediatric upper UTI emphasis",points:["Febrile 18-month-old: assess sepsis, hydration, feeding and urine output; obtain appropriately collected urine for culture before antibiotics if feasible without delay.","Use paediatric pyelonephritis antibiotic/admission guidance and weight-based formulary; vomiting, sepsis or poor intake may require hospital treatment. Arrange age/risk-based imaging/follow-up, not routine adult cystitis advice."]}]}],pages:[74],note:"Pyelonephritis was recalled. Use age-appropriate febrile-child assessment, properly collected urine culture and paediatric upper-UTI treatment/admission criteria, not an adult uncomplicated-cystitis regimen.",adapted:false,set:"2023 · cohort 2018",images:[]},{id:"jcs-255",year:"2023",rotation:"Psychiatry",topic:"autism",title:"A three-year-old has speech delay. Take history and discuss care with the mother",case:"A three-year-old has speech delay. Take history and discuss care with the mother.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Take developmental and language/hearing history, social communication/reciprocity, play, repetitive behaviours, restricted interests and sensory differences.","Establish onset and impact across settings, regression, school function, strengths, sleep, feeding and family history; ask parent concerns without blame."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Autism versus language/hearing impairment, global developmental/intellectual difficulties, ADHD and other developmental conditions; co-occurrence is common."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Formal hearing/vision and multidisciplinary developmental/autism assessment, school information and developmental/cognitive profile as indicated."]},{heading:"Management",points:["Early communication/educational and environmental support tailored to strengths/needs, parent support and treatment of coexisting conditions.","No medicine cures core autism; use specialist medication only for specific significant comorbid symptoms when appropriate."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Use respectful neurodevelopmental language, explain there is no parental blame, agree practical supports and avoid unsupported causal claims.","Early communication/educational and environmental support tailored to strengths/needs, parent support and treatment of coexisting conditions.","No medicine cures core autism; use specialist medication only for specific significant comorbid symptoms when appropriate."]}]}],pages:[74],note:"",adapted:false,set:"2023 · cohort 2018",images:[]},{id:"jcs-256",year:"2023",rotation:"Psychiatry",topic:"bipolar",title:"A 35-year-old man has sleep disturbance for three weeks",case:"A 35-year-old man has sleep disturbance for three weeks.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Establish current low versus elevated/irritable mood, sleep need, energy, speech/thought acceleration, impulsivity, psychosis and functioning.","Ask past mania/hypomania/depression, episodes/medicines including antidepressants, adherence, substances and collateral.","Assess suicide, spending/sexual/driving risks, vulnerability and ability to care for self."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Manic/hypomanic or depressive episode in bipolar disorder versus substance/medical causes, unipolar depression or primary psychosis.","Lithium use suggests a history to explore; it does not prove that today’s presentation is a depressive episode."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["MSE and physical review; renal/thyroid/calcium and lithium level when appropriate, plus medication-specific monitoring.","Check pregnancy possibility and drug interactions; urgent level/electrolytes if toxicity suspected."]},{heading:"Management",points:["Acute mania/psychosis or major safety risk: urgent psychiatric review; review/stop triggering antidepressants only through an appropriate prescriber.","Treatment may include an antipsychotic and/or mood stabiliser selected for phase, prior response and reproductive risk.","Bipolar depression requires specialist phase-specific treatment; avoid routine antidepressant monotherapy. Valproate carries major reproductive restrictions."]}]}],pages:[74],note:"",adapted:false,set:"2023 · cohort 2018",images:[]},{id:"jcs-257",year:"2023",rotation:"Psychiatry",topic:"ocd",title:"A 40-year-old man has worrying thoughts for eight months",case:"A 40-year-old man has worrying thoughts for eight months.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask intrusive unwanted thoughts/images/urges and repetitive acts/mental rituals, time consumed, distress, avoidance and functional effect.","Assess insight, resistance, triggers, reassurance seeking, depression, suicide risk, psychosis and substance use."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["OCD versus generalised anxiety, health anxiety, psychosis, autism-related routines and obsessive-compulsive personality traits."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["MSE and functional/risk assessment; targeted physical investigations only if indicated, not a test to prove OCD."]},{heading:"Management",points:["CBT with exposure and response prevention; SSRIs depending on severity, preference and specialist assessment.","Explain that response may take time and OCD may need a different dose/duration strategy under supervision; review adherence and side effects.","Severe impairment/risk or nonresponse needs specialist input."]}]}],pages:[74,75],note:"",adapted:false,set:"2023 · cohort 2018",images:[]},{id:"jcs-258",year:"2023",rotation:"FAMCO",topic:"migraine",title:"A 32-year-old woman presents with headache",case:"A 32-year-old woman presents with headache.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Characterise onset, time course, location, quality, severity, duration, aura, nausea, light/sound sensitivity and activity effect.","Ask thunderclap onset, fever/meningism, new neurological deficit, pregnancy/postpartum, cancer/immunosuppression, trauma, positional/exertional change and medication overuse."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Migraine versus tension-type/cluster, medication-overuse and secondary headache.","Band-like headache with no red flags may be tension-type; do not force a migraine diagnosis from the presenting word alone."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Vitals and focused neurological/fundal assessment; targeted urgent imaging/LP pathway for red flags.","Routine MRI is not indicated solely for reassurance after a typical primary headache and normal appropriate assessment."]},{heading:"Management",points:["Explain working diagnosis and safety-net; headache diary, sleep/hydration/regular meals and trigger management.","Acute migraine: suitable simple analgesic/NSAID and/or triptan ± antiemetic after contraindications; tension-type generally simple analgesia; avoid opioids.","Discuss prevention if frequent/disabling, with pregnancy and reproductive-safety considerations. Any prescription requires allergy, pregnancy, interaction, dose/duration and follow-up checks."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Explore why MRI is requested, explain benefits/harms and red flags without dismissing concern.","Explain working diagnosis and safety-net; headache diary, sleep/hydration/regular meals and trigger management.","Acute migraine: suitable simple analgesic/NSAID and/or triptan ± antiemetic after contraindications; tension-type generally simple analgesia; avoid opioids.","Discuss prevention if frequent/disabling, with pregnancy and reproductive-safety considerations. Any prescription requires allergy, pregnancy, interaction, dose/duration and follow-up checks."]}]}],pages:[75],note:"",adapted:false,set:"2023 · cohort 2018",images:[]},{id:"jcs-259",year:"2023",rotation:"FAMCO",topic:"diabetes",title:"A 45-year-old woman has an abnormal random blood sugar reading",case:"A 45-year-old woman has an abnormal random blood sugar reading.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask polyuria, polydipsia, weight loss, fatigue, infections, visual symptoms, duration and symptoms of hyperglycaemic crisis.","Assess diet/activity, family history, pregnancy, medicines/steroids, cardiovascular/renal disease and patient concerns."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Type 2 diabetes versus type 1, gestational or secondary disease; confirm according to symptoms and diagnostic glucose/HbA1c criteria.","An isolated abnormal random reading in an otherwise well person may need confirmation rather than an immediate label."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["HbA1c or appropriate plasma glucose confirmation, renal function/eGFR, urine ACR, lipids/BP and complications screening.","Ketones/urgent metabolic work-up if weight loss, illness or possible insulin deficiency."]},{heading:"Management",points:["Individualised education, nutrition/activity support and medication based on HbA1c, renal function, cardiovascular/heart failure risk and preferences.","Metformin may be appropriate; SGLT2 inhibitors and GLP-1-based treatments have selected cardiorenal/metabolic indications; insulin if clinically needed.","Persistent albuminuria: optimise BP/glucose; ACE inhibitor/ARB and/or SGLT2 therapy when indicated with eGFR, potassium, pregnancy and contraindication checks—not automatically for everyone."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Explain microvascular and cardiovascular complications without fatalism; kidney failure is not inevitable. Discuss smoking cessation, monitoring, annual reviews and sick-day/hypoglycaemia advice tailored to medicines.","Individualised education, nutrition/activity support and medication based on HbA1c, renal function, cardiovascular/heart failure risk and preferences.","Metformin may be appropriate; SGLT2 inhibitors and GLP-1-based treatments have selected cardiorenal/metabolic indications; insulin if clinically needed.","Persistent albuminuria: optimise BP/glucose; ACE inhibitor/ARB and/or SGLT2 therapy when indicated with eGFR, potassium, pregnancy and contraindication checks—not automatically for everyone."]}]}],pages:[75],note:"",adapted:false,set:"2023 · cohort 2018",images:[]},{id:"jcs-260",year:"2023",rotation:"Dermatology",topic:"shingles",title:"A 58-year-old man has a painful skin eruption. Describe the photograph, discuss alternatives, care and complications",case:"A 58-year-old man has a painful skin eruption. Describe the photograph, discuss alternatives, care and complications.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask pain before rash, onset, dermatome, prior chickenpox/vaccine, immunosuppression, eye/ear symptoms and systemic illness."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Herpes zoster versus HSV, contact dermatitis and other vesicular eruptions."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Usually clinical; PCR if atypical/immunocompromised; urgent eye/ENT assessment with relevant involvement."]},{heading:"Management",points:["Antiviral treatment when indicated, ideally early and using current age/renal/local criteria; analgesia and skin care.","Ophthalmic zoster, facial palsy/ear disease, dissemination or immunosuppression requires urgent specialist assessment.","Discuss postherpetic neuralgia and vaccination eligibility after recovery."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Vesicle fluid can transmit varicella to non-immune people; cover lesions and avoid high-risk susceptible contacts until crusted.","Antiviral treatment when indicated, ideally early and using current age/renal/local criteria; analgesia and skin care.","Ophthalmic zoster, facial palsy/ear disease, dissemination or immunosuppression requires urgent specialist assessment.","Discuss postherpetic neuralgia and vaccination eligibility after recovery."]}]}],pages:[75],note:"The clinical photo is not included in the PDF.",adapted:false,set:"2023 · cohort 2018",images:[]},{id:"jcs-261",year:"2023",rotation:"Anaesthesia",topic:"airway",title:"A 58-year-old man has chest pain and breathlessness, then collapses; demonstrate airway adjunct and bag-mask ventilation on a manikin",case:"A 58-year-old man has chest pain and breathlessness, then collapses; demonstrate airway adjunct and bag-mask ventilation on a manikin.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Before collapse, obtain key chest-pain/dyspnoea, cardiac/respiratory, allergy, medicine and event history if time permits.","Once collapse occurs, stop routine history and assess responsiveness and breathing immediately."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Cardiac arrest/ACS/arrhythmia, hypoxia, airway obstruction, severe asthma/anaphylaxis, PE or metabolic causes according to context."]}]},{key:"p",label:"Demonstrate or explain the procedure safely",sections:[{heading:"Safety and steps",points:["Model-only, trained practice: position airway appropriately (jaw thrust/manual in-line support for suspected cervical injury), remove visible obstruction/suction, oxygen and correct mask size.","Use effective seal and jaw lift (two-person BVM preferred when possible), ventilate to visible chest rise without excessive rate/volume, reassess chest rise/oxygenation/capnography if available.","OPA for deeply unresponsive patient without gag; NPA sizing/contraindications per training (avoid suspected skull-base/major facial injury). Use a suitable supraglottic device/LMA when indicated and escalate failed oxygenation.","Intubation needs trained staff, equipment checks, backup plan, monitoring and waveform capnography confirmation; device sizes depend on device and patient, not one universal size."]},{heading:"Checks and samples",points:["Call emergency/resuscitation team, assess ABCDE, attach monitoring/defibrillator; glucose and ECG as appropriate.","If unresponsive and not breathing normally, start CPR/use defibrillator per current training—ventilation alone is not sufficient."]}]}],pages:[75],note:"",adapted:false,set:"2023 · cohort 2018",images:[]},{id:"jcs-262",year:"2023",rotation:"Orthopaedics",topic:"shoulder",title:"A man in his thirties has shoulder pain",case:"A man in his thirties has shoulder pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask injury/overhead lifting, pain arc/night pain, weakness, stiffness, instability, neck symptoms and red flags."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect from front/back, palpate appropriate landmarks; compare active and passive flexion/abduction/rotation, then gentle resisted cuff testing.","Global active and passive restriction suggests capsulitis; preserved passive with impaired active movement may suggest cuff pathology. Complete cervical/distal neurovascular exam."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Rotator cuff/subacromial pain, adhesive capsulitis, arthritis, cervical referral and acute traumatic tear; pain on all movements alone is not diagnostic."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Clinical assessment; X-ray if trauma/arthritis concern, ultrasound/MRI when it changes management; urgent infection assessment for hot painful systemic illness."]},{heading:"Management",points:["Activity modification, appropriate analgesia and physiotherapy; selected injection or specialist review.","Acute traumatic loss of power or major suspected tear warrants prompt orthopaedic review; surgery is individualised."]}]}],pages:[76],note:"Age and final diagnosis were not remembered; no definitive lesion should be invented.",adapted:false,set:"2023 · cohort 2018",images:[]},{id:"jcs-263",year:"2023",rotation:"Orthopaedics",topic:"footdrop",title:"A man in his twenties has an incompletely recalled limb complaint",case:"A man in his twenties has an incompletely recalled limb complaint.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask onset, back/radicular pain, leg crossing/pressure, trauma, surgery, weight loss, sensory symptoms and bladder/bowel red flags."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Test dorsiflexion/toe extension, eversion and inversion, proximal hip abduction, reflexes and sensory map.","Weak inversion/hip abduction suggests L5 involvement rather than isolated common fibular lesion; gait only with guarding."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Common fibular neuropathy versus L5 radiculopathy, sciatic/plexus lesion or central disease."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Focused neurological exam; nerve conduction/EMG and imaging guided by localisation; urgent MRI for spinal emergency signs."]},{heading:"Management",points:["Address compression/cause, falls support and ankle-foot orthosis/physiotherapy; urgent review of new/progressive or traumatic deficit.","Spinal compression/cauda equina signs require emergency pathway."]}]}],pages:[76],note:"The recall names foot drop, but onset/cause and exact presenting words are missing.",adapted:false,set:"2023 · cohort 2018",images:[]},{id:"jcs-264",year:"2023",rotation:"Surgery",topic:"ugib",title:"A 45-year-old man presents with haematemesis",case:"A 45-year-old man presents with haematemesis.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Clarify vomiting blood/coffee grounds versus coughing blood; quantity, melaena, syncope, shock, pain, retching, ulcers, liver disease, NSAIDs/anticoagulants and alcohol."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Peptic ulcer, gastritis/oesophagitis, varices, Mallory–Weiss tear and malignancy; prioritise severity before labelling cause."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["ABCDE, serial observations, FBC/renal/liver/coagulation, group/crossmatch and ECG if appropriate.","Validated pathway risk assessment and urgent endoscopy after resuscitation; unstable bleeding requires immediate specialist intervention."]},{heading:"Management",points:["Emergency help, IV access, monitored resuscitation and blood products according to severity/local protocol, early gastro/surgery input.","Endoscopic haemostasis and cause-specific treatment; suspected varices needs appropriate vasoactive/antibiotic pathway through team.","Review anticoagulation/NSAIDs with senior team; later H. pylori testing/eradication when indicated."]}]}],pages:[76],note:"Peptic ulcer was only a tentative recalled cause; assess all UGIB causes and severity.",adapted:false,set:"2023 · cohort 2018",images:[]},{id:"jcs-265",year:"2023",rotation:"Surgery",topic:"diverticulitis",title:"A 60-year-old man has left lower abdominal pain",case:"A 60-year-old man has left lower abdominal pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask pain onset/localisation, fever, bowel change, bleeding, vomiting, urinary symptoms, prior episodes and immune status."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["General observations and gentle abdominal localisation/guarding/mass; other examination only when indicated."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Diverticulitis versus colorectal cancer, colitis, constipation, urinary disease and gynaecological causes."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Vitals, FBC/CRP/renal tests/urine and relevant pregnancy test; CT for complicated/uncertain disease and appropriate secondary-care assessment."]},{heading:"Management",points:["Assess sepsis/peritonism/obstruction for urgent admission; antibiotics and drainage/surgery depend on severity/complications and local pathway.","Selected uncomplicated well patients may have outpatient supportive care with clear review; avoid assuming antibiotics for every mild episode.","Plan appropriate later colonic assessment when indicated; avoid colonoscopy during acute severe inflammation."]}]}],pages:[76],note:"",adapted:false,set:"2023 · cohort 2018",images:[]},{id:"jcs-266",year:"2023",rotation:"Surgery",topic:"retention",title:"A 64-year-old man has been unable to pass urine for 12 hours. Demonstrate Foley catheterisation on a model",case:"A 64-year-old man has been unable to pass urine for 12 hours. Demonstrate Foley catheterisation on a model.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask onset, pain, last urine, prior LUTS, haematuria, constipation, medicines, surgery, trauma and neurological/saddle symptoms."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["BPH, urethral obstruction, medicines, infection, clot retention and neurogenic causes; no final cause is established in the short recall."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Bladder assessment/scan when appropriate, urine and renal/electrolyte tests; urgent spinal assessment for neurological red flags."]},{heading:"Management",points:["Prompt decompression with appropriate catheter by trained staff unless urethral injury suspected; monitor output and complications.","Model procedure: identity/consent/chaperone, allergies, asepsis, appropriate catheter and lubricant/anaesthetic, gentle insertion without force; confirm intravesical placement/urine before balloon inflation per policy.","Blood at meatus, pelvic trauma or resistance: stop and seek urology; manage post-obstructive diuresis and plan cause-directed care/trial without catheter."]}]},{key:"p",label:"Demonstrate or explain the procedure safely",sections:[{heading:"Safety and steps",points:["Prompt decompression with appropriate catheter by trained staff unless urethral injury suspected; monitor output and complications.","Model procedure: identity/consent/chaperone, allergies, asepsis, appropriate catheter and lubricant/anaesthetic, gentle insertion without force; confirm intravesical placement/urine before balloon inflation per policy.","Blood at meatus, pelvic trauma or resistance: stop and seek urology; manage post-obstructive diuresis and plan cause-directed care/trial without catheter."]},{heading:"Checks and samples",points:["Bladder assessment/scan when appropriate, urine and renal/electrolyte tests; urgent spinal assessment for neurological red flags."]}]}],pages:[76,77],note:"No final aetiology is remembered.",adapted:false,set:"2023 · cohort 2018",images:[]},{id:"jcs-267",year:"2024",rotation:"Medicine",topic:"valves",title:"A 35-year-old man presents with chest pain. A mitral regurgitation murmur and rheumatic heart disease were recalled",case:"A 35-year-old man presents with chest pain. A mitral regurgitation murmur and rheumatic heart disease were recalled.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Clarify exertional dyspnoea, chest pain, syncope, palpitations and oedema.","Ask rheumatic fever, fever/dental or bloodstream infection, cardiac surgery, valve type, anticoagulants and functional limitation."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Consent, pain check, appropriate exposure; inspect scars, hands and face; pulse rate/rhythm/character and BP.","Assess JVP, apex, heaves/thrills; auscultate all areas with diaphragm/bell and appropriate positioning; time a murmur against pulse.","Describe timing, site, radiation, intensity and associated sounds; examine lung bases and oedema."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Characterise the murmur before naming a lesion: systolic versus diastolic, loudest site, radiation and associated pulse/JVP changes.","Consider regurgitation/stenosis, prosthetic valve sounds and infective endocarditis if systemic features; a scar alone does not establish the operation."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["ECG and transthoracic echoc
