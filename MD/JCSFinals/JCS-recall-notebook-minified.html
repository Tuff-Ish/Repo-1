le abdominal examination; Murphy sign is an inspiratory catch on RUQ palpation, not definitive alone."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Observations, FBC/CRP, liver profile, renal function and lipase; pregnancy test if relevant.","RUQ ultrasound; further bile-duct imaging/ERCP according to obstruction/cholangitis pathway."]},{heading:"Management",points:["Analgesia, antiemetic, fluids when needed and antibiotics according to severity/local policy; surgical assessment.","Early laparoscopic cholecystectomy is recommended, for example within 1 week of diagnosis in NICE guidance—not an absolute universal 72-hour cut-off.","Jaundice with sepsis suggests cholangitis and may require urgent biliary drainage; individualise timing if unstable/unfit."]}]}],pages:[87],note:"",adapted:false,set:"2024 · cohort 2019",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-282",diagnoses:["Cholecystitis"],differentials:[],evidence:[{page:87,quote:"Case of cholecystitis"}],mode:"document-context"},aiNotes:{title:"Cholecystitis",safety:"",refs:["gallstones"]}},{id:"jcs-283",year:"2024",rotation:"Surgery",topic:"acuteischaemia",title:"A 21-year-old man has leg pain",case:"A 21-year-old man has leg pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Rapidly establish onset, pain, sensory loss/weakness and baseline function; ask AF, vascular disease, procedures/trauma and anticoagulants."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Compare colour/temperature/pulses and document sensory/motor deficit quickly; do not waste time with routine ABPI/exercise testing."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Immediate vascular assessment; Doppler and urgent vascular imaging as directed without delaying threatened-limb treatment.","ECG, bloods including renal function/lactate and coagulation; assess other embolic sites."]},{heading:"Management",points:["Call vascular/emergency team immediately, analgesia and ABCDE; keep nil by mouth and protect the limb.","Anticoagulation with unfractionated heparin is often indicated after contraindication review by the team; do not delay revascularisation decisions.","Definitive embolectomy/thrombectomy/thrombolysis/bypass depends on viability, cause and time; monitor reperfusion/compartment syndrome."]}]}],pages:[87,88],note:"",adapted:false,set:"2024 · cohort 2019",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-283",diagnoses:["Acute limb ischaemia"],differentials:[],evidence:[{page:88,quote:"Case of acute limb ischemia"}],mode:"document-context"},aiNotes:{title:"Acute limb ischaemia",safety:"New sensory loss or weakness in a cold painful limb indicates threatened viability: immediate vascular emergency assessment.",refs:[]}},{id:"jcs-284",year:"2024",rotation:"Surgery",topic:"graves",title:"A 41-year-old man has neck swelling",case:"A 41-year-old man has neck swelling.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask weight loss, heat intolerance, palpitations, bowel change, tremor, menstrual change and neck compression.","Assess eye pain/diplopia/vision, smoking, pregnancy, medicines, cardiac symptoms and family autoimmune disease."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Warm moist hands, tremor, tachycardia/AF, proximal power/reflexes, diffuse goitre/bruit; assess eye movements, acuity and corneal exposure if eye signs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["TSH, free T4/T3, TSH receptor antibodies when indicated; ECG, baseline FBC/liver tests before relevant medicines.","Ultrasound for structural questions; radionuclide testing selected by specialists and avoided in pregnancy."]},{heading:"Management",points:["Symptom control with a suitable beta-blocker if safe; antithyroid medicine, radioiodine or surgery based on cause, preference, pregnancy and specialist input.","Carbimazole can cause agranulocytosis: fever/sore throat requires stopping it and urgent medical/FBC assessment per safety instructions; liver symptoms also require urgent review.","Thyroid storm is emergency treatment; severe/sight-threatening thyroid eye disease needs urgent eye/endocrine care. Smoking cessation matters."]}]}],pages:[88],note:"",adapted:false,set:"2024 · cohort 2019",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-284",diagnoses:["Graves disease"],differentials:[],evidence:[{page:88,quote:"Case of graves’ disease"}],mode:"document-context"},aiNotes:{title:"Graves disease",safety:"",refs:[]}},{id:"jcs-285",year:"2025",rotation:"Surgery",topic:"appendicitis",title:"A young man presents to the emergency department with acute abdominal pain for two days",case:"A young man presents to the emergency department with acute abdominal pain for two days.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask onset/migration to RIF, anorexia, nausea/vomiting, fever, bowel/urinary symptoms and pregnancy/sexual-gynaecological context when relevant."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Vitals/general assessment and gentle abdomen away from pain, local tenderness/guarding; do not repeatedly provoke rebound; relevant genital/hernia/gynaecological exam only if indicated/consented."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Observations, urine/pregnancy test, FBC/CRP/renal tests; ultrasound or CT based on age/pregnancy/risk and surgical assessment."]},{heading:"Management",points:["Analgesia, antiemetic and hydration as needed, nil by mouth pending surgery plan and prompt surgical review.","Antibiotics/appendicectomy versus selected nonoperative treatment depends on imaging, complications and patient/team decision; sepsis/peritonitis needs urgent care."]}]}],pages:[89],note:"",adapted:false,set:"2025 · cohort 2020",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-285",diagnoses:["Appendicitis"],differentials:[],evidence:[{page:89,quote:"(Appendicitis)"}],mode:"document-context"},aiNotes:{title:"Appendicitis",safety:"",refs:[]}},{id:"jcs-286",year:"2025",rotation:"Surgery",topic:"trauma",title:"A young man arrives after a motor vehicle accident",case:"A young man arrives after a motor vehicle accident.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Expose safely, control external bleeding, assess airway/breathing, chest movement/sounds, perfusion, neurological status and hidden injuries, preventing hypothermia."]}]},{key:"i",label:"Select and interpret relevant investigations",sections:[{heading:"Important points",points:["CABCDE/ABCDE with haemorrhage control, monitoring and repeated assessment; eFAST and bedside chest/pelvic imaging when appropriate.","Trauma CT only when stable enough; blood gas/lactate, blood count/coagulation and crossmatch; do not delay life-saving intervention for imaging."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["CABCDE/ABCDE with haemorrhage control, monitoring and repeated assessment; eFAST and bedside chest/pelvic imaging when appropriate.","Trauma CT only when stable enough; blood gas/lactate, blood count/coagulation and crossmatch; do not delay life-saving intervention for imaging."]},{heading:"Management",points:["Activate trauma/massive-haemorrhage response, protect cervical spine as indicated, oxygenation/airway support and balanced blood-product resuscitation per pathway.","Suspected unstable pelvic injury: binder over greater trochanters, avoid repeated pelvic springing; persistent instability requires urgent haemorrhage control with trauma/IR/surgery (packing/embolisation/fixation as appropriate), not simply another fluid bolus.","Clinically significant traumatic haemothorax may require chest drain by trained staff and urgent surgery for massive/ongoing bleeding; treat associated injuries."]}]}],pages:[89],note:"Traumatic haemothorax is recalled in the source.",adapted:false,set:"2025 · cohort 2020",images:[],taskType:"examination",caseReviewed:true,recallContext:"A young man arrives after a motor vehicle accident. Perform a primary survey, discuss airway support and immediate investigations/treatment.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-286",diagnoses:["Trauma with haemothorax"],differentials:[],evidence:[{page:89,quote:"Trauma with \nHemothorax"}],mode:"document-context"},aiNotes:{title:"Trauma with haemothorax",safety:"Unstable trauma requires immediate senior trauma response; procedures are supervised/manikin learning only.",refs:["trauma","abcde"]}},{id:"jcs-287",year:"2025",rotation:"Surgery",topic:"renal",title:"A young man presents with flank pain for two days",case:"A young man presents with flank pain for two days.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask colicky radiation to groin, haematuria, fever/rigors, dysuria, vomiting, stone history, solitary kidney, gout and fluid intake.","Assess pregnancy, retention, trauma and malignancy risks as relevant."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Assess vitals/sepsis, hydration, abdomen and gentle renal angle tenderness; avoid repeated painful percussion.","Assess mass if present; offer indicated genital/hernia examination with consent. A new non-reducing left varicocele with concerning signs can prompt renal assessment."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Urinalysis/culture, renal function/electrolytes, FBC and pregnancy test when appropriate.","Non-contrast low-dose CT KUB is typical adult stone imaging; ultrasound first in pregnancy/children or selected pathways. Uric acid stones can be radiolucent on plain film but visible on CT."]},{heading:"Management",points:["Sepsis with obstruction, anuria/AKI, solitary kidney or uncontrolled symptoms needs urgent urology; infected obstruction requires antibiotics plus urgent decompression, not antibiotics alone.","Analgesia (NSAID if safe), antiemetic, hydration to need and stone-size/location-based passage versus intervention plan.","Uric acid stones: metabolic assessment and specialist-guided urine alkalinisation may dissolve selected stones; do not prescribe it indiscriminately."]}]}],pages:[89],note:"",adapted:false,set:"2025 · cohort 2020",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A young man presents with flank pain for two days. Demonstrate renal-angle assessment and discuss tests, alternatives and treatment.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-287",diagnoses:["Ureteric stones"],differentials:[],evidence:[{page:89,quote:"Ureter stones"}],mode:"document-context"},aiNotes:{title:"Ureteric stones",safety:"",refs:[]}},{id:"jcs-288",year:"2025",rotation:"Orthopaedics",topic:"knee",title:"A young man attends with a sports-related knee injury",case:"A young man attends with a sports-related knee injury.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask mechanism (twist/contact/hyperextension), pop, immediate/delayed swelling, instability, locking, weight-bearing and prior injury.","Check fracture, infection and neurovascular red flags; assess sport/work goals."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect gait/alignment if safe then swelling/wasting, warmth/tenderness, effusion and comfortable active/passive range.","Assess Lachman/anterior drawer, posterior drawer and collateral stress when tolerated and trained; meniscal tests only if useful, not forced in an acutely painful joint.","Assess distal neurovascular status and adjacent joints; document findings."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Plain films when fracture criteria/clinical concern indicate; MRI for selected soft-tissue assessment and management planning."]},{heading:"Management",points:["Analgesia, protection/support and early appropriate rehabilitation; urgent referral for dislocation/neurovascular compromise, locked knee or major instability.","MCL injuries are often treated nonoperatively; surgery is reserved for selected severe/combined injuries, not all “severe” tears automatically.","ACL reconstruction versus rehabilitation depends on instability, activity and associated injury; shared orthopaedic plan."]}]}],pages:[89],note:"",adapted:false,set:"2025 · cohort 2020",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-288",diagnoses:["ACL tear"],differentials:[],evidence:[{page:89,quote:"ACL tear"}],mode:"document-context"},aiNotes:{title:"ACL tear",safety:"",refs:[]}},{id:"jcs-289",year:"2025",rotation:"Orthopaedics",topic:"cervical",title:"A young man has neck and left-arm pain",case:"A young man has neck and left-arm pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask neck pain/radiation, dermatomal numbness, weakness, trauma, hand clumsiness, gait imbalance and bladder/bowel change.","Assess infection/cancer and inflammatory risks; clarify functional impact."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect/palpate neck and assess comfortable movement, arm power/reflexes/sensation and relevant peripheral nerves.","Assess legs/reflexes/gait for cord signs; use provocative tests only if appropriate and trained."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Neurological assessment; no routine imaging for uncomplicated improving pain, but MRI for progressive deficit, myelopathy or other red flags."]},{heading:"Management",points:["Conservative activity/posture advice, appropriate analgesia and physiotherapy if safe.","Progressive weakness, myelopathy or traumatic instability needs urgent spine assessment; avoid forceful neck manipulation."]}]}],pages:[89],note:"",adapted:false,set:"2025 · cohort 2020",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-289",diagnoses:["Cervical disc herniation"],differentials:[],evidence:[{page:89,quote:"Cervical Disc \nherniation"}],mode:"document-context"},aiNotes:{title:"Cervical disc herniation",safety:"",refs:[]}},{id:"jcs-290",year:"2025",rotation:"Anaesthesia",topic:"airway",title:"An unresponsive older man requires airway support on a manikin",case:"An unresponsive older man requires airway support on a manikin.",objectives:[{key:"p",label:"Demonstrate or explain the procedure safely",sections:[{heading:"Safety and steps",points:["Model-only, trained practice: position airway appropriately (jaw thrust/manual in-line support for suspected cervical injury), remove visible obstruction/suction, oxygen and correct mask size.","Use effective seal and jaw lift (two-person BVM preferred when possible), ventilate to visible chest rise without excessive rate/volume, reassess chest rise/oxygenation/capnography if available.","OPA for deeply unresponsive patient without gag; NPA sizing/contraindications per training (avoid suspected skull-base/major facial injury). Use a suitable supraglottic device/LMA when indicated and escalate failed oxygenation.","Intubation needs trained staff, equipment checks, backup plan, monitoring and waveform capnography confirmation; device sizes depend on device and patient, not one universal size."]},{heading:"Checks and samples",points:["Call emergency/resuscitation team, assess ABCDE, attach monitoring/defibrillator; glucose and ECG as appropriate.","If unresponsive and not breathing normally, start CPR/use defibrillator per current training—ventilation alone is not sufficient."]}]}],pages:[89],note:"",adapted:false,set:"2025 · cohort 2020",images:[],taskType:"procedure",caseReviewed:true,recallContext:"An older man presents with chest pain and collapses during the history. Explain next actions and demonstrate airway management on a manikin.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"During the assessment",items:["The patient presented with chest pain and collapsed during history-taking."]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-290",diagnoses:[],differentials:[],evidence:[],mode:"neutral"},aiNotes:{title:"Airway assessment and support",safety:"Unresponsive and not breathing normally: activate emergency response, CPR and defibrillator per training.",refs:["abcde"]}},{id:"jcs-291",year:"2025",rotation:"Dermatology",topic:"molluscum",title:"A young woman presents with an itchy eruption for one week",case:"A young woman presents with an itchy eruption for one week.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask duration, itch, spread, contacts, eczema, immune status and treatment; in adults assess genital distribution/sexual health sensitively."]}]},{key:"x",label:"Describe and interpret the supplied image or findings",sections:[{heading:"Describe the supplied material",points:["Describe small smooth pearly/flesh-coloured dome-shaped papules with central umbilication; assess inflammation and distribution.","Correlate the image findings with the history, examination and relevant test results."]},{heading:"Interpretation",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Usually clinical; no routine investigations if typical and otherwise well."]},{heading:"Management",points:["Usually self-limiting: reassurance and avoid picking/shared towels; manage associated eczema.","Discuss selected clinician-administered treatment if troublesome, genital, uncertain or persistent; balance pain/scarring against observation.","Do not use harsh home removal techniques; refer eye-adjacent or unusual lesions."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Explain contact spread and autoinoculation; lesions can take months or longer to clear and do not imply poor hygiene.","Usually self-limiting: reassurance and avoid picking/shared towels; manage associated eczema.","Discuss selected clinician-administered treatment if troublesome, genital, uncertain or persistent; balance pain/scarring against observation.","Do not use harsh home removal techniques; refer eye-adjacent or unusual lesions."]}]}],pages:[89],note:"Molluscum contagiosum is named in the recall; original picture is absent.",adapted:false,set:"2025 · cohort 2020",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A young woman has an itchy eruption for one week. Describe the picture and discuss investigations, care and counselling.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-291",diagnoses:["Molluscum contagiosum"],differentials:[],evidence:[{page:89,quote:"Molluscum \ncontagiosum"}],mode:"document-context"},aiNotes:{title:"Molluscum contagiosum",safety:"",refs:[]}},{id:"jcs-292",year:"2025",rotation:"FAMCO",topic:"anaemia",title:"A young woman has fatigue for three months",case:"A young woman has fatigue for three months.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask fatigue, exertional dyspnoea/palpitations, bleeding including menstruation/GI loss, diet, pica, pregnancy, malabsorption and chronic disease.","In children ask milk/diet, growth, stool loss/parasites risks and family haemoglobinopathy history; jaundice raises haemolysis/liver alternatives."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["FBC indices/film, ferritin interpreted with inflammation, iron studies as needed; reticulocytes/haemolysis or other tests by pattern.","Iron deficiency usually gives low ferritin and transferrin saturation; ferritin may be falsely normal/high with inflammation. Investigate the source of deficiency."]},{heading:"Management",points:["Haemodynamic compromise, active major bleeding or severe symptomatic anaemia needs urgent review.","Replace iron using age/weight/local formulary, treat source and check response; selected patients need IV iron/specialist care.","Explain oral iron GI effects/dark stools, adherence, safe storage and a planned course/recheck; do not use transfusion routinely for stable mild disease."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Give diet and bleeding advice without blaming; do not assume all adult iron deficiency is nutritional.","Haemodynamic compromise, active major bleeding or severe symptomatic anaemia needs urgent review.","Replace iron using age/weight/local formulary, treat source and check response; selected patients need IV iron/specialist care.","Explain oral iron GI effects/dark stools, adherence, safe storage and a planned course/recheck; do not use transfusion routinely for stable mild disease."]}]}],pages:[90],note:"",adapted:false,set:"2025 · cohort 2020",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-292",diagnoses:["Iron deficiency anaemia"],differentials:[],evidence:[{page:90,quote:"Iron \ndeﬁciency anemia"}],mode:"document-context"},aiNotes:{title:"Iron deficiency anaemia",safety:"",refs:[]}},{id:"jcs-293",year:"2025",rotation:"FAMCO",topic:"whitecoat",title:"A 50-year-old man attends with elevated blood pressure",case:"A 50-year-old man attends with elevated blood pressure.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Check measurement technique and repeat readings; ask symptoms, medicines and prior readings, and use home/ambulatory measurement when appropriate. Review home/ambulatory results alongside clinic readings.","Clarify the presenting concern, onset, duration, course, severity and effect on daily function.","Ask relevant associated lood-pressure assessment",safety:"",refs:[]}},{id:"jcs-294",year:"2025",rotation:"Medicine",topic:"pleural",title:"An older man presents with breathlessness and fever",case:"An older man presents with breathlessness and fever.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Assess observations, expansion, percussion (often stony dull), reduced breath sounds/vocal resonance; inspect whole chest and assess cause signs."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["CXR and thoracic ultrasound; pleural aspiration by trained staff with image guidance when indicated.","Fluid pH, glucose, protein/LDH with paired serum, cells, culture and cytology as appropriate; blood cultures if febrile."]},{heading:"Management",points:["Acute compromise/sepsis requires urgent care; antibiotics for pleural infection and respiratory/pleural-team input.","Complicated/infected effusion (e.g. pus or appropriate biochemical/imaging criteria) often requires drainage; further intrapleural/surgical options by specialists.","Do not aspirate/drain from memorised physical landmarks without ultrasound and training."]}]}],pages:[90],note:"",adapted:false,set:"2025 · cohort 2020",images:[],taskType:"examination",caseReviewed:true,recallContext:"An older man has shortness of breath and fever. Perform respiratory examination and discuss tests and treatment.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-294",diagnoses:["Complicated pleural effusion"],differentials:[],evidence:[{page:90,quote:"Complicated \npleura eVusion"}],mode:"document-context"},aiNotes:{title:"Complicated pleural effusion",safety:"",refs:[]}},{id:"jcs-295",year:"2025",rotation:"Medicine",topic:"dvt",title:"A young man presents to the emergency department with painful right-leg swelling",case:"A young man presents to the emergency department with painful right-leg swelling.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask unilateral swelling/pain onset, surgery/immobility/travel, cancer, oestrogen/pregnancy, previous VTE and bleeding risks.","Ask breathlessness, pleuritic pain, haemoptysis or syncope immediately."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Validated clinical probability pathway with D-dimer and/or compression ultrasound according to probability; pregnancy has a separate pathway.","Baseline FBC/renal/liver/coagulation for treatment as appropriate; urgent PE assessment if chest symptoms."]},{heading:"Management",points:["Arrange timely investigation and interim anticoagulation when indicated by pathway and after contraindication assessment.","Confirmed DVT: anticoagulant choice/duration depends on provoking factors, cancer, pregnancy, renal function and bleeding risk.","Do not massage the limb or use Homan sign; provide clear PE/bleeding advice."]}]}],pages:[90],note:"",adapted:false,set:"2025 · cohort 2020",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-295",diagnoses:["DVT"],differentials:[],evidence:[{page:90,quote:"(DVT)"}],mode:"document-context"},aiNotes:{title:"DVT",safety:"",refs:[]}},{id:"jcs-296",year:"2025",rotation:"Medicine",topic:"nephrotic",title:"A young woman presents with generalised swelling",case:"A young woman presents with generalised swelling.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask morning eye puffiness, dependent/generalised oedema, frothy urine, urine output, weight gain, infection and breathlessness.","Ask haematuria, hypertension symptoms, drugs/systemic illness; fever/abdominal pain may indicate complications."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["BP, weight/fluid status, urine protein quantification, serum albumin/renal function/electrolytes/lipids; cause-directed tests.","Childhood typical steroid-sensitive disease is assessed by paediatrics; adult disease often needs a different renal investigation/biopsy pathway."]},{heading:"Management",points:["Paediatric/renal review; monitor fluid balance/BP and treat oedema carefully because intravascular depletion can coexist.","Steroids for appropriate childhood presentations under protocol; adult treatment depends on cause. Assess infection and thrombosis risk.","Explain childhood minimal-change disease often responds well but relapses are possible; do not promise permanent cure."]}]}],pages:[90],note:"",adapted:false,set:"2025 · cohort 2020",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-296",diagnoses:["Nephrotic syndrome"],differentials:[],evidence:[{page:90,quote:"Nephrotic syndrome"}],mode:"document-context"},aiNotes:{title:"Nephrotic syndrome",safety:"",refs:[]}},{id:"jcs-297",year:"2025",rotation:"Paediatrics",topic:"meningitis",title:"An eight-month-old has abnormal movements",case:"An eight-month-old has abnormal movements.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask fever duration, feeding, irritability/lethargy, rash, neck symptoms, vomiting, seizures (duration/focality/recovery), immunisation and exposure.","In infants consider subtle poor feeding, apnoea or reduced responsiveness; do not require neck stiffness."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["ABCDE, glucose, blood cultures and urgent blood tests; CSF only when safe and without delaying treatment; imaging according to indication."]},{heading:"Management",points:["Immediate senior paediatric/emergency care, age-appropriate empirical IV antimicrobials per protocol and seizure treatment if prolonged; do not wait for LP.","Manage shock/glucose/airway and monitor; isolate/public-health measures and contact prophylaxis for relevant organisms.","Arrange hearing/neurodevelopmental follow-up; discuss potential seizures/sequelae without guaranteeing epilepsy or no sequelae."]}]}],pages:[90],note:"",adapted:false,set:"2025 · cohort 2020",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-297",diagnoses:["Meningitis"],differentials:[],evidence:[{page:90,quote:"(Meningitis)"}],mode:"document-context"},aiNotes:{title:"Meningitis",safety:"Seizure, reduced consciousness, shock or suspected meningitis needs emergency assessment.",refs:["meningitis"]}},{id:"jcs-298",year:"2025",rotation:"Paediatrics",topic:"innocent",title:"A five-year-old has an incidentally detected murmur",case:"A five-year-old has an incidentally detected murmur.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask exertional symptoms, syncope, cyanosis, chest pain, palpitations, feeding/growth, family sudden death/CHD and previous evaluations."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Paediatric cardiovascular assessment; ECG/echo/cardiology referral if pathological features or uncertainty, not every typical innocent murmur needs all tests."]},{heading:"Management",points:["If confidently assessed innocent and asymptomatic, reassurance and no disease-specific restriction/medicine; investigate concerning features.","Diastolic/harsh/loud murmur, abnormal sounds/pulses, symptoms or concerning family history warrants paediatric/cardiology review."]}]}],pages:[90],note:"",adapted:false,set:"2025 · cohort 2020",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-298",diagnoses:["Innocent murmur"],differentials:[],evidence:[{page:90,quote:"Innocent murmur"}],mode:"document-context"},aiNotes:{title:"Innocent murmur",safety:"",refs:[]}},{id:"jcs-299",year:"2025",rotation:"Paediatrics",topic:"psgn",title:"A 12-year-old has dark urine for two days",case:"A 12-year-old has dark urine for two days.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask dark/tea-coloured urine versus blood, oedema, urine output, headache, breathlessness and timing after throat/skin infection.","Assess urinary pain/fever, family renal disease, systemic rash/joint symptoms and medicines."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["BP, urine dip/microscopy/protein, renal function/electrolytes and complement; streptococcal serology as appropriate.","Urgent assessment for AKI, hyperkalaemia, hypertension or pulmonary oedema."]},{heading:"Management",points:["Paediatric/renal review, fluid/salt and BP/diuretic management according to fluid status; monitor urine, weight, BP and renal function.","Treat ongoing streptococcal infection when indicated; antibiotics do not instantly reverse established nephritis.","Most childhood cases improve but arrange follow-up to document resolution and investigate atypical/persistent abnormalities."]}]}],pages:[90],note:"",adapted:false,set:"2025 · cohort 2020",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-299",diagnoses:["Post-streptococcal glomerulonephritis"],differentials:[],evidence:[{page:90,quote:"Post-streptococcal glomerulonephritis"}],mode:"document-context"},aiNotes:{title:"Post-streptococcal glomerulonephritis",safety:"",refs:[]}},{id:"jcs-300",year:"2025",rotation:"Psychiatry",topic:"adhd",title:"A mother brings her eight-year-old with hyperactivity and inattention",case:"A mother brings her eight-year-old with hyperactivity and inattention.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Clarify the presenting symptoms, duration, triggers, sleep, function, previous episodes, treatment, substances and relevant medical history.","Explore mood, thoughts, perception and cognit s only clears the local “notes viewed” dots. Your station collection and answers are\n                not changed.\n              </p>\n              <div class="modal-actions">\n                <button class="btn" data-action="close-modal">Cancel</button>\n                <button class="btn primary" data-action="confirm-reset">Reset markers</button>\n              </div>\n            `);break;case"confirm-reset":reviewed.clear();persist();closeModal();render();toast("Reviewed markers reset.");break}});let searchTimer;document.addEventListener("input",e=>{if(e.target.id!=="search")return;clearTimeout(searchTimer);const wasFiltered=hasFilters();const value=e.target.value;state.query=value;state.page=1;state.selected=null;state.view="library";commitFilters(wasFiltered);searchTimer=setTimeout(()=>{render();const input=$("#search");input?.focus();input?.setSelectionRange(value.length,value.length)},100)});document.addEventListener("change",e=>{if(e.target.id==="year"||e.target.id==="rotation"){clearTimeout(searchTimer);const wasFiltered=hasFilters();state[e.target.id]=e.target.value;state.page=1;state.selected=null;state.view="library";state.revealed=false;commitFilters(wasFiltered);render()}if(e.target.id==="sort"){state.sort=e.target.value;state.page=1;saveHistory("replace");render()}});document.addEventListener("keydown",e=>{const m=$(".modal");if(m){if(e.key==="Escape"){closeModal();return}if(e.key==="Tab"){const f=[...m.querySelectorAll("button,a[href],input,select")].filter(x=>!x.disabled),first=f[0],last=f.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===m)){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}return}if(["INPUT","TEXTAREA","SELECT","BUTTON","A","SUMMARY"].includes(document.activeElement?.tagName))return;if(state.view==="station"){if(e.code==="Space"){e.preventDefault();toggleAnswer()}if(e.key.toLowerCase()==="n"){e.preventDefault();draw()}}});applyTh
