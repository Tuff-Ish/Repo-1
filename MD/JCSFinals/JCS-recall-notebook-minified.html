ardiography to define valve anatomy/severity and ventricular function.","FBC, renal function and chest radiograph if indicated; blood cultures before antibiotics if endocarditis suspected and this does not delay urgent care."]},{heading:"Management",points:["Treat acute instability using ABCDE and urgent cardiology input.","Stable management depends on lesion, severity, symptoms and echo; discuss surveillance versus valve intervention, not a generic drug prescription.","Manage heart failure/arrhythmia and cardiovascular risk with supervision."]}]}],pages:[81],note:"",adapted:false,set:"2024 · cohort 2019",images:[]},{id:"jcs-268",year:"2024",rotation:"Medicine",topic:"tb",title:"A 26-year-old woman presents with cough and fever",case:"A 26-year-old woman presents with cough and fever.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask cough duration, sputum/haemoptysis, fever/night sweats, weight loss, contacts, travel/residence, previous TB/treatment and immunosuppression/HIV risk."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["TB versus other infection, bronchiectasis, lung cancer and inflammatory disease."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Appropriate infection precautions, chest radiograph and sputum molecular testing/microscopy/culture with susceptibility; HIV testing with consent and targeted baseline tests."]},{heading:"Management",points:["Prompt TB/respiratory team and public-health pathway; use a susceptibility-based multidrug regimen, adherence support and monitoring.","Discuss hepatotoxicity and drug interactions; ethambutol-related visual symptoms require urgent review. Do not prescribe a single antibiotic for suspected active TB."]}]}],pages:[81],note:"",adapted:false,set:"2024 · cohort 2019",images:[]},{id:"jcs-269",year:"2024",rotation:"Medicine",topic:"haemoptysis",title:"A 33-year-old man has one week of “coughing blood”",case:"A 33-year-old man has one week of “coughing blood”.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["First establish source: cough with frothy sputum versus nausea/haematemesis, epistaxis/swallowed blood; quantify and assess airway/respiratory compromise.","Ask infection/TB exposure, smoking/weight loss, chest pain/PE risk and anticoagulants."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["If true haemoptysis: infection/TB, bronchiectasis, cancer, PE and other lung causes. Peptic ulcer causes haematemesis, not true haemoptysis."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Observations/SpO2, FBC/coagulation/renal tests and chest imaging; sputum/TB tests, CT/bronchoscopy or PE work-up according to assessment.","If actually haematemesis, use UGIB/endoscopy pathway instead."]},{heading:"Management",points:["Major bleeding, hypoxia or instability: emergency airway/resuscitation and specialist support.","Manage the established cause and urgent referral for concerning/persistent haemoptysis; never endorse the contradictory recall diagnosis without clarifying source."]}]}],pages:[82],note:"Source contradiction: labelled “peptic ulcer” despite coughing blood. The answer distinguishes haemoptysis from haematemesis rather than reproducing that error.",adapted:false,set:"2024 · cohort 2019",images:[]},{id:"jcs-270",year:"2024",rotation:"Paediatrics",topic:"aom",title:"An eight-month-old has had fever for three days",case:"An eight-month-old has had fever for three days.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask ear pain/fever duration, discharge, hearing change, preceding URTI, age, feeding/hydration, prior infections and medicines/doses already used.","Check mastoid swelling, severe headache, facial weakness, toxic appearance and immunocompromise."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["AOM versus otitis externa, effusion and referred pain; diagnosis needs otoscopy, not fever alone."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Vitals/hydration, ear examination with appropriate clean speculum and braced hand; bulging inflamed drum/effusion supports AOM."]},{heading:"Management",points:["Appropriate age/weight-based paracetamol or ibuprofen if safe; no aspirin in children. Check exact formulation, dose, interval/max and contraindications in current paediatric formulary rather than guessing.","Many cases are self-limiting; no/back-up/immediate antibiotics depend on age, severity, duration, otorrhoea/bilateral disease and risk per local guidance.","Urgent care for mastoiditis/systemic complication; reassess if worsening/not improving."]}]}],pages:[82],note:"",adapted:false,set:"2024 · cohort 2019",images:[]},{id:"jcs-271",year:"2024",rotation:"Paediatrics",topic:"jia",title:"A five-year-old has an abnormal gait",case:"A five-year-old has an abnormal gait.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask swelling, morning stiffness, limp, duration (often ≥6 weeks for classification), systemic fever/rash and impact on play/school.","Assess eye symptoms (uveitis may be silent), psoriasis/IBD features and infection/trauma."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["JIA versus infection, malignancy, reactive arthritis and other inflammatory disease; exclude dangerous causes first."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Paediatric rheumatology assessment; FBC/inflammation and selected antibodies/imaging help subtype/exclude alternatives, not one diagnostic blood test."]},{heading:"Management",points:["Physiotherapy/OT and appropriate anti-inflammatory treatment; disease-modifying medicines/biologics through specialists.","Ophthalmology slit-lamp screening according to risk; joint/growth monitoring and family/school support."]}]}],pages:[82,83],note:"",adapted:false,set:"2024 · cohort 2019",images:[]},{id:"jcs-272",year:"2024",rotation:"Paediatrics",topic:"cf",title:"A ten-month-old presents with failure to thrive",case:"A ten-month-old presents with failure to thrive.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask recurrent chest infection/chronic cough, greasy bulky stools, feeding/growth, meconium ileus, salt-loss symptoms, siblings and screening results."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["CF versus other malabsorption, chronic infection, immune disease or inadequate intake."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Growth/nutrition and respiratory assessment, sweat chloride at an experienced centre and CFTR testing; relevant sputum/other testing.","For family counselling confirm both parental and child variants; CF is autosomal recessive."]},{heading:"Management",points:["Specialist CF team: airway clearance, infection treatment, nutrition/pancreatic enzymes and fat-soluble vitamins when needed; genotype-appropriate modulators through specialists.","If both parents are carriers: 25% affected, 50% carrier, 25% neither each pregnancy; offer genetic/reproductive counselling and partner testing."]}]}],pages:[83],note:"",adapted:false,set:"2024 · cohort 2019",images:[]},{id:"jcs-273",year:"2024",rotation:"Psychiatry",topic:"selfharm",title:"A 29-year-old woman is referred from the emergency department for a detailed risk/safety assessment",case:"A 29-year-old woman is referred from the emergency department for a detailed risk/safety assessment.",objectives:[{key:"r",label:"Perform a detailed psychosocial and safety assessment",sections:[{heading:"Elicit and formulate safety needs",points:["Attend physical injury/possible ingestion first; ask what happened, timing, intent, planning, expected lethality, substances, rescue and regret.","Ask current suicidal thoughts, plans/means, past attempts, triggers, supports, trauma/abuse, vulnerability and protective factors.","Explore long-standing emotion/interpersonal difficulties non-judgementally; do not diagnose a personality disorder from cutting alone.","Physical/toxicology assessment guided by injury/ingestion, MSE and comprehensive psychosocial formulation.","Do not use a numerical risk score or low/medium/high category to predict suicide or decide discharge."]},{heading:"Act on findings",points:["Immediate intent, serious injury/poisoning or inability to maintain safety: urgent emergency/crisis assessment and appropriate observation/support.","Collaborative safety plan: warning signs, coping, trusted contacts, crisis access and reducing access to lethal means.","Arrange timely aftercare and evidence-based therapy; structured therapies such as DBT may be considered for recurrent self-harm/emotion dysregulation. Do not prescribe solely to treat a personality label."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Self-harm may occur with depression, trauma, emotional dysregulation, substance use, psychosis or personality-related difficulties; assess the individual."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Physical/toxicology assessment guided by injury/ingestion, MSE and comprehensive psychosocial formulation.","Do not use a numerical risk score or low/medium/high category to predict suicide or decide discharge."]},{heading:"Management",points:["Immediate intent, serious injury/poisoning or inability to maintain safety: urgent emergency/crisis assessment and appropriate observation/support.","Collaborative safety plan: warning signs, coping, trusted contacts, crisis access and reducing access to lethal means.","Arrange timely aftercare and evidence-based therapy; structured therapies such as DBT may be considered for recurrent self-harm/emotion dysregulation. Do not prescribe solely to treat a personality label."]}]}],pages:[83],note:"Borderline personality disorder is named in the recall, but cannot be established from this referral alone.",adapted:false,set:"2024 · cohort 2019",images:[]},{id:"jcs-274",year:"2024",rotation:"Psychiatry",topic:"dementia",title:"An 80-year-old man has forgetfulness; take history from his son and discuss care",case:"An 80-year-old man has forgetfulness; take history from his son and discuss care.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Obtain patient and collateral accounts with permission: gradual versus acute/fluctuating onset, memory/language/executive changes and daily function.","Ask mood, psychosis, medicines, alcohol, neurological events, sensory problems, driving, finances, medication safety and caregiver needs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Alzheimer disease, vascular/mixed and other dementias; exclude delirium, depression and reversible medical/drug causes.","A history of stroke alone does not establish vascular dementia; time course and neurological/cognitive pattern matter."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Physical/neurological exam, validated language/culture-appropriate cognitive assessment, sensory review and collateral.","Reversible-cause blood tests and specialist-selected structural imaging; refer to memory/neurology service as appropriate."]},{heading:"Management",points:["Agree support, medication simplification, safeguarding/driving assessment and advance planning while preserving autonomy.","Specialist subtype-based medication: cholinesterase inhibitors and/or memantine when indicated; discuss adverse effects and limits.","Support caregivers and arrange community/functional assessment."]}]}],pages:[84],note:"",adapted:false,set:"2024 · cohort 2019",images:[]},{id:"jcs-275",year:"2024",rotation:"Psychiatry",topic:"depression",title:"A 19-year-old has sleep disturbance for two weeks",case:"A 19-year-old has sleep disturbance for two weeks.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask low mood/anhedonia, duration, sleep, appetite/weight, energy, concentration, guilt, function and psychotic symptoms.","Screen previous mania/hypomania, substances, medicines, physical causes and stressors.","Directly ask self-harm/suicide thoughts, intent, plans, access to means, previous acts, supports and immediate safety."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Depressive episode, bipolar depression, adjustment/grief, substance/medical illness; exclude psychosis or postpartum emergency where relevant."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["MSE, psychosocial/risk formulation and targeted physical investigation (e.g. FBC/thyroid if indicated).","Severity is clinical and functional, not determined by a questionnaire alone."]},{heading:"Management",points:["Collaborative safety plan and urgent crisis help if immediate risk; do not leave someone at imminent risk unsupported.","Discuss psychological therapy, social/activity/sleep support and antidepressants depending on severity/preferences and local guidance.","If an SSRI is considered, explain delayed benefit, GI/sexual effects, activation, discontinuation and early review; reconsider antidepressant monotherapy if bipolar disorder suspected."]}]}],pages:[84],note:"",adapted:false,set:"2024 · cohort 2019",images:[]},{id:"jcs-276",year:"2024",rotation:"FAMCO",topic:"back",title:"A 40-year-old man presents with back pain",case:"A 40-year-old man presents with back pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Characterise onset, trauma/lifting, radiation, mechanical/inflammatory features, neurological symptoms and functional limitation.","Ask cancer/infection/steroid risks and red flags: saddle sensory change, new bladder/bowel/sexual dysfunction, bilateral weakness or systemic illness."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Mechanical pain, disc-related radiculopathy, spinal stenosis, inflammatory disease; exclude fracture, malignancy, infection and cauda equina compression."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["No routine imaging for uncomplicated mechanical pain; investigate red flags and consider MRI when it changes management.","Urgent emergency MRI/spinal pathway if cauda equina or cord compression suspected."]},{heading:"Management",points:["Explain likely cause after assessment; encourage activity, avoid prolonged bed rest, offer supported exercise/physiotherapy and suitable analgesia after contraindication review.","Progressive deficit, suspected compression, infection or fracture requires urgent specialist assessment."]}]}],pages:[84,85],note:"",adapted:false,set:"2024 · cohort 2019",images:[]},{id:"jcs-277",year:"2024",rotation:"FAMCO",topic:"anc",title:"A 27-year-old pregnant woman attends her booking visit and requests a green card/maternity record",case:"A 27-year-old pregnant woman attends her booking visit and requests a green card/maternity record.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Confirm pregnancy/LMP, cycle regularity, gestation and red flags; ask previous pregnancies/complications, medical/surgical/genetic history, medicines/allergies and support.","Assess smoking/alcohol/substances, mental health, domestic safety sensitively, infection/travel risks and patient preferences."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Promote informed choices, confidentiality, who to contact for bleeding, pain, severe headache or reduced fetal movements when applicable.","Review medicines for pregnancy safety, folic acid and other supplementation per risk/local guidance; healthy diet/activity and food/infection precautions.","Treat confirmed bacteriuria with pregnancy-appropriate antibiotics and follow-up culture per policy; assess/treat anaemia.","Explain visit schedule, maternity record/green card, screening choices and red flags; no live rubella/MMR vaccine during pregnancy—plan postpartum if non-immune."]}]}],pages:[85],note:"",adapted:false,set:"2024 · cohort 2019",images:[]},{id:"jcs-278",year:"2024",rotation:"Oral health",topic:"aphthous",title:"A 27-year-old woman has recurrent mouth ulcers",case:"A 27-year-old woman has recurrent mouth ulcers.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask recurrence, duration, pain, site, trauma, systemic/genital/eye/GI symptoms, medicines, diet/anaemia and immunosuppression."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Aphthous ulceration versus HSV, trauma, haematinic deficiency, IBD/coeliac/Behçet disease and malignancy if persistent."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Oral examination; FBC/ferritin/B12/folate and cause-directed tests if recurrent/severe/systemic features.","Persistent unexplained ulcer beyond about 3 weeks or suspicious induration requires urgent dental/oral specialist assessment."]},{heading:"Management",points:["Pain relief, avoid trauma/irritants and maintain oral hygiene; topical anti-inflammatory treatment such as an oral corticosteroid preparation when diagnosis supports it.","Correct documented deficiency and investigate systemic disease; do not give antibiotics for uncomplicated aphthae."]}]}],pages:[85,86],note:"",adapted:false,set:"2024 · cohort 2019",images:[]},{id:"jcs-279",year:"2024",rotation:"Ophthalmology",topic:"redeye",title:"A 36-year-old woman has one day of eye pain and redness",case:"A 36-year-old woman has one day of eye pain and redness.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask pain, photophobia, acuity loss, discharge/itch, contact lenses, trauma/chemical exposure, headache/haloes/nausea and prior episodes."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Document acuity, distribution of redness, cornea and pupil; no remote photograph can exclude an eye emergency."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Conjunctivitis versus keratitis/corneal ulcer, anterior uveitis, scleritis and acute angle closure; pain/reduced vision changes urgency.","The 2021 picture shows conjunctival injection but does not establish pressure, acuity or cause; the 2024 recall explicitly names acute angle closure."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Assess acuity in each eye, pupils, external/corneal examination and eye movements; slit lamp/fluorescein and IOP by trained clinician when indicated.","Do not press on suspected ruptured globe or routinely dilate a painful red eye."]},{heading:"Management",points:["Painful red eye with reduced vision, corneal opacity, contact-lens keratitis, trauma or angle-closure concern: immediate/urgent ophthalmology.","Angle closure requires urgent pressure-lowering treatment through eye team; not topical steroid alone.","If uncomplicated conjunctivitis is established, hygiene and supportive care; antibiotic/other treatment depends on cause and risk, not redness alone."]}]}],pages:[86],note:"Acute angle closure is named in the recall; manage as an urgent eye presentation, not uncomplicated conjunctivitis.",adapted:false,set:"2024 · cohort 2019",images:[]},{id:"jcs-280",year:"2024",rotation:"Orthopaedics",topic:"scaphoid",title:"A 23-year-old man has right hand pain",case:"A 23-year-old man has right hand pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask FOOSH, radial-sided pain, timing, dominant hand, function and prior injury; assess trauma elsewhere."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect swelling, assess anatomical snuffbox and scaphoid tubercle tenderness gently, wrist movement only as safe, and distal neurovascular status."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Scaphoid versus distal radius/other carpal fracture or ligament injury; normal initial X-ray does not exclude scaphoid fracture."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Appropriate wrist/scaphoid imaging; MRI is considered early when suspicion persists per pathway; CT for selected union/displacement questions."]},{heading:"Management",points:["Immobilise if suspected and arrange timely fracture/hand review even if initial radiographs are normal.","Management depends on site/displacement/vascular risk; selected injuries need fixation.","Discuss nonunion, avascular necrosis (particularly proximal pole), collapse and arthritis; smoking cessation helps healing."]}]}],pages:[86],note:"",adapted:false,set:"2024 · cohort 2019",images:[]},{id:"jcs-281",year:"2024",rotation:"Orthopaedics",topic:"ulnar",title:"A 34-year-old man has hand weakness",case:"A 34-year-old man has hand weakness.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask ring/little finger numbness, grip/fine motor problems, elbow flexion/pressure, trauma, job and neck symptoms."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect intrinsic wasting/clawing, test finger abduction/adduction and Froment sign; map palmar and dorsal ulnar sensation.","Assess FCU/FDP as relevant, other nerves and cervical findings; localise using the whole pattern."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Ulnar neuropathy at elbow versus wrist, C8/T1 radiculopathy and broader neuropathy."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Clinical localisation and nerve conduction/EMG when indicated; imaging for structural/traumatic concern."]},{heading:"Management",points:["Avoid prolonged elbow flexion/pressure, ergonomic/night positioning support; specialist review for progressive weakness/wasting or persistent significant symptoms.","Discuss selected decompression/transposition with hand/orthopaedic team."]}]}],pages:[87],note:"",adapted:false,set:"2024 · cohort 2019",images:[]},{id:"jcs-282",year:"2024",rotation:"Surgery",topic:"cholecystitis",title:"A 30-year-old man has right upper abdominal pain",case:"A 30-year-old man has right upper abdominal pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask RUQ pain duration/radiation, fever, vomiting, food association, jaundice, dark urine/pale stool and prior episodes.","Assess sepsis and distinguish pancreatitis/cholangitis; review pregnancy/medicines/comorbidity."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Assess general/sepsis signs, jaundice and gentle abdominal examination; Murphy sign is an inspiratory catch on RUQ palpation, not definitive alone."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Acute cholecystitis versus biliary colic, cholangitis, hepatitis, pancreatitis, ulcer disease and right lower pneumonia."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Observations, FBC/CRP, liver profile, renal function and lipase; pregnancy test if relevant.","RUQ ultrasound; further bile-duct imaging/ERCP according to obstruction/cholangitis pathway."]},{heading:"Management",points:["Analgesia, antiemetic, fluids when needed and antibiotics according to severity/local policy; surgical assessment.","Early laparoscopic cholecystectomy is recommended, for example within 1 week of diagnosis in NICE guidance—not an absolute universal 72-hour cut-off.","Jaundice with sepsis suggests cholangitis and may require urgent biliary drainage; individualise timing if unstable/unfit."]}]}],pages:[87],note:"",adapted:false,set:"2024 · cohort 2019",images:[]},{id:"jcs-283",year:"2024",rotation:"Surgery",topic:"acuteischaemia",title:"A 21-year-old man has leg pain",case:"A 21-year-old man has leg pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Rapidly establish onset, pain, sensory loss/weakness and baseline function; ask AF, vascular disease, procedures/trauma and anticoagulants."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Compare colour/temperature/pulses and document sensory/motor deficit quickly; do not waste time with routine ABPI/exercise testing."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Acute embolus, arterial thrombosis or aortic pathology; the six Ps include pain, pallor, pulselessness, coldness, paraesthesia and paralysis."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Immediate vascular assessment; Doppler and urgent vascular imaging as directed without delaying threatened-limb treatment.","ECG, bloods including renal function/lactate and coagulation; assess other embolic sites."]},{heading:"Management",points:["Call vascular/emergency team immediately, analgesia and ABCDE; keep nil by mouth and protect the limb.","Anticoagulation with unfractionated heparin is often indicated after contraindication review by the team; do not delay revascularisation decisions.","Definitive embolectomy/thrombectomy/thrombolysis/bypass depends on viability, cause and time; monitor reperfusion/compartment syndrome."]}]}],pages:[87,88],note:"",adapted:false,set:"2024 · cohort 2019",images:[]},{id:"jcs-284",year:"2024",rotation:"Surgery",topic:"graves",title:"A 41-year-old man has neck swelling",case:"A 41-year-old man has neck swelling.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask weight loss, heat intolerance, palpitations, bowel change, tremor, menstrual change and neck compression.","Assess eye pain/diplopia/vision, smoking, pregnancy, medicines, cardiac symptoms and family autoimmune disease."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Warm moist hands, tremor, tachycardia/AF, proximal power/reflexes, diffuse goitre/bruit; assess eye movements, acuity and corneal exposure if eye signs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Graves versus toxic nodules, thyroiditis and exogenous hormone; eye disease/diffuse vascular goitre supports Graves but tests confirm."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["TSH, free T4/T3, TSH receptor antibodies when indicated; ECG, baseline FBC/liver tests before relevant medicines.","Ultrasound for structural questions; radionuclide testing selected by specialists and avoided in pregnancy."]},{heading:"Management",points:["Symptom control with a suitable beta-blocker if safe; antithyroid medicine, radioiodine or surgery based on cause, preference, pregnancy and specialist input.","Carbimazole can cause agranulocytosis: fever/sore throat requires stopping it and urgent medical/FBC assessment per safety instructions; liver symptoms also require urgent review.","Thyroid storm is emergency treatment; severe/sight-threatening thyroid eye disease needs urgent eye/endocrine care. Smoking cessation matters."]}]}],pages:[88],note:"",adapted:false,set:"2024 · cohort 2019",images:[]},{id:"jcs-285",year:"2025",rotation:"Surgery",topic:"appendicitis",title:"A young man presents to the emergency department with acute abdominal pain for two days",case:"A young man presents to the emergency department with acute abdominal pain for two days.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask onset/migration to RIF, anorexia, nausea/vomiting, fever, bowel/urinary symptoms and pregnancy/sexual-gynaecological context when relevant."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Vitals/general assessment and gentle abdomen away from pain, local tenderness/guarding; do not repeatedly provoke rebound; relevant genital/hernia/gynaecological exam only if indicated/consented."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Appendicitis versus gastroenteritis, mesenteric adenitis, urinary stone/infection, IBD and ectopic/ovarian pathology."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Observations, urine/pregnancy test, FBC/CRP/renal tests; ultrasound or CT based on age/pregnancy/risk and surgical assessment."]},{heading:"Management",points:["Analgesia, antiemetic and hydration as needed, nil by mouth pending surgery plan and prompt surgical review.","Antibiotics/appendicectomy versus selected nonoperative treatment depends on imaging, complications and patient/team decision; sepsis/peritonitis needs urgent care."]}]}],pages:[89],note:"",adapted:false,set:"2025 · cohort 2020",images:[]},{id:"jcs-286",year:"2025",rotation:"Surgery",topic:"trauma",title:"A young man arrives after a motor vehicle accident. Perform a primary survey, discuss airway support and immediate investigations/treatment",case:"A young man arrives after a motor vehicle accident. Perform a primary survey, discuss airway support and immediate investigations/treatment.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Expose safely, control external bleeding, assess airway/breathing, chest movement/sounds, perfusion, neurological status and hidden injuries, preventing hypothermia."]}]},{key:"i",label:"Select and interpret relevant investigations",sections:[{heading:"Important points",points:["CABCDE/ABCDE with haemorrhage control, monitoring and repeated assessment; eFAST and bedside chest/pelvic imaging when appropriate.","Trauma CT only when stable enough; blood gas/lactate, blood count/coagulation and crossmatch; do not delay life-saving intervention for imaging."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["CABCDE/ABCDE with haemorrhage control, monitoring and repeated assessment; eFAST and bedside chest/pelvic imaging when appropriate.","Trauma CT only when stable enough; blood gas/lactate, blood count/coagulation and crossmatch; do not delay life-saving intervention for imaging."]},{heading:"Management",points:["Activate trauma/massive-haemorrhage response, protect cervical spine as indicated, oxygenation/airway support and balanced blood-product resuscitation per pathway.","Suspected unstable pelvic injury: binder over greater trochanters, avoid repeated pelvic springing; persistent instability requires urgent haemorrhage control with trauma/IR/surgery (packing/embolisation/fixation as appropriate), not simply another fluid bolus.","Clinically significant traumatic haemothorax may require chest drain by trained staff and urgent surgery for massive/ongoing bleeding; treat associated injuries."]}]}],pages:[89],note:"Traumatic haemothorax is recalled in the source.",adapted:false,set:"2025 · cohort 2020",images:[]},{id:"jcs-287",year:"2025",rotation:"Surgery",topic:"renal",title:"A young man presents with flank pain for two days. Demonstrate renal-angle assessment and discuss tests, alternatives and treatment",case:"A young man presents with flank pain for two days. Demonstrate renal-angle assessment and discuss tests, alternatives and treatment.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask colicky radiation to groin, haematuria, fever/rigors, dysuria, vomiting, stone history, solitary kidney, gout and fluid intake.","Assess pregnancy, retention, trauma and malignancy risks as relevant."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Assess vitals/sepsis, hydration, abdomen and gentle renal angle tenderness; avoid repeated painful percussion.","Assess mass if present; offer indicated genital/hernia examination with consent. A new non-reducing left varicocele with concerning signs can prompt renal assessment."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Ureteric stone, pyelonephritis, obstruction, renal mass and non-urinary causes; reconcile the side of pain with imaging rather than silently changing it."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Urinalysis/culture, renal function/electrolytes, FBC and pregnancy test when appropriate.","Non-contrast low-dose CT KUB is typical adult stone imaging; ultrasound first in pregnancy/children or selected pathways. Uric acid stones can be radiolucent on plain film but visible on CT."]},{heading:"Management",points:["Sepsis with obstruction, anuria/AKI, solitary kidney or uncontrolled symptoms needs urgent urology; infected obstruction requires antibiotics plus urgent decompression, not antibiotics alone.","Analgesia (NSAID if safe), antiemetic, hydration to need and stone-size/location-based passage versus intervention plan.","Uric acid stones: metabolic assessment and specialist-guided urine alkalinisation may dissolve selected stones; do not prescribe it indiscriminately."]}]}],pages:[89],note:"",adapted:false,set:"2025 · cohort 2020",images:[]},{id:"jcs-288",year:"2025",rotation:"Orthopaedics",topic:"knee",title:"A young man attends with a sports-related knee injury",case:"A young man attends with a sports-related knee injury.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask mechanism (twist/contact/hyperextension), pop, immediate/delayed swelling, instability, locking, weight-bearing and prior injury.","Check fracture, infection and neurovascular red flags; assess sport/work goals."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect gait/alignment if safe then swelling/wasting, warmth/tenderness, effusion and comfortable active/passive range.","Assess Lachman/anterior drawer, posterior drawer and collateral stress when tolerated and trained; meniscal tests only if useful, not forced in an acutely painful joint.","Assess distal neurovascular status and adjacent joints; document findings."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["ACL/MCL/meniscal injury, patellar injury, fracture or other internal derangement; combined injury is possible but not assumed from one sign."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Plain films when fracture criteria/clinical concern indicate; MRI for selected soft-tissue assessment and management planning."]},{heading:"Management",points:["Analgesia, protection/support and early appropriate rehabilitation; urgent referral for dislocation/neurovascular compromise, locked knee or major instability.","MCL injuries are often treated nonoperatively; surgery is reserved for selected severe/combined injuries, not all “severe” tears automatically.","ACL reconstruction versus rehabilitation depends on instability, activity and associated injury; shared orthopaedic plan."]}]}],pages:[89],note:"",adapted:false,set:"2025 · cohort 2020",images:[]},{id:"jcs-289",year:"2025",rotation:"Orthopaedics",topic:"cervical",title:"A young man has neck and left-arm pain",case:"A young man has neck and left-arm pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask neck pain/radiation, dermatomal numbness, weakness, trauma, hand clumsiness, gait imbalance and bladder/bowel change.","Assess infection/cancer and inflammatory risks; clarify functional impact."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect/palpate neck and assess comfortable movement, arm power/reflexes/sensation and relevant peripheral nerves.","Assess legs/reflexes/gait for cord signs; use provocative tests only if appropriate and trained."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Cervical radiculopathy from disc/spondylosis versus peripheral nerve disease, shoulder pathology or cervical myelopathy."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Neurological assessment; no routine imaging for uncomplicated improving pain, but MRI for progressive deficit, myelopathy or other red flags."]},{heading:"Management",points:["Conservative activity/posture advice, appropriate analgesia and physiotherapy if safe.","Progressive weakness, myelopathy or traumatic instability needs urgent spine assessment; avoid forceful neck manipulation."]}]}],pages:[89],note:"",adapted:false,set:"2025 · cohort 2020",images:[]},{id:"jcs-290",year:"2025",rotation:"Anaesthesia",topic:"airway",title:"An older man presents with chest pain and collapses during the history. Explain next actions and demonstrate airway management on a manikin",case:"An older man presents with chest pain and collapses during the history. Explain next actions and demonstrate airway management on a manikin.",objectives:[{key:"p",label:"Demonstrate or explain the procedure safely",sections:[{heading:"Safety and steps",points:["Model-only, trained practice: position airway appropriately (jaw thrust/manual in-line support for suspected cervical injury), remove visible obstruction/suction, oxygen and correct mask size.","Use effective seal and jaw lift (two-person BVM preferred when possible), ventilate to visible chest rise without excessive rate/volume, reassess chest rise/oxygenation/capnography if available.","OPA for deeply unresponsive patient without gag; NPA sizing/contraindications per training (avoid suspected skull-base/major facial injury). Use a suitable supraglottic device/LMA when indicated and escalate failed oxygenation.","Intubation needs trained staff, equipment checks, backup plan, monitoring and waveform capnography confirmation; device sizes depend on device and patient, not one universal size."]},{heading:"Checks and samples",points:["Call emergency/resuscitation team, assess ABCDE, attach monitoring/defibrillator; glucose and ECG as appropriate.","If unresponsive and not breathing normally, start CPR/use defibrillator per current training—ventilation alone is not sufficient."]}]}],pages:[89],note:"",adapted:false,set:"2025 · cohort 2020",images:[]},{id:"jcs-291",year:"2025",rotation:"Dermatology",topic:"molluscum",title:"A young woman has an itchy eruption for one week. Describe the picture and discuss investigations, care and counselling",case:"A young woman has an itchy eruption for one week. Describe the picture and discuss investigations, care and counselling.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask duration, itch, spread, contacts, eczema, immune status and treatment; in adults assess genital distribution/sexual health sensitively."]}]},{key:"x",label:"Describe and interpret the supplied image or findings",sections:[{heading:"Describe, then interpret",points:["Describe small smooth pearly/flesh-coloured dome-shaped papules with central umbilication; assess inflammation and distribution.","Molluscum versus warts, milia, folliculitis and atypical lesions; widespread/large lesions may warrant immune assessment."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Usually clinical; no routine investigations if typical and otherwise well."]},{heading:"Management",points:["Usually self-limiting: reassurance and avoid picking/shared towels; manage associated eczema.","Discuss selected clinician-administered treatment if troublesome, genital, uncertain or persistent; balance pain/scarring against observation.","Do not use harsh home removal techniques; refer eye-adjacent or unusual lesions."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Explain contact spread and autoinoculation; lesions can take months or longer to clear and do not imply poor hygiene.","Usually self-limiting: reassurance and avoid picking/shared towels; manage associated eczema.","Discuss selected clinician-administered treatment if troublesome, genital, uncertain or persistent; balance pain/scarring against observation.","Do not use harsh home removal techniques; refer eye-adjacent or unusual lesions."]}]}],pages:[89],note:"Molluscum contagiosum is named in the recall; original picture is absent.",adapted:false,set:"2025 · cohort 2020",images:[]},{id:"jcs-292",year:"2025",rotation:"FAMCO",topic:"anaemia",title:"A young woman has fatigue for three months",case:"A young woman has fatigue for three months.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask fatigue, exertional dyspnoea/palpitations, bleeding including menstruation/GI loss, diet, pica, pregnancy, malabsorption and chronic disease.","In children ask milk/diet, growth, stool loss/parasites risks and family haemoglobinopathy history; jaundice raises haemolysis/liver alternatives."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Iron deficiency, haemoglobinopathy, chronic inflammation, B12/folate deficiency and haemolysis; pallor alone does not prove anaemia."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["FBC indices/film, ferritin interpreted with inflammation, iron studies as needed; reticulocytes/haemolysis or other tests by pattern.","Iron deficiency usually gives low ferritin and transferrin saturation; ferritin may be falsely normal/high with inflammation. Investigate the source of deficiency."]},{heading:"Management",points:["Haemodynamic compromise, active major bleeding or severe symptomatic anaemia needs urgent review.","Replace iron using age/weight/local formulary, treat source and check response; selected patients need IV iron/specialist care.","Explain oral iron GI effects/dark stools, adherence, safe storage and a planned course/recheck; do not use transfusion routinely for stable mild disease."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Give diet and bleeding advice without blaming; do not assume all adult iron deficiency is nutritional.","Haemodynamic compromise, active major bleeding or severe symptomatic anaemia needs urgent review.","Replace iron using age/weight/local formulary, treat source and check response; selected patients need IV iron/specialist care.","Explain oral iron GI effects/dark stools, adherence, safe storage and a planned course/recheck; do not use transfusion routinely for stable mild disease."]}]}],pages:[90],note:"",adapted:false,set:"2025 · cohort 2020",images:[]},{id:"jcs-293",year:"2025",rotation:"FAMCO",topic:"whitecoat",title:"A 50-year-old man attends with elevated blood pressure",case:"A 50-year-old man attends with elevated blood pressure.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask previous readings, home/ambulatory results, technique, medicines/adherence, NSAIDs/decongestants/stimulants, family risk and lifestyle.","Assess headache/vision change, chest pain, dyspnoea, neurological symptoms and renal/endocrine secondary-cause clues."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["White-coat hypertension requires elevated clinic but normal out-of-office BP; consider sustained, masked and secondary hypertension."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Repeat standardised clinic BP with correct cuff; arrange ABPM/HBPM according to pathway.","Assess urine ACR/haematuria, renal function/electrolytes, glucose/lipids, ECG and target-organ effects as appropriate."]},{heading:"Management",points:["Acute symptoms/signs of end-organ injury with markedly elevated BP: emergency assessment.","Confirm diagnosis and cardiovascular risk before long-term medication decisions; lifestyle support and monitoring if isolated white-coat pattern.","Confirmed hypertension: guideline-based medicines with comorbidity, pregnancy and monitoring considered."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Teach home technique, explain that normal home BP does not mean never needing review, and agree follow-up.","Acute symptoms/signs of end-organ injury with markedly elevated BP: emergency assessment.","Confirm diagnosis and cardiovascular risk before long-term medication decisions; lifestyle support and monitoring if isolated white-coat pattern.","Confirmed hypertension: guideline-based medicines with comorbidity, pregnancy and monitoring considered."]}]}],pages:[90],note:"No specific subtype is stated; confirm sustained versus white-coat/secondary hypertension rather than assuming white-coat disease.",adapted:false,set:"2025 · cohort 2020",images:[]},{id:"jcs-294",year:"2025",rotation:"Medicine",topic:"pleural",title:"An older man has shortness of breath and fever. Perform respiratory examination and discuss tests and treatment",case:"An older man has shortness of breath and fever. Perform respiratory examination and discuss tests and treatment.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Assess observations, expansion, percussion (often stony dull), reduced breath sounds/vocal resonance; inspect whole chest and assess cause signs."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["CXR and thoracic ultrasound; pleural aspiration by trained staff with image guidance when indicated.","Fluid pH, glucose, protein/LDH with paired serum, cells, culture and cytology as appropriate; blood cultures if febrile."]},{heading:"Management",points:["Acute compromise/sepsis requires urgent care; antibiotics for pleural infection and respiratory/pleural-team input.","Complicated/infected effusion (e.g. pus or appropriate biochemical/imaging criteria) often requires drainage; further intrapleural/surgical options by specialists.","Do not aspirate/drain from memorised physical landmarks without ultrasound and training."]}]}],pages:[90],note:"",adapted:false,set:"2025 · cohort 2020",images:[]},{id:"jcs-295",year:"2025",rotation:"Medicine",topic:"dvt",title:"A young man presents to the emergency department with painful right-leg swelling",case:"A young man presents to the emergency department with painful right-leg swelling.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask unilateral swelling/pain onset, surgery/immobility/travel, cancer, oestrogen/pregnancy, previous VTE and bleeding risks.","Ask breathlessness, pleuritic pain, haemoptysis or syncope immediately."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["DVT versus cellulitis, ruptured Baker cyst, injury and oedema; clinical examination cannot confirm/exclude it."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Validated clinical probability pathway with D-dimer and/or compression ultrasound according to probability; pregnancy has a separate pathway.","Baseline FBC/renal/liver/coagulation for treatment as appropriate; urgent PE assessment if chest symptoms."]},{heading:"Management",points:["Arrange timely investigation and interim anticoagulation when indicated by pathway and after contraindication assessment.","Confirmed DVT: anticoagulant choice/duration depends on provoking factors, cancer, pregnancy, renal function and bleeding risk.","Do not massage the limb or use Homan sign; provide clear PE/bleeding advice."]}]}],pages:[90],note:"",adapted:false,set:"2025 · cohort 2020",images:[]},{id:"jcs-296",year:"2025",rotation:"Medicine",topic:"nephrotic",title:"A young woman presents with generalised swelling",case:"A young woman presents with generalised swelling.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask morning eye puffiness, dependent/generalised oedema, frothy urine, urine output, weight gain, infection and breathlessness.","Ask haematuria, hypertension symptoms, drugs/systemic illness; fever/abdominal pain may indicate complications."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Nephrotic syndrome (heavy proteinuria/hypoalbuminaemia) versus nephritic disease, cardiac/liver causes and malnutrition."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["BP, weight/fluid status, urine protein quantification, serum albumin/renal function/electrolytes/lipids; cause-directed tests.","Childhood typical steroid-sensitive disease is assessed by paediatrics; adult disease often needs a different renal investigation/biopsy pathway."]},{heading:"Management",points:["Paediatric/renal review; monitor fluid balance/BP and treat oedema carefully because intravascular depletion can coexist.","Steroids for appropriate childhood presentations under protocol; adult treatment depends on cause. Assess infection and thrombosis risk.","Explain childhood minimal-change disease often responds well but relapses are possible; do not promise permanent cure."]}]}],pages:[90],note:"",adapted:false,set:"2025 · cohort 2020",images:[]},{id:"jcs-297",year:"2025",rotation:"Paediatrics",topic:"meningitis",title:"An eight-month-old has abnormal movements",case:"An eight-month-old has abnormal movements.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask fever duration, feeding, irritability/lethargy, rash, neck symptoms, vomiting, seizures (duration/focality/recovery), immunisation and exposure.","In infants consider subtle poor feeding, apnoea or reduced responsiveness; do not require neck stiffness."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Bacterial meningitis/encephalitis versus febrile seizure, sepsis and metabolic disease; meningitis-associated seizures are not simply labelled benign febrile seizures."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["ABCDE, glucose, blood cultures and urgent blood tests; CSF only when safe and without delaying treatment; imaging according to indication."]},{heading:"Management",points:["Immediate senior paediatric/emergency care, age-appropriate empirical IV antimicrobials per protocol and seizure treatment if prolonged; do not wait for LP.","Manage shock/glucose/airway and monitor; isolate/public-health measures and contact prophylaxis for relevant organisms.","Arrange hearing/neurodevelopmental follow-up; discuss potential seizures/sequelae without guaranteeing epilepsy or no sequelae."]}]}],pages:[90],note:"",adapted:false,set:"2025 · cohort 2020",images:[]},{id:"jcs-298",year:"2025",rotation:"Paediatrics",topic:"innocent",title:"A five-year-old has an incidentally detected murmur",case:"A five-year-old has an incidentally detected murmur.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask exertional symptoms, syncope, cyanosis, chest pain, palpitations, feeding/growth, family sudden death/CHD and previous evaluations."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Innocent flow murmur versus congenital/valvular disease; no diagnosis from the word “murmur” alone."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Paediatric cardiovascular assessment; ECG/echo/cardiology referral if pathological features or uncertainty, not every typical innocent murmur needs all tests."]},{heading:"Management",points:["If confidently assessed innocent and asymptomatic, reassurance and no disease-specific restriction/medicine; investigate concerning features.","Diastolic/harsh/loud murmur, abnormal sounds/pulses, symptoms or concerning family history warrants paediatric/cardiology review."]}]}],pages:[90],note:"",adapted:false,set:"2025 · cohort 2020",images:[]},{id:"jcs-299",year:"2025",rotation:"Paediatrics",topic:"psgn",title:"A 12-year-old has dark urine for two days",case:"A 12-year-old has dark urine for two days.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask dark/tea-coloured urine versus blood, oedema, urine output, headache, breathlessness and timing after throat/skin infection.","Assess urinary pain/fever, family renal disease, systemic rash/joint symptoms and medicines."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Post-streptococcal GN, IgA nephropathy, UTI, other glomerulonephritis and non-haematuric dark urine; PSGN often follows a latent period."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["BP, urine dip/microscopy/protein, renal function/electrolytes and complement; streptococcal serology as appropriate.","Urgent assessment for AKI, hyperkalaemia, hypertension or pulmonary oedema."]},{heading:"Management",points:["Paediatric/renal review, fluid/salt and BP/diuretic management according to fluid status; monitor urine, weight, BP and renal function.","Treat ongoing streptococcal infection when indicated; antibiotics do not instantly reverse established nephritis.","Most childhood cases improve but arrange follow-up to document resolution and investigate atypical/persistent abnormalities."]}]}],pages:[90],note:"",adapted:false,set:"2025 · cohort 2020",images:[]},{id:"jcs-300",year:"2025",rotation:"Psychiatry",topic:"adhd",title:"A mother brings her eight-year-old with hyperactivity and inattention",case:"A mother brings her eight-year-old with hyperactivity and inattention.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Assess inattention and hyperactivity/impulsivity with examples, onset before age 12, persistence and impairment in at least two settings.","Obtain parent/school reports, developmental/hearing/vision history, sleep, learning, autism, anxiety, trauma and family history."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["ADHD versus sleep deprivation, hearing/learning difficulties, autism, anxiety, mood disorders and environmental stressors; evaluate comorbidity."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Specialist developmental/ADHD assessment with structured rating information across settings; no single blood test or IQ test confirms ADHD.","Before medication, assess height/weight, pulse/BP, cardiac/family history and other baseline requirements."]},{heading:"Management",points:["Parent/carer training and school/environmental adjustments, predictable routines and sleep support.","Medication for persistent significant impairment through specialists: stimulants such as methylphenidate and selected non-stimulants such as atomoxetine/guanfacine according to age/local pathway.","Monitor response, appetite/growth, sleep, pulse/BP and mood; not every family must begin with medication."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Stimulants: reduced appetite, insomnia, abdominal/headache and pulse/BP effects. Atomoxetine: GI/mood effects; guanfacine: sedation and hypotension.","Explore reluctance to medicate and offer shared decisions; sleep hygiene includes routine, limiting late screens/caffeine and assessing other sleep problems.","Parent/carer training and school/environmental adjustments, predictable routines and sleep support.","Medication for persistent significant impairment through specialists: stimulants such as methylphenidate and selected non-stimulants such as atomoxetine/guanfacine according to age/local pathway.","Monitor response, appetite/growth, sleep, pulse/BP and mood; not every family must begin with medication."]}]}],pages:[91],note:"",adapted:false,set:"2025 · cohort 2020",images:[]},{id:"jcs-301",year:"2025",rotation:"Psychiatry",topic:"gad",title:"A young woman has nervous feelings for three months",case:"A young woman has nervous feelings for three months.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask domains, duration, uncontrollability, restlessness, muscle tension, sleep, irritability, concentration and function.","Ask panic, OCD, depression/suicidality, trauma, caffeine/substances and physical/medicine causes."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["GAD versus adjustment/stress, depression, panic/OCD, hyperthyroidism and substance effects.","A three-month recall alone does not establish the duration criterion of every diagnostic system; assess fully."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["MSE and targeted physical/thyroid/other tests if symptoms suggest a medical cause."]},{heading:"Management",points:["Psychoeducation, self-help and CBT/applied relaxation; consider an SSRI based on persistent impairment and shared decisions.","Discuss activation, GI/sexual side effects, delayed benefit and follow-up; avoid routine long-term benzodiazepine dependence."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Validate symptoms, explain the worry cycle and agree sleep, caffeine, activity and psychological support strategies.","Psychoeducation, self-help and CBT/applied relaxation; consider an SSRI based on persistent impairment and shared decisions.","Discuss activation, GI/sexual side effects, delayed benefit and follow-up; avoid routine long-term benzodiazepine dependence."]}]}],pages:[91],note:"",adapted:false,set:"2025 · cohort 2020",images:[]},{id:"jcs-302",year:"2025",rotation:"Psychiatry",topic:"alcohol",title:"A 45-year-old man is referred for an alcohol-drinking problem",case:"A 45-year-old man is referred for an alcohol-drinking problem.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Quantify units/standard drinks, beverage/strength, pattern, last drink, duration and binge use.","Ask craving, loss of control, tolerance, withdrawal, morning drinking, past seizures/delirium tremens, attempts to stop, other substances and physical/mental consequences.","Assess self-harm, driving/forensic risk, work/relationships, nutrition, housing, support and goals."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Alcohol use disorder/dependence, harmful use and withdrawal; assess comorbid depression, liver disease and other substances."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Vitals, withdrawal severity assessment by trained staff, glucose and nutrition; FBC, electrolytes, liver profile and other cause-directed tests."]},{heading:"Management",points:["Assess need for supervised/inpatient withdrawal, especially previous seizures/DTs, severe illness, pregnancy, poor support or high risk.","Do not advise abrupt unsupported cessation in a dependent drinker; supervised benzodiazepine regimens and thiamine follow local protocol.","Motivational interviewing, psychosocial/addiction support and specialist relapse-prevention medicines such as acamprosate/naltrexone when suitable; arrange follow-up."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Ask permission to discuss drinking, reflect goals, avoid judgement and make a practical reduction/treatment plan.","Assess need for supervised/inpatient withdrawal, especially previous seizures/DTs, severe illness, pregnancy, poor support or high risk.","Do not advise abrupt unsupported cessation in a dependent drinker; supervised benzodiazepine regimens and thiamine follow local protocol.","Motivational interviewing, psychosocial/addiction support and specialist relapse-prevention medicines such as acamprosate/naltrexone when suitable; arrange follow-up."]}]}],pages:[91],note:"",adapted:false,set:"2025 · cohort 2020",images:[]}],profiles:{valves:{name:"Valvular heart disease",safety:"Syncope, acute pulmonary oedema, shock or a new murmur with sepsis needs urgent assessment.",refs:[]},tricuspid:{name:"Tricuspid regurgitation",safety:"",refs:[]},prosthetic:{name:"Prosthetic heart valve",safety:"New dyspnoea, fever, embolic symptoms or a change/absence of usual mechanical sounds needs urgent review.",refs:["endocarditis"]},hepatomegaly:{name:"Hepatomegaly / abdominal mass",safety:"",refs:[]},bronchiectasis:{name:"Bronchiectasis",safety:"",refs:[]},copd:{name:"COPD / chronic breathlessness",safety:"",refs:[]},asthma:{name:"Asthma",safety:"Silent chest, exhaustion, cyanosis, altered consciousness or poor respiratory effort requires immediate emergency help.",refs:["asthma"]},motor:{name:"Limb motor examination and localisation",safety:"",refs:[]},eom:{name:"Ocular motility / diplopia",safety:"",refs:[]},chd:{name:"Cyanotic congenital heart disease",safety:"",refs:[]},tga:{name:"Transposition of the great arteries",safety:"",refs:[]},cp:{name:"Cerebral palsy / abnormal childhood movement",safety:"",refs:[]},development:{name:"Developmental assessment / delay",safety:"",refs:[]},scd:{name:"Sickle cell inheritance counselling",safety:"",refs:[]},nf1:{name:"Neurofibromatosis type 1 counselling",safety:"",refs:[]},haemophilia:{name:"Haemophilia counselling",safety:"",refs:[]},achondroplasia:{name:"Achondroplasia counselling",safety:"",refs:["achondroplasia"]},down:{name:"Down syndrome with familial translocation",safety:"",refs:[]},bma:{name:"Bone marrow aspiration",safety:"",refs:[]},ng:{name:"Nasogastric tube insertion",safety:"Never use the tube for feed/medicine before approved position confirmation.",refs:["ng"]},lp:{name:"Lumbar puncture / suspected meningitis",safety:"Suspected bacterial meningitis is a medi groups: \no Lower motor neuron lesion \no Sciatica (+ve SLR) – list causes \no Mechanical pain with paraspinal tenderness \nand no focal neurological findings.   \nDermatology \nFemale patient with pruritus.  \n▪ Take relevant history \n▪ Describe the lesions in the pictures provided by the \nexaminer \n▪ Talk to the patient about the most likely diagnosis \n(urticaria) and counsel her briefly.  \n",10:"Oral health \nFemale patient, known case of SLE, presented with \ndisturbed taste and tooth pain.  \n▪ Elicit relevant history.  \n▪ Talk to the patient about the most likely diagnosis \n(xerostomia due to 2nd Sjogren Syndrome) and \ncounsel her on how to maintain oral hygiene.  \n▪ Address her questions.  \n \nJunior Clerkship Finals 2016 \nCohort 2011 \nSurgery & Allied OSCE  \n \n \n➔ 8 stations, with 3 spared rest stations in between. 1 minute \noutside to read the case and your task, and 6 inside to perform.  \n \nSurgery \nPatient presented with breast lump. Perform focused \nbreast examination on the manikin with description of \nthe findings. Remember to ask for a chaperone.  \nSurgery \nPatient present with hematuria and lower abdominal \npain (simulated patient) \n▪ We were asked to skip general examination, and \ndo focused exam.  \n▪ NEVER forget to say you would like to examine \nhernial orifices, external genitalia, and PR \nexamination. \n▪ If the patient had left-sided costovertebral \ntenderness & varicocele → describe the \npathophysiology of varicocele.  \n▪ Describe how to differentiate between a splenic \nvs left renal mass.  \n",11:"Surgery \nPatient present with neck swelling. Perform relevant \ngeneral and local examination of the mass. \n▪ Utilize the cup of water available :D  \n▪ Describe the findings. Be systemic, and describe \nthe mass thoroughly with comment on any \nobstructive findings.  \n▪ Give your final diagnosis. Remember to comment \non 1) functional diagnosis (hypo, hyper, or \neuthyroid); 2) structural diagnosis (goiter, \nmul   \nStation3:  \nA gentleman presented with lower right quadrant pain for last 2 hours. \n1- Take focused history. \n2- Preform focused abdominal examination. \n3- Discuss your possible deferential diagnosis with the patient. \n4- Discuss with patient your management. \n(Case of appendicitis) \nStation4:  \nA Young lady presented with neck mass. \n1- take focused history. \n2- preform focused thyroid examination. \n3- List your differential diagnosis. \n4- List your management plan. \n(Case of Graves’ disease, they want detailed management)  \n",14:"Station5: \nA 25 years old male presented with leg instability. \n1- take focused history. \n2- preform focused knee examination. \n3- Explain to the doctor the possible causes. \n4- explain your management. \n(Case of ACL injury, positive ﬁndings exist as he was real patient) \nStation6:  \nA 35 years old lady, felt on her arm. \n1- Take focused history. \n2- Read the x ray to the patient. \n3- Explain your management plan. \n(Patient has collies fracture from falling on overstretched hand, she will ask you \nabout immediate and long term complication, choices for management, Surgery \ncomplication, sensation and movement loss)   \nStation 7:  \nKnown asthmatic patient, presented with shortness of breath and palpitation. \n1- Take focused history. \n2- Do Bag valve mask ventilation, and maintain his air way. \n3- Discuss with examiner. \n( The patient will loss consciousness during the history, they will ask you what \nyou will do, then will ask you to maintain the airway) \nStation8:  \nA 45 years old lady presented with headache and blurred vision. \n1- take focused history. \n2- Examine her visual ﬁelds. \n3- Discuss the deferential diagnosis.  \n4- Your management plan.  \n(Case of pituitary tumor, they will give you a picture of bitemporal hemianopia)  \nWaleed Alsaadi \n",15:"OSCE medicine and allied  \nClass 2017, cohort 2012, group B  \nStation 1: \nA young man presented with limb weakness and difﬁculty walking. \n1- Take focused history. \n2- preform lower limb motor examination. \n3- Discuss the ﬁndings with the examiner, and suggest a differential diagnosis. \n4- List your management plan. \n(There were two cases they keep changing them, one of them muscular \ndystrophy and the other was cerebellar ataxia) \nStation2:  \nA middle aged gentleman presented with shortened of breath and cough. \n1- please take focused history. \n2- preform speciﬁc general respiratory and chest examination. \n3- discuss your ﬁndings and differential diagnosis. \n4- List your management plan. \n(Case of bronchiectasis)  \nStation3:  \nA gentleman presented with palpitation and shortness of breath. \n1- Take focused history. \n2- Preform relevant general and pericardium examination. \n3- Discuss your ﬁndings and differential diagnosis. \n4- List your management plan. \n(Patient with metallic mitral valve, with click) \nStation4:  \nA gentleman presented with fever and headache. \n1- take focused history. \n2- preform lumbar puncture explaining the procedure. \n3- List your differential diagnosis. \n4- List your management plan. \n",16:"(Case of bacterial meningitis with LP results and gram stain, they need the type \nof the antibiotics)  \nStation5: \nA child presented with history blush discoloration, poor feeding and lethargy. \n1- take focused history. \n2- Explain to the patient the possible causes. \n3- explain your management to the patient. \n(Case of transposition of great vessels) \nStation6: 11 months old Child with diarrhea and poor weight gain. \nSame like above (Case of celiac)  \nStation 7: Child with abnormal movement. \nSame like above (Case of cerebral palsy) \nStation8: A child with Down syndrome, the mother coming for genetic \ncounseling. \n1- take history to draw pedigree. \n2- counsel the mother regarding the disease. \n(Robrotsonian translocation on the father)  \nWaleed Alsaadi \n",17:"OSCE Family medicine & allied   \nClass 2017, cohort 2012, group B  \nStation 1: \nAn old lady is complaining of forgetfulness and agitation since 2 years.   \n1- Take focused history from her daughter. \n2- Counsel the daughter about the possible causes.  \n3- Discuss the management.  \nStation2:  \nAn 7 years old child presented with restlessness and hyperactivity. \n1- Take focused history. \n2- Counsel the mother about the possible causes.  \n3- Discuss the management.  \nStation3:  \nA gentleman presented history of anxiety over 6 months duration.  \n1- Take focused history. \n2- Counsel the patient about the possible causes.  \n3- Discuss the management.. \nStation4:  \nA 35 years old man, known for excessive consumption of alcohol, referred to \nyou as he wants to quit. \n1- take focused history. \n2- Counsel him regarding quitting alcohol. \nStation5: \nA 40 years old lady, she did random blood glucose test yesterday. \n1- Take focused history. \n2- Counsel the patient regarding the results.   \n3- Explain your management plan to the patient. \n",18:"Station6:  \nA lady presented to your clinic with rhinorrhea. \n1- Take focused history. \n2- Discuss the possible cause with the patient.  \n3- Explain your management plan to the patient. \n(Always ask to preform physical examination and labs as they have all things \nhidden in famco stations, this case the patient was difﬁcult as she was insisting \nto take antibiotics)  \nStation 7:  \nA 6 years old child presented with painful viscular on the mouth and fever, he \nalso have reduced feeding and liquid intake. \n1- Take focused history. \n2- Suggest plan for the management. \nStation8:  \nA child presented with itching and redness. \n1- take focused history. \n2- Discuss with the mother the management plan. \n(Case of atopic dermatitis)  \nWaleed Alsaadi \n",19:"ALL THE BEST \n \nMaryam Al-Jabri \nFAMCO & PSYCHIATRY \nSTATION 1# (FAMCO) \nPatient present with headache (most likely migraine) \n \nTake focus Hx \n \nDDx \n \nAdvise patient about management \n \nWrite prescription \n \n \nST
