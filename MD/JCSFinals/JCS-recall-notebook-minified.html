res in the history and examination, and select investigations to guide clinical reasoning."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Assessment and investigations",points:["Request the relevant examination findings and investigation results.","Select and justify tests using the history and examination."]},{heading:"Care pending assessment",points:["Assess immediate stability and treat urgent symptoms while seeking appropriate senior help for concerning findings.","Agree supportive care, further assessment and review based on the findings.","Explain uncertainty, arrange follow-up and give clear advice about deterioration or new red flags."]}]}],pages:[63],note:"",adapted:false,set:"2021 · 23–25 January",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A six-week-old has two weeks of vomiting, initially small milk spit-ups but now projectile about 30 minutes after feeds; non-bilious and no blood.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Vomiting history",items:["Symptoms have been present for two weeks.","Initially small milk spit-ups, progressing to projectile vomiting about 30 minutes after feeds.","Non-bilious, without blood; milk content only."]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-208",diagnoses:[],differentials:[],evidence:[],mode:"neutral"},aiNotes:{title:"Infant-vomiting assessment",safety:"",refs:[]}},{id:"jcs-209",year:"2021",rotation:"Paediatrics",topic:"nephrotic",title:"A five-year-old presents with facial puffiness",case:"A five-year-old presents with facial puffiness.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Clarify distribution and timing of swelling, urine changes, breathlessness, medicines and systemic symptoms; assess observations and request urine/renal and other tests guided by the examination findings.","Clarify the presenting concern, onset, duration, course, severity and effect on daily function.","Ask relevant associated symptoms, previous episodes, medical/surgical history, medicines, allergies and exposures.","Explore the patient's concerns and expectations; obtain collateral history with permission when appropriate."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Identify the key discriminating features in the history and examination, and select investigations to guide clinical reasoning."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Assessment and investigations",points:["Request the relevant examination findings and investigation results.","Select and justify tests using the history and examination."]},{heading:"Care pending assessment",points:["Assess immediate stability and treat urgent symptoms while seeking appropriate senior help for concerning findings.","Agree supportive care, further assessment and review based on the findings.","Explain uncertainty, arrange follow-up and give clear advice about deterioration or new red flags."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Recorded follow-up questions",points:["Address the patient’s questions and check their understanding of the assessment and care plan.","Explain what is known, what remains uncertain and which findings or tests are needed next; check understanding and agree a follow-up plan."]}]}],pages:[64],note:"",adapted:false,set:"2021 · 23–25 January",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A five-year-old has early morning facial puffiness for three days; the mother asks if it is curable.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"History",items:["Early-morning facial puffiness for three days."]},{heading:"Mother’s question",items:["Is this disease curable?"]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-209",diagnoses:[],differentials:[],evidence:[],mode:"neutral"},aiNotes:{title:"Swelling assessment",safety:"",refs:[]}},{id:"jcs-210",year:"2021",rotation:"Psychiatry",topic:"bipolar",title:"A 44-year-old man presents with sleep disturbance",case:"A 44-year-old man presents with sleep disturbance.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Establish current low versus elevated/irritable mood, sleep need, energy, speech/thought acceleration, impulsivity, psychosis and functioning.","Ask past mania/hypomania/depression, episodes/medicines including antidepressants, adherence, substances and collateral.","Assess suicide, spending/sexual/driving risks, vulnerability and ability to care for self."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["MSE and physical review; renal/thyroid/calcium and lithium level when appropriate, plus medication-specific monitoring.","Check pregnancy possibility and drug interactions; urgent level/electrolytes if toxicity suspected."]},{heading:"Management",points:["Acute mania/psychosis or major safety risk: urgent psychiatric review; review/stop triggering antidepressants only through an appropriate prescriber.","Treatment may include an antipsychotic and/or mood stabiliser selected for phase, prior response and reproductive risk.","Bipolar depression requires specialist phase-specific treatment; avoid routine antidepressant monotherapy. Valproate carries major reproductive restrictions."]}]}],pages:[65],note:"The source calls it a depressive episode. Poor sleep/lithium alone cannot establish the current mood state. Its “history from mother” wording is retained only in the raw source, not assumed required.",adapted:false,set:"2021 · 23–25 January",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A 44-year-old man sleeps about three hours daily and is taking lithium.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"History",items:["The patient sleeps about three hours per night.","The patient is taking lithium."]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-210",diagnoses:["Bipolar disorder / depressive episode (collector’s label)"],differentials:[],evidence:[{page:65,quote:"Bipolar disorder. This was depressive \nepisode"}],mode:"document-context"},aiNotes:{title:"Bipolar disorder / depressive episode",safety:"",refs:[]}},{id:"jcs-211",year:"2021",rotation:"Psychiatry",topic:"ocd",title:"A patient reports repetitive hand washing",case:"A patient reports repetitive hand washing.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask intrusive unwanted thoughts/images/urges and repetitive acts/mental rituals, time consumed, distress, avoidance and functional effect.","Assess insight, resistance, triggers, reassurance seeking, depression, suicide risk, psychosis and substance use."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["MSE and functional/risk assessment; targeted physical investigations only if indicated, not a test to prove OCD."]},{heading:"Management",points:["CBT with exposure and response prevention; SSRIs depending on severity, preference and specialist assessment.","Explain that response may take time and OCD may need a different dose/duration strategy under supervision; review adherence and side effects.","Severe impairment/risk or nonresponse needs specialist input."]}]}],pages:[66],note:"History informant is unclear; ask the patient and obtain collateral with permission as appropriate.",adapted:false,set:"2021 · 23–25 January",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A patient reports repetitive hand washing; the original presenting complaint is not remembered.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-211",diagnoses:["OCD"],differentials:[],evidence:[{page:66,quote:"Psychiatry- OCD"}],mode:"document-context"},aiNotes:{title:"OCD",safety:"",refs:[]}},{id:"jcs-212",year:"2021",rotation:"Psychiatry",topic:"selfharm",title:"A 22-year-old woman is referred after self-harm",case:"A 22-year-old woman is referred after self-harm.",objectives:[{key:"r",label:"Perform a detailed psychosocial and safety assessment",sections:[{heading:"Elicit and formulate safety needs",points:["Attend physical injury/possible ingestion first; ask what happened, timing, intent, planning, expected lethality, substances, rescue and regret.","Ask current suicidal thoughts, plans/means, past attempts, triggers, supports, trauma/abuse, vulnerability and protective factors.","Explore long-standing emotion/interpersonal difficulties non-judgementally; do not diagnose a personality disorder from cutting alone.","Physical/toxicology assessment guided by injury/ingestion, MSE and comprehensive psychosocial formulation.","Do not use a numerical risk score or low/medium/high category to predict suicide or decide discharge."]},{heading:"Act on findings",points:["Immediate intent, serious injury/poisoning or inability to maintain safety: urgent emergency/crisis assessment and appropriate observation/support.","Collaborative safety plan: warning signs, coping, trusted contacts, crisis access and reducing access to lethal means.","Arrange timely aftercare and evidence-based therapy; structured therapies such as DBT may be considered for recurrent self-harm/emotion dysregulation. Do not prescribe solely to treat a personality label."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Identify the key discriminating features in the history and examination, and select investigations to guide clinical reasoning."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Physical/toxicology assessment guided by injury/ingestion, MSE and comprehensive psychosocial formulation.","Do not use a numerical risk score or low/medium/high category to predict suicide or decide discharge."]},{heading:"Management",points:["Immediate intent, serious injury/poisoning or inability to maintain safety: urgent emergency/crisis assessment and appropriate observation/support.","Collaborative safety plan: warning signs, coping, trusted contacts, crisis access and reducing access to lethal means.","Arrange timely aftercare and evidence-based therapy; structured therapies such as DBT may be considered for recurrent self-harm/emotion dysregulation. Do not prescribe solely to treat a personality label."]}]}],pages:[67],note:"The short account does not establish a personality diagnosis.",adapted:false,set:"2021 · 23–25 January",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A 22-year-old woman has superficial hand cutting two weeks ago and longstanding anger/emotional reactivity since age 17. Focus on safety assessment.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"History",items:["Superficial hand cutting occurred two weeks ago.","Anger and emotional reactivity have been present since age 17."]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-212",diagnoses:[],differentials:[],evidence:[],mode:"neutral"},aiNotes:{title:"Psychosocial and safety assessment",safety:"",refs:["selfharm"]}},{id:"jcs-213",year:"2022",rotation:"Medicine",topic:"diabetes",title:"A 34-year-old woman presents with urinary frequency",case:"A 34-year-old woman presents with urinary frequency.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask polyuria, polydipsia, weight loss, fatigue, infections, visual symptoms, duration and symptoms of hyperglycaemic crisis.","Assess diet/activity, family history, pregnancy, medicines/steroids, cardiovascular/renal disease and patient concerns."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Assess hydration, BMI with consent, BP, feet/pulses/sensation and eye screening status."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["HbA1c or appropriate plasma glucose confirmation, renal function/eGFR, urine ACR, lipids/BP and complications screening.","Ketones/urgent metabolic work-up if weight loss, illness or possible insulin deficiency."]},{heading:"Management",points:["Individualised education, nutrition/activity support and medication based on HbA1c, renal function, cardiovascular/heart failure risk and preferences.","Metformin may be appropriate; SGLT2 inhibitors and GLP-1-based treatments have selected cardiorenal/metabolic indications; insulin if clinically needed.","Persistent albuminuria: optimise BP/glucose; ACE inhibitor/ARB and/or SGLT2 therapy when indicated with eGFR, potassium, pregnancy and contraindication checks—not automatically for everyone."]}]},{key:"custom",label:"Address the patient’s concerns",sections:[{heading:"Important points",points:["Assess BP, eGFR and urine ACR, glycaemic control, smoking and cardiovascular risk. Explain that albuminuria management may include ACE inhibitor/ARB and SGLT2 therapy when indicated; check renal function/potassium and pregnancy precautions.","A father needing dialysis does not mean this patient will inevitably develop kidney failure; early monitoring and treatment reduce risk."]}]}],pages:[68],note:"",adapted:false,set:"2022 · cohort 2016",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A 34-year-old woman has urinary frequency for two months. She asks why it happened, complications, medication and kidney protection.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"History and family history",items:["Urinary frequency has been present for two months.","Her father receives haemodialysis."]},{heading:"Patient’s concerns",items:["She asks how to protect her kidneys and avoid needing dialysis."]},{heading:"Additional patient questions",items:["Why did I develop it? What are the complications? What medication will you give me?","Which medicines can protect against proteinuria?"]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-213",diagnoses:["Type 2 diabetes"],differentials:[],evidence:[{page:68,quote:"Type 2 DM"}],mode:"document-context"},aiNotes:{title:"Type 2 diabetes",safety:"",refs:["diabetes"]}},{id:"jcs-214",year:"2022",rotation:"Medicine",topic:"asthma",title:"A woman presents with breathlessness",case:"A woman presents with breathlessness.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask variable wheeze, cough, chest tightness, nocturnal/exertional symptoms and triggers.","Assess previous ICU/admissions, attacks, reliever use, preventer adherence, technique, atopy and occupational exposures."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Observe speech/work of breathing, RR, pulse/SpO2; compare air entry and wheeze.","A silent chest, exhaustion or reduced consciousness is life-threatening; normal examination between attacks does not exclude asthma."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Assess RR, speech, SpO2 and peak flow when safe in an attack.","When stable, confirm variable airflow obstruction/inflammation using age-appropriate objective testing such as spirometry/bronchodilator response, FeNO and peak-flow variability per pathway."]},{heading:"Management",points:["Acute severe features: urgent ABCDE, inhaled bronchodilator, oxygen and systemic steroid treatment under current acute protocol; do not delay for a complete history.","Long-term treatment must contain inhaled corticosteroid; current adult regimens may use ICS/formoterol-based AIR/MART depending on pathway, not reliever-only SABA care.","Check technique/adherence, triggers, personal action plan and follow-up."]}]}],pages:[68],note:"",adapted:false,set:"2022 · cohort 2016",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A woman has three months of shortness of breath and asks which medicines she needs.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"History",items:["Breathlessness has been present for three months."]},{heading:"Patient’s question",items:["What medication will you give me?"]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-214",diagnoses:["Asthma"],differentials:[],evidence:[{page:68,quote:"(Asthma"}],mode:"document-context"},aiNotes:{title:"Asthma",safety:"Silent chest, exhaustion, cyanosis, altered consciousness or poor respiratory effort requires immediate emergency help.",refs:["asthma"]}},{id:"jcs-215",year:"2022",rotation:"Medicine",topic:"aortic",title:"A 45-year-old man presents with chest pain",case:"A 45-year-old man presents with chest pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask exertional chest pain, syncope/dyspnoea, family sudden death/cardiomyopathy, palpitations and vascular/ACS risks."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Pulse/BP, apex/heave/thrill and murmur site/radiation, lung bases/oedema; avoid exertional provocation in symptomatic outflow obstruction."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["ECG and urgent troponin/ACS work-up when indicated; echocardiography for valve/ventricular anatomy and obstruction."]},{heading:"Management",points:["Acute instability/chest pain red flags require urgent cardiac assessment.","Symptomatic severe aortic stenosis needs valve-team consideration; HCM management depends on obstruction/risk, with specialist medicines and sudden-death risk evaluation.","Do not prescribe one generic “until surgery” drug: vasodilation/preload reduction may be hazardous in severe outflow obstruction; exercise advice should be specialist-led."]}]}],pages:[68],note:"The source asks about drugs while waiting for possible surgery; no universal bridging regimen is safe for every outflow obstruction.",adapted:false,set:"2022 · cohort 2016",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A 45-year-old man has chest pain; aortic stenosis and HCM were recalled alternatives.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Examiner’s follow-up question",items:["What medication will you give while the patient is awaiting surgery?"]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-215",diagnoses:["Aortic stenosis","HOCM"],differentials:[],evidence:[{page:68,quote:"Aortic stenosis; HOCM"}],mode:"document-context"},aiNotes:{title:"Aortic stenosis / HOCM",safety:"",refs:[]}},{id:"jcs-216",year:"2022",rotation:"Paediatrics",topic:"constipation",title:"An eight-year-old girl presents with abdominal pain",case:"An eight-year-old girl presents with abdominal pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask stool frequency/consistency, painful stool/withholding, soiling, abdominal pain, diet/fluids, toilet training and medicines.","Ask meconium timing, onset from birth, growth, bilious vomiting, neurological signs, urinary symptoms and safeguarding concerns."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect growth, abdomen, spine/lower limb signs; internal rectal exam only when specifically indicated and appropriately trained/supervised."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Growth and abdominal/perianal or neurological assessment as indicated with consent; no routine abdominal X-ray or extensive tests for typical functional disease."]},{heading:"Management",points:["Explain retention/overflow, disimpact if needed using age-appropriate local regimen then maintenance laxative and planned review.","Regular supported toileting/reward routine, adequate fluids/fibre/activity; diet alone is often insufficient for established impaction.","Red flags require paediatric assessment rather than empirical prolonged treatment."]}]}],pages:[68],note:"",adapted:false,set:"2022 · cohort 2016",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"An eight-year-old girl has abdominal pain and two years of constipation, low fluid/fibre intake, normal development and an affected sister; meconium passage was reported.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"History",items:["Constipation for two years.","Low fluid and fibre intake.","Development is reported as normal.","Her sister has the same problem.","Meconium passage is reported."]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-216",diagnoses:["Constipation"],differentials:[],evidence:[{page:68,quote:"history of constipation"}],mode:"document-context"},aiNotes:{title:"Constipation",safety:"",refs:[]}},{id:"jcs-217",year:"2022",rotation:"Paediatrics",topic:"meningitis",title:"A nine-month-old boy presents with abnormal movements",case:"A nine-month-old boy presents with abnormal movements.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask fever duration, feeding, irritability/lethargy, rash, neck symptoms, vomiting, seizures (duration/focality/recovery), immunisation and exposure.","In infants consider subtle poor feeding, apnoea or reduced responsiveness; do not require neck stiffness."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Observe before touching, age-specific vitals, perfusion, consciousness, fontanelle when appropriate, focal signs and rash; do not force painful/unsafe tests."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["ABCDE, glucose, blood cultures and urgent blood tests; CSF only when safe and without delaying treatment; imaging according to indication."]},{heading:"Management",points:["Immediate senior paediatric/emergency care, age-appropriate empirical IV antimicrobials per protocol and seizure treatment if prolonged; do not wait for LP.","Manage shock/glucose/airway and monitor; isolate/public-health measures and contact prophylaxis for relevant organisms.","Arrange hearing/neurodevelopmental follow-up; discuss potential seizures/sequelae without guaranteeing epilepsy or no sequelae."]}]}],pages:[68],note:"",adapted:false,set:"2022 · cohort 2016",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A nine-month-old boy presents with abnormal movements. Discuss acute care, future recurrence and prevention.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Parent’s questions",items:["Will these abnormal movements happen again? How can they be prevented?"]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-217",diagnoses:["Bacterial meningitis"],differentials:[],evidence:[{page:68,quote:"Bacterial meningitis"}],mode:"document-context"},aiNotes:{title:"Bacterial meningitis",safety:"Seizure, reduced consciousness, shock or suspected meningitis needs emergency assessment.",refs:["meningitis"]}},{id:"jcs-218",year:"2022",rotation:"Paediatrics",topic:"itp",title:"A three-year-old boy presents with a nosebleed",case:"A three-year-old boy presents with a nosebleed.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask duration/severity of bleeding, bruises/petechiae, mucosal/other bleeding, recent viral illness/vaccine, medicines, family bleeding and systemic symptoms."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Look for mucosal bleeding, pallor, skin signs, nodes and hepatosplenomegaly gently."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Assess perfusion; FBC/film to confirm isolated thrombocytopenia and exclude other cytopenias; coagulation/other tests guided by features and haematology."]},{heading:"Management",points:["For epistaxis sit forward and pinch soft nose continuously for an appropriate interval (e.g. 10–15 minutes), avoid swallowing blood; persistent/severe bleeding needs emergency/ENT care.","ITP treatment/admission depends chiefly on bleeding and clinical context, not platelet number alone; observation for mild disease versus haematology-directed steroid/IVIG or emergency treatment.","Avoid aspirin/NSAIDs/contact trauma when thrombocytopenic; no routine marrow aspiration for every typical ITP case."]}]}],pages:[68],note:"",adapted:false,set:"2022 · cohort 2016",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A three-year-old boy has epistaxis. Discuss alternatives, treatment, admission and emergency control of the nosebleed.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Follow-up questions",items:["Will you admit him? How will you control the nosebleed in the emergency department?"]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-218",diagnoses:["ITP"],differentials:[],evidence:[{page:68,quote:"(ITP"}],mode:"document-context"},aiNotes:{title:"ITP",safety:"",refs:[]}},{id:"jcs-219",year:"2022",rotation:"Psychiatry",topic:"healthanxiety",title:"A patient has worried about getting HIV for six months",case:"A patient has worried about getting HIV for six months.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Clarify the presenting symptoms, duration, triggers, sleep, function, previous episodes, treatment, substances and relevant medical history.","Explore mood, thoughts, perception and cognition as appropriate; obtain collateral history with permission.","Assess immediate self-harm, suicide, harm-to-others, self-neglect and safeguarding needs where appropriate; develop an individual safety plan rather than predicting risk with a score."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Perform an appropriate mental state or developmental assessment and relevant physical assessment; describe the observations and functional impact."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Identify the key discriminating features in the history and examination, and select investigations to guide clinical reasoning."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Assessment and investigations",points:["Request the relevant examination findings and investigation results.","Select and justify tests using the history and examination."]},{heading:"Care pending assessment",points:["Assess immediate stability and treat urgent symptoms while seeking appropriate senior help for concerning findings.","Agree supportive care, further assessment and review based on the findings.","Explain uncertainty, arrange follow-up and give clear advice about deterioration or new red flags."]}]}],pages:[68],note:"",adapted:false,set:"2022 · cohort 2016",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-219",diagnoses:[],differentials:[],evidence:[],mode:"neutral"},aiNotes:{title:"Mental-health assessment",safety:"",refs:[]}},{id:"jcs-220",year:"2022",rotation:"Psychiatry",topic:"anorexia",title:"A 24-year-old woman presents with poor intake",case:"A 24-year-old woman presents with poor intake.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Assess restriction, weight trajectory, fear of weight gain/body image, compensatory exercise/purging, intake, dizziness/syncope and menstruation/endocrine symptoms.","Ask mood, suicide/self-harm, substance use, function and supports; do not judge severity by appearance alone."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Assess hydration/perfusion, muscle weakness and signs of purging/malnutrition while preserving dignity."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Consented weight/height and trend, lying/standing vitals if safe, temperature, ECG, glucose, electrolytes including phosphate/magnesium and organ function."]},{heading:"Management",points:["Bradycardia, hypotension, hypoglycaemia, electrolyte/ECG abnormalities, rapid decline or serious psychiatric risk needs urgent specialist/inpatient assessment.","Specialist multidisciplinary nutritional rehabilitation and psychological treatment; monitor refeeding risk with supervised plans.","Discuss capacity/consent sensitively; no single BMI threshold can safely determine admission."]}]}],pages:[68],note:"",adapted:false,set:"2022 · cohort 2016",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A 24-year-old woman presents with poor intake. Discuss investigations, treatment and whether admission is needed.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Patient’s questions",items:["What investigations will you do? Will I need admission?"]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-220",diagnoses:["Anorexia nervosa"],differentials:[],evidence:[{page:68,quote:"anorexia nervosa"}],mode:"document-context"},aiNotes:{title:"Anorexia nervosa",safety:"",refs:[]}},{id:"jcs-221",year:"2022",rotation:"Psychiatry",topic:"depression",title:"A patient presents with poor sleep",case:"A patient presents with poor sleep.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask low mood/anhedonia, duration, sleep, appetite/weight, energy, concentration, guilt, function and psychotic symptoms.","Screen previous mania/hypomania, substances, medicines, physical causes and stressors.","Directly ask self-harm/suicide thoughts, intent, plans, access to means, previous acts, supports and immediate safety."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Observe appearance/behaviour, speech, mood/affect, thought, perception, cognition, insight and risk."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["MSE, psychosocial/risk formulation and targeted physical investigation (e.g. FBC/thyroid if indicated).","Severity is clinical and functional, not determined by a questionnaire alone."]},{heading:"Management",points:["Collaborative safety plan and urgent crisis help if immediate risk; do not leave someone at imminent risk unsupported.","Discuss psychological therapy, social/activity/sleep support and antidepressants depending on severity/preferences and local guidance.","If an SSRI is considered, explain delayed benefit, GI/sexual effects, activation, discontinuation and early review; reconsider antidepressant monotherapy if bipolar disorder suspected."]}]}],pages:[68],note:"",adapted:false,set:"2022 · cohort 2016",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-221",diagnoses:["Depression"],differentials:[],evidence:[{page:68,quote:"(depression)"}],mode:"document-context"},aiNotes:{title:"Depression",safety:"Current intent/plan, inability to maintain safety, severe self-neglect or psychosis needs urgent specialist assessment.",refs:[]}},{id:"jcs-222",year:"2022",rotation:"Surgery",topic:"appendicitis",title:"A patient presents with right lower quadrant pain",case:"A patient presents with right lower quadrant pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask onset/migration to RIF, anorexia, nausea/vomiting, fever, bowel/urinary symptoms and pregnancy/sexual-gynaecological context when relevant."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Vitals/general assessment and gentle abdomen away from pain, local tenderness/guarding; do not repeatedly provoke rebound; relevant genital/hernia/gynaecological exam only if indicated/consented."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Observations, urine/pregnancy test, FBC/CRP/renal tests; ultrasound or CT based on age/pregnancy/risk and surgical assessment."]},{heading:"Management",points:["Analgesia, antiemetic and hydration as needed, nil by mouth pending surgery plan and prompt surgical review.","Antibiotics/appendicectomy versus selected nonoperative treatment depends on imaging, complications and patient/team decision; sepsis/peritonitis needs urgent care."]}]}],pages:[69],note:"",adapted:false,set:"2022 · cohort 2016",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-222",diagnoses:["Appendicitis"],differentials:[],evidence:[{page:69,quote:"Appendicitis"}],mode:"document-context"},aiNotes:{title:"Appendicitis",safety:"",refs:[]}},{id:"jcs-223",year:"2022",rotation:"Surgery",topic:"anal",title:"A patient presents with rectal bleeding",case:"A patient presents with rectal bleeding.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask pain during/after stool, bright-red blood, constipation, trauma, chronicity, change in bowel habit, weight loss and IBD/STI/immunosuppression risks."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect for midline tear, sentinel tag and secondary features only as tolerated; severe pain means stop."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Gentle external inspection with explicit consent, chaperone and supervision; do not force painful DRE.","Further bowel/STI/IBD investigation by features/age, not a presumption all bleeding is benign."]},{heading:"Management",points:["Soften stool with fibre/fluids and appropriate laxative, analgesia and local measures.","Chronic fissure may need topical nitrate or calcium-channel-blocker treatment (headache/hypotension/irritation considerations), botulinum toxin or selected surgery through colorectal team.","Lateral internal sphincterotomy divides a controlled portion of internal sphincter to reduce spasm; discuss healing benefit, bleeding/infection and important continence risk/alternatives—not a do-it-yourself procedural guide."]}]}],pages:[69],note:"",adapted:false,set:"2022 · cohort 2016",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A patient has rectal bleeding. Discuss alternatives, primary/secondary causes and options including surgery.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Follow-up questions",items:["What are the primary and secondary causes? Which surgical procedure can be used, how is it performed, and how would you counsel the patient?"]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-223",diagnoses:["Anal fissure"],differentials:[],evidence:[{page:69,quote:"Anal fissure"}],mode:"document-context"},aiNotes:{title:"Anal fissure",safety:"",refs:[]}},{id:"jcs-224",year:"2022",rotation:"Surgery",topic:"trauma",title:"A patient arrives after a motor vehicle collision",case:"A patient arrives after a motor vehicle collision.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Obtain AMPLE history only after immediate threats: allergies, medicines, past history/pregnancy, last meal and events/mechanism."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Expose safely, control external bleeding, assess airway/breathing, chest movement/sounds, perfusion, neurological status and hidden injuries, preventing hypothermia."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["CABCDE/ABCDE with haemorrhage control, monitoring and repeated assessment; eFAST and bedside chest/pelvic imaging when appropriate.","Trauma CT only when stable enough; blood gas/lactate, blood count/coagulation and crossmatch; do not delay life-saving intervention for imaging."]},{heading:"Management",points:["Activate trauma/massive-haemorrhage response, protect cervical spine as indicated, oxygenation/airway support and balanced blood-product resuscitation per pathway.","Suspected unstable pelvic injury: binder over greater trochanters, avoid repeated pelvic springing; persistent instability requires urgent haemorrhage control with trauma/IR/surgery (packing/embolisation/fixation as appropriate), not simply another fluid bolus.","Clinically significant traumatic haemothorax may require chest drain by trained staff and urgent surgery for massive/ongoing bleeding; treat associated injuries."]}]}],pages:[69],note:"",adapted:false,set:"2022 · cohort 2016",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A patient arrives after a motor vehicle collision. Perform a primary survey and discuss persistent instability after a pelvic binder.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Examiner’s follow-up scenario",items:["An open-book pelvic fracture is discussed.","The examiner asks about persistent instability after a pelvic binder."]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-224",diagnoses:["Open-book pelvic fracture"],differentials:[],evidence:[{page:69,quote:"open book fracture"}],mode:"document-context"},aiNotes:{title:"Open-book pelvic fracture",safety:"Unstable trauma requires immediate senior trauma response; procedures are supervised/manikin learning only.",refs:["trauma","abcde"]}},{id:"jcs-225",year:"2022",rotation:"Anaesthesia",topic:"airway",title:"A 65-year-old man requires an airway assessment in a simulated station",case:"A 65-year-old man requires an airway assessment in a simulated station.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Before collapse, obtain key chest-pain/dyspnoea, cardiac/respiratory, allergy, medicine and event history if time permits.","Once collapse occurs, stop routine history and assess responsiveness and breathing immediately."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Rapidly assess airway noises/patency, breathing effort, chest movement and perfusion; do not delay life-saving action for formal introduction."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Identify the key discriminating features in the history and examination, and select investigations to guide clinical reasoning."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Call emergency/resuscitation team, assess ABCDE, attach monitoring/defibrillator; glucose and ECG as appropriate.","If unresponsive and not breathing normally, start CPR/use defibrillator per current training—ventilation alone is not sufficient."]},{heading:"Management",points:["Model-only, trained practice: position airway appropriately (jaw thrust/manual in-line support for suspected cervical injury), remove visible obstruction/suction, oxygen and correct mask size.","Use effective seal and jaw lift (two-person BVM preferred when possible), ventilate to visible chest rise without excessive rate/volume, reassess chest rise/oxygenation/capnography if available.","OPA for deeply unresponsive patient without gag; NPA sizing/contraindications per training (avoid suspected skull-base/major facial injury). Use a ppropriate wrist/scaphoid imaging; MRI is considered early when suspicion persists per pathway; CT for selected union/displacement questions."]},{heading:"Management",points:["Immobilise if suspected and arrange timely fracture/hand review even if initial radiographs are normal.","Management depends on site/displacement/vascular risk; selected injuries need fixation.","Discuss nonunion, avascular necrosis (particularly proximal pole), collapse and arthritis; smoking cessation helps healing."]}]}],pages:[69],note:"",adapted:false,set:"2022 · cohort 2016",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A patient presents with hand pain. Discuss diagnosis, treatment and fracture complications.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-226",diagnoses:["Scaphoid fracture"],differentials:[],evidence:[{page:69,quote:"Scaphoid fracture"}],mode:"document-context"},aiNotes:{title:"Scaphoid fracture",safety:"",refs:["fracture"]}},{id:"jcs-227",year:"2022",rotation:"Orthopaedics",topic:"cervical",title:"A patient presents with neck pain",case:"A patient presents with neck pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask neck pain/radiation, dermatomal numbness, weakness, trauma, hand clumsiness, gait imbalance and bladder/bowel change.","Assess infection/cancer and inflammatory risks; clarify functional impact."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect/palpate neck and assess comfortable movement, arm power/reflexes/sensation and relevant peripheral nerves.","Assess legs/reflexes/gait for cord signs; use provocative tests only if appropriate and trained."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Neurological assessment; no routine imaging for uncomplicated improving pain, but MRI for progressive deficit, myelopathy or other red flags."]},{heading:"Management",points:["Conservative activity/posture advice, appropriate analgesia and physiotherapy if safe.","Progressive weakness, myelopathy or traumatic instability needs urgent spine assessment; avoid forceful neck manipulation."]}]}],pages:[69],note:"",adapted:false,set:"2022 · cohort 2016",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-227",diagnoses:["Cervical spondylosis"],differentials:[],evidence:[{page:69,quote:"Cervical spondylosis"}],mode:"document-context"},aiNotes:{title:"Cervical spondylosis",safety:"",refs:[]}},{id:"jcs-228",year:"2022",rotation:"FAMCO",topic:"pcos",title:"A 35-year-old woman has four months of amenorrhoea",case:"A 35-year-old woman has four months of amenorrhoea.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Exclude pregnancy; ask cycle pattern, hirsutism/acne, weight change, galactorrhoea, headaches/vision, exercise/restriction, stress and medicines."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["With consent assess relevant BP/metabolic/androgen signs; pelvic examination only if indicated with safeguards."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Pregnancy test first; targeted TSH/prolactin/androgen and other tests; assess metabolic risk.","Use current adult/adolescent diagnostic criteria; ultrasound is not necessary or diagnostic in every case and adolescent assessment differs."]},{heading:"Management",points:["Address symptoms and reproductive goals, endometrial protection for prolonged anovulation, metabolic/lifestyle support without stigma.","Hormonal contraception/cyclic progestogen, selected metformin or fertility treatment through appropriate clinician after contraindication/pregnancy review.","Explain long-term follow-up, not a diagnosis from four months amenorrhoea alone."]}]}],pages:[69],note:"",adapted:false,set:"2022 · cohort 2016",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-228",diagnoses:["PCOS"],differentials:[],evidence:[{page:69,quote:"PCOS"}],mode:"document-context"},aiNotes:{title:"PCOS",safety:"",refs:[]}},{id:"jcs-229",year:"2022",rotation:"FAMCO",topic:"af",title:"A woman presents with palpitations",case:"A woman presents with palpitations.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask onset/duration/irregularity, dizziness/syncope, chest pain, dyspnoea, triggers, thyroid symptoms and alcohol.","Review cardiac history, stroke/bleeding risks and medicines."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Pulse rhythm/rate and BP/perfusion, cardiovascular signs, thyroid and heart-failure assessment."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["ECG confirmation; ambulatory recording if intermittent; FBC/renal/electrolytes/thyroid and echo when indicated."]},{heading:"Management",points:["Haemodynamic instability from arrhythmia: emergency resuscitation/cardioversion pathway.","Stable AF: rate/rhythm strategy and stroke prevention after formal stroke/bleeding assessment and preferences.","Anticoagulant choice depends on context; mechanical valves/significant rheumatic mitral stenosis require different anticoagulation considerations than usual non-valvular AF."]}]}],pages:[69],note:"",adapted:false,set:"2022 · cohort 2016",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-229",diagnoses:["Atrial fibrillation"],differentials:[],evidence:[{page:69,quote:"Atrial fibrillation"}],mode:"document-context"},aiNotes:{title:"Atrial fibrillation",safety:"",refs:[]}},{id:"jcs-230",year:"2022",rotation:"Dermatology",topic:"scabies",title:"A woman presents with a pruritic rash for two months",case:"A woman presents with a pruritic rash for two months.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask nocturnal itch, household/sexual contacts, onset, distribution, previous treatment and institutional exposure.","Assess infants, pregnancy, immunosuppression, crusted lesions and secondary infection."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect relevant sites with privacy/chaperone as needed; look for crusted scabies and infection."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Examine burrows and characteristic finger-web/wrist/waist/genital distribution with consent; dermoscopy/scraping if needed."]},{heading:"Management",points:["Topical permethrin 5% is commonly used; apply to all recommended sites, leave for the specified time and repeat as directed (often after 7 days); age/pregnancy-specific instructions matter.","Treat close household/sexual contacts simultaneously even if asymptomatic; wash/isolate clothing/bedding according to local advice.","Oral ivermectin is an option in selected cases through appropriate prescribing; restrictions differ in pregnancy/small children. Treat secondary infection when present."]}]}],pages:[69],note:"",adapted:false,set:"2022 · cohort 2016",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A woman has a pruritic rash for two months. Discuss treatment and adverse effects.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Follow-up question",items:["What are the side effects of treatment?"]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-230",diagnoses:["Scabies"],differentials:[],evidence:[{page:69,quote:"Scabies"}],mode:"document-context"},aiNotes:{title:"Scabies",safety:"",refs:[]}},{id:"jcs-231",year:"Unstated",rotation:"Surgery",topic:"pancreatitis",title:"A 40-year-old man has acute epigastric pain for four days",case:"A 40-year-old man has acute epigastric pain for four days.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask epigastric pain/radiation to back, vomiting, gallstones, alcohol, medicines, trauma and prior episodes; assess organ failure symptoms."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Vitals, hydration/perfusion, respiratory assessment and gentle abdominal tenderness/guarding; absence of rare skin signs does not exclude disease."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Lipase/amylase, FBC/renal/liver profile, glucose, calcium and triglycerides when appropriate; ultrasound for gallstones.","CT when diagnosis/complications warrant, not routinely immediately for every typical case; assess severity over time."]},{heading:"Management",points:["ABCDE, analgesia and individually titrated IV fluids with reassessment; monitor urine/oxygenation and seek senior input for organ dysfunction.","Early oral/enteral nutrition as tolerated rather than prolonged routine starvation; antibiotics not routinely for sterile pancreatitis.","Treat cause; urgent ERCP for appropriate biliary obstruction/cholangitis and cholecystectomy planning for biliary disease."]}]}],pages:[69,78],note:"This set has no printed year. Identical repeat merged; do not infer a year from adjacent sections.",adapted:false,set:"Undated · repeated day 1 / day 2 set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-231",diagnoses:["Acute pancreatitis"],differentials:[],evidence:[{page:69,quote:"Dx: Acute pancreatitis"}],mode:"document-context"},aiNotes:{title:"Acute pancreatitis",safety:"",refs:[]}},{id:"jcs-232",year:"Unstated",rotation:"Surgery",topic:"hernia",title:"A 42-year-old man presents with groin swelling",case:"A 42-year-old man presents with groin swelling.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask swelling ons :"mastitis",title:"A 30-year-old woman presents with breast pain and swelling",case:"A 30-year-old woman presents with breast pain and swelling.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask lactation/postpartum timing, fever, focal pain/redness, feeding problems, nipple trauma, lump, discharge and recurrent/non-lactating symptoms."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Consent/chaperone/draping; inspect redness/swelling and gently palpate tenderness, fluctuance, mass/nodes. The recall states no swelling was actually seen—do not invent it."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Vitals and breast assessment; ultrasound if abscess suspected; culture in selected recurrent/severe/nonresponding cases."]},{heading:"Management",points:["Assess sepsis; supportive analgesia, breastfeeding/expressing advice with skilled lactation support and antibiotics if bacterial disease/severity indicates.","Drain an abscess through the appropriate team; persistent non-lactational/recurrent or atypical symptoms need breast assessment.","Avoid aggressive massage or unnecessarily stopping breastfeeding without appropriate advice."]}]}],pages:[70,78],note:"",adapted:false,set:"Undated · repeated day 1 / day 2 set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A 30-year-old woman has breast pain and perceived swelling; the recall notes no swelling on examination.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Examination",items:["No breast swelling is found on examination."]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-orig 9],note:"",adapted:false,set:"Undated · repeated day 1 / day 2 set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-235",diagnoses:["ACL tear"],differentials:[],evidence:[{page:71,quote:"Dx: ACL tear"}],mode:"document-context"},aiNotes:{title:"ACL tear",safety:"",refs:[]}},{id:"jcs-236",year:"Unstated",rotation:"Ophthalmology",topic:"visualfield",title:"A 60-year-old woman presents with blurred vision and intermittent headache",case:"A 60-year-old woman presents with blurred vision and intermittent headache.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask visual onset/progression, peripheral loss, headache, diplopia and pituitary hormone symptoms (menses, libido, galactorrhoea, body changes)."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Test each eye separately, match eye level/distance, ensure fixation, compare quadrants with finger counting/movement/appropriate target; assess blind spot if required.","State limitations of confrontation and need for formal fields; do not infer the field solely from symptom wording."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Explain the crossing optic fibres/chiasm simply; advise on driving safety and local licensing requirements pending assessment.","Urgent eye/endocrine/neurosurgical review for field defect; sudden severe headache/vision loss/ophthalmoplegia suggests pituitary apoplexy and is an emergency.","Management (medicine/surgery/surveillance) depends on tumour type and compression; do not presume all pituitary lesions need the same operation."]}]}],pages:[71,79],note:"Bitemporal field loss/pituitary adenoma is recalled, but optic-disc oedema and symptoms need urgent assessment; original field image absent.",adapted:false,set:"Undated · repeated day 1 / day 2 set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A 60-year-old woman has blurred vision and intermittent headache; normal anterior chamber and optic-disc oedema were recalled.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Eye examination",items:["The anterior chamber is normal.","Optic-disc oedema is recorded."]},{heading:"Recorded visual-field finding",items:["Bitemporal hemianopia."]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-236",diagnoses:["Bitemporal hemianopia / pituitary adenoma"],differentials:[],evidence:[{page:71,quote:"Dx: Bitemporal hemianopia (pituitary adenoma)"}],mode:"document-context"},aiNotes:{title:"Bitemporal hemianopia / pituitary adenoma",safety:"",refs:[]}},{id:"jcs-237",year:"Unstated",rotation:"Oral health",topic:"xerostomia",title:"A 35-year-old woman presents with a dry, burning mouth",case:"A 35-year-old woman presents with a dry, burning mouth.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask dryness duration, dry eyes, swallowing/speech/taste difficulties, dental pain, parotid swelling and fluid intake.","Review anticholinergics (e.g. amitriptyline), other medicines, SLE/autoimmune symptoms, diabetes, radiation and tobacco."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Oral/dental assessment and salivary/eye assessment as indicated; cause-directed glucose/autoimmune work-up with specialists.","Examine for caries, candidiasis and mucosal injury; do not infer Sjögren solely from SLE plus dry mouth."]},{heading:"Management",points:["Review/change offending medicine only with prescriber; frequent water sips, sugar-free gum if suitable and saliva substitutes.","High-fluoride preventive dental care as advised, regular dental review and treat caries/candidiasis when present.","Avoid sugary/acidic drinks, alcohol-containing mouthwash and smoking; refer suspected systemic disease."]}]}],pages:[71,79],note:"",adapted:false,set:"Undated · repeated day 1 / day 2 set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A 35-year-old woman has dry mouth and a burning sensation; amitriptyline use was recalled.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Medication history",items:["Amitriptyline use is recorded."]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-237",diagnoses:["Amitriptyline-induced xerostomia"],differentials:[],evidence:[{page:71,quote:"Dx: Drug induced xerostomia (amitriptyline)"}],mode:"document-context"},aiNotes:{title:"Amitriptyline-induced xerostomia",safety:"",refs:[]}},{id:"jcs-238",year:"Unstated",rotation:"FAMCO",topic:"whitecoat",title:"A 45-year-old woman attends with elevated clinic blood pressure",case:"A 45-year-old woman attends with elevated clinic blood pressure.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask previous readings, home/ambulatory results, technique, medicines/adherence, NSAIDs/decongestants/stimulants, family risk and lifestyle.","Assess headache/vision change, chest pain, dyspnoea, neurological symptoms and renal/endocrine secondary-cause clues."]}]},{key:"i",label:"Select and interpret relevant investigations",sections:[{heading:"Important points",points:["Repeat standardised clinic BP with correct cuff; arrange ABPM/HBPM according to pathway.","Assess urine ACR/haematuria, renal function/electrolytes, glucose/lipids, ECG and target-organ effects as appropriate."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Repeat standardised clinic BP with correct cuff; arrange ABPM/HBPM according to pathway.","Assess urine ACR/haematuria, renal function/electrolytes, glucose/lipids, ECG and target-organ effects as appropriate."]},{heading:"Management",points:["Acute symptoms/signs of end-organ injury with markedly elevated BP: emergency assessment.","Confirm diagnosis and cardiovascular risk before long-term medication decisions; lifestyle support and monitoring if isolated white-coat pattern.","Confirmed hypertension: guideline-based medicines with comorbidity, pregnancy and monitoring considered."]}]}],pages:[71,79],note:"",adapted:false,set:"Undated · repeated day 1 / day 2 set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-238",diagnoses:["White-coat hypertension"],differentials:[],evidence:[{page:71,quote:"Dx: White coat hypertension"}],mode:"document-context"},aiNotes:{title:"White-coat hypertension",safety:"",refs:[]}},{id:"jcs-239",year:"Unstated",rotation:"FAMCO",topic:"uti",title:"A 23-year-old woman has burning on urination",case:"A 23-year-old woman has burning on urination.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask dysuria, frequency, urgency, suprapubic pain, haematuria, duration, fever/flank pain, pregnancy, discharge/STI risk, stones and previous cultures."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Urine testing/culture according to sex/pregnancy/age/complexity and local policy; pregnancy/STI testing when relevant.","Fever/obstruction concern: renal tests and appropriate imaging; consider stone imaging if clinical pattern suggests."]},{heading:"Management",points:["Pregnancy, male/paediatric or complicated disease needs an appropriate specific pathway; choose antibiotics using local resistance/culture, renal function and allergy.","Simple lower UTI may be treated with first-line local options, analgesia/hydration and review; fever, vomiting or sepsis requires urgent assessment.","Stone with infected obstruction needs urgent drainage/urology, not antibiotics alone."]}]}],pages:[72,79],note:"",adapted:false,set:"Undated · repeated day 1 / day 2 set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-239",diagnoses:["UTI"],differentials:[],evidence:[{page:72,quote:"Dx: UTI"}],mode:"document-context"},aiNotes:{title:"UTI",safety:"",refs:[]}},{id:"jcs-240",year:"Unstated",rotation:"Medicine",topic:"malaria",title:"A patient returns from travel with fever",case:"A patient returns from travel with fever.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Obtain exact countries/regions/dates, exposures, prophylaxis/adherence, fever pattern, headache, GI symptoms, jaundice, dark urine and neurological/respiratory symptoms.","Assess pregnancy, prior malaria, comorbidity and sepsis risks."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Urgent thick/thin blood films or approved rapid test with microscopy for species/parasitaemia; repeat testing if strong suspicion with initial negative per pathway.","FBC, glucose, renal/liver profile, lactate/blood gas and cultures as appropriate; assess severe disease."]},{heading:"Management",points:["Urgent infectious-disease input; severe malaria is a medical emergency treated with IV artesunate and monitored care per current protocol.","Uncomplicated therapy depends on species, region/resistance, pregnancy and current local guidance; an effective ACT is commonly used for falciparum.","Do not copy the old recall’s chloroquine suggestion for presumed African falciparum; widespread resistance matters. Vivax/ovale anti-relapse treatment requires G6PD assessment and specialist pregnancy precautions."]}]}],pages:[72,80],note:"Topic-only recall: no patient age, case details or objectives were recorded. The practice stem and objectives are added, not quoted from an original exam. Clear duplicate topic list merged.",adapted:true,set:"Undated · repeated day 1 / day 2 set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-240",diagnoses:["Malaria"],differentials:[],evidence:[{page:72,quote:"Station 1: Malaria"}],mode:"document-context"},aiNotes:{title:"Malaria",safety:"",refs:["malaria"]}},{id:"jcs-241",year:"Unstated",rotation:"Medicine",topic:"ie",title:"A patient presents with fever",case:"A patient presents with fever.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask persistent fever, sweats, fatigue, valve/prosthesis or congenital disease, prior endocarditis, dental/skin infection, invasive procedures and injecting exposure sensitively.","Ask heart failure, embolic neurological/limb symptoms, back pain and previous antibiotics."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Multiple blood-culture sets before antibiotics if feasible without delaying urgent sepsis treatment; echo (TTE/TOE selected by team), ECG, FBC/renal/inflammatory tests and complication imaging as indicated."]},{heading:"Management",points:["Urgent cardiology/infectious-disease care and sepsis/heart-failure treatment if unstable.","Prolonged targeted antibiotics depend on organism, valve type, allergies and susceptibilities; surgery considered for selected valve failure, uncontrolled infection or embolic risk.","Do not diagnose solely from a murmur or assume all dental procedures require prophylaxis."]}]}],pages:[72,80],note:"Topic-only recall: no patient age, case details or objectives were recorded. The practice stem and objectives are added, not quoted from an original exam. Clear duplicate topic list merged.",adapted:true,set:"Undated · repeated day 1 / day 2 set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A patient has fever and a possible new murmur.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-241",diagnoses:["Infective endocarditis"],differentials:[],evidence:[{page:72,quote:"Station 2: Infective endocarditis"}],mode:"document-context"},aiNotes:{title:"Infective endocarditis",safety:"Sepsis, acute valve failure or new embolic neurological symptoms requires urgent assessment.",refs:[]}},{id:"jcs-242",year:"Unstated",rotation:"Medicine",topic:"lungcancer",title:"A patient has persistent respiratory symptoms requiring assessment",case:"A patient has persistent respiratory symptoms requiring assessment.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask cough/haemoptysis, weight loss, dyspnoea, chest pain, hoarseness and recurrent infection; smoking/occupation/asbestos and functional status.","Assess metastasis, SVC obstruction and spinal compression symptoms."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Urgent chest imaging and respiratory/cancer pathway; contrast CT and tissue diagnosis/staging chosen by multidisciplinary team."]},{heading:"Management",points:["Address emergencies, symptoms and smoking support; treatment depends on histology/stage, molecular profile and fitness: surgery/radiotherapy/systemic/supportive care.","Do not promise a specific prognosis or treatment without diagnosis/stage."]}]}],pages:[72,80],note:"Topic-only recall: no patient age, case details or objectives were recorded. The practice stem and objectives are added, not quoted from an original exam. Clear duplicate topic list merged.",adapted:true,set:"Undated · repeated day 1 / day 2 set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-242",diagnoses:["Lung cancer"],differentials:[],evidence:[{page:72,quote:"Station 3: Lung cancer"}],mode:"document-context"},aiNotes:{title:"Lung cancer",safety:"",refs:[]}},{id:"jcs-243",year:"Unstated",rotation:"Paediatrics",topic:"coeliac",title:"A child has chronic gastrointestinal symptoms or poor growth",case:"A child has chronic gastrointestinal symptoms or poor growth.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask chronic diarrhoea/steatorrhoea, distension, pain, weight/growth, gluten exposure, anaemia, family/autoimmune history and diet."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Growth chart, FBC/ferritin and nutritional assessment; total IgA and tTG-IgA while eating gluten, with alternative tests if IgA deficient.","Paediatric/gastroenterology confirmation pathway (selected children may meet no-biopsy criteria; others need biopsy)."]},{heading:"Management",points:["Do not start a gluten-free diet before appropriate diagnostic testing unless advised by specialist.","After confirmation: lifelong gluten-free diet with dietitian, correct deficiencies, monitor growth/serology and family risk testing as appropriate."]}]}],pages:[72,80],note:"Topic-only recall: no patient age, case details or objectives were recorded. The practice stem and objectives are added, not quoted from an original exam. Clear duplicate topic list merged.",adapted:true,set:"Undated · repeated day 1 / day 2 set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-243",diagnoses:["Coeliac disease"],differentials:[],evidence:[{page:72,quote:"Station 4: Celiac disease"}],mode:"document-context"},aiNotes:{title:"Coeliac disease",safety:"",refs:[]}},{id:"jcs-244",year:"Unstated",rotation:"Paediatrics",topic:"anaphylaxis",title:"A child develops an acute reaction with airway, breathing or circulation concerns",case:"A child develops an acute reaction with airway, breathing or circulation concerns.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Rapidly ask exposure/time, previous allergy, medicines/food/sting and prior reactions only if this does not delay care."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Clinical emergency diagnosis; monitor ABCDE and response. Tryptase at appropriate times after stabilisation must not delay treatment."]},{heading:"Management",points:["Call emergency help, appropriate positioning (do not stand/walk with circulatory compromise), prompt IM adrenaline in anterolateral thigh per current age/weight protocol.","Oxygen/airway support and IV fluid as indicated, repeated adrenaline and escalation under resuscitation algorithm.","Antihistamines do not treat airway obstruction/shock; observation, allergy referral, trigger avoidance, autoinjector training and written plan after recovery."]}]}],pages:[72,80],note:"Topic-only recall: no patient age, case details or objectives were recorded. The practice stem and objectives are added, not quoted from an original exam. Clear duplicate topic list merged.",adapted:true,set:"Undated · repeated day 1 / day 2 set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-244",diagnoses:["Anaphylaxis"],differentials:[],evidence:[{page:72,quote:"Station 5: Anaphylaxis"}],mode:"document-context"},aiNotes:{title:"Anaphylaxis",safety:"Treat airway/breathing/circulation compromise immediately; do not delay adrenaline for tests.",refs:["anaphylaxis"]}},{id:"jcs-245",year:"Unstated",rotation:"Paediatrics",topic:"septicjoint",title:"A child presents with an acutely painful swollen joint",case:"A child presents with an acutely painful swollen joint.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask acute joint pain/swelling, fever, inability to bear weight, infection/trauma, prosthetic joint, immune risks and antibiotics."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Urgent senior/orthopaedic/paediatric assessment, blood cultures and aspiration by trained staff for microscopy/culture/crystals when safe.","Blood inflammatory tests and imaging support assessment; crystals do not exclude simultaneous infection."]},{heading:"Management",points:["Prompt appropriate IV antibiotics after cultures if feasible without delaying treatment in an unstable patient; urgent drainage/source control through team.","Analgesia, sepsis management and later rehabilitation; do not repeatedly force movement."]}]}],pages:[72,80],note:"Topic-only recall: no patient age, case details or objectives were recorded. The practice stem and objectives are added, not quoted from an original exam. Clear duplicate topic list merged.",adapted:true,set:"Undated · repeated day 1 / day 2 set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-245",diagnoses:["Septic arthritis"],differentials:[],evidence:[{page:72,quote:"Station 6: Septic arthritis"}],mode:"document-context"},aiNotes:{title:"Septic arthritis",safety:"",
