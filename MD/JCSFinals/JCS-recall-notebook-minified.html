){color:#263c36}[data-theme=dark] .caution{background:#fff;color:#263c36}[data-theme=dark] .caution strong{color:#263c36}}[data-theme=dark] .bank-line strong{color:#b0c2a4}</style> </head> <body> <a class="skip" href="#main">Skip to content</a> <div id="app"></div> <div id="toast" role="status" aria-live="polite"></div> <div id="modal-root"></div> <script>window.JCS_BANK={version:"1.1",sourceFile:"JCS OSCEs All 2026.pdf",sourcePageCount:91,stations:[{id:"jcs-001",year:"2012",rotation:"Medicine",topic:"valves",title:"A patient has a cardiac murmur and a median sternotomy scar",case:"A patient has a cardiac murmur and a median sternotomy scar.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Consent, pain check, appropriate exposure; inspect scars, hands and face; pulse rate/rhythm/character and BP.","Assess JVP, apex, heaves/thrills; auscultate all areas with diaphragm/bell and appropriate positioning; time a murmur against pulse.","Describe timing, site, radiation, intensity and associated sounds; examine lung bases and oedema."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Characterise the murmur before naming a lesion: systolic versus diastolic, loudest site, radiation and associated pulse/JVP changes.","Consider regurgitation/stenosis, prosthetic valve sounds and infective endocarditis if systemic features; a scar alone does not establish the operation."]}]}],pages:[1],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-002",year:"2012",rotation:"Medicine",topic:"hepatomegaly",title:"A patient requires abdominal examination; an enlarged liver is found",case:"A patient requires abdominal examination; an enlarged liver is found.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect general state, hands/face and abdomen; palpate from right iliac fossa during inspiration and characterise liver edge, span, tenderness, surface and pulsatility.","Assess spleen, ascites, nodes, JVP and oedema; maintain dignity and avoid painful repeated palpation."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Consider fatty liver, alcohol-related/viral liver disease, congestive hepatomegaly, malignancy/metastases and infiltrative/haematological disease.","For any abdominal mass consider organ of origin rather than assuming it is hepatic."]}]}],pages:[1],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-003",year:"2012",rotation:"Medicine",topic:"cf",title:"A patient requires a respiratory examination",case:"A patient requires a respiratory examination.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Assess growth, clubbing, respiratory effort/chest signs and abdominal nutrition/liver findings."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["CF versus other malabsorption, chronic infection, immune disease or inadequate intake."]}]}],pages:[1],note:"Alternative recall from a shared table cell; this is not evidence of an additional distinct official exam station. The cell lists cystic fibrosis, bronchiectasis and COPD as alternatives.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-004",year:"2012",rotation:"Medicine",topic:"bronchiectasis",title:"A patient requires a respiratory examination",case:"A patient requires a respiratory examination.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect work of breathing and sputum, clubbing, pulse and SpO2; examine trachea and expansion.","Compare percussion, auscultation and vocal resonance anteriorly/posteriorly including bases; describe coarse crackles/wheeze without inventing signs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Bronchiectasis is suggested by chronic productive cough with coarse crackles/clubbing; consider COPD, TB, lung cancer and interstitial disease."]}]}],pages:[1],note:"Alternative recall from a shared table cell; this is not evidence of an additional distinct official exam station.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-005",year:"2012",rotation:"Medicine",topic:"copd",title:"A patient requires a respiratory examination",case:"A patient requires a respiratory examination.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Assess distress, RR/SpO2, hands, pulse and face; trachea/expansion, percussion and auscultation bilaterally.","Possible hyperinflation, quiet breath sounds and prolonged expiration; look for cor pulmonale."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["COPD versus asthma, bronchiectasis, heart failure, malignancy or interstitial disease; clubbing is not typical of uncomplicated COPD."]}]}],pages:[1],note:"Alternative recall from a shared table cell; this is not evidence of an additional distinct official exam station.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-006",year:"2012",rotation:"Medicine",topic:"motor",title:"A patient requires lower-limb motor examination",case:"A patient requires lower-limb motor examination.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Consent, exposure and pain check; inspect posture, wasting/fasciculations; assess tone and MRC power systematically comparing sides.","Test relevant tendon reflexes and plantar responses; assess coordination; complete sensation and supported gait.","Describe distribution and UMN/LMN pattern rather than giving a disease label without evidence."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Localise: UMN pattern (increased tone/brisk reflexes/extensor plantars), LMN pattern (wasting/fasciculation/reduced tone/reflexes), myopathy (often proximal) or neuromuscular junction disease.","Acute stroke/spinal compression and rapidly ascending weakness are urgent; a single sign does not establish the cause."]}]}],pages:[1],note:"Alternative recall from a shared table cell; this is not evidence of an additional distinct official exam station.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-007",year:"2012",rotation:"Medicine",topic:"eom",title:"A patient has ptosis and abnormal eye position",case:"A patient has ptosis and abnormal eye position.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect alignment/ptosis, assess acuity and pupils; ask the patient to follow a target in an H pattern without moving the head.","Ask when diplopia occurs, observe restriction and nystagmus; test convergence if appropriate. Do not claim a normal fundus rules out serious disease."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["III/IV/VI nerve palsy, thyroid eye disease, myasthenia and orbital/brainstem disease.","VI palsy causes impaired abduction; III palsy may cause ptosis and a down-and-out eye with or without pupil involvement."]}]}],pages:[1],note:"Alternative recall from a shared table cell; this is not evidence of an additional distinct official exam station. The recall says “deviated pupil”; pupil size/reactivity is not documented.",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-008",year:"2012",rotation:"Paediatrics",topic:"chd",title:"Take a history for suspected congenital heart disease in a child",case:"Take a history for suspected congenital heart disease in a child.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask timing of cyanosis, relationship to crying/feeding, breathlessness, sweating, poor growth, collapse, antenatal scans and birth history.","Assess sepsis, maternal/perinatal risks and family cardiac history."]}]}],pages:[1],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-009",year:"2012",rotation:"Paediatrics",topic:"cp",title:"A video reportedly shows a child with spasticity, hyperreflexia and fixed contractures",case:"A video reportedly shows a child with spasticity, hyperreflexia and fixed contractures.",objectives:[{key:"x",label:"Describe and interpret the supplied image or findings",sections:[{heading:"Describe, then interpret",points:["Describe observed movement, posture, symmetry, tone, hyperreflexia, contractures and function objectively.","If video is absent, do not invent signs or severity; offer an age-appropriate neurological/developmental examination.","Spastic CP is supported by persistent abnormal tone/reflexes and motor impairment; consider neuromuscular disease, genetic/metabolic disorders, spinal lesions and dystonia depending on pattern."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Spastic CP is supported by persistent abnormal tone/reflexes and motor impairment; consider neuromuscular disease, genetic/metabolic disorders, spinal lesions and dystonia depending on pattern."]}]}],pages:[1],note:"Original video is not present; the recall asks for four differentials.",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-010",year:"2012",rotation:"Paediatrics",topic:"development",title:"Review a childhood developmental assessment video",case:"Review a childhood developmental assessment video.",objectives:[{key:"dev",label:"Describe development and estimate the developmental level",sections:[{heading:"Assess the observed domains",points:["Describe each observed skill by domain, then estimate a developmental range using validated age norms.","Do not infer exact developmental age or diagnosis without the recalled video; compare all assessed domains and account for cooperation.","Confirm chronological age and prematurity correction; ask gross motor, fine motor/vision, language/hearing and social/adaptive milestones.","Ask pregnancy/birth history, regression, seizures, hearing/vision, family history, environment and opportunities for learning."]},{heading:"Interpret with limitations",points:["Consider global versus isolated delay, hearing/vision impairment, autism, cerebral palsy and genetic/metabolic causes; developmental variation is not diagnosed from one task."]}]}],pages:[1],note:"No video or specific demonstrated skills is supplied.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-011",year:"2012",rotation:"Genetics",topic:"scd",title:"A family attends for counselling about sickle cell disease",case:"A family attends for counselling about sickle cell disease.",objectives:[{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Risks apply independently to each pregnancy; check understanding using teach-back and avoid blame.","For two HbAS carriers, each pregnancy has 25% HbSS disease, 50% HbAS trait and 25% neither variant.","Discuss prenatal diagnosis and preimplantation testing where available, non-directively and according to local policy.","Arrange specialist haematology care, preventive care and a fever/pain action plan for an affected child."]}]}],pages:[1],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-012",year:"2012",rotation:"Procedures",topic:"bma",title:"Perform bone marrow aspiration in a simulated station",case:"Perform bone marrow aspiration in a simulated station.",objectives:[{key:"p",label:"Demonstrate or explain the procedure safely",sections:[{heading:"Safety and steps",points:["Model/supervised practice only: identity, consent, analgesia/local anaesthetic, asepsis and appropriate PPE.","Common adult site is posterior iliac crest; choose age/site/equipment with a trained supervisor. Describe safe positioning, aspirate collection and immediate lab handling.","Apply pressure/dressing, sharps disposal, document and monitor pain/bleeding; discuss bleeding, infection and inadequate sample."]},{heading:"Checks and samples",points:["Check relevant FBC/coagulation and consent; arrange correct labelled sample containers and requested morphology/flow/cytogenetics/culture as indicated."]}]}],pages:[1],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-013",year:"2013",rotation:"Medicine",topic:"tricuspid",title:"Perform a cardiovascular examination on a patient or manikin",case:"Perform a cardiovascular examination on a patient or manikin.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Assess JVP including prominent systolic v waves, parasternal heave, inspiratory variation of murmur, pulsatile liver and oedema."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Tricuspid regurgitation is supported by a pansystolic lower-left-sternal murmur that may increase on inspiration; consider MR/VSD as alternatives."]}]}],pages:[1],note:"The 2013 recall identifies tricuspid regurgitation; other years describe valve problems or a murmur/click.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-014",year:"2013",rotation:"Medicine",topic:"bronchiectasis",title:"Perform a respiratory examination",case:"Perform a respiratory examination.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect work of breathing and sputum, clubbing, pulse and SpO2; examine trachea and expansion.","Compare percussion, auscultation and vocal resonance anteriorly/posteriorly including bases; describe coarse crackles/wheeze without inventing signs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Bronchiectasis is suggested by chronic productive cough with coarse crackles/clubbing; consider COPD, TB, lung cancer and interstitial disease."]}]}],pages:[1],note:"The recall lists a respiratory examination; use supplied findings rather than assuming all typical signs.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-015",year:"2013",rotation:"Medicine",topic:"motor",title:"Perform upper- and/or lower-limb motor examination and localise the lesion",case:"Perform upper- and/or lower-limb motor examination and localise the lesion.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Consent, exposure and pain check; inspect posture, wasting/fasciculations; assess tone and MRC power systematically comparing sides.","Test relevant tendon reflexes and plantar responses; assess coordination; complete sensation and supported gait.","Describe distribution and UMN/LMN pattern rather than giving a disease label without evidence."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Localise: UMN pattern (increased tone/brisk reflexes/extensor plantars), LMN pattern (wasting/fasciculation/reduced tone/reflexes), myopathy (often proximal) or neuromuscular junction disease.","Acute stroke/spinal compression and rapidly ascending weakness are urgent; a single sign does not establish the cause."]}]}],pages:[1],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-016",year:"2013",rotation:"Paediatrics",topic:"development",title:"Review a childhood developmental assessment video",case:"Review a childhood developmental assessment video.",objectives:[{key:"dev",label:"Describe development and estimate the developmental level",sections:[{heading:"Assess the observed domains",points:["Describe each observed skill by domain, then estimate a developmental range using validated age norms.","Do not infer exact developmental age or diagnosis without the recalled video; compare all assessed domains and account for cooperation.","Confirm chronological age and prematurity correction; ask gross motor, fine motor/vision, language/hearing and social/adaptive milestones.","Ask pregnancy/birth history, regression, seizures, hearing/vision, family history, environment and opportunities for learning."]},{heading:"Interpret with limitations",points:["Consider global versus isolated delay, hearing/vision impairment, autism, cerebral palsy and genetic/metabolic causes; developmental variation is not diagnosed from one task."]}]}],pages:[1],note:"Video not included; a numerical developmental age cannot be reconstructed.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-017",year:"2013",rotation:"Genetics",topic:"nf1",title:"A family attends for counselling about neurofibromatosis type 1",case:"A family attends for counselling about neurofibromatosis type 1.",objectives:[{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Explain variable severity without catastrophising; urgent review for a rapidly growing painful lesion or new neurological/visual symptoms.","An affected heterozygous individual has a 50% transmission risk in each pregnancy; severity cannot be reliably predicted.","If apparently de novo, sibling recurrence is low but not zero because of germline mosaicism.","Explain multidisciplinary surveillance and options for reproductive testing when the familial variant is known."]}]}],pages:[1],note:"Original summary names neurofibromatosis type 1 only; the case prompt is structured for practice.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-018",year:"2013",rotation:"Procedures",topic:"ng",title:"Demonstrate the recalled procedure on a training model",case:"Demonstrate the recalled procedure on a training model.",objectives:[{key:"p",label:"Demonstrate or explain the procedure safely",sections:[{heading:"Safety and steps",points:["Use a manikin and supervision: explain, sit appropriately, select/measure tube by local policy, lubricate and pass gently while monitoring tolerance; stop for respiratory distress/resistance.","Secure only after appropriate checks; document tube type/length, confirmation and plan.","Monitor for aspiration, displacement, mucosal injury and need for reassessment before use."]},{heading:"Checks and samples",points:["Confirm position according to approved policy: appropriately obtained aspirate pH using approved strips, or correctly interpreted X-ray when required.","Auscultating injected air is not a safe confirmation method; do not give feed/medicine until position is confirmed."]}]}],pages:[1],note:"Original procedure: nasogastric tube insertion.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-019",year:"2014",rotation:"Medicine",topic:"valves",title:"Perform a cardiovascular examination on a patient or manikin",case:"Perform a cardiovascular examination on a patient or manikin.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Consent, pain check, appropriate exposure; inspect scars, hands and face; pulse rate/rhythm/character and BP.","Assess JVP, apex, heaves/thrills; auscultate all areas with diaphragm/bell and appropriate positioning; time a murmur against pulse.","Describe timing, site, radiation, intensity and associated sounds; examine lung bases and oedema."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Characterise the murmur before naming a lesion: systolic versus diastolic, loudest site, radiation and associated pulse/JVP changes.","Consider regurgitation/stenosis, prosthetic valve sounds and infective endocarditis if systemic features; a scar alone does not establish the operation."]}]}],pages:[1],note:"Brief recall; no complete vignette or definitive valve lesion supplied.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-020",year:"2014",rotation:"Medicine",topic:"copd",title:"Perform a respiratory examination",case:"Perform a respiratory examination.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Assess distress, RR/SpO2, hands, pulse and face; trachea/expansion, percussion and auscultation bilaterally.","Possible hyperinflation, quiet breath sounds and prolonged expiration; look for cor pulmonale."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["COPD versus asthma, bronchiectasis, heart failure, malignancy or interstitial disease; clubbing is not typical of uncomplicated COPD."]}]}],pages:[1],note:"The recall lists a respiratory examination; use supplied findings rather than assuming all typical signs.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-021",year:"2014",rotation:"Medicine",topic:"asthma",title:"Perform a respiratory examination in a patient with episodic breathing symptoms",case:"Perform a respiratory examination in a patient with episodic breathing symptoms.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Observe speech/work of breathing, RR, pulse/SpO2; compare air entry and wheeze.","A silent chest, exhaustion or reduced consciousness is life-threatening; normal examination between attacks does not exclude asthma."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Asthma versus COPD, infection, dysfunctional breathing, heart failure; acute onset also consider anaphylaxis/foreign body."]}]}],pages:[1],note:"Alternative recall from a shared table cell; this is not evidence of an additional distinct official exam station.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-022",year:"2014",rotation:"Medicine",topic:"motor",title:"Perform upper- and/or lower-limb motor examination and localise the lesion",case:"Perform upper- and/or lower-limb motor examination and localise the lesion.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Consent, exposure and pain check; inspect posture, wasting/fasciculations; assess tone and MRC power systematically comparing sides.","Test relevant tendon reflexes and plantar responses; assess coordination; complete sensation and supported gait.","Describe distribution and UMN/LMN pattern rather than giving a disease label without evidence."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Localise: UMN pattern (increased tone/brisk reflexes/extensor plantars), LMN pattern (wasting/fasciculation/reduced tone/reflexes), myopathy (often proximal) or neuromuscular junction disease.","Acute stroke/spinal compression and rapidly ascending weakness are urgent; a single sign does not establish the cause."]}]}],pages:[1],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-023",year:"2014",rotation:"Paediatrics",topic:"development",title:"Review a childhood developmental assessment video",case:"Review a childhood developmental assessment video.",objectives:[{key:"dev",label:"Describe development and estimate the developmental level",sections:[{heading:"Assess the observed domains",points:["Describe each observed skill by domain, then estimate a developmental range using validated age norms.","Do not infer exact developmental age or diagnosis without the recalled video; compare all assessed domains and account for cooperation.","Confirm chronological age and prematurity correction; ask gross motor, fine motor/vision, language/hearing and social/adaptive milestones.","Ask pregnancy/birth history, regression, seizures, hearing/vision, family history, environment and opportunities for learning."]},{heading:"Interpret with limitations",points:["Consider global versus isolated delay, hearing/vision impairment, autism, cerebral palsy and genetic/metabolic causes; developmental variation is not diagnosed from one task."]}]}],pages:[1],note:"Video not included; a numerical developmental age cannot be reconstructed.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-024",year:"2014",rotation:"Genetics",topic:"haemophilia",title:"A family attends for counselling about haemophilia",case:"A family attends for counselling about haemophilia.",objectives:[{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Avoid IM injections/unnecessary trauma and medicines increasing bleeding unless advised; urgent care for head injury or major bleeding.","For a carrier mother and unaffected father: each son has a 50% risk of haemophilia and each daughter a 50% risk of inheriting the variant.","An affected father passes the variant to all daughters and no sons if the mother does not carry it. Women carrying variants can also have clinically significant bleeding.","Discuss haematology-led prophylaxis, prompt bleed treatment and prenatal/preimplantation options where available."]}]}],pages:[1],note:"Original summary names haemophilia only; the case prompt is structured for practice.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-025",year:"2014",rotation:"Procedures",topic:"ng",title:"Demonstrate the recalled procedure on a training model",case:"Demonstrate the recalled procedure on a training model.",objectives:[{key:"p",label:"Demonstrate or explain the procedure safely",sections:[{heading:"Safety and steps",points:["Use a manikin and supervision: explain, sit appropriately, select/measure tube by local policy, lubricate and pass gently while monitoring tolerance; stop for respiratory distress/resistance.","Secure only after appropriate checks; document tube type/length, confirmation and plan.","Monitor for aspiration, displacement, mucosal injury and need for reassessment before use."]},{heading:"Checks and samples",points:["Confirm position according to approved policy: appropriately obtained aspirate pH using approved strips, or correctly interpreted X-ray when required.","Auscultating injected air is not a safe confirmation method; do not give feed/medicine until position is confirmed."]}]}],pages:[1],note:"Original procedure: nasogastric tube insertion.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-026",year:"2015",rotation:"Medicine",topic:"valves",title:"Perform a cardiovascular examination on a patient or manikin",case:"Perform a cardiovascular examination on a patient or manikin.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Consent, pain check, appropriate exposure; inspect scars, hands and face; pulse rate/rhythm/character and BP.","Assess JVP, apex, heaves/thrills; auscultate all areas with diaphragm/bell and appropriate positioning; time a murmur against pulse.","Describe timing, site, radiation, intensity and associated sounds; examine lung bases and oedema."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Characterise the murmur before naming a lesion: systolic versus diastolic, loudest site, radiation and associated pulse/JVP changes.","Consider regurgitation/stenosis, prosthetic valve sounds and infective endocarditis if systemic features; a scar alone does not establish the operation."]}]}],pages:[1],note:"Brief recall; no complete vignette or definitive valve lesion supplied.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-027",year:"2015",rotation:"Medicine",topic:"resp",title:"Perform a respiratory examination",case:"Perform a respiratory examination.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Consent, positioning/exposure, inspect effort and surroundings; hands/pulse/face, trachea and relevant nodes.","Compare chest movement, expansion, percussion and auscultation anteriorly/posteriorly including bases; assess vocal resonance where indicated and oedema.","Present positives and relevant negatives, limitations and proposed completion without inventing unelicited signs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Use the actual pattern: obstruction (asthma/COPD), bronchiectasis, consolidation, effusion, collapse, pneumothorax or interstitial disease. No final diagnosis is documented in this recall."]}]}],pages:[1],note:"2013: clubbing is reported. 2014: COPD/asthma variants. 2015: no diagnosis or signs are specified; the answer gives an approach to chronic airway disease, not a confirmed diagnosis.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-028",year:"2015",rotation:"Medicine",topic:"motor",title:"Perform upper- and/or lower-limb motor examination and localise the lesion",case:"Perform upper- and/or lower-limb motor examination and localise the lesion.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Consent, exposure and pain check; inspect posture, wasting/fasciculations; assess tone and MRC power systematically comparing sides.","Test relevant tendon reflexes and plantar responses; assess coordination; complete sensation and supported gait.","Describe distribution and UMN/LMN pattern rather than giving a disease label without evidence."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Localise: UMN pattern (increased tone/brisk reflexes/extensor plantars), LMN pattern (wasting/fasciculation/reduced tone/reflexes), myopathy (often proximal) or neuromuscular junction disease.","Acute stroke/spinal compression and rapidly ascending weakness are urgent; a single sign does not establish the cause."]}]}],pages:[1],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-029",year:"2015",rotation:"Paediatrics",topic:"development",title:"Review a childhood developmental assessment video",case:"Review a childhood developmental assessment video.",objectives:[{key:"dev",label:"Describe development and estimate the developmental level",sections:[{heading:"Assess the observed domains",points:["Describe each observed skill by domain, then estimate a developmental range using validated age norms.","Do not infer exact developmental age or diagnosis without the recalled video; compare all assessed domains and account for cooperation.","Confirm chronological age and prematurity correction; ask gross motor, fine motor/vision, language/hearing and social/adaptive milestones.","Ask pregnancy/birth history, regression, seizures, hearing/vision, family history, environment and opportunities for learning."]},{heading:"Interpret with limitations",points:["Consider global versus isolated delay, hearing/vision impairment, autism, cerebral palsy and genetic/metabolic causes; developmental variation is not diagnosed from one task."]}]}],pages:[1],note:"Video not included; a numerical developmental age cannot be reconstructed.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-030",year:"2015",rotation:"Genetics",topic:"nf1",title:"A family attends for counselling about neurofibromatosis type 1",case:"A family attends for counselling about neurofibromatosis type 1.",objectives:[{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Explain variable severity without catastrophising; urgent review for a rapidly growing painful lesion or new neurological/visual symptoms.","An affected heterozygous individual has a 50% transmission risk in each pregnancy; severity cannot be reliably predicted.","If apparently de novo, sibling recurrence is low but not zero because of germline mosaicism.","Explain multidisciplinary surveillance and options for reproductive testing when the familial variant is known."]}]}],pages:[1],note:"Original summary names neurofibromatosis type 1 only; the case prompt is structured for practice.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-031",year:"2015",rotation:"Procedures",topic:"lp",title:"Demonstrate the recalled procedure on a training model",case:"Demonstrate the recalled procedure on a training model.",objectives:[{key:"p",label:"Demonstrate or explain the procedure safely",sections:[{heading:"Safety and steps",points:["Prioritise ABCDE and prompt empirical IV antibiotics per age/local policy; dexamethasone where indicated by current pathway.","Model-only LP: consent, contraindication check, asepsis, trained positioning at L3/4 or L4/5, local analgesia, sterile sampling and documentation.","Defer LP and obtain senior help for instability, signs of raised intracranial pressure/focal deficit, significant bleeding risk or local infection; monitor afterwards."]},{heading:"Checks and samples",points:["Blood cultures/glucose and urgent routine bloods; CSF opening pressure when indicated, cells/differential, protein, paired glucose, Gram stain/culture and PCR.","Do not delay antibiotics in suspected bacterial meningitis for LP or imaging; CT before LP only when clinical criteria indicate, and a normal CT does not guarantee safety."]}]}],pages:[1],note:"Original procedure: lumbar puncture.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-032",year:"2013",rotation:"Paediatrics",topic:"diarrhoea",title:"A child has loose stools for two days",case:"A child has loose stools for two days.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask duration, frequency, blood/mucus, vomiting (bilious?), fever, intake/urine, contacts/travel, food and antibiotics.","Assess baseline growth, feeding and vulnerability."]}]}],pages:[1],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-033",year:"2013",rotation:"Paediatrics",topic:"spleen",title:"A four-year-old has abdominal pain, pallor and splenomegaly",case:"A four-year-old has abdominal pain, pallor and splenomegaly.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Palpate spleen from right iliac fossa on inspiration gently, characterise notch and movement; bimanual kidney assessment when indicated.","Spleen may have a notch, inferomedial inspiratory movement and no ability to get above; kidney may be ballotable with ability to get above and overlying colonic resonance. These are supportive, not absolute rules."]}]}],pages:[1],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-034",year:"2014",rotation:"Paediatrics",topic:"anaemia",title:"A child presents with pallor",case:"A child presents with pallor.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask fatigue, exertional dyspnoea/palpitations, bleeding including menstruation/GI loss, diet, pica, pregnancy, malabsorption and chronic disease.","In children ask milk/diet, growth, stool loss/parasites risks and family haemoglobinopathy history; jaundice raises haemolysis/liver alternatives."]}]}],pages:[1],note:"Alternative recall from a shared table cell; this is not evidence of an additional distinct official exam station.",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-035",year:"2014",rotation:"Paediatrics",topic:"chd",title:"A child presents with cyanosis",case:"A child presents with cyanosis.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask timing of cyanosis, relationship to crying/feeding, breathlessness, sweating, poor growth, collapse, antenatal scans and birth history.","Assess sepsis, maternal/perinatal risks and family cardiac history."]}]}],pages:[1],note:"Alternative recall from a shared table cell; this is not evidence of an additional distinct official exam station.",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-036",year:"2014",rotation:"Paediatrics",topic:"abdomen",title:"A child has abdominal pain",case:"A child has abdominal pain.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Hand hygiene, consent, pain check and draping; inspect general state/abdomen; gentle systematic palpation away from pain, organ/mass assessment and percussion.","Auscultate as appropriate; assess hernia/genital/rectal regions only if indicated with specific consent, chaperone and supervision."]}]}],pages:[1],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-037",year:"2015",rotation:"Paediatrics",topic:"rickets",title:"A child presents with bowing of the legs",case:"A child presents with bowing of the legs.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask growth, milestones, pain/weakness, fractures, dietary calcium/vitamin D, supplementation, sun exposure, malabsorption/renal disease and family history."]}]}],pages:[1],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-038",year:"2015",rotation:"Paediatrics",topic:"childcough",title:"A child presents with cough",case:"A child presents with cough.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask age, onset/duration, wet/dry or barking cough, fever, breathing effort, wheeze/stridor, feeding/urine and choking onset.","Ask contacts, smoke/exposure, immunisation, TB risks, atopy, recurrent infections, growth and previous treatment."]}]}],pages:[1],note:"No final diagnosis or chronicity is supplied. Use an age-appropriate cough history; the chronic-airway differential is a revision outline, not a claim this child had bronchiectasis.",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-039",year:"2012",rotation:"FAMCO",topic:"back",title:"Perform a back examination",case:"Perform a back examination.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Observe supported gait/posture; inspect/palpate spine, comfortable range; assess lower-limb power, tone, reflexes and dermatomal sensation.","Straight leg raise with consent if radicular symptoms; assess heel/toe gait only if safe.","Do not routinely perform rectal examination for all back pain; normal anal tone cannot exclude cauda equina syndrome."]}]}],pages:[2],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-040",year:"2012",rotation:"FAMCO",topic:"lifestyle",title:"Counsel a patient on smoking, alcohol, exercise and diet",case:"Counsel a patient on smoking, alcohol, exercise and diet.",objectives:[{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Use ask–advise–assist, motivational interviewing and teach-back; choose one or two achievable changes.","Agree realistic shared goals: smoke-free support, balanced high-fibre diet, less salt/ultraprocessed food, weight support and gradual activity (often aim 150 minutes/week moderate activity plus strength work if suitable).","Discuss alcohol reduction in context; dependent drinkers should not abruptly stop without withdrawal assessment.","Arrange follow-up, risk-based preventive treatment and support rather than judgement."]}]}],pages:[2],note:"Alternative recall from a shared table cell; this is not evidence of an additional distinct official exam station.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-041",year:"2012",rotation:"FAMCO",topic:"abdomen",title:"A patient presents with abdominal pain",case:"A patient presents with abdominal pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Explore site, onset, migration, severity, bowel/urinary/gynaecological symptoms, vomiting, bleeding and systemic signs.","Ask pregnancy possibility, operations, medicines including NSAIDs, alcohol and red flags."]}]}],pages:[2],note:"Alternative recall from a shared table cell; this is not evidence of an additional distinct official exam station.",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-042",year:"2012",rotation:"Psychiatry",topic:"dementia",title:"Take a history of cognitive decline",case:"Take a history of cognitive decline.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Obtain patient and collateral accounts with permission: gradual versus acute/fluctuating onset, memory/language/executive changes and daily function.","Ask mood, psychosis, medicines, alcohol, neurological events, sensory problems, driving, finances, medication safety and caregiver needs."]}]}],pages:[2],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-043",year:"2012",rotation:"Psychiatry",topic:"depression",title:"Take a history of low mood",case:"Take a history of low mood.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask low mood/anhedonia, duration, sleep, appetite/weight, energy, concentration, guilt, function and psychotic symptoms.","Screen previous mania/hypomania, substances, medicines, physical causes and stressors.","Directly ask self-harm/suicide thoughts, intent, plans, access to means, previous acts, supports and immediate safety."]}]}],pages:[2],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-044",year:"2012",rotation:"Psychiatry",topic:"psychosis",title:"Explore delusions and hallucinations in a psychiatric history",case:"Explore delusions and hallucinations in a psychiatric history.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Explore hallucinations (including commands), delusional beliefs, thought disorder, negative symptoms, mood, sleep and functioning non-judgementally.","Ask medication adherence and reasons, adverse effects, substance use, relapse triggers and collateral with consent.","Assess self-harm, harm to others, self-neglect, vulnerability and access to support."]}]}],pages:[2],note:"Alternative recall from a shared table cell; this is not evidence of an additional distinct official exam station.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-045",year:"2012",rotation:"Psychiatry",topic:"autism",title:"Take a developmental history from the father of a child with communication or social concerns",case:"Take a developmental history from the father of a child with communication or social concerns.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Take developmental and language/hearing history, social communication/reciprocity, play, repetitive behaviours, restricted interests and sensory differences.","Establish onset and impact across settings, regression, school function, strengths, sleep, feeding and family history; ask parent concerns without blame."]}]}],pages:[2],note:"Alternative recall from a shared table cell; this is not evidence of an additional distinct official exam station.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-046",year:"2012",rotation:"Psychiatry",topic:"cognitive",title:"Perform a cognitive screening assessment",case:"Perform a cognitive screening assessment.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Quiet environment, aids/interpreter as appropriate; assess orientation, registration/recall, attention, language, commands and visuospatial skills using the selected tool."]}]}],pages:[2],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-047",year:"2012",rotation:"Oral health",topic:"aphthous",title:"A patient has aphthous oral ulcers and anaemia",case:"A patient has aphthous oral ulcers and anaemia.",objectives:[{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Aphthous ulcers are not contagious; HSV is contagious. If the source shows mixed images, do not assume both have one cause.","Pain relief, avoid trauma/irritants and maintain oral hygiene; topical anti-inflammatory treatment such as an oral corticosteroid preparation when diagnosis supports it.","Correct documented deficiency and investigate systemic disease; do not give antibiotics for uncomplicated aphthae."]}]}],pages:[2],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-048",year:"2012",rotation:"Dermatology",topic:"pruritus",title:"A patient presents with itching",case:"A patient presents with itching.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Clarify onset, distribution, nocturnal itch, contacts, new medicines/products, atopy, systemic symptoms, travel and occupation.","Ask pregnancy, liver/renal/thyroid disease, constitutional symptoms and impact on sleep."]}]}],pages:[2],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-049",year:"2013",rotation:"FAMCO",topic:"knee",title:"A football player has injured his right knee",case:"A football player has injured his right knee.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect gait/alignment if safe then swelling/wasting, warmth/tenderness, effusion and comfortable active/passive range.","Assess Lachman/anterior drawer, posterior drawer and collateral stress when tolerated and trained; meniscal tests only if useful, not forced in an acutely painful joint.","Assess distal neurovascular status and adjacent joints; document findings."]}]}],pages:[2],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-050",year:"2013",rotation:"FAMCO",topic:"anaemia",title:"A 25-year-old woman presents with palpitations and fatigue",case:"A 25-year-old woman presents with palpitations and fatigue.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask fatigue, exertional dyspnoea/palpitations, bleeding including menstruation/GI loss, diet, pica, pregnancy, malabsorption and chronic disease.","In children ask milk/diet, growth, stool loss/parasites risks and family haemoglobinopathy history; jaundice raises haemolysis/liver alternatives."]}]}],pages:[2],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-051",year:"2013",rotation:"Psychiatry",topic:"alcohol",title:"Take a history of alcohol dependence",case:"Take a history of alcohol dependence.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Quantify units/standard drinks, beverage/strength, pattern, last drink, duration and binge use.","Ask craving, loss of control, tolerance, withdrawal, morning drinking, past seizures/delirium tremens, attempts to stop, other substances and physical/mental consequences.","Assess self-harm, driving/forensic risk, work/relationships, nutrition, housing, support and goals."]}]}],pages:[2],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-052",year:"2013",rotation:"Psychiatry",topic:"school",title:"A father reports poor school performance in his nine-year-old son",case:"A father reports poor school performance in his nine-year-old son.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask academic domains, onset/progression, school attendance/teaching, language, family/social stress, sleep, hearing/vision, development, attention and peer relations.","Ask ADHD/autism features and learning difficulties in relatives; obtain school information with permission."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Avoid labelling or blaming the child; explain that performance has many causes and support can start before a final label.","Provide individualised educational support, address sensory/health/psychosocial causes and involve school/parents with the child’s needs central."]}]}],pages:[2],note:"The recall calls IQ testing the single most important investigation; the answer explains why a broader developmental/sensory/educational assessment is necessary.",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-053",year:"2013",rotation:"Psychiatry",topic:"dementia",title:"A son reports his mother has been forgetting things for two years",case:"A son reports his mother has been forgetting things for two years.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Obtain patient and collateral accounts with permission: gradual versus acute/fluctuating onset, memory/language/executive changes and daily function.","Ask mood, psychosis, medicines, alcohol, neurological events, sensory problems, driving, finances, medication safety and caregiver needs."]}]}],pages:[2],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-054",year:"2013",rotation:"Psychiatry",topic:"olanzapine",title:"A 26-year-old patient with schizophrenia is being discharged on olanzapine. Discuss side effects, relapse and a healthy lifestyle",case:"A 26-year-old patient with schizophrenia is being discharged on olanzapine. Discuss side effects, relapse and a healthy lifestyle.",objectives:[{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Explain common weight gain, appetite increase, sedation, constipation/dry mouth and metabolic risk; mention movement effects and rare neuroleptic malignant syndrome.","Discuss alternatives/side-effect support and shared decision-making; avoid blaming the patient for adherence difficulties.","Continue/review treatment through the responsible team; do not stop abruptly on your own.","Discuss sleep/routine, activity, diet, smoking changes (which can alter levels), substance avoidance and a written early-warning/crisis plan.","Seek urgent help for fever/rigidity/confusion, severe sedation or other serious adverse effects."]}]}],pages:[2],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-055",year:"2013",rotation:"Oral health",topic:"hsv",title:"A mother brings an eight-year-old with fever, malaise, painful swallowing, cervical lymphadenopathy and lower-lip ulcers",case:"A mother brings an eight-year-old with fever, malaise, painful swallowing, cervical lymphadenopathy and lower-lip ulcers.",objectives:[{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Explain viral, contagious illness usually resolves; do not promise it cannot be anything serious without assessing red flags. Review poor drinking, urine reduction, eye pain or persistent illness.","Age-appropriate analgesia, frequent fluids and hydration support; admission if unable to maintain hydration, severe disease or high-risk child.","Early oral aciclovir may be considered for severe early disease per paediatric protocol; immunocompromised cases require urgent specialist care.","Avoid sharing utensils/kissing lesions; hand hygiene and avoid eye touching; no antibiotics unless bacterial indication."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Explain viral, contagious illness usually resolves; do not promise it cannot be anything serious without assessing red flags. Review poor drinking, urine reduction, eye pain or persistent illness.","Age-appropriate analgesia, frequent fluids and hydration support; admission if unable to maintain hydration, severe disease or high-risk child.","Early oral aciclovir may be considered for severe early disease per paediatric protocol; immunocompromised cases require urgent specialist care.","Avoid sharing utensils/kissing lesions; hand hygiene and avoid eye touching; no antibiotics unless bacterial indication."]},{heading:"Parent’s specific concerns",points:["Most typical viral gingivostomatitis is self-limiting, but assess hydration, immune status and clinical red flags before reassurance. Admission is considered for inability to drink, dehydration, severe illness or high risk.","A neighbour’s leukaemia does not establish this child’s diagnosis. Persistent fever, pallor, bruising, weight loss or atypical lesions warrant assessment and targeted blood tests. Give a clear review plan."]}]}],pages:[2],note:"She asks about the cause, contagiousness, leukaemia, admission, follow-up and seriousness. The recalled photograph is absent.",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-056",year:"2013",rotation:"Dermatology",topic:"scabies",title:"A patient has an itchy rash in finger webs, around the umbilicus and in axillae; his wife and two children have a similar rash",case:"A patient has an itchy rash in finger webs, around the umbilicus and in axillae; his wife and two children have a similar rash.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask nocturnal itch, household/sexual contacts, onset, distribution, previous treatment and institutional exposure.","Assess infants, pregnancy, immunosuppression, crusted lesions and secondary infection."]}]}],pages:[2],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-057",year:"2014",rotation:"FAMCO",topic:"back",title:"Perform a back examination, including gait and relevant lower-limb assessment",case:"Perform a back examination, including gait and relevant lower-limb assessment.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Observe supported gait/posture; inspect/palpate spine, comfortable range; assess lower-limb power, tone, reflexes and dermatomal sensation.","Straight leg raise with consent if radicular symptoms; assess heel/toe gait only if safe.","Do not routinely perform rectal examination for all back pain; normal anal tone cannot exclude cauda equina syndrome."]}]}],pages:[2,3],note:"The historical note suggests routine rectal tone assessment; this is not required for every back-pain examination and normal tone cannot exclude cauda equina syndrome.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-058",year:"2014",rotation:"FAMCO",topic:"lifestyle",title:"A man attending a check-up has BP 135/88 mmHg and fasting glucose 6.1 mmol/L. Counsel on lifestyle",case:"A man attending a check-up has BP 135/88 mmHg and fasting glucose 6.1 mmol/L. Counsel on lifestyle.",objectives:[{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Use ask–advise–assist, motivational interviewing and teach-back; choose one or two achievable changes.","Agree realistic shared goals: smoke-free support, balanced high-fibre diet, less salt/ultraprocessed food, weight support and gradual activity (often aim 150 minutes/week moderate activity plus strength work if suitable).","Discuss alcohol reduction in context; dependent drinkers should not abruptly stop without withdrawal assessment.","Arrange follow-up, risk-based preventive treatment and support rather than judgement."]}]}],pages:[2,3],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-059",year:"2014",rotation:"Psychiatry",topic:"delirium",title:"The daughter of a 70-year-old man reports five days of confusion",case:"The daughter of a 70-year-old man reports five days of confusion.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Establish hours/days onset and fluctuation from collateral; baseline cognition/function, infection/illness, medicines, alcohol withdrawal, pain, retention and constipation."]}]}],pages:[2,3],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-060",year:"2014",rotation:"Psychiatry",topic:"depression",title:"A 29-year-old man has low mood. Explore suicide risk and stressful life events",case:"A 29-year-old man has low mood. Explore suicide risk and stressful life events.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask low mood/anhedonia, duration, sleep, appetite/weight, energy, concentration, guilt, function and psychotic symptoms.","Screen previous mania/hypomania, substances, medicines, physical causes and stressors.","Directly ask self-harm/suicide thoughts, intent, plans, access to means, previous acts, supports and immediate safety."]}]},{key:"r",label:"Perform a detailed psychosocial and safety assessment",sections:[{heading:"Elicit and formulate safety needs",points:["Ask low mood/anhedonia, duration, sleep, appetite/weight, energy, concentration, guilt, function and psychotic symptoms.","Screen previous mania/hypomania, substances, medicines, physical causes and stressors.","Directly ask self-harm/suicide thoughts, intent, plans, access to means, previous acts, supports and immediate safety.","MSE, psychosocial/risk formulation and targeted physical investigation (e.g. FBC/thyroid if indicated).","Severity is clinical and functional, not determined by a questionnaire alone."]},{heading:"Act on findings",points:["Collaborative safety plan and urgent crisis help if immediate risk; do not leave someone at imminent risk unsupported.","Discuss psychological therapy, social/activity/sleep support and antidepressants depending on severity/preferences and local guidance.","If an SSRI is considered, explain delayed benefit, GI/sexual effects, activation, discontinuation and early review; reconsider antidepressant monotherapy if bipolar disorder suspected."]}]}],pages:[2,3],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-061",year:"2014",rotation:"Psychiatry",topic:"psychosis",title:"A father reports behavioural changes in his 27-year-old son",case:"A father reports behavioural changes in his 27-year-old son.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Explore hallucinations (including commands), delusional beliefs, thought disorder, negative symptoms, mood, sleep and functioning non-judgementally.","Ask medication adherence and reasons, adverse effects, substance use, relapse triggers and collateral with consent.","Assess self-harm, harm to others, self-neglect, vulnerability and access to support."]}]}],pages:[2,3],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-062",year:"2014",rotation:"Psychiatry",topic:"adhd",title:"Counsel the mother of a child diagnosed with ADHD about treatment and adverse effects",case:"Counsel the mother of a child diagnosed with ADHD about treatment and adverse effects.",objectives:[{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Stimulants: reduced appetite, insomnia, abdominal/headache and pulse/BP effects. Atomoxetine: GI/mood effects; guanfacine: sedation and hypotension.","Explore reluctance to medicate and offer shared decisions; sleep hygiene includes routine, limiting late screens/caffeine and assessing other sleep problems.","Parent/carer training and school/environmental adjustments, predictable routines and sleep support.","Medication for persistent significant impairment through specialists: stimulants such as methylphenidate and selected non-stimulants such as atomoxetine/guanfacine according to age/local pathway.","Monitor response, appetite/growth, sleep, pulse/BP and mood; not every family must begin with medication."]}]}],pages:[2,3],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-063",year:"2014",rotation:"Oral health",topic:"dentalvalve",title:"A woman with valvular heart disease has dental caries requiring extraction; discuss her OPG and whether her heart condition may be affected",case:"A woman with valvular heart disease has dental caries requiring extraction; discuss her OPG and whether her heart condition may be affected.",objectives:[{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Explain why dental infection prevention is important, balanced infection/bleeding risks and whom to contact after fever or uncontrolled bleeding.","Treat dental disease and optimise oral hygiene; plan haemostasis/anticoagulation with dental and responsible medical teams.","Do not stop warfarin or prescribe prophylaxis automatically; current local policy matters. NICE does not recommend antibiotic prophylaxis routinely for dental procedures; other jurisdictions advise it for selected highest-risk patients."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Explain why dental infection prevention is important, balanced infection/bleeding risks and whom to contact after fever or uncontrolled bleeding.","Treat dental disease and optimise oral hygiene; plan haemostasis/anticoagulation with dental and responsible medical teams.","Do not stop warfarin or prescribe prophylaxis automatically; current local policy matters. NICE does not recommend antibiotic prophylaxis routinely for dental procedures; other jurisdictions advise it for selected highest-risk patients."]}]}],pages:[2,3],note:"The OPG is not supplied. Antibiotic prophylaxis requires current local risk-based guidance, not an automatic historical rule.",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-064",year:"2014",rotation:"Dermatology",topic:"eczema",title:"A mother presents with her infant’s rash involving the face and flexures. Discuss the diagnosis, management and topical steroid effects",case:"A mother presents with her infant’s rash involving the face and flexures. Discuss the diagnosis, management and topical steroid effects.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask itch/dryness, distribution, triggers, age of onset, atopy/family history, products, infection symptoms and previous treatment.","Assess sleep, school/family impact and adherence/concerns about steroids."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Atopic eczema versus contact/irritant dermatitis, scabies, fungal infection, lichen planus and other age-dependent causes."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Clinical diagnosis; swab or specialist testing only if infection/uncertainty/selected allergy concern."]},{heading:"Management",points:["Regular generous emollient, soap substitutes, irritant avoidance and comfortable clothing.","Topical corticosteroid of appropriate potency for age/site/severity during flares with clear application/duration instructions; review rather than avoid needed treatment because of fear.","Escalate difficult disease; eczema herpeticum (painful monomorphic vesicles/erosions ± fever/eye involvement) needs urgent care."]}]}],pages:[2,3],note:"Recalled clinical image is not included.",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-065",year:"2015",rotation:"FAMCO",topic:"knee",title:"Perform a knee examination",case:"Perform a knee examination.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect gait/alignment if safe then swelling/wasting, warmth/tenderness, effusion and comfortable active/passive range.","Assess Lachman/anterior drawer, posterior drawer and collateral stress when tolerated and trained; meniscal tests only if useful, not forced in an acutely painful joint.","Assess distal neurovascular status and adjacent joints; document findings."]}]}],pages:[3],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-066",year:"2015",rotation:"FAMCO",topic:"abdomen",title:"Take a history of upper abdominal pain",case:"Take a history of upper abdominal pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Explore site, onset, migration, severity, bowel/urinary/gynaecological symptoms, vomiting, bleeding and systemic signs.","Ask pregnancy possibility, operations, medicines including NSAIDs, alcohol and red flags."]}]}],pages:[3],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-067",year:"2015",rotation:"Psychiatry",topic:"ocd",title:"Take a history of repetitive or intrusive symptoms and suggest a diagnosis",case:"Take a history of repetitive or intrusive symptoms and suggest a diagnosis.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask intrusive unwanted thoughts/images/urges and repetitive acts/mental rituals, time consumed, distress, avoidance and functional effect.","Assess insight, resistance, triggers, reassurance seeking, depression, suicide risk, psychosis and substance use."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["OCD versus generalised anxiety, health anxiety, psychosis, autism-related routines and obsessive-compulsive personality traits."]}]}],pages:[3],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-068",year:"2015",rotation:"Psychiatry",topic:"depression",title:"Take a history of low mood and suggest a diagnosis",case:"Take a history of low mood and suggest a diagnosis.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask low mood/anhedonia, duration, sleep, appetite/weight, energy, concentration, guilt, function and psychotic symptoms.","Screen previous mania/hypomania, substances, medicines, physical causes and stressors.","Directly ask self-harm/suicide thoughts, intent, plans, access to means, previous acts, supports and immediate safety."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Depressive episode, bipolar depression, adjustment/grief, substance/medical illness; exclude psychosis or postpartum emergency where relevant."]}]}],pages:[3],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-069",year:"2015",rotation:"Psychiatry",topic:"autism",title:"Counsel a mother whose child has been diagnosed with autism",case:"Counsel a mother whose child has been diagnosed with autism.",objectives:[{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Use respectful neurodevelopmental language, explain there is no parental blame, agree practical supports and avoid unsupported causal claims.","Early communication/educational and environmental support tailored to strengths/needs, parent support and treatment of coexisting conditions.","No medicine cures core autism; use specialist medication only for specific significant comorbid symptoms when appropriate."]}]}],pages:[3],note:"Original summary names autism only.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-070",year:"2015",rotation:"Psychiatry",topic:"dementia",title:"Counsel a son about his father’s memory illness, symptoms, investigations and management",case:"Counsel a son about his father’s memory illness, symptoms, investigations and management.",objectives:[{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Explain progressive impairment compassionately, distinguish normal ageing, discuss uncertainty and check caregiver strain.","Agree support, medication simplification, safeguarding/driving assessment and advance planning while preserving autonomy.","Specialist subtype-based medication: cholinesterase inhibitors and/or memantine when indicated; discuss adverse effects and limits.","Support caregivers and arrange community/functional assessment."]}]}],pages:[3],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-071",year:"2015",rotation:"Oral health",topic:"periodontal",title:"A patient with diabetes has bleeding gums. Explain the OPG and management",case:"A patient with diabetes has bleeding gums. Explain the OPG and management.",objectives:[{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Explain bidirectional association of diabetes and periodontal health, floss/interdental cleaning and review; extraction decisions need a dental assessment.","Dental hygiene instruction, professional cleaning/periodontal treatment, caries care and improved diabetes management.","Urgent dental care for spreading infection, fever, trismus or facial swelling; do not routinely give antibiotics for simple gingivitis."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Explain bidirectional association of diabetes and periodontal health, floss/interdental cleaning and review; extraction decisions need a dental assessment.","Dental hygiene instruction, professional cleaning/periodontal treatment, caries care and improved diabetes management.","Urgent dental care for spreading infection, fever, trismus or facial swelling; do not routinely give antibiotics for simple gingivitis."]}]}],pages:[3],note:"OPG is not supplied; radiographic findings cannot be reconstructed.",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-072",year:"2015",rotation:"Dermatology",topic:"psoriasis",title:"A patient presents with a scaly skin lesion. Take history, describe the photo and discuss management",case:"A patient presents with a scaly skin lesion. Take history, describe the photo and discuss management.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask chronicity, distribution, itch/pain, triggers, medicines, family history, joint/back stiffness, nail symptoms and psychological impact."]}]},{key:"x",label:"Describe and interpret the supplied image or findings",sections:[{heading:"Describe, then interpret",points:["Describe well-demarcated plaques, scale and distribution; examine scalp/nails and consented flexures; avoid deliberately eliciting bleeding.","Plaque psoriasis versus eczema, tinea and seborrhoeic dermatitis."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Clinical assessment; mycology/biopsy if uncertain; assess joint symptoms and systemic disease burden."]},{heading:"Management",points:["Emollients and site/severity-appropriate topical steroid/vitamin-D analogue therapy with instructions.","Phototherapy or systemic/biologic treatment through dermatology for extensive/refractory disease; rheumatology if arthritis.","Erythroderma/generalised pustular disease or systemic illness needs urgent specialist assessment."]}]}],pages:[3],note:"The source names psoriasis; original photograph is not present.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-073",year:"2012",rotation:"Surgery",topic:"neck",title:"A patient presents with a neck swelling",case:"A patient presents with a neck swelling.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask onset/growth, pain, swallowing/voice/breathing symptoms, thyroid hyper/hypo symptoms, radiation, family thyroid cancer and medicines."]}]}],pages:[4],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-074",year:"2012",rotation:"Surgery",topic:"perforation",title:"An abdominal/chest radiograph is recalled as showing air beneath the diaphragm",case:"An abdominal/chest radiograph is recalled as showing air beneath the diaphragm.",objectives:[{key:"x",label:"Describe and interpret the supplied image or findings",sections:[{heading:"Describe, then interpret",points:["Vitals/perfusion, abdominal distension, gentle tenderness/guarding; avoid repeated rebound testing.","Free subdiaphragmatic air suggests perforated hollow viscus in context, not necessarily a peptic ulcer; recent surgery and other causes exist."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["ABCDE, bloods/lactate, group and save/crossmatch; erect CXR or urgent CT in a stable patient as directed.","Do not delay surgery/resuscitation for imaging in an unstable patient with strong concern."]},{heading:"Management",points:["Urgent surgical review, IV access, resuscitation with reassessment, analgesia, nil by mouth and antibiotics per intra-abdominal sepsis pathway.","Definitive source control/surgery guided by team; address ulcer cause after stabilisation."]}]}],pages:[4],note:"No radiograph supplied; location/clinical context must be checked before attributing all free air to perforated ulcer.",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-075",year:"2012",rotation:"Surgery",topic:"cholecystitis",title:"Examine the abdomen of a patient with suspected gallbladder inflammation",case:"Examine the abdomen of a patient with suspected gallbladder inflammation.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Assess general/sepsis signs, jaundice and gentle abdominal examination; Murphy sign is an inspiratory catch on RUQ palpation, not definitive alone."]}]}],pages:[4],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-076",year:"2012",rotation:"Surgery",topic:"prostate",title:"Perform a model rectal/prostate assessment for suspected prostate disease",case:"Perform a model rectal/prostate assessment for suspected prostate disease.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Abdominal palpation for bladder; indicated DRE on model only with explanation, explicit consent, chaperone and draping.","Usual clinical DRE position is left lateral, not automatically prone as one recall states; describe prostate size, symmetry, consistency, nodules/tenderness."]}]}],pages:[4],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-077",year:"2012",rotation:"Orthopaedics",topic:"knee",title:"Perform a knee examination",case:"Perform a knee examination.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect gait/alignment if safe then swelling/wasting, warmth/tenderness, effusion and comfortable active/passive range.","Assess Lachman/anterior drawer, posterior drawer and collateral stress when tolerated and trained; meniscal tests only if useful, not forced in an acutely painful joint.","Assess distal neurovascular status and adjacent joints; document findings."]}]}],pages:[4],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-078",year:"2012",rotation:"Orthopaedics",topic:"femur",title:"Assess a recalled femoral fracture",case:"Assess a recalled femoral fracture.",objectives:[{key:"x",label:"Describe and interpret the supplied image or findings",sections:[{heading:"Describe, then interpret",points:["Inspect wounds/deformity, palpate gently without repeatedly moving fracture, document pulses/sensation/motor before/after immobilisation.","Femoral shaft fracture and associated trauma; exact pattern/displacement requires the supplied films, which are not included in this recall."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["ABCDE if significant trauma, analgesia and repeated neurovascular assessment; AP/lateral views including joints above/below; age/context-directed additional imaging."]},{heading:"Management",points:["Splint/immobilise and urgent orthopaedic review; assess blood loss and open injury.","Paediatric treatment depends on age, weight, displacement and stability: harness/cast/traction or fixation as selected, not one method for all 10-year-olds.","Discuss infection, bleeding, malunion/nonunion, growth/length differences, stiffness and fixation-specific risks; weight-bearing only per treating team."]}]}],pages:[4],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-079",year:"2012",rotation:"Ophthalmology",topic:"fundus",title:"Perform fundoscopy",case:"Perform fundoscopy.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Consent, acuity first, dim lights, check instrument/red reflex, examine disc/vessels/macula systematically within competence.","Do not dilate an undifferentiated painful red eye without assessment; supplied photos/videos are absent in many recalls, so do not invent findings."]}]}],pages:[4],note:"Alternative recall from a shared table cell; this is not evidence of an additional distinct official exam station.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-080",year:"2012",rotation:"Ophthalmology",topic:"eom",title:"Assess eye movements for a possible nerve palsy",case:"Assess eye movements for a possible nerve palsy.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect alignment/ptosis, assess acuity and pupils; ask the patient to follow a target in an H pattern without moving the head.","Ask when diplopia occurs, observe restriction and nystagmus; test convergence if appropriate. Do not claim a normal fundus rules out serious disease."]}]}],pages:[4],note:"Alternative recall from a shared table cell; this is not evidence of an additional distinct official exam station.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-081",year:"2012",rotation:"Anaesthesia",topic:"preop",title:"Perform a preoperative assessment, including airway assessment",case:"Perform a preoperative assessment, including airway assessment.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Confirm procedure/urgency; ask comorbid cardiac/respiratory disease, exercise tolerance, previous anaesthesia/difficult airway, family malignant hyperthermia, allergies, medicines/anticoagulants, OSA and fasting."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["General habitus/BMI, teeth/dentures, mouth opening/Mallampati with correct position, neck/jaw movement and relevant measurements.","Examine heart/lungs and assess aspiration/OSA risks; avoid unsafe neck movement after trauma."]}]}],pages:[4],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-082",year:"2013",rotation:"Surgery",topic:"pad",title:"A 40-year-old man presents with calf pain",case:"A 40-year-old man presents with calf pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Characterise exertional reproducible calf pain and relief with rest, distance, rest/night pain, ulcers and tissue loss.","Ask vascular risk, smoking, diabetes, cardiac/cerebrovascular disease, medicines and neurological/musculoskeletal alternatives."]}]}],pages:[4],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-083",year:"2013",rotation:"Surgery",topic:"sbo",title:"A 20-year-old woman has severe colicky abdominal pain for two days and had an appendicectomy at age five",case:"A 20-year-old woman has severe colicky abdominal pain for two days and had an appendicectomy at age five.",objectives:[{key:"x",label:"Describe and interpret the supplied image or findings",sections:[{heading:"Describe, then interpret",points:["Assess hydration/perfusion, distension, scars, gentle tenderness/guarding and hernia orifices when consented.","Adhesional SBO after surgery versus hernia, tumour, ileus and other obstruction. Adhesions are fibrous bands, not simply constipation."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Adhesional SBO after surgery versus hernia, tumour, ileus and other o
