 pulses, capillary refill, motor/sensation and pain on passive stretch; normal pulses do not exclude compartment syndrome."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["ABCDE for major trauma, repeated distal neurovascular and compartment assessment; orthogonal X-rays including adjacent joints; CT if complex intra-articular planning."]},{heading:"Management",points:["Analgesia, splint, elevate appropriately and urgent orthopaedics; open fracture: sterile cover, antibiotics/tetanus and operative pathway.","Closed reduction/fixation or cast depends on stability/alignment/joint involvement and soft tissues.","Discuss immediate neurovascular/compartment injury and later infection, nonunion/malunion, stiffness and post-traumatic arthritis; complication frequency varies by pattern."]}]}],pages:[5],note:"Fracture site and X-ray are not specified.",adapted:true,set:"2012–2015 summary tables",images:[],taskType:"interpretation",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-102",diagnoses:["Fracture (site not specified)"],differentials:[],evidence:[{page:5,quote:"x-ray of fracture"}],mode:"document-context"},aiNotes:{title:"Fracture (site not specified)",safety:"Suspected compartment syndrome needs immediate surgical assessment; it is not ruled out by palpable pulses.",refs:[]}},{id:"jcs-103",year:"2015",rotation:"Ophthalmology",topic:"eom",title:"Perform an eye-movement examination",case:"Perform an eye-movement examination.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect alignment/ptosis, assess acuity and pupils; ask the patient to follow a target in an H pattern without moving the head.","Ask when diplopia occurs, observe restriction and nystagmus; test convergence if appropriate. Do not claim a normal fundus rules out serious disease."]}]},{key:"x",label:"Describe and interpret the supplied image or findings",sections:[{heading:"Describe the supplied material",points:["Inspect alignment/ptosis, assess acuity and pupils; ask the patient to follow a target in an H pattern without moving the head.","Ask when diplopia occurs, observe restriction and nystagmus; test convergence if appropriate. Do not claim a normal fundus rules out serious disease.","Correlate the image findings with the history, examination and relevant test results."]},{heading:"Interpretation",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["LR6 SO4, all other extraocular muscles III. In adduction, superior oblique depresses and inferior oblique elevates; in abduction, superior/inferior rectus elevate/depress.","Explain that double vision has several causes and some require urgent imaging.","Urgent referral for painful/pupil-involving third-nerve palsy, acute neurological signs or vision loss.","Treat cause; temporary occlusion/prisms may relieve diplopia under eye-team advice.","Advise not to drive with uncontrolled diplopia; apply local licensing rules."]}]}],pages:[5],note:"Recalled diagram absent.",adapted:true,set:"2012–2015 summary tables",images:[],taskType:"examination",caseReviewed:true,recallContext:"Assess eye movements and explain the affected muscle and causes of a sixth-nerve palsy.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-103",diagnoses:["Sixth nerve palsy"],differentials:[],evidence:[{page:5,quote:"6th nerve \npalsy"}],mode:"document-context"},aiNotes:{title:"Sixth nerve palsy",safety:"",refs:[]}},{id:"jcs-104",year:"2015",rotation:"Anaesthesia",topic:"airway",title:"A deeply unresponsive manikin requires airway support and bag-mask ventilation",case:"A deeply unresponsive manikin requires airway support and bag-mask ventilation.",objectives:[{key:"p",label:"Demonstrate or explain the procedure safely",sections:[{heading:"Safety and steps",points:["Model-only, trained practice: position airway appropriately (jaw thrust/manual in-line support for suspected cervical injury), remove visible obstruction/suction, oxygen and correct mask size.","Use effective seal and jaw lift (two-person BVM preferred when possible), ventilate to visible chest rise without excessive rate/volume, reassess chest rise/oxygenation/capnography if available.","OPA for deeply unresponsive patient without gag; NPA sizing/contraindications per training (avoid suspected skull-base/major facial injury). Use a suitable supraglottic device/LMA when indicated and escalate failed oxygenation.","Intubation needs trained staff, equipment checks, backup plan, monitoring and waveform capnography confirmation; device sizes depend on device and patient, not one universal size."]},{heading:"Checks and samples",points:["Call emergency/resuscitation team, assess ABCDE, attach monitoring/defibrillator; glucose and ECG as appropriate.","If unresponsive and not breathing normally, start CPR/use defibrillator per current training—ventilation alone is not sufficient."]}]}],pages:[5],note:"",adapted:false,set:"2012–2015 summary tables",images:[],taskType:"procedure",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-104",diagnoses:[],differentials:[],evidence:[],mode:"neutral"},aiNotes:{title:"Airway assessment and support",safety:"Unresponsive and not breathing normally: activate emergency response, CPR and defibrillator per training.",refs:["abcde"]}},{id:"jcs-105",year:"2016",rotation:"Medicine",topic:"bronchiectasis",title:"A man around 50 requires a respiratory examination",case:"A man around 50 requires a respiratory examination.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect work of breathing and sputum, clubbing, pulse and SpO2; examine trachea and expansion.","Compare percussion, auscultation and vocal resonance anteriorly/posteriorly including bases; describe coarse crackles/wheeze without inventing signs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Observations/SpO2, sputum culture and chest radiograph initially.","High-resolution CT confirms bronchiectasis; spirometry and cause-directed immune/CF testing as appropriate."]},{heading:"Management",points:["Assess exacerbation severity and sepsis; culture-guided antibiotics according to previous organisms and local policy.","Airway clearance with physiotherapy, vaccinations, exercise and smoking cessation.","Specialist management for frequent exacerbations or chronic colonisation; significant haemoptysis is urgent."]}]}],pages:[6],note:"Variants include bilateral changes or right basal changes. Do not assume a single cause from clubbing alone.",adapted:false,set:"2016 · cohort 2011",images:[],taskType:"examination",caseReviewed:true,recallContext:"A man around 50 requires posterior respiratory and relevant peripheral examination. Recalled signs include clubbing, reduced expansion/air entry, crackles and sometimes wheeze.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Examination — group variant 1",items:["Clubbing, bilaterally reduced chest expansion and air entry, scattered crepitations and wheeze."]},{heading athing immediately."]}]},{key:"p",label:"Demonstrate or explain the procedure safely",sections:[{heading:"Safety and steps",points:["Model-only, trained practice: position airway appropriately (jaw thrust/manual in-line support for suspected cervical injury), remove visible obstruction/suction, oxygen and correct mask size.","Use effective seal and jaw lift (two-person BVM preferred when possible), ventilate to visible chest rise without excessive rate/volume, reassess chest rise/oxygenation/capnography if available.","OPA for deeply unresponsive patient without gag; NPA sizing/contraindications per training (avoid suspected skull-base/major facial injury). Use a suitable supraglottic device/LMA when indicated and escalate failed oxygenation.","Intubation needs trained staff, equipment checks, backup plan, monitoring and waveform capnography confirmation; device sizes depend on device and patient, not one universal size."]},{heading:"Checks and samples",points:["Call emergency/resuscitation team, assess ABCDE, attach monitoring/defibrillator; glucose and ECG as appropriate.","If unresponsive and not breathing normally, start CPR/use defibrillator per current training—ventilation alone is not sufficient."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Equipment: oxygen, suction, BVM/masks, airway adjuncts, appropriate laryngoscope/tubes or supraglottic device, cuff syringe, fixation, capnography and rescue equipment.","Explain actions to team and relatives where possible; debrief after stabilisation.","Model-only, trained practice: position airway appropriately (jaw thrust/manual in-line support for suspected cervical injury), remove visible obstruction/suction, oxygen and correct mask size.","Use effective seal and jaw lift (two-person BVM preferred when possible), ventilate to visible chest rise without excessive rate/volume, reassess chest rise/oxygenation/capnography if available.","OPA for d on and need for formal fields; do not infer the field solely from symptom wording."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Acuity, pupils, confrontation fields, fundus; formal perimetry, pituitary MRI and endocrine hormone assessment through specialists."]},{heading:"Management",points:["Urgent eye/endocrine/neurosurgical review for field defect; sudden severe headache/vision loss/ophthalmoplegia suggests pituitary apoplexy and is an emergency.","Management (medicine/surgery/surveillance) depends on tumour type and compression; do not presume all pituitary lesions need the same operation."]}]}],pages:[14],note:"Pituitary lesion/bitemporal field loss recalled; original field picture absent.",adapted:false,set:"2017 · cohort 2012 · group B",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A 45-year-old woman has headache and blurred vision. Assess visual fields, discuss alternatives and management.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Visual-field result",items:["Bitemporal hemianopia is shown in the supplied field image."]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-136",diagnoses:["Pituitary tumour"],differentials:[],evidence:[{page:14,quote:"pituitary tumor"}],mode:"document-context"},aiNotes:{title:"Pituitary tumour",safety:"",refs:[]}},{id:"jcs-137",year:"2017",rotation:"Medicine",topic:"myopathy",title:"A young man has limb weakness and difficulty walking",case:"A young man has limb weakness and difficulty walking.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Clarify the presenting concern, onset, duration, course, severity and effect on daily function.","Ask relevant associated symptoms, previous episodes, medical/surgical history, medicines, allergies and exposures.","Explore the patient's concerns and expectations; obtain collateral history with permission when appropriate."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Introduce yourself, obtain consent, assess pain and record relevant observations; use an age-appropriate, focused examination.","Describe the examination findings and relevant negatives."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Muscular dystrophy; Cerebellar ataxia. Discuss the history, examination and tests that distinguish these possibilities."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Assessment and investigations",points:["Request the relevant examination findings and investigation results.","Select and justify tests using the history and examination."]},{heading:"Care pending assessment",points:["Assess immediate stability and treat urgent symptoms while seeking appropriate senior help for concerning findings.","Agree supportive care, further assessment and review based on the findings.","Explain uncertainty, arrange follow-up and give clear advice about deterioration or new red flags."]}]}],pages:[15],note:"",adapted:false,set:"2017 · cohort 2012 · group B",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-137",diagnoses:[],differentials:["Muscular dystrophy","Cerebellar ataxia"],evidence:[{page:15,quote:"muscular \ndystrophy and the other was cerebellar ataxia"}],mode:"neutral"},aiNotes:{title:"Assessment outline",safety:"",refs:[]}},{id:"jcs-138",year:"2017",rotation:"Medicine",topic:"bronchiectasis",title:"A middle-aged man has breathlessness and cough",case:"A middle-aged man has breathlessness and cough.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Characterise chronic cough, daily sputum volume/purulence, recurrent infection, haemoptysis, breathlessness and exacerbations.","Ask childhood disease/CF, aspiration, immune/connective-tissue disease, smoking, TB exposure and previous cultures/treatment."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect work of breathing and sputum, clubbing, pulse and SpO2; examine trachea and expansion.","Compare percussion, auscultation and vocal resonance anteriorly/posteriorly including bases; describe coarse crackles/wheeze without inventing signs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Observations/SpO2, sputum culture and chest radiograph initially.","High-resolution CT confirms bronchiectasis; spirometry and cause-directed immune/CF testing as appropriate."]},{heading:"Management",points:["Assess exacerbation severity and sepsis; culture-guided antibiotics according to previous organisms and local policy.","Airway clearance with physiotherapy, vaccinations, exercise and smoking cessation.","Specialist management for frequent exacerbations or chronic colonisation; significant haemoptysis is urgent."]}]}],pages:[15],note:"",adapted:false,set:"2017 · cohort 2012 · group B",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrou :"An 11-month-old has diarrhoea and poor weight gain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask chronic diarrhoea/steatorrhoea, distension, pain, weight/growth, gluten exposure, anaemia, family/autoimmune history and diet."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Growth chart, FBC/ferritin and nutritional assessment; total IgA and tTG-IgA while eating gluten, with alternative tests if IgA deficient.","Paediatric/gastroenterology confirmation pathway (selected children may meet no-biopsy criteria; others need biopsy)."]},{heading:"Management",points:["Do not start a gluten-free diet before appropriate diagnostic testing unless advised by specialist.","After confirmation: lifelong gluten-free diet with dietitian, correct deficiencies, monitor growth/serology and family risk testing as appropriate."]}]}],pages:[16],note:"",adapted:false,set:"2017 · cohort 2012 · group B",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-142",diagnoses:["Coeliac disease"],differentials:[],evidence:[{page:16,quote:"celiac"}],mode:"document-context"},aiNotes:{title:"Coeliac disease",safety:"",refs:[]}},{id:"jcs-143",year:"2017",rotation:"Paediatrics",topic:"cp",title:"A child presents with abnormal movements",case:"A child presents with abnormal movements.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Take antenatal/perinatal history, prematurity/injury, developmental trajectory, asymmetry, seizures, fee bout steroids."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Correct topical steroid use is generally safe; excessive strong/prolonged use can cause atrophy, striae, pigment change and rarely systemic effects, particularly in children.","Keep nails short, manage itch/sleep; do not prescribe food exclusion diets without evidence and nutritional support.","Regular generous emollient, soap substitutes, irritant avoidance and comfortable clothing.","Topical corticosteroid of appropriate potency for age/site/severity during flares with clear application/duration instructions; review rather than avoid needed treatment because of fear.","Escalate difficult disease; eczema herpeticum (painful monomorphic vesicles/erosions ± fever/eye involvement) needs urgent care."]}]}],pages:[18],note:"",adapted:false,set:"2017 · cohort 2012 · group B",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A child has itching and redness; discuss care with the mother.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-152",diagnoses:["Atopic dermatitis"],differentials:[],evidence:[{page:18,quote:"atopic dermatitis"}],mode:"document-context"},aiNotes:{title:"Atopic dermatitis",safety:"",refs:[]}},{id:"jcs-153",year:"Unstated",rotation:"FAMCO",topic:"migraine",title:"A patient presents with headache",case:"A patient presents with headache.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Characterise onset, time course, location, quality, severity, duration, aura, nausea, light/sound sensitivity and activity effect.","Ask thunderclap onset, fever/meningism, new neurological deficit, pregnancy/postpartum, cancer/immunosuppression, trauma, positional/exertional change and medication overuse."]}]},{key:"d",label:"Discuss eadache/vision change, chest pain, dyspnoea, neurological symptoms and renal/endocrine secondary-cause clues."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Repeat standardised clinic BP with correct cuff; arrange ABPM/HBPM according to pathway.","Assess urine ACR/haematuria, renal function/electrolytes, glucose/lipids, ECG and target-organ effects as appropriate."]},{heading:"Management",points:["Acute symptoms/signs of end-organ injury with markedly elevated BP: emergency assessment.","Confirm diagnosis and cardiovascular risk before long-term medication decisions; lifestyle support and monitoring if isolated white-coat pattern.","Confirmed hypertension: guideline-based medicines with comorbidity, pregnancy and monitoring considered."]}]}],pages:[19],note:"",adapted:false,set:"Undated · Maryam recall set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A 40-year-old man attends hypertension follow-up. Ask about medication and home/ambulatory readings.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-156",diagnoses:["White-coat hypertension"],differentials:[],evidence:[{page:19,quote:"white coat HTN"}],mode:"document-context"},aiNotes:{title:"White-coat hypertension",safety:"",refs:[]}},{id:"jcs-157",year:"Unstated",rotation:"Psychiatry",topic:"adhd",title:"A father brings his eight-year-old with concerns about attention and activity",case:"A father brings his eight-year-old with concerns about attention and activity.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Assess inattention and hyperactivity/impulsivity with examples, onset before age 12, persistence and impairment in at least two settings.","Obtain parent/school reports, developmental/hearing/vision history, sleep, learning, autism, anxiety, trauma and family history."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Specialist developmental/ADHD assessment with structured rating information across settings; no single blood test or IQ test confirms ADHD.","Before medication, assess height/weight, pulse/BP, cardiac/family history and other baseline requirements."]},{heading:"Management",points:["Parent/carer training and school/environmental adjustments, predictable routines and sleep support.","Medication for persistent significant impairment through specialists: stimulants such as methylphenidate and selected non-stimulants such as atomoxetine/guanfacine according to age/local pathway.","Monitor response, appetite/growth, sleep, pulse/BP and mood; not every family must begin with medication."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Stimulants: reduced appetite, insomnia, abdominal/headache and pulse/BP effects. Atomoxetine: GI/mood effects; guanfacine: sedation and hypotension.","Explore reluctance to medicate and offer shared decisions; sleep hygiene includes routine, limiting late screens/caffeine and assessing other sleep problems.","Parent/carer training and school/environmental adjustments, predictable routines and sleep support.","Medication for persistent significant impairment through specialists: stimulants such as methylphenidate and selected non-stimulants such as atomoxetine/guanfacine according to age/local pathway.","Monitor response, appetite/growth, sleep, pulse/BP and mood; not every family must begin with medication."]}]}],pages:[20],note:"",adapted:false,set:"Undated · Maryam recall set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"An eight-year-old boy is easily distracted and hyperactive; his father attends.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-157",diagnoses:["ADHD"],differentials:[],evidence:[{page:20,quote:"ADHD"}],mode:"document-context"},aiNotes:{title:"ADHD",safety:"",refs:[]}},{id:"jcs-158",year:"Unstated",rotation:"Psychiatry",topic:"ocd",title:"A 40-year-old man reports repeated hand washing",case:"A 40-year-old man reports repeated hand washing.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask intrusive unwanted thoughts/images/urges and repetitive acts/mental rituals, time consumed, distress, avoidance and functional effect.","Assess insight, resistance, triggers, reassurance seeking, depression, suicide risk, psychosis and substance use."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["MSE and functional/risk assessment; targeted physical investigations only if indicated, not a test to prove OCD."]},{heading:"Management",points:["CBT with exposure and response prevention; SSRIs depending on severity, preference and specialist assessment.","Explain that response may take time and OCD may need a different dose/duration strategy under supervision; review adherence and side effects.","Severe impairment/risk or nonresponse needs specialist input."]}]}],pages:[20],note:"",adapted:false,set:"Undated · Maryam recall set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-158",diagnoses:["OCD"],differentials:[],evidence:[{page:20,quote:"OCD"}],mode:"document-context"},aiNotes:{title:"OCD",safety:"",refs:[]}},{id:"jcs-159",year:"Unstated",rotation:"Psychiatry",topic:"postpartum",title:"A 25-year-old woman presents with fatigue after childbirth",case:"A 25-year-old woman presents with fatigue after childbirth.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask timing after delivery, mood/anhedonia, sleep apart from infant care, functioning, bonding, support, trauma and previous mental illness.","Ask directly about suicide, intrusive thoughts versus intent to harm the baby, psychosis, mania and safeguarding."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["MSE and immediate maternal/infant safety assessment; targeted physical tests and perinatal mental-health review."]},{heading:"Management",points:["Psychosis, mania, severe risk or inability to care safely: emergency perinatal/psychiatric assessment.","Offer psychological and practical/family support; consider antidepressants based on severity, previous response and breastfeeding/pregnancy medication guidance.","Arrange early follow-up and an explicit support/safety plan."]}]}],pages:[20],note:"",adapted:false,set:"Undated · Maryam recall set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-159",diagnoses:["Postpartum depression"],differentials:[],evidence:[{page:20,quote:"post-partum depression"}],mode:"document-context"},aiNotes:{title:"Postpartum depression",safety:"",refs:[]}},{id:"jcs-160",year:"Unstated",rotation:"Psychiatry",topic:"dementia",title:"A son is concerned about his mother’s forgetfulness",case:"A son is concerned about his mother’s forgetfulness.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Obtain patient and collateral accounts with permission: gradual versus acute/fluctuating onset, memory/language/executive changes and daily function.","Ask mood, psychosis, medicines, alcohol, neurological events, sensory problems, driving, finances, medication safety and caregiver needs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Physical/neurological exam, validated language/culture-appropriate cognitive assessment, sensory review and collateral.","Reversible-cause blood tests and specialist-selected structural imaging; refer to memory/neurology service as appropriate."]},{heading:"Management",points:["Agree support, medication simplification, safeguarding/driving assessment and advance planning while preserving autonomy.","Specialist subtype-based medication: cholinesterase inhibitors and/or memantine when indicated; discuss adverse effects and limits.","Support caregivers and arrange community/functional assessment."]}]}],pages:[20],note:"The source suggests vascular dementia; verify pattern and course rather than inferring it solely from stroke.",adapted:false,set:"Undated · Maryam recall set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A 25-year-old son reports his mother’s forgetfulness for one year; stroke history was recalled.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Collateral history",items:["Forgetfulness has been present for one year.","A history of stroke is recorded."]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-160",diagnoses:["Vascular dementia"],differentials:[],evidence:[{page:20,quote:"most likely vascular \ndementia"}],mode:"document-context",tentative:true},aiNotes:{title:"Vascular dementia",safety:"",refs:[]}},{id:"jcs-161",year:"Unstated",rotation:"Medicine",topic:"bronchiectasis",title:"A 57-year-old woman has cough and shortness of breath",case:"A 57-year-old woman has cough and shortness of breath.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Clarify cough and breathlessness: onset, duration, sputum, wheeze, blood, fever, exertional limitation and previous episodes.","Ask smoking and other exposures, previous respiratory illness, medicines and the impact on sleep or activity; use child-specific feeding and growth questions where appropriate."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Assess respiratory effort and observations, including oxygen saturation when available; compare inspection, expansion, percussion and auscultation systematically.","For a radiograph check identity, projection and quality, then describe the airways, lungs, pleura, heart and visible bones systematically."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Bronchiectasis; Asthma; COPD. Discuss the history, examination and tests that distinguish these possibilities."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Assessment and investigations",points:["Choose tests to answer questions raised by the history and examination, such as imaging, lung function or microbiology where appropriate."]},{heading:"Care pending assessment",points:["Escalate respiratory distress, hypoxaemia or clinical instability; provide immediate support according to assessed need.","Plan subsequent treatment and follow-up using the clinical assessment and investigation results."]}]}],pages:[21],note:"",adapted:false,set:"Undated · Maryam recall set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-161",diagnoses:[],differentials:["Bronchiectasis","Asthma","COPD"],evidence:[{page:21,quote:"DDx  (bronchiectasis, asthma, COPD"}],mode:"neutral"},aiNotes:{title:"Respiratory assessment",safety:"",refs:[]}},{id:"jcs-162",year:"Unstated",rotation:"Medicine",topic:"prosthetic",title:"A 35-year-old man presents with palpitations and breathlessness",case:"A 35-year-old man presents with palpitations and breathlessness.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask operation date, valve position/type, indication, dyspnoea, fever, bleeding, embolic symptoms and adherence.","Review warfarin/other medicines, INR monitoring, interactions, pregnancy plans and dental care."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect sternotomy/thoracotomy scars, assess pulse, BP/JVP, locate and describe valve sounds and murmurs, assess heart failure/peripheral embolic signs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points: ither each pregnancy; offer genetic/reproductive counselling and partner testing.","Explain variable course, multidisciplinary care and non-directive inheritance/testing options; use a three-generation pedigree for genetic objective."]}]}],pages:[22],note:"",adapted:false,set:"Undated · Maryam recall set",images:[],taskType:"counselling",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-165",diagnoses:["Cystic fibrosis"],differentials:[],evidence:[{page:22,quote:"CYSTIC FIBROSIS"}],mode:"document-context"},aiNotes:{title:"Cystic fibrosis",safety:"",refs:[]}},{id:"jcs-166",year:"Unstated",rotation:"Paediatrics",topic:"psgn",title:"A five-year-old boy presents with dark urine for three days",case:"A five-year-old boy presents with dark urine for three days.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask urine colour, amount, pain, recent illness, swelling, medicines and systemic symptoms; assess blood pressure, hydration and appropriate urine/renal tests before naming a cause.","Clarify the presenting concern, onset, duration, course, severity and effect on daily function.","Ask relevant associated symptoms, previous episodes, medical/surgical history, medicines, allergies and exposures.","Explore the patient's concerns and expectations; obtain collateral history with permission when appropriate."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Identify the key discriminating features in the history and examination, and select investigations to guide clinical reasoning."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Assessment and investigations",points:["Request the relevant examination findings and investigation results.","Select and justify tests ys including adjacent joints; CT if complex intra-articular planning."]},{heading:"Management",points:["Analgesia, splint, elevate appropriately and urgent orthopaedics; open fracture: sterile cover, antibiotics/tetanus and operative pathway.","Closed reduction/fixation or cast depends on stability/alignment/joint involvement and soft tissues.","Discuss immediate neurovascular/compartment injury and later infection, nonunion/malunion, stiffness and post-traumatic arthritis; complication frequency varies by pattern."]}]},{key:"x",label:"Describe and interpret the supplied image or findings",sections:[{heading:"Describe the supplied material",points:["Document wounds, deformity, pulses, capillary refill, motor/sensation and pain on passive stretch; normal pulses do not exclude compartment syndrome.","Correlate the image findings with the history, examination and relevant test results."]},{heading:"Interpretation",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]}],pages:[23],note:"Original X-ray absent. The recall labels compartment syndrome “most common”; frequency depends on fracture pattern, although it is a critical complication.",adapted:false,set:"Undated · Maryam recall set",images:[],taskType:"interpretation",caseReviewed:true,recallContext:"A patient has a tibia/fibula fracture involving the joint after an accident. Read the film and discuss care and complications.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Radiograph",items:["An intra-articular fracture of the tibia and fibula is recorded."]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-169",diagnoses:["Intra-articular tibia/fibula fracture"],differentials:[],evidence:[{page:23,quote:"fracture of tibia and fibula"}],mode:"document-context"},aiNotes:{title:"Intra-articular tibia/fibula fracture",safety:"Suspected compartment syndrome needs immediate surgical assessment; it is not ruled out by palpable pulses.",refs:[]}},{id:"jcs-170",year:"Unstated",rotation:"Orthopaedics",topic:"cts",title:"A 27-year-old woman presents with hand pain",case:"A 27-year-old woman presents with hand pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask nocturnal thumb/index/middle symptoms, shaking relief, weakness/dropping objects, dominant hand/job, pregnancy, diabetes/thyroid and neck symptoms."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect thenar bulk, test thumb abduction/opposition and median sensation; compare ulnar/radial functions and assess cervical source.","Phalen/Tinel may support but are not definitive; avoid repeated painful provocation. Thenar eminence sensation may be spared in tunnel compression."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Clinical examination; nerve conduction testing when needed for uncertainty/severity or intervention planning; targeted cause assessment."]},{heading:"Management",points:["Neutral night splint and activity modification; selected steroid injection; persistent/severe weakness/wasting needs hand-surgery review for decompression.","Treat contributing conditions and counsel about recovery and risks; no single provocative test establishes severity."]}]}],pages:[23],note:"",adapted:false,set:"Undated · Maryam recall set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A 27-year-old woman presents with hand pain. Ask about dominant hand and occupation and assess sensory/motor function.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"s s not sufficient."]}]}],pages:[23],note:"",adapted:false,set:"Undated · Maryam recall set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A 60-year-old man with ischaemic heart disease has breathlessness and chest pain, then collapses during history.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Medical history",items:["Known ischaemic heart disease."]},{heading:"During the assessment",items:["The patient collapses during history-taking."]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-171",diagnoses:[],differentials:[],evidence:[],mode:"neutral"},aiNotes:{title:"Airway assessment and support",safety:"Unresponsive and not breathing normally: activate emergency response, CPR and defibrillator per training.",refs:["abcde"]}},{id:"jcs-172",year:"Unstated",rotation:"Ophthalmology",topic:"eom",title:"A 26-year-old woman presents with double vision",case:"A 26-year-old woman presents with double vision.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Distinguish monocular from binocular diplopia; ask onset, direction/gaze dependence, pain, ptosis, pupil change, headache and neurological symptoms.","Assess vascular risks, trauma, thyroid disease and fluctuating fatigability."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect alignment/ptosis, assess acuity and pupils; ask the patient to follow a target in an H pattern without moving the head.","Ask when diplopia occurs, observe restriction and nystagmus; test convergence if appropriate. Do not claim a normal fundus rules out serious disease."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Sixth nerve palsy; Stroke. Discuss the history, examination and tests that distinguish these possibilities."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Visual acuity, pupils/RAPD, fields and full neurological assessment; urgent neuroimaging/vascular imaging when indicated.","Specialist eye assessment; glucose/BP and cause-directed tests."]},{heading:"Management",points:["Urgent referral for painful/pupil-involving third-nerve palsy, acute neurological signs or vision loss.","Treat cause; temporary occlusion/prisms may relieve diplopia under eye-team advice.","Advise not to drive with uncontrolled diplopia; apply local licensing rules."]}]}],pages:[23],note:"The recall requests fundoscopy as well as evaluating diplopia; original image absent.",adapted:false,set:"Undated · Maryam recall set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A 26-year-old woman has diplopia. Take history, examine and discuss alternatives, care and driving.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Patient’s question",items:["Can I drive?"]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-172",diagnoses:[],differentials:["Sixth nerve palsy","Stroke"],evidence:[{page:23,quote:"DDx (6th nerve palsy, stroke"}],mode:"neutral"},aiNotes:{title:"Eye-movement assessment",safety:"",refs:[]}},{id:"jcs-173",year:"Unstated",rotation:"Surgery",topic:"graves",title:"A 66-year-old man presents with neck swelling",case:"A 66-year-old man presents with neck swelling.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask weight loss, heat intolerance, palpitations, bowel change, tremor, menstrual change and neck compression.","Assess eye pain/diplopia/vision, smoking, pregnancy, medicines, cardiac symptoms and family autoimmune disease."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Warm moist hands, tremor, tachycardia/AF, proximal ber.","Treatment may include an antipsychotic and/or mood stabiliser selected for phase, prior response and reproductive risk.","Bipolar depression requires specialist phase-specific treatment; avoid routine antidepressant monotherapy. Valproate carries major reproductive restrictions."]}]}],pages:[28],note:"Only a bipolar topic and follow-up questions are recorded; the full symptoms/episode are missing.",adapted:true,set:"2019 · day 1",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"Added practice prompt: a patient taking fluoxetine develops reduced need for sleep, increased activity and elevated mood. Discuss assessment, treatment and how the presentation differs from schizophrenia.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Medication history",items:["The patient is taking fluoxetine."]},{heading:"Patient’s question",items:["Why don’t I have schizophrenia?"]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-178",diagnoses:["Bipolar symptoms"],differentials:[],evidence:[{page:28,quote:"Bipolar symptoms"}],mode:"document-context",tentative:true},aiNotes:{title:"Bipolar symptoms",safety:"",refs:[]}},{id:"jcs-179",year:"2019",rotation:"Psychiatry",topic:"mse",title:"Perform a mental state examination",case:"Perform a mental state examination.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Quote relevant patient language; separate subjective symptoms from observed signs and avoid stigmatising descriptions."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Discuss medication side effects only after identifying the drug: metabolic, neurological, cardiac and other risks differ by medicine.","Act on immediate safety needs, acute medical causes or severe agitation; formulate a person-centred care and follow-up plan."]}]}],pages:[29],note:"No case, diagnosis or medicine is specified; use the framework and request the actual drug before giving drug-specific advice.",adapted:true,set:"2019 · day 1",images:[],taskType:"examination",caseReviewed:true,recallContext:"Perform a mental state examination and discuss medication adverse effects.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-179",diagnoses:[],differentials:[],evidence:[],mode:"neutral"},aiNotes:{title:"Mental state examination",safety:"",refs:[]}},{id:"jcs-180",year:"2019",rotation:"Psychiatry",topic:"adhd",title:"A parent is concerned about their child’s attention and activity",case:"A parent is concerned about their child’s attention and activity.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Assess inattention and hyperactivity/impulsivity with examples, onset before age 12, persistence and impairment in at least two settings.","Obtain parent/school reports, developmental/hearing/vision history, sleep, learning, autism, anxiety, trauma and family history."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Specialist developmental/ADHD assessment with structured rating information across settings; no single blood test or IQ test confirms ADHD.","Before medication, assess height/weight, pulse/BP, cardiac/family history and other baseline requirements."]},{heading:"Management",points:["Parent/carer training and school/environmental adjustments, predictable routines and sleep support.","Medication for persistent significant impairment through specialists: stimulants such ork of breathing and sputum, clubbing, pulse and SpO2; examine trachea and expansion.","Compare percussion, auscultation and vocal resonance anteriorly/posteriorly including bases; describe coarse crackles/wheeze without inventing signs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Observations/SpO2, sputum culture and chest radiograph initially.","High-resolution CT confirms bronchiectasis; spirometry and cause-directed immune/CF testing as appropriate."]},{heading:"Management",points:["Assess exacerbation severity and sepsis; culture-guided antibiotics according to previous organisms and local policy.","Airway clearance with physiotherapy, vaccinations, exercise and smoking cessation.","Specialist management for frequent exacerbations or chronic colonisation; significant haemoptysis is urgent."]}]}],pages:[31],note:"",adapted:false,set:"2019 · day 1",images:[],taskType:"examination",caseReviewed:true,recallContext:"Perform respiratory examination in a smoker with clubbing and crackles.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"History",items:["The patient smokes."]},{heading:"Examination",items:["Clubbing and crepitations."]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-181",diagnoses:["Bronchiectasis"],differentials:[],evidence:[{page:31,quote:"Bronchiectasis"}],mode:"document-context"},aiNotes:{title:"Bronchiectasis",safety:"",refs:[]}},{id:"jcs-182",year:"2019",rotation:"Medicine",topic:"prosthetic",title:"Perform a cardiovascular examination",case:"Perform a cardiovascular examination.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Ins  on valve model, position and thromboembolic risk; check the patient-specific anticoagulation plan, not one universal aortic/mitral range.","Periprocedural interruption/bridging requires specialist planning; never advise stopping anticoagulation independently."]}]}],pages:[32],note:"",adapted:false,set:"2019 · day 1",images:[],taskType:"examination",caseReviewed:true,recallContext:"Perform cardiac assessment in a person with previous valve surgery and a click. Discuss anticoagulation, valve location and dental planning.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Cardiac history and examination",items:["A prosthetic valve is recorded.","A metallic click and median sternotomy scar are recorded."]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-182",diagnoses:["Prosthetic valve"],differentials:[],evidence:[{page:32,quote:"Prosthetic valves"}],mode:"document-context"},aiNotes:{title:"Prosthetic valve",safety:"New dyspnoea, fever, embolic symptoms or a change/absence of usual mechanical sounds needs urgent review.",refs:["endocarditis"]}},{id:"jcs-183",year:"2019",rotation:"Medicine",topic:"hepa",title:"A woman presents with jaundice",case:"A woman presents with jaundice.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask jaundice, dark urine/pale stool, itching, RUQ pain, nausea, fever, exposure timing, travel/food/water/contacts, medicines/alcohol and other hepatitis risks."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Liver profile, bilirubin, INR, glucose and renal function; anti-HAV IgM supports recent infection, IgG indicates past infection/vaccination." stigation findings."]}]}],pages:[54],note:"",adapted:false,set:"2021 · 23–25 January",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"An athlete has lower back pain after lifting something heavy at the gym.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"History",items:["Pain began after lifting a heavy object at the gym."]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-200",diagnoses:[],differentials:[],evidence:[],mode:"neutral"},aiNotes:{title:"Musculoskeletal assessment",safety:"",refs:[]}},{id:"jcs-201",year:"2021",rotation:"Orthopaedics",topic:"tennis",title:"A 28-year-old man has right elbow pain for approximately two years",case:"A 28-year-old man has right elbow pain for approximately two years.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask lateral elbow pain, repetitive grip/wrist activity, dominant hand/work, trauma, neck/neurological symptoms and functional impact."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect elbow, palpate lateral epicondyle/common extensor origin, assess range and pain with resisted wrist/finger extension and grip; check neck and distal neurology."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Usually clinical; imaging only for atypical, traumatic or persistent uncertain features."]},{heading:"Management",points:["Relative activity modification, graded tendon-loading physiotherapy, suitable analgesia and ergonomic support.","Discuss uncertain long-term benefit/recurrence with steroid injection and selected referral for refractory cases; avoid complete prolonged inactivity."]}]}],pages:[55],note:"",adapted:false,set:"2021 · 23–25 January",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-201",diagnoses:["Tennis elbow"],differentials:[],evidence:[{page:55,quote:"It was tennis elbow"}],mode:"document-context"},aiNotes:{title:"Tennis elbow",safety:"",refs:[]}},{id:"jcs-202",year:"2021",rotation:"Ophthalmology",topic:"redeye",title:"A 35-year-old woman presents with a red eye for two days",case:"A 35-year-old woman presents with a red eye for two days.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask about visual change, pain, photophobia, itch/discharge, onset, laterality, contact lenses, trauma, chemical exposure and previous eye symptoms.","Clarify medicines, previous eye procedures and the effect on daily activities; establish whether any visual loss is sudden."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Measure visual acuity in each eye, assess pupils and eye movements, and examine the lids, conjunctiva and cornea with suitable equipment.","Describe the location and distribution of redness and the appearance of the conjunctiva, cornea and surrounding tissues."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Identify the key discriminating features in the history and examination, and select investigations to guide clinical reasoning."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Assessment and investigations",points:["Use the clinical examination to decide whether slit-lamp assessment, fluorescein testing, pressure measurement or specialist assessment is appropriate.","Interpret the examination and test results in the clinical context."]},{heading:"Care pending assessment",points:["Arrange urgent eye assessment for significant pain, reduced vision, marked photophobia, trauma or chemical exposure; address immediate safety and avoid driving with impaired vision.","Choose treatment according to the clinical assessment and arrange follow-up."]}]}],pages:[56],note:"",adapted:false,set:"2021 · 23–25 January",images:["red-eye.jpeg"],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A 35-year-old woman has unilateral red eye for two days. Examine, explain findings and discuss alternatives and care.",imageStage:"document-info",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-202",diagnoses:[],differentials:[],evidence:[],mode:"neutral"},aiNotes:{title:"Eye assessment",safety:"",refs:[]}},{id:"jcs-203",year:"2021",rotation:"Oral health",topic:"hsv",title:"A father brings his six-year-old with mouth ulcers for two days",case:"A father brings his six-year-old with mouth ulcers for two days.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask about onset, recurrence, pain, oral lesions, fever, swallowing, oral intake, urine output, medicines, dental care and relevant exposures.","In a child assess feeding, hydration, growth and the caregiver's concerns; ask about systemic symptoms and immune risk when relevant."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Identify the key discriminating features in the history and examination, and select investigations to guide clinical reasoning."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Assessment and investigations",points:["Assess whether direct oral/dental examination and targeted tests are required, guided by severity, persistence and the wider clinical picture."]},{heading:"Care pending assessment",points:["Prioritise hydration, appropriate analgesia and review of poor intake or systemic illness; refer urgently if drinking or swallowing is significantly impaired.","Discuss transmission precautions and treatment according to the clinical assessment."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Recorded follow-up questions",points:["Address the patient’s questions and check their understanding of the assessment and care plan.","Explain what is known, what remains uncertain and which findings or tests are needed next; check understanding and agree a follow-up plan."]}]},{key:"custom",label:"Describe the supplied images",sections:[{heading:"Image description",points:["Describe the site, number, size, surface and distribution of visible lesions, the gums and surrounding tissues; assess hydration and general appearance.","Describe the site, number, distribution and appearance of lesions in each photograph.","Describe the site, distribution and appearance of each visible lesion."]}]}],pages:[57],note:"",adapted:false,set:"2021 · 23–25 January",images:["oral-perioral.jpeg","oral-ulcer.jpeg"],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A father brings his six-year-old with two days of oral ulcers and asks if they are contagious. Two illustrative photographs are supplied.",imageStage:"document-info",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Father’s question",items:["Is it contagious?"]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-203",diagnoses:[],differentials:[],evidence:[],mode:"neutral"},aiNotes:{title:"Oral assessment",safety:"",refs:[]}},{id:"jcs-204",year:"2021",rotation:"Medicine",topic:"copd",title:"A 55-year-old man presents with cough and breathlessness",case:"A 55-year-old man presents with cough and breathlessness.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Clarify cough and breathlessness: onset, duration, sputum, wheeze, blood, fever, exertional limitation and previous episodes.","Ask smoking and other exposures, previous respiratory illness, medicines and the impact on sleep or activity; use child-specific feeding and growth questions where appropriate."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Identify the key discriminating features in the history and examination, and select investigations to guide clinical reasoning."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Assessment and investigations",points:["Choose tests to answer questions raised by the history and examination, such as imaging, lung function or microbiology where appropriate."]},{heading:"Care pending assessment",points:["Escalate respiratory distress, hypoxaemia or clinical instability; provide immediate support according to assessed need.","Plan subsequent treatment and follow-up using the clinical assessment and investigation results."]}]}],pages:[59],note:"",adapted:false,set:"2021 · 23–25 January",images:["chest-xray.jpeg"],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A 55-year-old man has cough and shortness of breath for two years. A chest radiograph is supplied.",imageStage:"document-info",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"History",items:["Cough and breathlessness have been present for two years."]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-204",diagnoses:[],differentials:[],evidence:[],mode:"neutral"},aiNotes:{title:"Respiratory assessment",safety:"",refs:[]}},{id:"jcs-205",year:"2021",rotation:"Medicine",topic:"graves",title:"A 24-year-old woman has palpitations and neck swelling",case:"A 24-year-old woman has palpitations and neck swelling.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask weight loss, heat intolerance, palpitations, bowel change, tremor, menstrual change and neck compression.","Assess eye pain/diplopia/vision, smoking, pregnancy, medicines, cardiac symptoms and family autoimmune disease."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["TSH, free T4/T3, TSH receptor antibodies when indicated; ECG, baseline FBC/liver tests before relevant medicines.","Ultrasound for structural questions; radionuclide testing selected by specialists and avoided in pregnancy."]},{heading:"Management",points:["Symptom control with a suitable beta-blocker if safe; antithyroid medicine, radioiodine or surgery based on cause, preference, pregnancy and specialist input.","Carbimazole can cause agranulocytosis: fever/sore throat requires stopping it and urgent medical/FBC assessment per safety instructions; liver symptoms also require urgent review.","Thyroid storm is emergency treatment; severe/sight-threatening thyroid eye disease needs urgent eye/endocrine care. Smoking cessation matters."]}]}],pages:[60],note:"",adapted:false,set:"2021 · 23–25 January",images:["thyroid-swelling.jpeg"],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"document-info",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-205",diagnoses:["Graves disease"],differentials:[],evidence:[{page:60,quote:"suggestable for Grave’s"}],mode:"document-context",tentative:true},aiNotes:{title:"Graves disease",safety:"",refs:[]}},{id:"jcs-206",year:"2021",rotation:"Medicine",topic:"ra",title:"A 25-yea s or tests are needed next; check understanding and agree a follow-up plan."]}]}],pages:[61],note:"",adapted:false,set:"2021 · 23–25 January",images:["hand-joints.jpeg"],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A 25-year-old woman has swelling of small joints in both hands and feet. Discuss NSAID and steroid adverse effects.",imageStage:"document-info",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Examiner’s follow-up question",items:["What are the side effects of NSAIDs and steroids?"]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-206",diagnoses:[],differentials:[],evidence:[],mode:"neutral"},aiNotes:{title:"Musculoskeletal assessment",safety:"",refs:[]}},{id:"jcs-207",year:"2021",rotation:"Paediatrics",topic:"brucella",title:"A nine-year-old presents with persistent fever",case:"A nine-year-old presents with persistent fever.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask fever chronology, systemic and focal symptoms, travel, food/drink and animal exposures, medicines and relevant contacts; assess growth and the child’s overall condition.","Clarify the presenting concern, onset, duration, course, severity and effect on daily function.","Ask relevant associated symptoms, previous episodes, medical/surgical history, medicines, allergies and exposures.","Explore the patient's concerns and expectations; obtain collateral history with permission when appropriate."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Identify the key discriminating features in the history and examination, and select investigations to guide clinical reasoning."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Assessment and investigations",points:["Request the relevant examination findings and investigation results.","Select and justify te
