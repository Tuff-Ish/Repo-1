ey:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Mechanical valve sounds may explain a click; new symptoms also suggest valve thrombosis, paravalvular leak, endocarditis or another lesion."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Obtain valve card/operative record, ECG and echo; INR if taking warfarin.","If fever/endocarditis suspected, urgent cultures and cardiac imaging through a specialist team."]},{heading:"Management",points:["Mechanical valves generally require lifelong vitamin-K-antagonist anticoagulation; DOACs are not a substitute for mechanical-valve anticoagulation.","INR target depends on valve model, position and thromboembolic risk; check the patient-specific anticoagulation plan, not one universal aortic/mitral range.","Periprocedural interruption/bridging requires specialist planning; never advise stopping anticoagulation independently."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Aortic versus mitral position is confirmed by records/echo, not sound location alone.","If asked for conventional targets: many modern bileaflet aortic valves use target INR 2.5 (range 2–3) without extra risks; mechanical mitral valves often target 3.0 (2.5–3.5). These are examples, not a patient-specific prescription.","Explain bleeding/thromboembolism warnings, INR checks, interaction precautions and importance of oral hygiene.","Dental antibiotic prophylaxis varies by jurisdiction and risk: NICE does not recommend it routinely; use current local/cardiology guidance, not automatic antibiotics for every dental visit.","Mechanical valves generally require lifelong vitamin-K-antagonist anticoagulation; DOACs are not a substitute for mechanical-valve anticoagulation.","INR target depends on valve model, position and thromboembolic risk; check the patient-specific anticoagulation plan, not one universal aortic/mitral range.","Periprocedural interruption/bridging requires specialist planning; never advise stopping anticoagulation independently."]}]}],pages:[32],note:"",adapted:false,set:"2019 · day 1",images:[]},{id:"jcs-183",year:"2019",rotation:"Medicine",topic:"hepa",title:"A woman has jaundice and hepatic tenderness after travel and eating outside; anti-HAV IgM was positive",case:"A woman has jaundice and hepatic tenderness after travel and eating outside; anti-HAV IgM was positive.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask jaundice, dark urine/pale stool, itching, RUQ pain, nausea, fever, exposure timing, travel/food/water/contacts, medicines/alcohol and other hepatitis risks."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Acute viral hepatitis A versus other hepatitis, drug injury, biliary obstruction and haemolysis."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Liver profile, bilirubin, INR, glucose and renal function; anti-HAV IgM supports recent infection, IgG indicates past infection/vaccination.","Interpret HBV using HBsAg, anti-HBc IgM/total and anti-HBs pattern; HCV antibody may need RNA confirmation. Ultrasound if obstruction possible."]},{heading:"Management",points:["Most uncomplicated hepatitis A: supportive fluids/nutrition, avoid alcohol/hepatotoxic medicines and appropriate symptom relief.","Analgesic choice/dose must consider liver injury; do not automatically give full-dose paracetamol or NSAIDs without clinical assessment.","Encephalopathy, bleeding/prolonged INR, hypoglycaemia or worsening illness needs urgent liver/emergency assessment; public-health/contact prophylaxis per policy."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Explain faeco-oral spread, hand hygiene and vaccination/contact advice; most recover but liver failure warnings include confusion, abnormal bleeding and severe deterioration.","Most uncomplicated hepatitis A: supportive fluids/nutrition, avoid alcohol/hepatotoxic medicines and appropriate symptom relief.","Analgesic choice/dose must consider liver injury; do not automatically give full-dose paracetamol or NSAIDs without clinical assessment.","Encephalopathy, bleeding/prolonged INR, hypoglycaemia or worsening illness needs urgent liver/emergency assessment; public-health/contact prophylaxis per policy."]}]}],pages:[33],note:"",adapted:false,set:"2019 · day 1",images:[]},{id:"jcs-184",year:"2019",rotation:"Paediatrics",topic:"anaemia",title:"A child has pallor and reported jaundice. Low Hb, high RDW, reactive platelets, low transferrin saturation and low ferritin were recalled",case:"A child has pallor and reported jaundice. Low Hb, high RDW, reactive platelets, low transferrin saturation and low ferritin were recalled.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask fatigue, exertional dyspnoea/palpitations, bleeding including menstruation/GI loss, diet, pica, pregnancy, malabsorption and chronic disease.","In children ask milk/diet, growth, stool loss/parasites risks and family haemoglobinopathy history; jaundice raises haemolysis/liver alternatives."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Iron deficiency, haemoglobinopathy, chronic inflammation, B12/folate deficiency and haemolysis; pallor alone does not prove anaemia."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["FBC indices/film, ferritin interpreted with inflammation, iron studies as needed; reticulocytes/haemolysis or other tests by pattern.","Iron deficiency usually gives low ferritin and transferrin saturation; ferritin may be falsely normal/high with inflammation. Investigate the source of deficiency."]},{heading:"Management",points:["Haemodynamic compromise, active major bleeding or severe symptomatic anaemia needs urgent review.","Replace iron using age/weight/local formulary, treat source and check response; selected patients need IV iron/specialist care.","Explain oral iron GI effects/dark stools, adherence, safe storage and a planned course/recheck; do not use transfusion routinely for stable mild disease."]}]}],pages:[34],note:"Iron deficiency is recalled, but jaundice also prompts haemolysis/liver assessment rather than being assumed a usual iron-deficiency sign.",adapted:false,set:"2019 · day 1",images:[]},{id:"jcs-185",year:"2019",rotation:"Paediatrics",topic:"aom",title:"A child has ear symptoms; the parent requests treatment and says paracetamol has not helped",case:"A child has ear symptoms; the parent requests treatment and says paracetamol has not helped.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask ear pain/fever duration, discharge, hearing change, preceding URTI, age, feeding/hydration, prior infections and medicines/doses already used.","Check mastoid swelling, severe headache, facial weakness, toxic appearance and immunocompromise."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["AOM versus otitis externa, effusion and referred pain; diagnosis needs otoscopy, not fever alone."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Vitals/hydration, ear examination with appropriate clean speculum and braced hand; bulging inflamed drum/effusion supports AOM."]},{heading:"Management",points:["Appropriate age/weight-based paracetamol or ibuprofen if safe; no aspirin in children. Check exact formulation, dose, interval/max and contraindications in current paediatric formulary rather than guessing.","Many cases are self-limiting; no/back-up/immediate antibiotics depend on age, severity, duration, otorrhoea/bilateral disease and risk per local guidance.","Urgent care for mastoiditis/systemic complication; reassess if worsening/not improving."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Explain why analgesia and review matter even without antibiotics; persistent poor intake/uncontrolled pain needs reassessment.","Appropriate age/weight-based paracetamol or ibuprofen if safe; no aspirin in children. Check exact formulation, dose, interval/max and contraindications in current paediatric formulary rather than guessing.","Many cases are self-limiting; no/back-up/immediate antibiotics depend on age, severity, duration, otorrhoea/bilateral disease and risk per local guidance.","Urgent care for mastoiditis/systemic complication; reassess if worsening/not improving."]}]}],pages:[35],note:"",adapted:true,set:"2019 · day 1",images:[]},{id:"jcs-186",year:"2019",rotation:"Surgery",topic:"hydrocele",title:"A 37-year-old has a transilluminating scrotal swelling. Discuss causes, varicocele and tumour concern",case:"A 37-year-old has a transilluminating scrotal swelling. Discuss causes, varicocele and tumour concern.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Model/supervised: consent/chaperone; inspect and palpate testis/epididymis/cord gently, determine whether you can get above swelling, assess cough impulse and transillumination when appropriate.","A varicocele is typically a bag-of-worms venous swelling; transillumination supports fluid but does not exclude an underlying tumour."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Hydrocele versus inguinoscrotal hernia, varicocele, epididymal cyst and testicular tumour.","Causes include congenital patent processus vaginalis, idiopathic acquired hydrocele, infection/inflammation, trauma or tumour-related reactive fluid; do not treat a list of four as exhaustive."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Scrotal ultrasound especially when testis cannot be palpated or diagnosis/underlying cause is uncertain."]},{heading:"Management",points:["Urgent torsion pathway for sudden pain; otherwise treat secondary cause, observe selected asymptomatic cases or discuss hydrocelectomy for symptoms/size.","Do not repeatedly aspirate as routine definitive care; surgical risks/recurrence and patient preference matter."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Reassure only after appropriate assessment; explain why ultrasound may be needed.","Urgent torsion pathway for sudden pain; otherwise treat secondary cause, observe selected asymptomatic cases or discuss hydrocelectomy for symptoms/size.","Do not repeatedly aspirate as routine definitive care; surgical risks/recurrence and patient preference matter."]}]}],pages:[38],note:"",adapted:false,set:"2019 · day 2",images:[]},{id:"jcs-187",year:"2019",rotation:"Surgery",topic:"spleen",title:"Perform abdominal examination for left-sided pain or swelling",case:"Perform abdominal examination for left-sided pain or swelling.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Palpate spleen from right iliac fossa on inspiration gently, characterise notch and movement; bimanual kidney assessment when indicated.","Spleen may have a notch, inferomedial inspiratory movement and no ability to get above; kidney may be ballotable with ability to get above and overlying colonic resonance. These are supportive, not absolute rules."]}]}],pages:[39],note:"No definitive organ or diagnosis is recorded.",adapted:false,set:"2019 · day 2",images:[]},{id:"jcs-188",year:"2019",rotation:"Surgery",topic:"incisional",title:"A patient has abdominal swelling in relation to a previous incision",case:"A patient has abdominal swelling in relation to a previous incision.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask prior incision/operation, wound infection, swelling with strain, pain, reducibility, vomiting and risk factors such as cough/smoking."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect scar and bulge standing/coughing only if safe; assess defect and reducibility gently, tenderness/skin change and other hernias; do not force a painful irreducible swelling."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Incisional hernia versus rectus diastasis, local mass, seroma or recurrent intra-abdominal disease."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Clinical exam; ultrasound/CT for uncertainty, large/complex defects or operative planning."]},{heading:"Management",points:["Strangulation/obstruction concern requires urgent surgical assessment.","Otherwise discuss risk modification, symptom support and elective repair depending on defect/symptoms/fitness; repair risks include recurrence, infection and chronic pain."]}]}],pages:[40],note:"Source only names incisional hernia; objectives are structured for practice.",adapted:true,set:"2019 · day 2",images:[]},{id:"jcs-189",year:"2019",rotation:"Orthopaedics",topic:"knee",title:"Perform knee examination for suspected ligament injury; discuss MRI, support, physiotherapy and possible surgery",case:"Perform knee examination for suspected ligament injury; discuss MRI, support, physiotherapy and possible surgery.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect gait/alignment if safe then swelling/wasting, warmth/tenderness, effusion and comfortable active/passive range.","Assess Lachman/anterior drawer, posterior drawer and collateral stress when tolerated and trained; meniscal tests only if useful, not forced in an acutely painful joint.","Assess distal neurovascular status and adjacent joints; document findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Plain films when fracture criteria/clinical concern indicate; MRI for selected soft-tissue assessment and management planning."]},{heading:"Management",points:["Analgesia, protection/support and early appropriate rehabilitation; urgent referral for dislocation/neurovascular compromise, locked knee or major instability.","MCL injuries are often treated nonoperatively; surgery is reserved for selected severe/combined injuries, not all “severe” tears automatically.","ACL reconstruction versus rehabilitation depends on instability, activity and associated injury; shared orthopaedic plan."]}]}],pages:[41],note:"",adapted:true,set:"2019 · day 2",images:[]},{id:"jcs-190",year:"2019",rotation:"Orthopaedics",topic:"shoulder",title:"A weightlifter has shoulder pain on movement",case:"A weightlifter has shoulder pain on movement.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect from front/back, palpate appropriate landmarks; compare active and passive flexion/abduction/rotation, then gentle resisted cuff testing.","Global active and passive restriction suggests capsulitis; preserved passive with impaired active movement may suggest cuff pathology. Complete cervical/distal neurovascular exam."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Rotator cuff/subacromial pain, adhesive capsulitis, arthritis, cervical referral and acute traumatic tear; pain on all movements alone is not diagnostic."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Clinical assessment; X-ray if trauma/arthritis concern, ultrasound/MRI when it changes management; urgent infection assessment for hot painful systemic illness."]},{heading:"Management",points:["Activity modification, appropriate analgesia and physiotherapy; selected injection or specialist review.","Acute traumatic loss of power or major suspected tear warrants prompt orthopaedic review; surgery is individualised."]}]}],pages:[42],note:"Rotator cuff tear is recalled; painful movement alone is not diagnostic.",adapted:false,set:"2019 · day 2",images:[]},{id:"jcs-191",year:"2019",rotation:"Anaesthesia",topic:"airway",title:"A talking patient loses consciousness. Call for help and demonstrate appropriate airway adjuncts, BVM technique and LMA use",case:"A talking patient loses consciousness. Call for help and demonstrate appropriate airway adjuncts, BVM technique and LMA use.",objectives:[{key:"p",label:"Demonstrate or explain the procedure safely",sections:[{heading:"Safety and steps",points:["Model-only, trained practice: position airway appropriately (jaw thrust/manual in-line support for suspected cervical injury), remove visible obstruction/suction, oxygen and correct mask size.","Use effective seal and jaw lift (two-person BVM preferred when possible), ventilate to visible chest rise without excessive rate/volume, reassess chest rise/oxygenation/capnography if available.","OPA for deeply unresponsive patient without gag; NPA sizing/contraindications per training (avoid suspected skull-base/major facial injury). Use a suitable supraglottic device/LMA when indicated and escalate failed oxygenation.","Intubation needs trained staff, equipment checks, backup plan, monitoring and waveform capnography confirmation; device sizes depend on device and patient, not one universal size."]},{heading:"Checks and samples",points:["Call emergency/resuscitation team, assess ABCDE, attach monitoring/defibrillator; glucose and ECG as appropriate.","If unresponsive and not breathing normally, start CPR/use defibrillator per current training—ventilation alone is not sufficient."]}]}],pages:[43],note:"",adapted:false,set:"2019 · day 2",images:[]},{id:"jcs-192",year:"2019",rotation:"Surgery",topic:"uti",title:"A woman has dysuria and suprapubic pain; a stone was recalled",case:"A woman has dysuria and suprapubic pain; a stone was recalled.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask dysuria, frequency, urgency, suprapubic pain, haematuria, duration, fever/flank pain, pregnancy, discharge/STI risk, stones and previous cultures."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Lower UTI versus pyelonephritis, urethritis/STI, vaginitis and stone; symptoms in the 2019 recall were attributed to a stone, so do not assume infection."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Urine testing/culture according to sex/pregnancy/age/complexity and local policy; pregnancy/STI testing when relevant.","Fever/obstruction concern: renal tests and appropriate imaging; consider stone imaging if clinical pattern suggests."]},{heading:"Management",points:["Pregnancy, male/paediatric or complicated disease needs an appropriate specific pathway; choose antibiotics using local resistance/culture, renal function and allergy.","Simple lower UTI may be treated with first-line local options, analgesia/hydration and review; fever, vomiting or sepsis requires urgent assessment.","Stone with infected obstruction needs urgent drainage/urology, not antibiotics alone."]}]}],pages:[44],note:"",adapted:false,set:"2019 · day 2",images:[]},{id:"jcs-193",year:"2019",rotation:"Unspecified rotation",topic:"back",title:"Examine lower back pain, including relevant sensation and straight leg raise",case:"Examine lower back pain, including relevant sensation and straight leg raise.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Observe supported gait/posture; inspect/palpate spine, comfortable range; assess lower-limb power, tone, reflexes and dermatomal sensation.","Straight leg raise with consent if radicular symptoms; assess heel/toe gait only if safe.","Do not routinely perform rectal examination for all back pain; normal anal tone cannot exclude cauda equina syndrome."]}]},{key:"custom",label:"Choose suitable sensory tests",sections:[{heading:"Important points",points:["Use dermatomal light touch/pinprick and vibration/proprioception when relevant. A 10 g monofilament is chiefly for protective-sensation foot assessment, not a substitute for a full spinal sensory examination."]}]}],pages:[45],note:"Rotation is not printed on this slide, so it is left unspecified rather than inferred.",adapted:false,set:"2019 · day 2",images:[]},{id:"jcs-194",year:"2019",rotation:"Dermatology",topic:"eczema",title:"Discuss a child’s itchy rash, differential diagnoses, emollients, topical steroids and practical clothing/nail advice",case:"Discuss a child’s itchy rash, differential diagnoses, emollients, topical steroids and practical clothing/nail advice.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask itch/dryness, distribution, triggers, age of onset, atopy/family history, products, infection symptoms and previous treatment.","Assess sleep, school/family impact and adherence/concerns about steroids."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Atopic eczema versus contact/irritant dermatitis, scabies, fungal infection, lichen planus and other age-dependent causes."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Clinical diagnosis; swab or specialist testing only if infection/uncertainty/selected allergy concern."]},{heading:"Management",points:["Regular generous emollient, soap substitutes, irritant avoidance and comfortable clothing.","Topical corticosteroid of appropriate potency for age/site/severity during flares with clear application/duration instructions; review rather than avoid needed treatment because of fear.","Escalate difficult disease; eczema herpeticum (painful monomorphic vesicles/erosions ± fever/eye involvement) needs urgent care."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Correct topical steroid use is generally safe; excessive strong/prolonged use can cause atrophy, striae, pigment change and rarely systemic effects, particularly in children.","Keep nails short, manage itch/sleep; do not prescribe food exclusion diets without evidence and nutritional support.","Regular generous emollient, soap substitutes, irritant avoidance and comfortable clothing.","Topical corticosteroid of appropriate potency for age/site/severity during flares with clear application/duration instructions; review rather than avoid needed treatment because of fear.","Escalate difficult disease; eczema herpeticum (painful monomorphic vesicles/erosions ± fever/eye involvement) needs urgent care."]}]}],pages:[46],note:"",adapted:true,set:"2019 · day 2",images:[]},{id:"jcs-195",year:"2021",rotation:"Surgery",topic:"renal",title:"A man in his thirties has right flank pain for two years. Imaging was recalled as a 7 mm LEFT mid-ureteric calculus with mild hydronephrosis and pyelonephritis",case:"A man in his thirties has right flank pain for two years. Imaging was recalled as a 7 mm LEFT mid-ureteric calculus with mild hydronephrosis and pyelonephritis.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask colicky radiation to groin, haematuria, fever/rigors, dysuria, vomiting, stone history, solitary kidney, gout and fluid intake.","Assess pregnancy, retention, trauma and malignancy risks as relevant."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Assess vitals/sepsis, hydration, abdomen and gentle renal angle tenderness; avoid repeated painful percussion.","Assess mass if present; offer indicated genital/hernia examination with consent. A new non-reducing left varicocele with concerning signs can prompt renal assessment."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Ureteric stone, pyelonephritis, obstruction, renal mass and non-urinary causes; reconcile the side of pain with imaging rather than silently changing it."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Urinalysis/culture, renal function/electrolytes, FBC and pregnancy test when appropriate.","Non-contrast low-dose CT KUB is typical adult stone imaging; ultrasound first in pregnancy/children or selected pathways. Uric acid stones can be radiolucent on plain film but visible on CT."]},{heading:"Management",points:["Sepsis with obstruction, anuria/AKI, solitary kidney or uncontrolled symptoms needs urgent urology; infected obstruction requires antibiotics plus urgent decompression, not antibiotics alone.","Analgesia (NSAID if safe), antiemetic, hydration to need and stone-size/location-based passage versus intervention plan.","Uric acid stones: metabolic assessment and specialist-guided urine alkalinisation may dissolve selected stones; do not prescribe it indiscriminately."]}]}],pages:[49],note:"Source discrepancy: symptoms are right-sided, imaging is left-sided. Verify the actual report/patient; infected obstruction is urgent regardless of side.",adapted:false,set:"2021 · 23–25 January",images:[]},{id:"jcs-196",year:"2021",rotation:"Surgery",topic:"breast",title:"A 31-year-old woman has a breast lump for eight months",case:"A 31-year-old woman has a breast lump for eight months.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask duration/change, pain/cycle relation, nipple discharge/retraction, skin change, pregnancy/lactation, systemic symptoms and family/personal breast history."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Model or supervised setting: explain, explicit consent, chaperone offer, privacy and draping.","Inspect symmetry, skin/nipple change with appropriate arm positions; systematic palpation of all tissue, characterise lump, assess axillary/supraclavicular nodes and other breast."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Fibroadenoma, cyst, malignancy, fat necrosis or infection; young age and mobility do not by themselves exclude cancer."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Triple assessment when indicated: clinical exam, age/risk-appropriate imaging (often ultrasound in younger patients) and tissue sampling as needed.","Urgent breast pathway for suspicious features; do not diagnose a lump solely by palpation."]},{heading:"Management",points:["Management depends on concordant assessment: reassurance/surveillance or excision for selected confirmed benign lesions versus cancer treatment pathway.","Discuss options, growth/symptom concerns and follow-up."]}]}],pages:[50],note:"",adapted:false,set:"2021 · 23–25 January",images:[]},{id:"jcs-197",year:"2021",rotation:"Surgery",topic:"acuteischaemia",title:"A 35-year-old man has acute severe left leg pain. A clinical photograph is supplied",case:"A 35-year-old man has acute severe left leg pain. A clinical photograph is supplied.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Rapidly establish onset, pain, sensory loss/weakness and baseline function; ask AF, vascular disease, procedures/trauma and anticoagulants."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Acute embolus, arterial thrombosis or aortic pathology; the six Ps include pain, pallor, pulselessness, coldness, paraesthesia and paralysis."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Immediate vascular assessment; Doppler and urgent vascular imaging as directed without delaying threatened-limb treatment.","ECG, bloods including renal function/lactate and coagulation; assess other embolic sites."]},{heading:"Management",points:["Call vascular/emergency team immediately, analgesia and ABCDE; keep nil by mouth and protect the limb.","Anticoagulation with unfractionated heparin is often indicated after contraindication review by the team; do not delay revascularisation decisions.","Definitive embolectomy/thrombectomy/thrombolysis/bypass depends on viability, cause and time; monitor reperfusion/compartment syndrome."]}]}],pages:[51],note:"",adapted:false,set:"2021 · 23–25 January",images:["leg-ischaemia.jpeg"]},{id:"jcs-198",year:"2021",rotation:"FAMCO",topic:"migraine",title:"A 25-year-old woman has a band-like headache. History and examination were reportedly unremarkable; she requests an MRI",case:"A 25-year-old woman has a band-like headache. History and examination were reportedly unremarkable; she requests an MRI.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Characterise onset, time course, location, quality, severity, duration, aura, nausea, light/sound sensitivity and activity effect.","Ask thunderclap onset, fever/meningism, new neurological deficit, pregnancy/postpartum, cancer/immunosuppression, trauma, positional/exertional change and medication overuse."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Migraine versus tension-type/cluster, medication-overuse and secondary headache.","Band-like headache with no red flags may be tension-type; do not force a migraine diagnosis from the presenting word alone."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Vitals and focused neurological/fundal assessment; targeted urgent imaging/LP pathway for red flags.","Routine MRI is not indicated solely for reassurance after a typical primary headache and normal appropriate assessment."]},{heading:"Management",points:["Explain working diagnosis and safety-net; headache diary, sleep/hydration/regular meals and trigger management.","Acute migraine: suitable simple analgesic/NSAID and/or triptan ± antiemetic after contraindications; tension-type generally simple analgesia; avoid opioids.","Discuss prevention if frequent/disabling, with pregnancy and reproductive-safety considerations. Any prescription requires allergy, pregnancy, interaction, dose/duration and follow-up checks."]}]}],pages:[52],note:"The source text says “bad-like”; interpreted as band-like for readability, not a confirmed primary-headache diagnosis.",adapted:false,set:"2021 · 23–25 January",images:[]},{id:"jcs-199",year:"2021",rotation:"FAMCO",topic:"anc",title:"A 31-year-old attends her pregnancy booking. Anaemia, positive urine nitrites and a “positive rubella” result were recalled",case:"A 31-year-old attends her pregnancy booking. Anaemia, positive urine nitrites and a “positive rubella” result were recalled.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Confirm pregnancy/LMP, cycle regularity, gestation and red flags; ask previous pregnancies/complications, medical/surgical/genetic history, medicines/allergies and support.","Assess smoking/alcohol/substances, mental health, domestic safety sensitively, infection/travel risks and patient preferences."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Promote informed choices, confidentiality, who to contact for bleeding, pain, severe headache or reduced fetal movements when applicable.","Review medicines for pregnancy safety, folic acid and other supplementation per risk/local guidance; healthy diet/activity and food/infection precautions.","Treat confirmed bacteriuria with pregnancy-appropriate antibiotics and follow-up culture per policy; assess/treat anaemia.","Explain visit schedule, maternity record/green card, screening choices and red flags; no live rubella/MMR vaccine during pregnancy—plan postpartum if non-immune."]}]}],pages:[53],note:"Only the focused-history objective is remembered. Counselling/management is an added revision objective. Rubella assay/isotype is not supplied.",adapted:false,set:"2021 · 23–25 January",images:[]},{id:"jcs-200",year:"2021",rotation:"Orthopaedics",topic:"back",title:"An athlete has lower back pain after lifting something heavy at the gym",case:"An athlete has lower back pain after lifting something heavy at the gym.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Characterise onset, trauma/lifting, radiation, mechanical/inflammatory features, neurological symptoms and functional limitation.","Ask cancer/infection/steroid risks and red flags: saddle sensory change, new bladder/bowel/sexual dysfunction, bilateral weakness or systemic illness."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Observe supported gait/posture; inspect/palpate spine, comfortable range; assess lower-limb power, tone, reflexes and dermatomal sensation.","Straight leg raise with consent if radicular symptoms; assess heel/toe gait only if safe.","Do not routinely perform rectal examination for all back pain; normal anal tone cannot exclude cauda equina syndrome."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Mechanical pain, disc-related radiculopathy, spinal stenosis, inflammatory disease; exclude fracture, malignancy, infection and cauda equina compression."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["No routine imaging for uncomplicated mechanical pain; investigate red flags and consider MRI when it changes management.","Urgent emergency MRI/spinal pathway if cauda equina or cord compression suspected."]},{heading:"Management",points:["Explain likely cause after assessment; encourage activity, avoid prolonged bed rest, offer supported exercise/physiotherapy and suitable analgesia after contraindication review.","Progressive deficit, suspected compression, infection or fracture requires urgent specialist assessment."]}]}],pages:[54],note:"",adapted:false,set:"2021 · 23–25 January",images:[]},{id:"jcs-201",year:"2021",rotation:"Orthopaedics",topic:"tennis",title:"A 28-year-old man has right elbow pain for approximately two years",case:"A 28-year-old man has right elbow pain for approximately two years.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask lateral elbow pain, repetitive grip/wrist activity, dominant hand/work, trauma, neck/neurological symptoms and functional impact."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect elbow, palpate lateral epicondyle/common extensor origin, assess range and pain with resisted wrist/finger extension and grip; check neck and distal neurology."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Lateral epicondylalgia versus radial tunnel syndrome, arthritis, cervical referral or other elbow pathology."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Usually clinical; imaging only for atypical, traumatic or persistent uncertain features."]},{heading:"Management",points:["Relative activity modification, graded tendon-loading physiotherapy, suitable analgesia and ergonomic support.","Discuss uncertain long-term benefit/recurrence with steroid injection and selected referral for refractory cases; avoid complete prolonged inactivity."]}]}],pages:[55],note:"",adapted:false,set:"2021 · 23–25 January",images:[]},{id:"jcs-202",year:"2021",rotation:"Ophthalmology",topic:"redeye",title:"A 35-year-old woman has unilateral red eye for two days. Examine, explain findings and discuss alternatives and care",case:"A 35-year-old woman has unilateral red eye for two days. Examine, explain findings and discuss alternatives and care.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask pain, photophobia, acuity loss, discharge/itch, contact lenses, trauma/chemical exposure, headache/haloes/nausea and prior episodes."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Document acuity, distribution of redness, cornea and pupil; no remote photograph can exclude an eye emergency."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Conjunctivitis versus keratitis/corneal ulcer, anterior uveitis, scleritis and acute angle closure; pain/reduced vision changes urgency.","The 2021 picture shows conjunctival injection but does not establish pressure, acuity or cause; the 2024 recall explicitly names acute angle closure."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Assess acuity in each eye, pupils, external/corneal examination and eye movements; slit lamp/fluorescein and IOP by trained clinician when indicated.","Do not press on suspected ruptured globe or routinely dilate a painful red eye."]},{heading:"Management",points:["Painful red eye with reduced vision, corneal opacity, contact-lens keratitis, trauma or angle-closure concern: immediate/urgent ophthalmology.","Angle closure requires urgent pressure-lowering treatment through eye team; not topical steroid alone.","If uncomplicated conjunctivitis is established, hygiene and supportive care; antibiotic/other treatment depends on cause and risk, not redness alone."]}]}],pages:[56],note:"Source photograph retained; it cannot establish visual acuity or intraocular pressure.",adapted:false,set:"2021 · 23–25 January",images:["red-eye.jpeg"]},{id:"jcs-203",year:"2021",rotation:"Oral health",topic:"hsv",title:"A father brings his six-year-old with two days of oral ulcers and asks if they are contagious. Two illustrative photographs are supplied",case:"A father brings his six-year-old with two days of oral ulcers and asks if they are contagious. Two illustrative photographs are supplied.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask fever, painful oral lesions, gingival symptoms, hydration/urine, intake, contacts, immunosuppression and eye symptoms.","Address parent fears of leukaemia while checking persistent fever, bruising, weight loss or pallor if present."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Primary HSV gingivostomatitis versus aphthous ulcers, hand-foot-mouth, herpangina and other mucosal disease."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Assess hydration and oral/perioral distribution; usually clinical; targeted viral testing/other investigations if severe/atypical."]},{heading:"Management",points:["Age-appropriate analgesia, frequent fluids and hydration support; admission if unable to maintain hydration, severe disease or high-risk child.","Early oral aciclovir may be considered for severe early disease per paediatric protocol; immunocompromised cases require urgent specialist care.","Avoid sharing utensils/kissing lesions; hand hygiene and avoid eye touching; no antibiotics unless bacterial indication."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Explain viral, contagious illness usually resolves; do not promise it cannot be anything serious without assessing red flags. Review poor drinking, urine reduction, eye pain or persistent illness.","Age-appropriate analgesia, frequent fluids and hydration support; admission if unable to maintain hydration, severe disease or high-risk child.","Early oral aciclovir may be considered for severe early disease per paediatric protocol; immunocompromised cases require urgent specialist care.","Avoid sharing utensils/kissing lesions; hand hygiene and avoid eye touching; no antibiotics unless bacterial indication."]}]},{key:"custom",label:"Distinguish the two pictured patterns",sections:[{heading:"Important points",points:["Primary HSV can cause fever, painful widespread gingivostomatitis and perioral lesions and is contagious. A solitary aphthous ulcer is typically non-contagious. Both images are source illustrations, not verified photographs of this particular child."]}]}],pages:[57],note:"The images show different patterns: perioral vesicular/crusted lesions and a solitary aphthous-looking ulcer. History/examination must distinguish HSV from non-contagious aphthae; do not force one diagnosis onto both.",adapted:false,set:"2021 · 23–25 January",images:["oral-perioral.jpeg","oral-ulcer.jpeg"]},{id:"jcs-204",year:"2021",rotation:"Medicine",topic:"copd",title:"A 55-year-old man has cough and shortness of breath for two years. A chest radiograph is supplied",case:"A 55-year-old man has cough and shortness of breath for two years. A chest radiograph is supplied.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask chronic breathlessness, cough/sputum, exacerbations, smoking/biomass or occupational exposure, exercise limit and inhaler use.","Assess asthma variability, haemoptysis, weight loss, cardiac symptoms and comorbidity."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["COPD versus asthma, bronchiectasis, heart failure, malignancy or interstitial disease; clubbing is not typical of uncomplicated COPD."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Post-bronchodilator spirometry when stable; assess oxygenation.","Chest radiograph and FBC; blood gas if acutely unwell or hypercapnia is a concern."]},{heading:"Management",points:["Smoking cessation, vaccinations, inhaler technique, pulmonary rehabilitation and activity/nutrition support.","Select inhaled bronchodilator/other therapy using current guideline and exacerbation profile.","Acute deterioration: ABCDE, controlled oxygen if at risk of hypercapnic failure, blood gas and urgent treatment per local pathway."]}]}],pages:[59],note:"No diagnosis is printed; the small illustrative CXR appears hyperinflated but cannot confirm COPD. Spirometry and clinical assessment are needed.",adapted:false,set:"2021 · 23–25 January",images:["chest-xray.jpeg"]},{id:"jcs-205",year:"2021",rotation:"Medicine",topic:"graves",title:"A 24-year-old woman has palpitations and neck swelling",case:"A 24-year-old woman has palpitations and neck swelling.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask weight loss, heat intolerance, palpitations, bowel change, tremor, menstrual change and neck compression.","Assess eye pain/diplopia/vision, smoking, pregnancy, medicines, cardiac symptoms and family autoimmune disease."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Graves versus toxic nodules, thyroiditis and exogenous hormone; eye disease/diffuse vascular goitre supports Graves but tests confirm."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["TSH, free T4/T3, TSH receptor antibodies when indicated; ECG, baseline FBC/liver tests before relevant medicines.","Ultrasound for structural questions; radionuclide testing selected by specialists and avoided in pregnancy."]},{heading:"Management",points:["Symptom control with a suitable beta-blocker if safe; antithyroid medicine, radioiodine or surgery based on cause, preference, pregnancy and specialist input.","Carbimazole can cause agranulocytosis: fever/sore throat requires stopping it and urgent medical/FBC assessment per safety instructions; liver symptoms also require urgent review.","Thyroid storm is emergency treatment; severe/sight-threatening thyroid eye disease needs urgent eye/endocrine care. Smoking cessation matters."]}]}],pages:[60],note:"",adapted:false,set:"2021 · 23–25 January",images:["thyroid-swelling.jpeg"]},{id:"jcs-206",year:"2021",rotation:"Medicine",topic:"ra",title:"A 25-year-old woman has swelling of small joints in both hands and feet. Discuss NSAID and steroid adverse effects",case:"A 25-year-old woman has swelling of small joints in both hands and feet. Discuss NSAID and steroid adverse effects.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask symmetrical small-joint pain/swelling, morning stiffness, duration, function, fatigue and systemic/extra-articular symptoms.","Assess psoriasis, infection, SLE features, medicines, pregnancy plans and impact on work/ADLs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["RA versus psoriatic, SLE/viral and other inflammatory arthritides; chronicity and pattern matter."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Prompt rheumatology assessment for persistent synovitis; FBC/inflammatory markers, RF/anti-CCP and baseline imaging as appropriate.","Negative antibodies or normal markers do not exclude RA; do not delay referral while awaiting tests."]},{heading:"Management",points:["Early specialist disease-modifying therapy to prevent damage, with appropriate screening/monitoring.","NSAIDs relieve symptoms but do not prevent progression: discuss GI bleeding/ulcer, renal, BP/cardiovascular and pregnancy risks.","Steroids may be selected short-term bridging treatment; discuss infection, glucose, mood, osteoporosis, skin and adrenal suppression risks, and not stopping prolonged treatment abruptly."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Explain chronic immune inflammation, shared treatment goals, monitoring and pregnancy/medicine precautions.","Early specialist disease-modifying therapy to prevent damage, with appropriate screening/monitoring.","NSAIDs relieve symptoms but do not prevent progression: discuss GI bleeding/ulcer, renal, BP/cardiovascular and pregnancy risks.","Steroids may be selected short-term bridging treatment; discuss infection, glucose, mood, osteoporosis, skin and adrenal suppression risks, and not stopping prolonged treatment abruptly."]}]}],pages:[61],note:"",adapted:false,set:"2021 · 23–25 January",images:["hand-joints.jpeg"]},{id:"jcs-207",year:"2021",rotation:"Paediatrics",topic:"brucella",title:"A nine-year-old has persistent fever for two months. Travel included drinking cow’s milk in Salalah",case:"A nine-year-old has persistent fever for two months. Travel included drinking cow’s milk in Salalah.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Detail fever pattern/duration, sweats, weight/appetite, bone/joint/back pain and exposures.","Ask raw/unpasteurised milk/cheese, livestock, travel to Salalah/elsewhere, TB contacts, medicines and immune risk."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Brucellosis is suggested by unpasteurised dairy/animal exposure; consider TB, malaria/other infection, inflammatory disease and malignancy."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Full fever evaluation including growth/exam, FBC/inflammatory/liver tests, cultures and Brucella serology/cultures in context.","Notify laboratory if Brucella suspected because of occupational exposure risk; assess focal complications with specialists."]},{heading:"Management",points:["Paediatric/infectious-disease care; combination prolonged antibiotics selected by age/weight, complications and local guidance, not monotherapy.","Monitor response/relapse and investigate osteoarticular, neurological or cardiac complications."]}]}],pages:[62],note:"Clarify whether milk was unpasteurised; travel/dairy exposure is a clue, not laboratory confirmation.",adapted:false,set:"2021 · 23–25 January",images:[]},{id:"jcs-208",year:"2021",rotation:"Paediatrics",topic:"pyloric",title:"A six-week-old has two weeks of vomiting, initially small milk spit-ups but now projectile about 30 minutes after feeds; non-bilious and no blood",case:"A six-week-old has two weeks of vomiting, initially small milk spit-ups but now projectile about 30 minutes after feeds; non-bilious and no blood.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask onset/progression, projectile nature, bilious/bloody content, relation to feeds, hunger after vomiting, weight, wet nappies and stool.","Ask birth/feeding history, medicines and infection symptoms."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Hypertrophic pyloric stenosis fits progressive non-bilious projectile vomiting at a few weeks; consider reflux, infection and metabolic disease.","Bilious green vomiting is a surgical emergency suggesting obstruction, not classic pyloric stenosis."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Hydration/weight and electrolytes/blood gas (hypochloraemic hypokalaemic metabolic alkalosis may occur); ultrasound confirms suspected pyloric stenosis."]},{heading:"Management",points:["Urgent paediatric/surgical admission, correct dehydration/electrolyte/acid-base disturbance before pyloromyotomy.","Do not rush an inadequately resuscitated infant to anaesthesia; feeding support per team."]}]}],pages:[63],note:"",adapted:false,set:"2021 · 23–25 January",images:[]},{id:"jcs-209",year:"2021",rotation:"Paediatrics",topic:"nephrotic",title:"A five-year-old has early morning facial puffiness for three days; the mother asks if it is curable",case:"A five-year-old has early morning facial puffiness for three days; the mother asks if it is curable.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask morning eye puffiness, dependent/generalised oedema, frothy urine, urine output, weight gain, infection and breathlessness.","Ask haematuria, hypertension symptoms, drugs/systemic illness; fever/abdominal pain may indicate complications."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Nephrotic syndrome (heavy proteinuria/hypoalbuminaemia) versus nephritic disease, cardiac/liver causes and malnutrition."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["BP, weight/fluid status, urine protein quantification, serum albumin/renal function/electrolytes/lipids; cause-directed tests.","Childhood typical steroid-sensitive disease is assessed by paediatrics; adult disease often needs a different renal investigation/biopsy pathway."]},{heading:"Management",points:["Paediatric/renal review; monitor fluid balance/BP and treat oedema carefully because intravascular depletion can coexist.","Steroids for appropriate childhood presentations under protocol; adult treatment depends on cause. Assess infection and thrombosis risk.","Explain childhood minimal-change disease often responds well but relapses are possible; do not promise permanent cure."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Home monitoring and prompt review for fever, abdominal pain, dyspnoea or reduced urine; discuss medicine side effects when applicable.","Paediatric/renal review; monitor fluid balance/BP and treat oedema carefully because intravascular depletion can coexist.","Steroids for appropriate childhood presentations under protocol; adult treatment depends on cause. Assess infection and thrombosis risk.","Explain childhood minimal-change disease often responds well but relapses are possible; do not promise permanent cure."]}]}],pages:[64],note:"",adapted:false,set:"2021 · 23–25 January",images:[]},{id:"jcs-210",year:"2021",rotation:"Psychiatry",topic:"bipolar",title:"A 44-year-old man sleeps about three hours daily and is taking lithium",case:"A 44-year-old man sleeps about three hours daily and is taking lithium.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Establish current low versus elevated/irritable mood, sleep need, energy, speech/thought acceleration, impulsivity, psychosis and functioning.","Ask past mania/hypomania/depression, episodes/medicines including antidepressants, adherence, substances and collateral.","Assess suicide, spending/sexual/driving risks, vulnerability and ability to care for self."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Manic/hypomanic or depressive episode in bipolar disorder versus substance/medical causes, unipolar depression or primary psychosis.","Lithium use suggests a history to explore; it does not prove that today’s presentation is a depressive episode."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["MSE and physical review; renal/thyroid/calcium and lithium level when appropriate, plus medication-specific monitoring.","Check pregnancy possibility and drug interactions; urgent level/electrolytes if toxicity suspected."]},{heading:"Management",points:["Acute mania/psychosis or major safety risk: urgent psychiatric review; review/stop triggering antidepressants only through an appropriate prescriber.","Treatment may include an antipsychotic and/or mood stabiliser selected for phase, prior response and reproductive risk.","Bipolar depression requires specialist phase-specific treatment; avoid routine antidepressant monotherapy. Valproate carries major reproductive restrictions."]}]}],pages:[65],note:"The source calls it a depressive episode. Poor sleep/lithium alone cannot establish the current mood state. Its “history from mother” wording is retained only in the raw source, not assumed required.",adapted:false,set:"2021 · 23–25 January",images:[]},{id:"jcs-211",year:"2021",rotation:"Psychiatry",topic:"ocd",title:"A patient reports repetitive hand washing; the original presenting complaint is not remembered",case:"A patient reports repetitive hand washing; the original presenting complaint is not remembered.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask intrusive unwanted thoughts/images/urges and repetitive acts/mental rituals, time consumed, distress, avoidance and functional effect.","Assess insight, resistance, triggers, reassurance seeking, depression, suicide risk, psychosis and substance use."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["OCD versus generalised anxiety, health anxiety, psychosis, autism-related routines and obsessive-compulsive personality traits."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["MSE and functional/risk assessment; targeted physical investigations only if indicated, not a test to prove OCD."]},{heading:"Management",points:["CBT with exposure and response prevention; SSRIs depending on severity, preference and specialist assessment.","Explain that response may take time and OCD may need a different dose/duration strategy under supervision; review adherence and side effects.","Severe impairment/risk or nonresponse needs specialist input."]}]}],pages:[66],note:"History informant is unclear; ask the patient and obtain collateral with permission as appropriate.",adapted:false,set:"2021 · 23–25 January",images:[]},{id:"jcs-212",year:"2021",rotation:"Psychiatry",topic:"selfharm",title:"A 22-year-old woman has superficial hand cutting two weeks ago and longstanding anger/emotional reactivity since age 17. Focus on safety assessment",case:"A 22-year-old woman has superficial hand cutting two weeks ago and longstanding anger/emotional reactivity since age 17. Focus on safety assessment.",objectives:[{key:"r",label:"Perform a detailed psychosocial and safety assessment",sections:[{heading:"Elicit and formulate safety needs",points:["Attend physical injury/possible ingestion first; ask what happened, timing, intent, planning, expected lethality, substances, rescue and regret.","Ask current suicidal thoughts, plans/means, past attempts, triggers, supports, trauma/abuse, vulnerability and protective factors.","Explore long-standing emotion/interpersonal difficulties non-judgementally; do not diagnose a personality disorder from cutting alone.","Physical/toxicology assessment guided by injury/ingestion, MSE and comprehensive psychosocial formulation.","Do not use a numerical risk score or low/medium/high category to predict suicide or decide discharge."]},{heading:"Act on findings",points:["Immediate intent, serious injury/poisoning or inability to maintain safety: urgent emergency/crisis assessment and appropriate observation/support.","Collaborative safety plan: warning signs, coping, trusted contacts, crisis access and reducing access to lethal means.","Arrange timely aftercare and evidence-based therapy; structured therapies such as DBT may be considered for recurrent self-harm/emotion dysregulation. Do not prescribe solely to treat a personality label."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Self-harm may occur with depression, trauma, emotional dysregulation, substance use, psychosis or personality-related difficulties; assess the individual."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Physical/toxicology assessment guided by injury/ingestion, MSE and comprehensive psychosocial formulation.","Do not use a numerical risk score or low/medium/high category to predict suicide or decide discharge."]},{heading:"Management",points:["Immediate intent, serious injury/poisoning or inability to maintain safety: urgent emergency/crisis assessment and appropriate observation/support.","Collaborative safety plan: warning signs, coping, trusted contacts, crisis access and reducing access to lethal means.","Arrange timely aftercare and evidence-based therapy; structured therapies such as DBT may be considered for recurrent self-harm/emotion dysregulation. Do not prescribe solely to treat a personality label."]}]}],pages:[67],note:"The short account does not establish a personality diagnosis.",adapted:false,set:"2021 · 23–25 January",images:[]},{id:"jcs-213",year:"2022",rotation:"Medicine",topic:"diabetes",title:"A 34-year-old woman has urinary frequency for two months. She asks why it happened, complications, medication and kidney protection. ",case:"A 34-year-old woman has urinary frequency for two months. She asks why it happened, complications, medication and kidney protection. ",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask polyuria, polydipsia, weight loss, fatigue, infections, visual symptoms, duration and symptoms of hyperglycaemic crisis.","Assess diet/activity, family history, pregnancy, medicines/steroids, cardiovascular/renal disease and patient concerns."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Assess hydration, BMI with consent, BP, feet/pulses/sensation and eye screening status."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Type 2 diabetes versus type 1, gestational or secondary disease; confirm according to symptoms and diagnostic glucose/HbA1c criteria.","An isolated abnormal random reading in an otherwise well person may need confirmation rather than an immediate label."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["HbA1c or appropriate plasma glucose confirmation, renal function/eGFR, urine ACR, lipids/BP and complications screening.","Ketones/urgent metabolic work-up if weight loss, illness or possible insulin deficiency."]},{heading:"Management",points:["Individualised education, nutrition/activity support and medication based on HbA1c, renal function, cardiovascular/heart failure risk and preferences.","Metformin may be appropriate; SGLT2 inhibitors and GLP-1-based treatments have selected cardiorenal/metabolic indications; insulin if clinically needed.","Persistent albuminuria: optimise BP/glucose; ACE inhibitor/ARB and/or SGLT2 therapy when indicated with eGFR, potassium, pregnancy and contraindication checks—not automatically for everyone."]}]},{key:"custom",label:"Address kidney-protection concerns",sections:[{heading:"Important points",points:["Assess BP, eGFR and urine ACR, glycaemic control, smoking and cardiovascular risk. Explain that albuminuria management may include ACE inhibitor/ARB and SGLT2 therapy when indicated; check renal function/potassium and pregnancy precautions.","A father needing dialysis does not mean this patient will inevitably develop kidney failure; early monitoring and treatment reduce risk."]}]}],pages:[68],note:"",adapted:false,set:"2022 · cohort 2016",images:[]},{id:"jcs-214",year:"2022",rotation:"Medicine",topic:"asthma",title:"A woman has three months of shortness of breath and asks which medicines she needs",case:"A woman has three months of shortness of breath and asks which medicines she needs.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask variable wheeze, cough, chest tightness, nocturnal/exertional symptoms and triggers.","Assess previous ICU/admissions, attacks, reliever use, preventer adherence, technique, atopy and occupational exposures."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Observe speech/work of breathing, RR, pulse/SpO2; compare air entry and wheeze.","A silent chest, exhaustion or reduced consciousness is life-threatening; normal examination between attacks does not exclude asthma."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Asthma versus COPD, infection, dysfunctional breathing, heart failure; acute onset also consider anaphylaxis/foreign body."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Assess RR, speech, SpO2 and peak flow when safe in an attack.","When stable, confirm variable airflow obstruction/inflammation using age-appropriate objective testing such as spirometry/bronchodilator response, FeNO and peak-flow variability per pathway."]},{heading:"Management",points:["Acute severe features: urgent ABCDE, inhaled bronchodilator, oxygen and systemic steroid treatment under current acute protocol; do not delay for a complete history.","Long-term treatment must contain inhaled corticosteroid; current adult regimens may use ICS/formoterol-based AIR/MART depending on pathway, not reliever-only SABA care.","Check technique/adherence, triggers, personal action plan and follow-up."]}]}],pages:[68],note:"",adapted:false,set:"2022 · cohort 2016",images:[]},{id:"jcs-215",year:"2022",rotation:"Medicine",topic:"aortic",title:"A 45-year-old man has chest pain; aortic stenosis and HCM were recalled alternatives",case:"A 45-year-old man has chest pain; aortic stenosis and HCM were recalled alternatives.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask exertional chest pain, syncope/dyspnoea, family sudden death/cardiomyopathy, palpitations and vascular/ACS risks."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Pulse/BP, apex/heave/thrill and murmur site/radiation, lung bases/oedema; avoid exertional provocation in symptomatic outflow obstruction."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Aortic stenosis and hypertrophic cardiomyopathy are recalled alternatives, but ACS and other chest emergencies must be assessed first."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["ECG and urgent troponin/ACS work-up when indicated; echocardiography for valve/ventricular anatomy and obstruction."]},{heading:"Management",points:["Acute instability/chest pain red flags require urgent cardiac assessment.","Symptomatic severe aortic stenosis needs valve-team consideration; HCM management depends on obstruction/risk, with specialist medicines and sudden-death risk evaluation.","Do not prescribe one generic “until surgery” drug: vasodilation/preload reduction may be hazardous in severe outflow obstruction; exercise advice should be specialist-led."]}]}],pages:[68],note:"The source asks about drugs while waiting for possible surgery; no universal bridging regimen is safe for every outflow obstruction.",adapted:false,set:"2022 · cohort 2016",images:[]},{id:"jcs-216",year:"2022",rotation:"Paediatrics",topic:"constipation",title:"An eight-year-old girl has abdominal pain and two years of constipation, low fluid/fibre intake, normal development and an affected sister; meconium passage was reported",case:"An eight-year-old girl has abdominal pain and two years of constipation, low fluid/fibre intake, normal development and an affected sister; meconium passage was reported.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask stool frequency/consistency, painful stool/withholding, soiling, abdominal pain, diet/fluids, toilet training and medicines.","Ask meconium timing, onset from birth, growth, bilious vomiting, neurological signs, urinary symptoms and safeguarding concerns."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect growth, abdomen, spine/lower limb signs; internal rectal exam only when specifically indicated and appropriately trained/supervised."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Functional constipation is common; consider Hirschsprung, coeliac/hypothyroid and neurological disease if red flags."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Growth and abdominal/perianal or neurological assessment as indicated with consent; no routine abdominal X-ray or extensive tests for typical functional disease."]},{heading:"Management",points:["Explain retention/overflow, disimpact if needed using age-appropriate local regimen then maintenance laxative and planned review.","Regular supported toileting/reward routine, adequate fluids/fibre/activity; diet alone is often insufficient for established impaction.","Red flags require paediatric assessment rather than empirical prolonged treatment."]}]}],pages:[68],note:"",adapted:false,set:"2022 · cohort 2016",images:[]},{id:"jcs-217",year:"2022",rotation:"Paediatrics",topic:"meningitis",title:"A nine-month-old boy presents with abnormal movements. Discuss acute care, future recurrence and prevention",case:"A nine-month-old boy presents with abnormal movements. Discuss acute care, future recurrence and prevention.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask fever duration, feeding, irritability/lethargy, rash, neck symptoms, vomiting, seizures (duration/focality/recovery), immunisation and exposure.","In infants consider subtle poor feeding, apnoea or reduced responsiveness; do not require neck stiffness."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Observe before touching, age-specific vitals, perfusion, consciousness, fontanelle when appropriate, focal signs and rash; do not force painful/unsafe tests."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Bacterial meningitis/encephalitis versus febrile seizure, sepsis and metabolic disease; meningitis-associated seizures are not simply labelled benign febrile seizures."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["ABCDE, glucose, blood cultures and urgent blood tests; CSF only when safe and without delaying treatment; imaging according to indication."]},{heading:"Management",points:["Immediate senior paediatric/emergency care, age-appropriate empirical IV antimicrobials per protocol and seizure treatment if prolonged; do not wait for LP.","Manage shock/glucose/airway and monitor; isolate/public-health measures and contact prophylaxis for relevant organisms.","Arrange hearing/neurodevelopmental follow-up; discuss potential seizures/sequelae without guaranteeing epilepsy or no sequelae."]}]}],pages:[68],note:"",adapted:false,set:"2022 · cohort 2016",images:[]},{id:"jcs-218",year:"2022",rotation:"Paediatrics",topic:"itp",title:"A three-year-old boy has epistaxis. Discuss alternatives, treatment, admission and emergency control of the nosebleed",case:"A three-year-old boy has epistaxis. Discuss alternatives, treatment, admission and emergency control of the nosebleed.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask duration/severity of bleeding, bruises/petechiae, mucosal/other bleeding, recent viral illness/vaccine, medicines, family bleeding and systemic symptoms."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Look for mucosal bleeding, pallor, skin signs, nodes and hepatosplenomegaly gently."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["ITP, von Willebrand/other bleeding disorder, local nasal trauma, marrow disease/leukaemia or infection; fever/unwellness/bone pain/organomegaly is atypical for uncomplicated ITP."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Assess perfusion; FBC/film to confirm isolated thrombocytopenia and exclude other cytopenias; coagulation/other tests guided by features and haematology."]},{heading:"Management",points:["For epistaxis sit forward and pinch soft nose continuously for an appropriate interval (e.g. 10–15 minutes), avoid swallowing blood; persistent/severe bleeding needs emergency/ENT care.","ITP treatment/admission depends chiefly on bleeding and clinical context, not platelet number alone; observation for mild disease versus haematology-directed steroid/IVIG or emergency treatment.","Avoid aspirin/NSAIDs/contact trauma when thrombocytopenic; no routine marrow aspiration for every typical ITP case."]}]}],pages:[68],note:"",adapted:false,set:"2022 · cohort 2016",images:[]},{id:"jcs-219",year:"2022",rotation:"Psychiatry",topic:"healthanxiety",title:"A patient has worried about getting HIV for six months",case:"A patient has worried about getting HIV for six months.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Clarify actual exposure, timing, protection, tests/window periods, checking/reassurance seeking, internet searches, distress and effect on life.","Ask OCD, depression/suicide risk, sexual safety and substances without judgement."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Only clinically indicated examination; respect sexual-health confidentiality."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Health anxiety/OCD versus a genuine exposure needing testing; distinguish delusional conviction from an anxious doubt."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Offer appropriate confidential HIV/STI testing based on exposure and current window-period guidance, with consent.","If a very recent significant exposure is possible, urgently assess PEP eligibility rather than assuming anxiety."]},{heading:"Management",points:["Explain results and uncertainty accurately; agree a planned follow-up rather than endless repeated testing without indication.","CBT and treatment of comorbid anxiety/depression when appropriate; provide prevention advice and specialist referral as needed."]}]}],pages:[68],note:"",adapted:false,set:"2022 · cohort 2016",images:[]},{id:"jcs-220",year:"2022",rotation:"Psychiatry",topic:"anorexia",title:"A 24-year-old woman presents with poor intake. Discuss investigations, treatment and whether admission is needed",case:"A 24-year-old woman presents with poor intake. Discuss investigations, treatment and whether admission is needed.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Assess restriction, weight trajectory, fear of weight gain/body image, compensatory exercise/purging, intake, dizziness/syncope and menstruation/endocrine symptoms.","Ask mood, suicide/self-harm, substance use, function and supports; do not judge severity by appearance alone."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Assess hydration/perfusion, muscle weakness and signs of purging/malnutrition while preserving dignity."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Anorexia nervosa/other eating disorders versus GI, endocrine, chronic disease and depression; assess nutritional and psychiatric risk."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Consented weight/height and trend, lying/standing vitals if safe, temperature, ECG, glucose, electrolytes including phosphate/magnesium and organ function."]},{heading:"Management",points:["Bradycardia, hypotension, hypoglycaemia, electrolyte/ECG abnormalities, rapid decline or serious psychiatric risk needs urgent specialist/inpatient assessment.","Specialist multidisciplinary nutritional rehabilitation and psychological treatment; monitor refeeding risk with supervised plans.","Discuss capacity/consent sensitively; no single BMI threshold can safely determine admission."]}]}],pages:[68],note:"",adapted:false,set:"2022 · cohort 2016",images:[]},{id:"jcs-221",year:"2022",rotation:"Psychiatry",topic:"depression",title:"A patient presents with poor sleep",case:"A patient presents with poor sleep.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask low mood/anhedonia, duration, sleep, appetite/weight, energy, concentration, guilt, function and psychotic symptoms.","Screen previous mania/hypomania, substances, medicines, physical causes and stressors.","Directly ask self-harm/suicide thoughts, intent, plans, access to means, previous acts, supports and immediate safety."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Observe appearance/behaviour, speech, mood/affect, thought, perception, cognition, insight and risk."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Depressive episode, bipolar depression, adjustment/grief, substance/medical illness; exclude psychosis or postpartum emergency where relevant."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["MSE, psychosocial/risk formulation and targeted physical investigation (e.g. FBC/thyroid if indicated).","Severity is clinical and functional, not determined by a questionnaire alone."]},{heading:"Management",points:["Collaborative safety plan and urgent crisis help if immediate risk; do not leave someone at imminent risk unsupported.","Discuss psychological therapy, social/activity/sleep support and antidepressants depending on severity/preferences and local guidance.","If an SSRI is considered, explain delayed benefit, GI/sexual effects, activation, discontinuation and early review; reconsider antidepressant monotherapy if bipolar disorder suspected."]}]}],pages:[68],note:"",adapted:false,set:"2022 · cohort 2016",images:[]},{id:"jcs-222",year:"2022",rotation:"Surgery",topic:"appendicitis",title:"A patient presents with right lower quadrant pain",case:"A patient presents with right lower quadrant pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask onset/migration to RIF, anorexia, nausea/vomiting, fever, bowel/urinary symptoms and pregnancy/sexual-gynaecological context when relevant."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Vitals/general assessment and gentle abdomen away from pain, local tenderness/guarding; do not repeatedly provoke rebound; relevant genital/hernia/gynaecological exam only if indicated/consented."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Appendicitis versus gastroenteritis, mesenteric adenitis, urinary stone/infection, IBD and ectopic/ovarian pathology."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Observations, urine/pregnancy test, FBC/CRP/renal tests; ultrasound or CT based on age/pregnancy/risk and surgical assessment."]},{heading:"Management",points:["Analgesia, antiemetic and hydration as needed, nil by mouth pending surgery plan and prompt surgical review.","Antibiotics/appendicectomy versus selected nonoperative treatment depends on imaging, complications and patient/team decision; sepsis/peritonitis needs urgent care."]}]}],pages:[69],note:"",adapted:false,set:"2022 · cohort 2016",images:[]},{id:"jcs-223",year:"2022",rotation:"Surgery",topic:"anal",title:"A patient has rectal bleeding. Discuss alternatives, primary/secondary causes and options including surgery",case:"A patient has rectal bleeding. Discuss alternatives, primary/secondary causes and options including surgery.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask pain during/after stool, bright-red blood, constipation, trauma, chronicity, change in bowel habit, weight loss and IBD/STI/immunosuppression risks."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect for midline tear, sentinel tag and secondary features only as tolerated; severe pain means stop."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Anal fissure versus haemorrhoids, abscess, IBD and malignancy; lateral/multiple/nonhealing fissures suggest a secondary cause."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Gentle external inspection with explicit consent, chaperone and supervision; do not force painful DRE.","Further bowel/STI/IBD investigation by features/age, not a presumption all bleeding is benign."]},{heading:"Management",points:["Soften stool with fibre/fluids and appropriate laxative, analgesia and local measures.","Chronic fissure may need topical nitrate or calcium-channel-blocker tre
