 to previous organisms and local policy.","Airway clearance with physiotherapy, vaccinations, exercise and smoking cessation.","Specialist management for frequent exacerbations or chronic colonisation; significant haemoptysis is urgent."]}]}],pages:[15],note:"",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-139",year:"2017",rotation:"Medicine",topic:"prosthetic",title:"A man has palpitations and breathlessness; previous valve surgery is recalled",case:"A man has palpitations and breathlessness; previous valve surgery is recalled.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask operation date, valve position/type, indication, dyspnoea, fever, bleeding, embolic symptoms and adherence.","Review warfarin/other medicines, INR monitoring, interactions, pregnancy plans and dental care."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect sternotomy/thoracotomy scars, assess pulse, BP/JVP, locate and describe valve sounds and murmurs, assess heart failure/peripheral embolic signs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Mechanical valve sounds may explain a click; new symptoms also suggest valve thrombosis, paravalvular leak, endocarditis or another lesion."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Obtain valve card/operative record, ECG and echo; INR if taking warfarin.","If fever/endocarditis suspected, urgent cultures and cardiac imaging through a specialist team."]},{heading:"Management",points:["Mechanical valves generally require lifelong vitamin-K-antagonist anticoagulation; DOACs are not a substitute for mechanical-valve anticoagulation.","INR target depends on valve model, position and thromboembolic risk; check the patient-specific anticoagulation plan, not one universal aortic/mitral range.","Periprocedural interruption/bridging requires specialist planning; never advise stopping anticoagulation independently."]}]}],pages:[15],note:"",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-140",year:"2017",rotation:"Procedures",topic:"lp",title:"A man presents with fever and headache. Take history, explain/demonstrate LP, interpret the recalled results and plan care",case:"A man presents with fever and headache. Take history, explain/demonstrate LP, interpret the recalled results and plan care.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask fever, headache, photophobia, neck stiffness, rash, seizures, consciousness, immunosuppression, anticoagulants and focal symptoms."]}]},{key:"p",label:"Demonstrate or explain the procedure safely",sections:[{heading:"Safety and steps",points:["Prioritise ABCDE and prompt empirical IV antibiotics per age/local policy; dexamethasone where indicated by current pathway.","Model-only LP: consent, contraindication check, asepsis, trained positioning at L3/4 or L4/5, local analgesia, sterile sampling and documentation.","Defer LP and obtain senior help for instability, signs of raised intracranial pressure/focal deficit, significant bleeding risk or local infection; monitor afterwards."]},{heading:"Checks and samples",points:["Blood cultures/glucose and urgent routine bloods; CSF opening pressure when indicated, cells/differential, protein, paired glucose, Gram stain/culture and PCR.","Do not delay antibiotics in suspected bacterial meningitis for LP or imaging; CT before LP only when clinical criteria indicate, and a normal CT does not guarantee safety."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Consider bacterial/viral meningitis, encephalitis and other causes; interpret CSF with the clinical picture."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Blood cultures/glucose and urgent routine bloods; CSF opening pressure when indicated, cells/differential, protein, paired glucose, Gram stain/culture and PCR.","Do not delay antibiotics in suspected bacterial meningitis for LP or imaging; CT before LP only when clinical criteria indicate, and a normal CT does not guarantee safety."]},{heading:"Management",points:["Prioritise ABCDE and prompt empirical IV antibiotics per age/local policy; dexamethasone where indicated by current pathway.","Model-only LP: consent, contraindication check, asepsis, trained positioning at L3/4 or L4/5, local analgesia, sterile sampling and documentation.","Defer LP and obtain senior help for instability, signs of raised intracranial pressure/focal deficit, significant bleeding risk or local infection; monitor afterwards."]}]}],pages:[15,16],note:"Bacterial meningitis/Gram stain recalled but results/image absent; antibiotic choice depends on age, allergies and current local protocol.",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-141",year:"2017",rotation:"Paediatrics",topic:"tga",title:"A child has bluish discolouration, poor feeding and lethargy",case:"A child has bluish discolouration, poor feeding and lethargy.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Establish early neonatal cyanosis, feeding distress, timing after birth and antenatal/birth history; assess fever/poor perfusion."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["TGA is an important cause of severe early cyanosis; compare other cyanotic CHD, pulmonary disease and sepsis."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Immediate pre/postductal oxygenation assessment, glucose/blood gas and urgent echo; ECG/CXR support but do not exclude disease."]},{heading:"Management",points:["Urgent neonatal/cardiology stabilisation and transfer; specialist-directed prostaglandin to maintain ductal patency when indicated.","Inadequate mixing may require urgent balloon atrial septostomy; definitive correction is usually an arterial switch procedure."]}]}],pages:[16],note:"",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-142",year:"2017",rotation:"Paediatrics",topic:"coeliac",title:"An 11-month-old has diarrhoea and poor weight gain",case:"An 11-month-old has diarrhoea and poor weight gain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask chronic diarrhoea/steatorrhoea, distension, pain, weight/growth, gluten exposure, anaemia, family/autoimmune history and diet."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Coeliac disease versus CF, chronic infection, food-protein disease, IBD and other malabsorption; age and gluten exposure matter."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Growth chart, FBC/ferritin and nutritional assessment; total IgA and tTG-IgA while eating gluten, with alternative tests if IgA deficient.","Paediatric/gastroenterology confirmation pathway (selected children may meet no-biopsy criteria; others need biopsy)."]},{heading:"Management",points:["Do not start a gluten-free diet before appropriate diagnostic testing unless advised by specialist.","After confirmation: lifelong gluten-free diet with dietitian, correct deficiencies, monitor growth/serology and family risk testing as appropriate."]}]}],pages:[16],note:"",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-143",year:"2017",rotation:"Paediatrics",topic:"cp",title:"A child presents with abnormal movements",case:"A child presents with abnormal movements.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Take antenatal/perinatal history, prematurity/injury, developmental trajectory, asymmetry, seizures, feeding, vision/hearing and functional abilities.","Ask regression: CP reflects a non-progressive brain disturbance, so loss of skills needs another explanation."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Spastic CP is supported by persistent abnormal tone/reflexes and motor impairment; consider neuromuscular disease, genetic/metabolic disorders, spinal lesions and dystonia depending on pattern."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Developmental/neurological assessment, hearing/vision and nutrition/swallow review; brain MRI and other tests when indicated by specialists."]},{heading:"Management",points:["Multidisciplinary care: physiotherapy/OT, speech and feeding support, tone/contracture management, assistive equipment, education and caregiver support.","Treat epilepsy/pain and monitor hip/spine, nutrition and respiratory complications."]}]}],pages:[16],note:"",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-144",year:"2017",rotation:"Genetics",topic:"down",title:"A mother attends for genetic counselling after her child was diagnosed with Down syndrome; a paternal Robertsonian translocation is recalled",case:"A mother attends for genetic counselling after her child was diagnosed with Down syndrome; a paternal Robertsonian translocation is recalled.",objectives:[{key:"g",label:"Take a genetic history, draw a pedigree and explain recurrence risk",sections:[{heading:"History and pedigree",points:["Take three-generation pedigree, affected pregnancies/miscarriages, parental ages and the actual child/parental chromosome reports.","Draw at least three generations where possible: proband, relationships, ages, affected status, relevant test results, miscarriages and consanguinity; include a legend and distinguish known results from assumptions."]},{heading:"Inheritance, recurrence and choices",points:["Distinguish free trisomy 21, Robertsonian translocation and mosaicism; do not apply one recurrence figure to all mechanisms.","Recurrence depends on which chromosomes are involved and which parent carries the translocation.","For a balanced paternal rob(14;21), risk is generally lower than for a maternal carrier; a rob(21;21) has a very different, very high affected-livebirth risk. Obtain a report-specific estimate rather than guessing.","Discuss diagnostic prenatal testing and preimplantation testing where available and the limits of screening.","Use non-directive counselling, explain a balanced carrier may be healthy and address guilt; offer developmental/medical support."]}]}],pages:[16],note:"Exact chromosome rearrangement is not supplied; do not invent a precise recurrence figure.",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-145",year:"2017",rotation:"Psychiatry",topic:"dementia",title:"An older woman has two years of forgetfulness and agitation; take a history from her daughter",case:"An older woman has two years of forgetfulness and agitation; take a history from her daughter.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Obtain patient and collateral accounts with permission: gradual versus acute/fluctuating onset, memory/language/executive changes and daily function.","Ask mood, psychosis, medicines, alcohol, neurological events, sensory problems, driving, finances, medication safety and caregiver needs."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Explain progressive impairment compassionately, distinguish normal ageing, discuss uncertainty and check caregiver strain.","Agree support, medication simplification, safeguarding/driving assessment and advance planning while preserving autonomy.","Specialist subtype-based medication: cholinesterase inhibitors and/or memantine when indicated; discuss adverse effects and limits.","Support caregivers and arrange community/functional assessment."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Physical/neurological exam, validated language/culture-appropriate cognitive assessment, sensory review and collateral.","Reversible-cause blood tests and specialist-selected structural imaging; refer to memory/neurology service as appropriate."]},{heading:"Management",points:["Agree support, medication simplification, safeguarding/driving assessment and advance planning while preserving autonomy.","Specialist subtype-based medication: cholinesterase inhibitors and/or memantine when indicated; discuss adverse effects and limits.","Support caregivers and arrange community/functional assessment."]}]}],pages:[17],note:"",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-146",year:"2017",rotation:"Psychiatry",topic:"adhd",title:"A seven-year-old has restlessness and hyperactivity; discuss assessment and care with the mother",case:"A seven-year-old has restlessness and hyperactivity; discuss assessment and care with the mother.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Assess inattention and hyperactivity/impulsivity with examples, onset before age 12, persistence and impairment in at least two settings.","Obtain parent/school reports, developmental/hearing/vision history, sleep, learning, autism, anxiety, trauma and family history."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Stimulants: reduced appetite, insomnia, abdominal/headache and pulse/BP effects. Atomoxetine: GI/mood effects; guanfacine: sedation and hypotension.","Explore reluctance to medicate and offer shared decisions; sleep hygiene includes routine, limiting late screens/caffeine and assessing other sleep problems.","Parent/carer training and school/environmental adjustments, predictable routines and sleep support.","Medication for persistent significant impairment through specialists: stimulants such as methylphenidate and selected non-stimulants such as atomoxetine/guanfacine according to age/local pathway.","Monitor response, appetite/growth, sleep, pulse/BP and mood; not every family must begin with medication."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Specialist developmental/ADHD assessment with structured rating information across settings; no single blood test or IQ test confirms ADHD.","Before medication, assess height/weight, pulse/BP, cardiac/family history and other baseline requirements."]},{heading:"Management",points:["Parent/carer training and school/environmental adjustments, predictable routines and sleep support.","Medication for persistent significant impairment through specialists: stimulants such as methylphenidate and selected non-stimulants such as atomoxetine/guanfacine according to age/local pathway.","Monitor response, appetite/growth, sleep, pulse/BP and mood; not every family must begin with medication."]}]}],pages:[17],note:"",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-147",year:"2017",rotation:"Psychiatry",topic:"gad",title:"A man has anxiety over six months",case:"A man has anxiety over six months.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask domains, duration, uncontrollability, restlessness, muscle tension, sleep, irritability, concentration and function.","Ask panic, OCD, depression/suicidality, trauma, caffeine/substances and physical/medicine causes."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Validate symptoms, explain the worry cycle and agree sleep, caffeine, activity and psychological support strategies.","Psychoeducation, self-help and CBT/applied relaxation; consider an SSRI based on persistent impairment and shared decisions.","Discuss activation, GI/sexual side effects, delayed benefit and follow-up; avoid routine long-term benzodiazepine dependence."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["MSE and targeted physical/thyroid/other tests if symptoms suggest a medical cause."]},{heading:"Management",points:["Psychoeducation, self-help and CBT/applied relaxation; consider an SSRI based on persistent impairment and shared decisions.","Discuss activation, GI/sexual side effects, delayed benefit and follow-up; avoid routine long-term benzodiazepine dependence."]}]}],pages:[17],note:"",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-148",year:"2017",rotation:"Psychiatry",topic:"alcohol",title:"A 35-year-old man with heavy alcohol consumption wants to stop",case:"A 35-year-old man with heavy alcohol consumption wants to stop.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Quantify units/standard drinks, beverage/strength, pattern, last drink, duration and binge use.","Ask craving, loss of control, tolerance, withdrawal, morning drinking, past seizures/delirium tremens, attempts to stop, other substances and physical/mental consequences.","Assess self-harm, driving/forensic risk, work/relationships, nutrition, housing, support and goals."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Ask permission to discuss drinking, reflect goals, avoid judgement and make a practical reduction/treatment plan.","Assess need for supervised/inpatient withdrawal, especially previous seizures/DTs, severe illness, pregnancy, poor support or high risk.","Do not advise abrupt unsupported cessation in a dependent drinker; supervised benzodiazepine regimens and thiamine follow local protocol.","Motivational interviewing, psychosocial/addiction support and specialist relapse-prevention medicines such as acamprosate/naltrexone when suitable; arrange follow-up."]}]}],pages:[17],note:"",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-149",year:"2017",rotation:"FAMCO",topic:"diabetes",title:"A 40-year-old woman had an abnormal random blood glucose reading yesterday",case:"A 40-year-old woman had an abnormal random blood glucose reading yesterday.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask polyuria, polydipsia, weight loss, fatigue, infections, visual symptoms, duration and symptoms of hyperglycaemic crisis.","Assess diet/activity, family history, pregnancy, medicines/steroids, cardiovascular/renal disease and patient concerns."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Explain microvascular and cardiovascular complications without fatalism; kidney failure is not inevitable. Discuss smoking cessation, monitoring, annual reviews and sick-day/hypoglycaemia advice tailored to medicines.","Individualised education, nutrition/activity support and medication based on HbA1c, renal function, cardiovascular/heart failure risk and preferences.","Metformin may be appropriate; SGLT2 inhibitors and GLP-1-based treatments have selected cardiorenal/metabolic indications; insulin if clinically needed.","Persistent albuminuria: optimise BP/glucose; ACE inhibitor/ARB and/or SGLT2 therapy when indicated with eGFR, potassium, pregnancy and contraindication checks—not automatically for everyone."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["HbA1c or appropriate plasma glucose confirmation, renal function/eGFR, urine ACR, lipids/BP and complications screening.","Ketones/urgent metabolic work-up if weight loss, illness or possible insulin deficiency."]},{heading:"Management",points:["Individualised education, nutrition/activity support and medication based on HbA1c, renal function, cardiovascular/heart failure risk and preferences.","Metformin may be appropriate; SGLT2 inhibitors and GLP-1-based treatments have selected cardiorenal/metabolic indications; insulin if clinically needed.","Persistent albuminuria: optimise BP/glucose; ACE inhibitor/ARB and/or SGLT2 therapy when indicated with eGFR, potassium, pregnancy and contraindication checks—not automatically for everyone."]}]}],pages:[17],note:"",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-150",year:"2017",rotation:"FAMCO",topic:"urti",title:"A woman attends with rhinorrhoea and requests antibiotics",case:"A woman attends with rhinorrhoea and requests antibiotics.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask onset, nasal blockage/discharge, sore throat, cough, fever, facial pain, duration and deterioration; allergy triggers, medicines and immune risk.","Assess breathlessness, dehydration, severe systemic illness or focal complications; explore expectations and why antibiotics are wanted."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Viral URTI, allergic rhinitis and selected bacterial sinusitis depending on duration/severity; do not infer bacterial disease from coloured discharge alone."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Important points",points:["Request relevant examination/observations and tests only if indicated; most uncomplicated viral colds need no antibiotic.","Offer symptom relief suited to pregnancy/comorbidity, hydration and safety-net; discuss expected course and reassessment for persistence or worsening.","Acknowledge concerns and explain antibiotic harms/resistance without confrontation; use local delayed/immediate prescribing criteria if bacterial disease is suspected."]}]}],pages:[18],note:"Respiratory, not urinary presentation: see the added station-specific answer below. Generic urinary sections are replaced.",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-151",year:"2017",rotation:"Oral health",topic:"hsv",title:"A six-year-old has fever, painful oral vesicles and reduced food/fluid intake",case:"A six-year-old has fever, painful oral vesicles and reduced food/fluid intake.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask fever, painful oral lesions, gingival symptoms, hydration/urine, intake, contacts, immunosuppression and eye symptoms.","Address parent fears of leukaemia while checking persistent fever, bruising, weight loss or pallor if present."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Assess hydration and oral/perioral distribution; usually clinical; targeted viral testing/other investigations if severe/atypical."]},{heading:"Management",points:["Age-appropriate analgesia, frequent fluids and hydration support; admission if unable to maintain hydration, severe disease or high-risk child.","Early oral aciclovir may be considered for severe early disease per paediatric protocol; immunocompromised cases require urgent specialist care.","Avoid sharing utensils/kissing lesions; hand hygiene and avoid eye touching; no antibiotics unless bacterial indication."]}]}],pages:[18],note:"",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-152",year:"2017",rotation:"Dermatology",topic:"eczema",title:"A child has itching and redness; discuss care with the mother",case:"A child has itching and redness; discuss care with the mother.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask itch/dryness, distribution, triggers, age of onset, atopy/family history, products, infection symptoms and previous treatment.","Assess sleep, school/family impact and adherence/concerns about steroids."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Correct topical steroid use is generally safe; excessive strong/prolonged use can cause atrophy, striae, pigment change and rarely systemic effects, particularly in children.","Keep nails short, manage itch/sleep; do not prescribe food exclusion diets without evidence and nutritional support.","Regular generous emollient, soap substitutes, irritant avoidance and comfortable clothing.","Topical corticosteroid of appropriate potency for age/site/severity during flares with clear application/duration instructions; review rather than avoid needed treatment because of fear.","Escalate difficult disease; eczema herpeticum (painful monomorphic vesicles/erosions ± fever/eye involvement) needs urgent care."]}]}],pages:[18],note:"",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-153",year:"Unstated",rotation:"FAMCO",topic:"migraine",title:"A patient presents with headache. Take a history, discuss alternatives, advise treatment and write a suitable prescription",case:"A patient presents with headache. Take a history, discuss alternatives, advise treatment and write a suitable prescription.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Characterise onset, time course, location, quality, severity, duration, aura, nausea, light/sound sensitivity and activity effect.","Ask thunderclap onset, fever/meningism, new neurological deficit, pregnancy/postpartum, cancer/immunosuppression, trauma, positional/exertional change and medication overuse."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Migraine versus tension-type/cluster, medication-overuse and secondary headache.","Band-like headache with no red flags may be tension-type; do not force a migraine diagnosis from the presenting word alone."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Vitals and focused neurological/fundal assessment; targeted urgent imaging/LP pathway for red flags.","Routine MRI is not indicated solely for reassurance after a typical primary headache and normal appropriate assessment."]},{heading:"Management",points:["Explain working diagnosis and safety-net; headache diary, sleep/hydration/regular meals and trigger management.","Acute migraine: suitable simple analgesic/NSAID and/or triptan ± antiemetic after contraindications; tension-type generally simple analgesia; avoid opioids.","Discuss prevention if frequent/disabling, with pregnancy and reproductive-safety considerations. Any prescription requires allergy, pregnancy, interaction, dose/duration and follow-up checks."]}]}],pages:[19],note:"",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-154",year:"Unstated",rotation:"Dermatology",topic:"lichen",title:"A patient has an itchy skin lesion. Describe the photograph and discuss diagnosis and care",case:"A patient has an itchy skin lesion. Describe the photograph and discuss diagnosis and care.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask itch, onset/distribution, new medicines, oral/genital symptoms, nails/scalp and infection risks relevant to local context."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Lichen planus versus eczema, psoriasis, drug-related lichenoid eruption and other papular rashes."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Clinical assessment; biopsy if uncertain; targeted hepatitis/other testing based on risk, not automatically all patients."]},{heading:"Management",points:["Appropriate topical corticosteroid and itch care; widespread/mucosal/scalp disease needs dermatology/oral review.","Review causative medicines with prescriber and monitor persistent oral lesions."]}]},{key:"x",label:"Describe and interpret the supplied image or findings",sections:[{heading:"Describe, then interpret",points:["Describe pruritic polygonal flat-topped papules, often violaceous/brown/grey according to skin tone, possible fine white Wickham striae; inspect mucosa with consent.","Lichen planus versus eczema, psoriasis, drug-related lichenoid eruption and other papular rashes."]}]}],pages:[19],note:"Lichen planus recalled; photo absent.",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-155",year:"Unstated",rotation:"Oral health",topic:"xerostomia",title:"A patient presents with dry mouth. Take a history, request relevant examination and discuss care",case:"A patient presents with dry mouth. Take a history, request relevant examination and discuss care.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask dryness duration, dry eyes, swallowing/speech/taste difficulties, dental pain, parotid swelling and fluid intake.","Review anticholinergics (e.g. amitriptyline), other medicines, SLE/autoimmune symptoms, diabetes, radiation and tobacco."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Oral/dental assessment and salivary/eye assessment as indicated; cause-directed glucose/autoimmune work-up with specialists.","Examine for caries, candidiasis and mucosal injury; do not infer Sjögren solely from SLE plus dry mouth."]},{heading:"Management",points:["Review/change offending medicine only with prescriber; frequent water sips, sugar-free gum if suitable and saliva substitutes.","High-fluoride preventive dental care as advised, regular dental review and treat caries/candidiasis when present.","Avoid sugary/acidic drinks, alcohol-containing mouthwash and smoking; refer suspected systemic disease."]}]}],pages:[19],note:"",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-156",year:"Unstated",rotation:"FAMCO",topic:"whitecoat",title:"A 40-year-old man attends hypertension follow-up. Ask about medication and home/ambulatory readings",case:"A 40-year-old man attends hypertension follow-up. Ask about medication and home/ambulatory readings.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask previous readings, home/ambulatory results, technique, medicines/adherence, NSAIDs/decongestants/stimulants, family risk and lifestyle.","Assess headache/vision change, chest pain, dyspnoea, neurological symptoms and renal/endocrine secondary-cause clues."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["White-coat hypertension requires elevated clinic but normal out-of-office BP; consider sustained, masked and secondary hypertension."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Repeat standardised clinic BP with correct cuff; arrange ABPM/HBPM according to pathway.","Assess urine ACR/haematuria, renal function/electrolytes, glucose/lipids, ECG and target-organ effects as appropriate."]},{heading:"Management",points:["Acute symptoms/signs of end-organ injury with markedly elevated BP: emergency assessment.","Confirm diagnosis and cardiovascular risk before long-term medication decisions; lifestyle support and monitoring if isolated white-coat pattern.","Confirmed hypertension: guideline-based medicines with comorbidity, pregnancy and monitoring considered."]}]}],pages:[19],note:"",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-157",year:"Unstated",rotation:"Psychiatry",topic:"adhd",title:"An eight-year-old boy is easily distracted and hyperactive; his father attends",case:"An eight-year-old boy is easily distracted and hyperactive; his father attends.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Assess inattention and hyperactivity/impulsivity with examples, onset before age 12, persistence and impairment in at least two settings.","Obtain parent/school reports, developmental/hearing/vision history, sleep, learning, autism, anxiety, trauma and family history."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["ADHD versus sleep deprivation, hearing/learning difficulties, autism, anxiety, mood disorders and environmental stressors; evaluate comorbidity."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Specialist developmental/ADHD assessment with structured rating information across settings; no single blood test or IQ test confirms ADHD.","Before medication, assess height/weight, pulse/BP, cardiac/family history and other baseline requirements."]},{heading:"Management",points:["Parent/carer training and school/environmental adjustments, predictable routines and sleep support.","Medication for persistent significant impairment through specialists: stimulants such as methylphenidate and selected non-stimulants such as atomoxetine/guanfacine according to age/local pathway.","Monitor response, appetite/growth, sleep, pulse/BP and mood; not every family must begin with medication."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Stimulants: reduced appetite, insomnia, abdominal/headache and pulse/BP effects. Atomoxetine: GI/mood effects; guanfacine: sedation and hypotension.","Explore reluctance to medicate and offer shared decisions; sleep hygiene includes routine, limiting late screens/caffeine and assessing other sleep problems.","Parent/carer training and school/environmental adjustments, predictable routines and sleep support.","Medication for persistent significant impairment through specialists: stimulants such as methylphenidate and selected non-stimulants such as atomoxetine/guanfacine according to age/local pathway.","Monitor response, appetite/growth, sleep, pulse/BP and mood; not every family must begin with medication."]}]}],pages:[20],note:"",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-158",year:"Unstated",rotation:"Psychiatry",topic:"ocd",title:"A 40-year-old man reports repeated hand washing",case:"A 40-year-old man reports repeated hand washing.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask intrusive unwanted thoughts/images/urges and repetitive acts/mental rituals, time consumed, distress, avoidance and functional effect.","Assess insight, resistance, triggers, reassurance seeking, depression, suicide risk, psychosis and substance use."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["OCD versus generalised anxiety, health anxiety, psychosis, autism-related routines and obsessive-compulsive personality traits."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["MSE and functional/risk assessment; targeted physical investigations only if indicated, not a test to prove OCD."]},{heading:"Management",points:["CBT with exposure and response prevention; SSRIs depending on severity, preference and specialist assessment.","Explain that response may take time and OCD may need a different dose/duration strategy under supervision; review adherence and side effects.","Severe impairment/risk or nonresponse needs specialist input."]}]}],pages:[20],note:"",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-159",year:"Unstated",rotation:"Psychiatry",topic:"postpartum",title:"A 25-year-old woman presents with fatigue after childbirth",case:"A 25-year-old woman presents with fatigue after childbirth.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask timing after delivery, mood/anhedonia, sleep apart from infant care, functioning, bonding, support, trauma and previous mental illness.","Ask directly about suicide, intrusive thoughts versus intent to harm the baby, psychosis, mania and safeguarding."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Postpartum depression versus transient baby blues, postpartum psychosis, bipolar illness and physical causes such as anaemia/thyroid disease."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["MSE and immediate maternal/infant safety assessment; targeted physical tests and perinatal mental-health review."]},{heading:"Management",points:["Psychosis, mania, severe risk or inability to care safely: emergency perinatal/psychiatric assessment.","Offer psychological and practical/family support; consider antidepressants based on severity, previous response and breastfeeding/pregnancy medication guidance.","Arrange early follow-up and an explicit support/safety plan."]}]}],pages:[20],note:"",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-160",year:"Unstated",rotation:"Psychiatry",topic:"dementia",title:"A 25-year-old son reports his mother’s forgetfulness for one year; stroke history was recalled",case:"A 25-year-old son reports his mother’s forgetfulness for one year; stroke history was recalled.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Obtain patient and collateral accounts with permission: gradual versus acute/fluctuating onset, memory/language/executive changes and daily function.","Ask mood, psychosis, medicines, alcohol, neurological events, sensory problems, driving, finances, medication safety and caregiver needs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Alzheimer disease, vascular/mixed and other dementias; exclude delirium, depression and reversible medical/drug causes.","A history of stroke alone does not establish vascular dementia; time course and neurological/cognitive pattern matter."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Physical/neurological exam, validated language/culture-appropriate cognitive assessment, sensory review and collateral.","Reversible-cause blood tests and specialist-selected structural imaging; refer to memory/neurology service as appropriate."]},{heading:"Management",points:["Agree support, medication simplification, safeguarding/driving assessment and advance planning while preserving autonomy.","Specialist subtype-based medication: cholinesterase inhibitors and/or memantine when indicated; discuss adverse effects and limits.","Support caregivers and arrange community/functional assessment."]}]}],pages:[20],note:"The source suggests vascular dementia; verify pattern and course rather than inferring it solely from stroke.",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-161",year:"Unstated",rotation:"Medicine",topic:"bronchiectasis",title:"A 57-year-old woman has cough and shortness of breath",case:"A 57-year-old woman has cough and shortness of breath.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Characterise chronic cough, daily sputum volume/purulence, recurrent infection, haemoptysis, breathlessness and exacerbations.","Ask childhood disease/CF, aspiration, immune/connective-tissue disease, smoking, TB exposure and previous cultures/treatment."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect work of breathing and sputum, clubbing, pulse and SpO2; examine trachea and expansion.","Compare percussion, auscultation and vocal resonance anteriorly/posteriorly including bases; describe coarse crackles/wheeze without inventing signs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Bronchiectasis is suggested by chronic productive cough with coarse crackles/clubbing; consider COPD, TB, lung cancer and interstitial disease."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Observations/SpO2, sputum culture and chest radiograph initially.","High-resolution CT confirms bronchiectasis; spirometry and cause-directed immune/CF testing as appropriate."]},{heading:"Management",points:["Assess exacerbation severity and sepsis; culture-guided antibiotics according to previous organisms and local policy.","Airway clearance with physiotherapy, vaccinations, exercise and smoking cessation.","Specialist management for frequent exacerbations or chronic colonisation; significant haemoptysis is urgent."]}]}],pages:[21],note:"",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-162",year:"Unstated",rotation:"Medicine",topic:"prosthetic",title:"A 35-year-old man has palpitations and breathlessness; a metallic valve is recalled",case:"A 35-year-old man has palpitations and breathlessness; a metallic valve is recalled.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask operation date, valve position/type, indication, dyspnoea, fever, bleeding, embolic symptoms and adherence.","Review warfarin/other medicines, INR monitoring, interactions, pregnancy plans and dental care."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect sternotomy/thoracotomy scars, assess pulse, BP/JVP, locate and describe valve sounds and murmurs, assess heart failure/peripheral embolic signs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Mechanical valve sounds may explain a click; new symptoms also suggest valve thrombosis, paravalvular leak, endocarditis or another lesion."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Obtain valve card/operative record, ECG and echo; INR if taking warfarin.","If fever/endocarditis suspected, urgent cultures and cardiac imaging through a specialist team."]},{heading:"Management",points:["Mechanical valves generally require lifelong vitamin-K-antagonist anticoagulation; DOACs are not a substitute for mechanical-valve anticoagulation.","INR target depends on valve model, position and thromboembolic risk; check the patient-specific anticoagulation plan, not one universal aortic/mitral range.","Periprocedural interruption/bridging requires specialist planning; never advise stopping anticoagulation independently."]}]}],pages:[21],note:"",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-163",year:"Unstated",rotation:"Medicine",topic:"tia",title:"A 65-year-old man has right-sided weakness since this morning",case:"A 65-year-old man has right-sided weakness since this morning.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Establish exact onset/last known well, symptom duration/resolution, face/limb/speech/vision/balance symptoms and residual deficit.","Ask AF/vascular risks, anticoagulation, seizure/migraine and glucose-related symptoms."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Ongoing focal deficit: possible acute stroke, not TIA. Transient focal symptoms may be TIA but mimics need assessment."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["ABCDE, glucose, focused neurological exam and immediate stroke pathway if ongoing/recent deficit.","Specialist TIA/stroke assessment, brain/vascular imaging as indicated, ECG/rhythm and risk-factor tests; do not use ABCD2 alone to decide urgency."]},{heading:"Management",points:["Acute stroke requires time-critical specialist reperfusion/haemorrhage evaluation; no oral intake before swallow safety assessment.","Suspected resolved TIA needs urgent specialist assessment (often within 24 hours); antiplatelet and prevention per current pathway and contraindications.","Address AF, carotids, BP/lipids, smoking and driving guidance after diagnosis."]}]}],pages:[21],note:"Source calls this TIA, but persistent weakness must be treated as possible acute stroke.",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-164",year:"Unstated",rotation:"Medicine",topic:"malaria",title:"A 33-year-old businessman has fever after returning from Congo",case:"A 33-year-old businessman has fever after returning from Congo.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Obtain exact countries/regions/dates, exposures, prophylaxis/adherence, fever pattern, headache, GI symptoms, jaundice, dark urine and neurological/respiratory symptoms.","Assess pregnancy, prior malaria, comorbidity and sepsis risks."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Malaria (especially falciparum after Congo/sub-Saharan travel), enteric fever, dengue/other imported infection and non-travel infection."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Urgent thick/thin blood films or approved rapid test with microscopy for species/parasitaemia; repeat testing if strong suspicion with initial negative per pathway.","FBC, glucose, renal/liver profile, lactate/blood gas and cultures as appropriate; assess severe disease."]},{heading:"Management",points:["Urgent infectious-disease input; severe malaria is a medical emergency treated with IV artesunate and monitored care per current protocol.","Uncomplicated therapy depends on species, region/resistance, pregnancy and current local guidance; an effective ACT is commonly used for falciparum.","Do not copy the old recall’s chloroquine suggestion for presumed African falciparum; widespread resistance matters. Vivax/ovale anti-relapse treatment requires G6PD assessment and specialist pregnancy precautions."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Explain adherence and return for deterioration; specimen morphology/species cannot be identified when the recalled microscope image is absent.","Urgent infectious-disease input; severe malaria is a medical emergency treated with IV artesunate and monitored care per current protocol.","Uncomplicated therapy depends on species, region/resistance, pregnancy and current local guidance; an effective ACT is commonly used for falciparum.","Do not copy the old recall’s chloroquine suggestion for presumed African falciparum; widespread resistance matters. Vivax/ovale anti-relapse treatment requires G6PD assessment and specialist pregnancy precautions."]}]}],pages:[21],note:"Microscopy was recalled but is not supplied. Historical chloroquine/mefloquine suggestions are not a current universal treatment regimen.",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-165",year:"Unstated",rotation:"Genetics",topic:"cf",title:"A 25-year-old woman and her husband attend because their daughter has cystic fibrosis",case:"A 25-year-old woman and her husband attend because their daughter has cystic fibrosis.",objectives:[{key:"g",label:"Take a genetic history, draw a pedigree and explain recurrence risk",sections:[{heading:"History and pedigree",points:["Ask recurrent chest infection/chronic cough, greasy bulky stools, feeding/growth, meconium ileus, salt-loss symptoms, siblings and screening results.","Draw at least three generations where possible: proband, relationships, ages, affected status, relevant test results, miscarriages and consanguinity; include a legend and distinguish known results from assumptions."]},{heading:"Inheritance, recurrence and choices",points:["CF versus other malabsorption, chronic infection, immune disease or inadequate intake.","Specialist CF team: airway clearance, infection treatment, nutrition/pancreatic enzymes and fat-soluble vitamins when needed; genotype-appropriate modulators through specialists.","If both parents are carriers: 25% affected, 50% carrier, 25% neither each pregnancy; offer genetic/reproductive counselling and partner testing.","Explain variable course, multidisciplinary care and non-directive inheritance/testing options; use a three-generation pedigree for genetic objective."]}]}],pages:[22],note:"",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-166",year:"Unstated",rotation:"Paediatrics",topic:"psgn",title:"A five-year-old boy has dark urine for three days, two weeks after a sore throat",case:"A five-year-old boy has dark urine for three days, two weeks after a sore throat.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask dark/tea-coloured urine versus blood, oedema, urine output, headache, breathlessness and timing after throat/skin infection.","Assess urinary pain/fever, family renal disease, systemic rash/joint symptoms and medicines."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Post-streptococcal GN, IgA nephropathy, UTI, other glomerulonephritis and non-haematuric dark urine; PSGN often follows a latent period."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["BP, urine dip/microscopy/protein, renal function/electrolytes and complement; streptococcal serology as appropriate.","Urgent assessment for AKI, hyperkalaemia, hypertension or pulmonary oedema."]},{heading:"Management",points:["Paediatric/renal review, fluid/salt and BP/diuretic management according to fluid status; monitor urine, weight, BP and renal function.","Treat ongoing streptococcal infection when indicated; antibiotics do not instantly reverse established nephritis.","Most childhood cases improve but arrange follow-up to document resolution and investigate atypical/persistent abnormalities."]}]}],pages:[22],note:"",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-167",year:"Unstated",rotation:"Paediatrics",topic:"croup",title:"A three-year-old has breathing difficulty, stridor and a barking cough",case:"A three-year-old has breathing difficulty, stridor and a barking cough.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask barking cough, hoarseness, onset, fever, stridor at rest, work of breathing, drooling, swallowing and foreign-body/allergic onset.","Assess feeding, urine, fatigue and vaccination."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Viral croup versus bacterial tracheitis, epiglottitis/deep-neck infection, foreign body and anaphylaxis."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Assess severity clinically from a distance; no routine X-ray/blood tests in typical mild croup.","Toxic appearance, drooling or atypical course needs urgent expert airway assessment; do not force throat exam."]},{heading:"Management",points:["Keep child calm with caregiver; corticosteroid per age/weight local protocol.","Stridor at rest/severe distress may require nebulised adrenaline with monitored observation and airway-ready team; urgent escalation for fatigue/hypoxia.","Oxygen/support as tolerated; antibiotics only for a bacterial alternative, not routine viral croup."]}]}],pages:[22],note:"",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-168",year:"Unstated",rotation:"Paediatrics",topic:"limp",title:"A five-year-old has been limping for four weeks; take history from the mother",case:"A five-year-old has been limping for four weeks; take history from the mother.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask pain site, duration, trauma, fever, morning stiffness, swelling, refusal to bear weight, systemic symptoms and recent infection.","Ask rash/eye symptoms, weight loss/night pain, development and family inflammatory disease."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Septic arthritis/osteomyelitis, transient synovitis, JIA, trauma, Perthes/SCFE (age-dependent), malignancy and referred pain."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Vitals, gait/joint exam and growth; FBC/inflammatory markers and targeted imaging/ultrasound as indicated.","Urgent aspiration/specialist assessment for suspected septic joint; normal inflammatory markers do not exclude early infection."]},{heading:"Management",points:["Fever/systemic illness, severe pain or non-weight-bearing: urgent paediatric/orthopaedic assessment.","Persistent inflammatory symptoms warrant rheumatology; JIA requires exclusion of alternatives and appropriate duration/pattern, not a diagnosis from a four-week limp alone.","Treat established cause, pain/function and arrange review."]}]}],pages:[22],note:"",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-169",year:"Unstated",rotation:"Orthopaedics",topic:"fracture",title:"A patient has a tibia/fibula fracture involving the joint after an accident. Read the film and discuss care and complications",case:"A patient has a tibia/fibula fracture involving the joint after an accident. Read the film and discuss care and complications.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask mechanism, speed/energy, time, open wounds, numbness/weakness, pain escalation and other injury; review medicines/tetanus as relevant."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["ABCDE for major trauma, repeated distal neurovascular and compartment assessment; orthogonal X-rays including adjacent joints; CT if complex intra-articular planning."]},{heading:"Management",points:["Analgesia, splint, elevate appropriately and urgent orthopaedics; open fracture: sterile cover, antibiotics/tetanus and operative pathway.","Closed reduction/fixation or cast depends on stability/alignment/joint involvement and soft tissues.","Discuss immediate neurovascular/compartment injury and later infection, nonunion/malunion, stiffness and post-traumatic arthritis; complication frequency varies by pattern."]}]},{key:"x",label:"Describe and interpret the supplied image or findings",sections:[{heading:"Describe, then interpret",points:["Document wounds, deformity, pulses, capillary refill, motor/sensation and pain on passive stretch; normal pulses do not exclude compartment syndrome.","Describe exact fracture location, pattern, joint involvement and displacement from actual films; do not infer a named pattern from a short note."]}]}],pages:[23],note:"Original X-ray absent. The recall labels compartment syndrome “most common”; frequency depends on fracture pattern, although it is a critical complication.",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-170",year:"Unstated",rotation:"Orthopaedics",topic:"cts",title:"A 27-year-old woman presents with hand pain. Ask about dominant hand and occupation and assess sensory/motor function",case:"A 27-year-old woman presents with hand pain. Ask about dominant hand and occupation and assess sensory/motor function.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask nocturnal thumb/index/middle symptoms, shaking relief, weakness/dropping objects, dominant hand/job, pregnancy, diabetes/thyroid and neck symptoms."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect thenar bulk, test thumb abduction/opposition and median sensation; compare ulnar/radial functions and assess cervical source.","Phalen/Tinel may support but are not definitive; avoid repeated painful provocation. Thenar eminence sensation may be spared in tunnel compression."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Carpal tunnel syndrome versus cervical radiculopathy, proximal median neuropathy and polyneuropathy."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Clinical examination; nerve conduction testing when needed for uncertainty/severity or intervention planning; targeted cause assessment."]},{heading:"Management",points:["Neutral night splint and activity modification; selected steroid injection; persistent/severe weakness/wasting needs hand-surgery review for decompression.","Treat contributing conditions and counsel about recovery and risks; no single provocative test establishes severity."]}]}],pages:[23],note:"",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-171",year:"Unstated",rotation:"Anaesthesia",topic:"airway",title:"A 60-year-old man with ischaemic heart disease has breathlessness and chest pain, then collapses during history",case:"A 60-year-old man with ischaemic heart disease has breathlessness and chest pain, then collapses during history.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Before collapse, obtain key chest-pain/dyspnoea, cardiac/respiratory, allergy, medicine and event history if time permits.","Once collapse occurs, stop routine history and assess responsiveness and breathing immediately."]}]},{key:"p",label:"Demonstrate or explain the procedure safely",sections:[{heading:"Safety and steps",points:["Model-only, trained practice: position airway appropriately (jaw thrust/manual in-line support for suspected cervical injury), remove visible obstruction/suction, oxygen and correct mask size.","Use effective seal and jaw lift (two-person BVM preferred when possible), ventilate to visible chest rise without excessive rate/volume, reassess chest rise/oxygenation/capnography if available.","OPA for deeply unresponsive patient without gag; NPA sizing/contraindications per training (avoid suspected skull-base/major facial injury). Use a suitable supraglottic device/LMA when indicated and escalate failed oxygenation.","Intubation needs trained staff, equipment checks, backup plan, monitoring and waveform capnography confirmation; device sizes depend on device and patient, not one universal size."]},{heading:"Checks and samples",points:["Call emergency/resuscitation team, assess ABCDE, attach monitoring/defibrillator; glucose and ECG as appropriate.","If unresponsive and not breathing normally, start CPR/use defibrillator per current training—ventilation alone is not sufficient."]}]}],pages:[23],note:"",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-172",year:"Unstated",rotation:"Ophthalmology",topic:"eom",title:"A 26-year-old woman has diplopia. Take history, examine and discuss alternatives, care and driving",case:"A 26-year-old woman has diplopia. Take history, examine and discuss alternatives, care and driving.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Distinguish monocular from binocular diplopia; ask onset, direction/gaze dependence, pain, ptosis, pupil change, headache and neurological symptoms.","Assess vascular risks, trauma, thyroid disease and fluctuating fatigability."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect alignment/ptosis, assess acuity and pupils; ask the patient to follow a target in an H pattern without moving the head.","Ask when diplopia occurs, observe restriction and nystagmus; test convergence if appropriate. Do not claim a normal fundus rules out serious disease."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["III/IV/VI nerve palsy, thyroid eye disease, myasthenia and orbital/brainstem disease.","VI palsy causes impaired abduction; III palsy may cause ptosis and a down-and-out eye with or without pupil involvement."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Visual acuity, pupils/RAPD, fields and full neurological assessment; urgent neuroimaging/vascular imaging when indicated.","Specialist eye assessment; glucose/BP and cause-directed tests."]},{heading:"Management",points:["Urgent referral for painful/pupil-involving third-nerve palsy, acute neurological signs or vision loss.","Treat cause; temporary occlusion/prisms may relieve diplopia under eye-team advice.","Advise not to drive with uncontrolled diplopia; apply local licensing rules."]}]}],pages:[23],note:"The recall requests fundoscopy as well as evaluating diplopia; original image absent.",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-173",year:"Unstated",rotation:"Surgery",topic:"graves",title:"A 66-year-old man presents with neck swelling",case:"A 66-year-old man presents with neck swelling.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask weight loss, heat intolerance, palpitations, bowel change, tremor, menstrual change and neck compression.","Assess eye pain/diplopia/vision, smoking, pregnancy, medicines, cardiac symptoms and family autoimmune disease."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Warm moist hands, tremor, tachycardia/AF, proximal power/reflexes, diffuse goitre/bruit; assess eye movements, acuity and corneal exposure if eye signs."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["TSH, free T4/T3, TSH receptor antibodies when indicated; ECG, baseline FBC/liver tests before relevant medicines.","Ultrasound for structural questions; radionuclide testing selected by specialists and avoided in pregnancy."]},{heading:"Management",points:["Symptom control with a suitable beta-blocker if safe; antithyroid medicine, radioiodine or surgery based on cause, preference, pregnancy and specialist input.","Carbimazole can cause agranulocytosis: fever/sore throat requires stopping it and urgent medical/FBC assessment per safety instructions; liver symptoms also require urgent review.","Thyroid storm is emergency treatment; severe/sight-threatening thyroid eye disease needs urgent eye/endocrine care. Smoking cessation matters."]}]}],pages:[24],note:"",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-174",year:"Unstated",rotation:"Surgery",topic:"breast",title:"A 28-year-old woman has left breast pain for one year; a benign lump was recalled",case:"A 28-year-old woman has left breast pain for one year; a benign lump was recalled.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask duration/change, pain/cycle relation, nipple discharge/retraction, skin change, pregnancy/lactation, systemic symptoms and family/personal breast history."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Model or supervised setting: explain, explicit consent, chaperone offer, privacy and draping.","Inspect symmetry, skin/nipple change with appropriate arm positions; systematic palpation of all tissue, characterise lump, assess axillary/supraclavicular nodes and other breast."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Fibroadenoma, cyst, malignancy, fat necrosis or infection; young age and mobility do not by themselves exclude cancer."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Triple assessment when indicated: clinical exam, age/risk-appropriate imaging (often ultrasound in younger patients) and tissue sampling as needed.","Urgent breast pathway for suspicious features; do not diagnose a lump solely by palpation."]},{heading:"Management",points:["Management depends on concordant assessment: reassurance/surveillance or excision for selected confirmed benign lesions versus cancer treatment pathway.","Discuss options, growth/symptom concerns and follow-up."]}]}],pages:[24],note:"",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-175",year:"Unstated",rotation:"Surgery",topic:"prostate",title:"A 66-year-old man presents with a poor urinary stream",case:"A 66-year-old man presents with a poor urinary stream.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Separate voiding (hesitancy, weak stream, straining, intermittency) from storage symptoms; ask retention, haematuria, pain, infection, neurological symptoms and impact.","Review medicines, fluids, diabetes, prior surgery and prostate cancer family history; ask erectile/sexual concerns sensitively."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Abdominal palpation for bladder; indicated DRE on model only with explanation, explicit consent, chaperone and draping.","Usual clinical DRE position is left lateral, not automatically prone as one recall states; describe prostate size, symmetry, consistency, nodules/tenderness."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Benign prostatic enlargement, prostate cancer, stricture, UTI and bladder/neurological disease; symptoms or DRE alone cannot distinguish all."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Urinalysis/culture if indicated, renal function and bladder residual/flow when appropriate.","Discuss PSA implications/limitations with informed consent and appropriate timing; specialist pathway for abnormal findings."]},{heading:"Management",points:["Red flags/retention require urgent management; otherwise symptom/lifestyle advice, alpha blocker and/or 5-alpha-reductase inhibitor in selected patients with contraindication/side-effect review.","Surgical options for persistent severe symptoms or complications through urology; investigate visible haematuria appropriately."]}]}],pages:[24],note:"The source says prone for DRE; a consented left-lateral model examination is the usual clinical approach.",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-176",year:"Unstated",rotation:"Surgery",topic:"cholecystitis",title:"A 23-year-old man has abdominal pain; a positive Murphy sign was recalled",case:"A 23-year-old man has abdominal pain; a positive Murphy sign was recalled.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask RUQ pain duration/radiation, fever, vomiting, food association, jaundice, dark urine/pale stool and prior episodes.","Assess sepsis and distinguish pancreatitis/cholangitis; review pregnancy/medicines/comorbidity."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Assess general/sepsis signs, jaundice and gentle abdominal examination; Murphy sign is an inspiratory catch on RUQ palpation, not definitive alone."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Acute cholecystitis versus biliary colic, cholangitis, hepatitis, pancreatitis, ulcer disease and right lower pneumonia."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Observations, FBC/CRP, liver profile, renal function and lipase; pregnancy test if relevant.","RUQ ultrasound; further bile-duct imaging/ERCP according to obstruction/cholangitis pathway."]},{heading:"Management",points:["Analgesia, antiemetic, fluids when needed and antibiotics according to severity/local policy; surgical assessment.","Early laparoscopic cholecystectomy is recommended, for example within 1 week of diagnosis in NICE guidance—not an absolute universal 72-hour cut-off.","Jaundice with sepsis suggests cholangitis and may require urgent biliary drainage; individualise timing if unstable/unfit."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Explain gallbladder inflammation, treatment options, operation risks and why recurrent episodes/complications matter.","Analgesia, antiemetic, fluids when needed and antibiotics according to severity/local policy; surgical assessment.","Early laparoscopic cholecystectomy is recommended, for example within 1 week of diagnosis in NICE guidance—not an absolute universal 72-hour cut-off.","Jaundice with sepsis suggests cholangitis and may require urgent biliary drainage; individualise timing if unstable/unfit."]}]}],pages:[24],note:"The historical 72-hour surgical timing is not a universal deadline; see current-guidance note in the answer.",adapted:false,set:"Undated · Maryam recall set",images:[]},{id:"jcs-177",year:"2019",rotation:"Paediatrics",topic:"rds",title:"A baby has respiratory distress and poor feeding, with a reportedly normal cardiovascular examination. A CXR was described as diffuse reticulogranular ground-glass opacity with air bronchograms",case:"A baby has respiratory distress and poor feeding, with a reportedly normal cardiovascular examination. A CXR was described as diffuse reticulogranular ground-glass opacity with air bronchograms.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask gestation/prematurity, onset after birth, delivery/resuscitation, maternal diabetes/infection, feeding, cyanosis and antenatal steroids."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Surfactant-deficiency RDS versus transient tachypnoea, pneumonia/sepsis, aspiration, pneumothorax and CHD."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Pre/postductal SpO2, blood gas/glucose, chest radiograph and infection tests when indicated.","Diffuse low-volume reticulogranular/ground-glass change with air bronchograms may support RDS; no original CXR is included for this station."]},{heading:"Management",points:["Urgent neonatal support: temperature/glucose, oxygen titrated to neonatal targets, CPAP/ventilation and surfactant when indicated by team.","Investigate/treat possible infection and assess pneumothorax/CHD; feeding support based on respiratory stability."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Explain immature/surfactant-deficient lungs can cause alveolar collapse, but other causes must be excluded.","Urgent neonatal support: temperature/glucose, oxygen titrated to neonatal targets, CPAP/ventilation and surfactant when indicated by team.","Investigate/treat possible infection and assess pneumothorax/CHD; feeding support based on respiratory stability."]}]}],pages:[27],note:"",adapted:false,set:"2019 · day 1",images:[]},{id:"jcs-178",year:"2019",rotation:"Psychiatry",topic:"bipolar",title:"Added practice prompt: a patient taking fluoxetine develops reduced need for sleep, increased activity and elevated mood. Discuss assessment, treatment and how the presentation differs from schizophrenia",case:"Added practice prompt: a patient taking fluoxetine develops reduced need for sleep, increased activity and elevated mood. Discuss assessment, treatment and how the presentation differs from schizophrenia.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Establish current low versus elevated/irritable mood, sleep need, energy, speech/thought acceleration, impulsivity, psychosis and functioning.","Ask past mania/hypomania/depression, episodes/medicines including antidepressants, adherence, substances and collateral.","Assess suicide, spending/sexual/driving risks, vulnerability and ability to care for self."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Manic/hypomanic or depressive episode in bipolar disorder versus substance/medical causes, unipolar depression or primary psychosis.","Lithium use suggests a history to explore; it does not prove that today’s presentation is a depressive episode."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["MSE and physical review; renal/thyroid/calcium and lithium level when appropriate, plus medication-specific monitoring.","Check pregnancy possibility and drug interactions; urgent level/electrolytes if toxicity suspected."]},{heading:"Management",points:["Acute mania/psychosis or major safety risk: urgent psychiatric review; review/stop triggering antidepressants only through an appropriate prescriber.","Treatment may include an antipsychotic and/or mood stabiliser selected for phase, prior response and reproductive risk.","Bipolar depression requires specialist phase-specific treatment; avoid routine antidepressant monotherapy. Valproate carries major reproductive restrictions."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Lithium: maintain hydration, recognise vomiting/diarrhoea, coarse tremor, ataxia/confusion as toxicity warnings; monitor levels and avoid unsupervised NSAIDs/ACE inhibitors/diuretics.","Explain episodic mood-linked psychosis can occur in bipolar disorder; differentiating from schizophrenia requires longitudinal history.","Acute mania/psychosis or major safety risk: urgent psychiatric review; review/stop triggering antidepressants only through an appropriate prescriber.","Treatment may include an antipsychotic and/or mood stabiliser selected for phase, prior response and reproductive risk.","Bipolar depression requires specialist phase-specific treatment; avoid routine antidepressant monotherapy. Valproate carries major reproductive restrictions."]}]}],pages:[28],note:"Only a bipolar topic and follow-up questions are recorded; the full symptoms/episode are missing.",adapted:true,set:"2019 · day 1",images:[]},{id:"jcs-179",year:"2019",rotation:"Psychiatry",topic:"mse",title:"Perform a mental state examination and discuss medication adverse effects",case:"Perform a mental state examination and discuss medication adverse effects.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Quote relevant patient language; separate subjective symptoms from observed signs and avoid stigmatising descriptions."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Discuss medication side effects only after identifying the drug: metabolic, neurological, cardiac and other risks differ by medicine.","Act on immediate safety needs, acute medical causes or severe agitation; formulate a person-centred care and follow-up plan."]}]}],pages:[29],note:"No case, diagnosis or medicine is specified; use the framework and request the actual drug before giving drug-specific advice.",adapted:true,set:"2019 · day 1",images:[]},{id:"jcs-180",year:"2019",rotation:"Psychiatry",topic:"adhd",title:"A parent asks about a child’s attention, activity and poor sleep, and is reluctant to use medicines",case:"A parent asks about a child’s attention, activity and poor sleep, and is reluctant to use medicines.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Assess inattention and hyperactivity/impulsivity with examples, onset before age 12, persistence and impairment in at least two settings.","Obtain parent/school reports, developmental/hearing/vision history, sleep, learning, autism, anxiety, trauma and family history."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["ADHD versus sleep deprivation, hearing/learning difficulties, autism, anxiety, mood disorders and environmental stressors; evaluate comorbidity."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Specialist developmental/ADHD assessment with structured rating information across settings; no single blood test or IQ test confirms ADHD.","Before medication, assess height/weight, pulse/BP, cardiac/family history and other baseline requirements."]},{heading:"Management",points:["Parent/carer training and school/environmental adjustments, predictable routines and sleep support.","Medication for persistent significant impairment through specialists: stimulants such as methylphenidate and selected non-stimulants such as atomoxetine/guanfacine according to age/local pathway.","Monitor response, appetite/growth, sleep, pulse/BP and mood; not every family must begin with medication."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Stimulants: reduced appetite, insomnia, abdominal/headache and pulse/BP effects. Atomoxetine: GI/mood effects; guanfacine: sedation and hypotension.","Explore reluctance to medicate and offer shared decisions; sleep hygiene includes routine, limiting late screens/caffeine and assessing other sleep problems.","Parent/carer training and school/environmental adjustments, predictable routines and sleep support.","Medication for persistent significant impairment through specialists: stimulants such as methylphenidate and selected non-stimulants such as atomoxetine/guanfacine according to age/local pathway.","Monitor response, appetite/growth, sleep, pulse/BP and mood; not every family must begin with medication."]}]}],pages:[30],note:"",adapted:true,set:"2019 · day 1",images:[]},{id:"jcs-181",year:"2019",rotation:"Medicine",topic:"bronchiectasis",title:"Perform respiratory examination in a smoker with clubbing and crackles",case:"Perform respiratory examination in a smoker with clubbing and crackles.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect work of breathing and sputum, clubbing, pulse and SpO2; examine trachea and expansion.","Compare percussion, auscultation and vocal resonance anteriorly/posteriorly including bases; describe coarse crackles/wheeze without inventing signs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Bronchiectasis is suggested by chronic productive cough with coarse crackles/clubbing; consider COPD, TB, lung cancer and interstitial disease."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Observations/SpO2, sputum culture and chest radiograph initially.","High-resolution CT confirms bronchiectasis; spirometry and cause-directed immune/CF testing as appropriate."]},{heading:"Management",points:["Assess exacerbation severity and sepsis; culture-guided antibiotics according to previous organisms and local policy.","Airway clearance with physiotherapy, vaccinations, exercise and smoking cessation.","Specialist management for frequent exacerbations or chronic colonisation; significant haemoptysis is urgent."]}]}],pages:[31],note:"",adapted:false,set:"2019 · day 1",images:[]},{id:"jcs-182",year:"2019",rotation:"Medicine",topic:"prosthetic",title:"Perform cardiac assessment in a person with previous valve surgery and a click. Discuss anticoagulation, valve location and dental planning",case:"Perform cardiac assessment in a person with previous valve surgery and a click. Discuss anticoagulation, valve location and dental planning.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect sternotomy/thoracotomy scars, assess pulse, BP/JVP, locate and describe valve sounds and murmurs, assess heart failure/peripheral embolic signs."]}]},{k
