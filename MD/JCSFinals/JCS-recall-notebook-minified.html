bstruction. Adhesions are fibrous bands, not simply constipation."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["FBC/renal/electrolytes/lactate and pregnancy test if relevant; CT abdomen/pelvis often defines level/cause/complications.","Interpret actual radiograph systematically for dilated loops/air-fluid levels; no original image is supplied in this recall."]},{heading:"Management",points:["ABCDE, urgent surgery review, nil by mouth, IV fluids with reassessment, analgesia and antiemetic; NG decompression when indicated.","Selected uncomplicated cases can be managed conservatively under surgical observation; peritonitis/ischaemia/strangulation/perforation requires urgent source control.","Do not give laxatives routinely in suspected mechanical obstruction."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Explain adhesions, why surgery may or may not be needed, fluid monitoring and signs of deterioration.","ABCDE, urgent surgery review, nil by mouth, IV fluids with reassessment, analgesia and antiemetic; NG decompression when indicated.","Selected uncomplicated cases can be managed conservatively under surgical observation; peritonitis/ischaemia/strangulation/perforation requires urgent source control.","Do not give laxatives routinely in suspected mechanical obstruction."]}]}],pages:[4],note:"The recall asks about adhesional obstruction, acute pain/constipation/vomiting care and further tests. X-ray not supplied.",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-084",year:"2013",rotation:"Surgery",topic:"spleen",title:"A 25-year-old man with sickle cell disease has left upper abdominal pain",case:"A 25-year-old man with sickle cell disease has left upper abdominal pain.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Palpate spleen from right iliac fossa on inspiration gently, characterise notch and movement; bimanual kidney assessment when indicated.","Spleen may have a notch, inferomedial inspiratory movement and no ability to get above; kidney may be ballotable with ability to get above and overlying colonic resonance. These are supportive, not absolute rules."]}]}],pages:[4],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-085",year:"2013",rotation:"EBM",topic:"ebm",title:"A nurse asks whether a drug from a research paper can be used locally",case:"A nurse asks whether a drug from a research paper can be used locally.",objectives:[{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["An RCT randomly allocates interventions to reduce confounding; a 95% CI reflects a method’s long-run coverage, not proof the treatment works or a 95% probability this fixed interval contains the true effect.","Explain absolute as well as relative benefit/harm, NNT/NNH when valid, precision and clinical importance.","Consider applicability to local population, resources, baseline risk, availability, cost and patient values before adoption.","No article is included in the PDF: journal, outcome or effect numbers cannot be supplied honestly."]}]}],pages:[4,5],note:"The article is not included. Address publication/design, primary outcome, applicability, confidence interval and randomised trials without inventing study results.",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-086",year:"2013",rotation:"Orthopaedics",topic:"back",title:"A 25-year-old man has two days of back pain; scoliosis was reported",case:"A 25-year-old man has two days of back pain; scoliosis was reported.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Observe supported gait/posture; inspect/palpate spine, comfortable range; assess lower-limb power, tone, reflexes and dermatomal sensation.","Straight leg raise with consent if radicular symptoms; assess heel/toe gait only if safe.","Do not routinely perform rectal examination for all back pain; normal anal tone cannot exclude cauda equina syndrome."]}]},{key:"custom",label:"Explain a Thomas test if requested",sections:[{heading:"Important points",points:["With consent and safe supine positioning, flex the opposite hip to flatten lumbar lordosis and observe whether the tested thigh lifts, suggesting fixed hip flexion. Do not force a painful or potentially injured hip."]}]}],pages:[4],note:"The recall requests SLR, lower-limb neurology and Thomas test; perform only appropriate tolerated manoeuvres.",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-087",year:"2013",rotation:"Orthopaedics",topic:"ankle",title:"A 28-year-old man injured his ankle playing football and has swelling; malleolar fractures were recalled on X-ray",case:"A 28-year-old man injured his ankle playing football and has swelling; malleolar fractures were recalled on X-ray.",objectives:[{key:"x",label:"Describe and interpret the supplied image or findings",sections:[{heading:"Describe, then interpret",points:["Inspect skin/deformity, gentle tenderness, pulses/sensation/motor; avoid forced movement; examine above/below.","Malleolar fracture, syndesmosis injury, dislocation and ligament sprain; distinguish lateral/medial/posterior involvement using images."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Ankle AP/lateral/mortise views as indicated; assess proximal fibula/other injuries, CT if selected complex fracture."]},{heading:"Management",points:["Analgesia, immobilisation, repeat neurovascular checks; urgent reduction by trained team for dislocation/compromised skin or circulation.","Orthopaedic treatment depends on mortise stability/displacement and patient factors; explain cast versus fixation and non-weight-bearing instructions."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Explain malunion, infection, stiffness, DVT risk where relevant and later arthritis; recovery/weight-bearing depends on treating team.","Analgesia, immobilisation, repeat neurovascular checks; urgent reduction by trained team for dislocation/compromised skin or circulation.","Orthopaedic treatment depends on mortise stability/displacement and patient factors; explain cast versus fixation and non-weight-bearing instructions."]}]}],pages:[4],note:"Actual X-ray absent; exact malleolar pattern is uncertain.",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-088",year:"2013",rotation:"Ophthalmology",topic:"eom",title:"A 40-year-old man has ptosis; eye movements and visual acuity were reported normal",case:"A 40-year-old man has ptosis; eye movements and visual acuity were reported normal.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect alignment/ptosis, assess acuity and pupils; ask the patient to follow a target in an H pattern without moving the head.","Ask when diplopia occurs, observe restriction and nystagmus; test convergence if appropriate. Do not claim a normal fundus rules out serious disease."]}]},{key:"custom",label:"Examine the pupils",sections:[{heading:"Important points",points:["Assess size, symmetry, shape, direct/consensual reactions and RAPD; compare in bright/dim conditions. Ptosis with a small pupil raises Horner syndrome; painful acute Horner syndrome also needs urgent assessment."]}]}],pages:[4],note:"Pupillary examination requested. Do not assume third-nerve palsy without pupil/other findings.",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-089",year:"2013",rotation:"Anaesthesia",topic:"airway",title:"A sedated surgical manikin requires preparation for intubation and ventilation",case:"A sedated surgical manikin requires preparation for intubation and ventilation.",objectives:[{key:"p",label:"Demonstrate or explain the procedure safely",sections:[{heading:"Safety and steps",points:["Model-only, trained practice: position airway appropriately (jaw thrust/manual in-line support for suspected cervical injury), remove visible obstruction/suction, oxygen and correct mask size.","Use effective seal and jaw lift (two-person BVM preferred when possible), ventilate to visible chest rise without excessive rate/volume, reassess chest rise/oxygenation/capnography if available.","OPA for deeply unresponsive patient without gag; NPA sizing/contraindications per training (avoid suspected skull-base/major facial injury). Use a suitable supraglottic device/LMA when indicated and escalate failed oxygenation.","Intubation needs trained staff, equipment checks, backup plan, monitoring and waveform capnography confirmation; device sizes depend on device and patient, not one universal size."]},{heading:"Checks and samples",points:["Call emergency/resuscitation team, assess ABCDE, attach monitoring/defibrillator; glucose and ECG as appropriate.","If unresponsive and not breathing normally, start CPR/use defibrillator per current training—ventilation alone is not sufficient."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Equipment: oxygen, suction, BVM/masks, airway adjuncts, appropriate laryngoscope/tubes or supraglottic device, cuff syringe, fixation, capnography and rescue equipment.","Explain actions to team and relatives where possible; debrief after stabilisation.","Model-only, trained practice: position airway appropriately (jaw thrust/manual in-line support for suspected cervical injury), remove visible obstruction/suction, oxygen and correct mask size.","Use effective seal and jaw lift (two-person BVM preferred when possible), ventilate to visible chest rise without excessive rate/volume, reassess chest rise/oxygenation/capnography if available.","OPA for deeply unresponsive patient without gag; NPA sizing/contraindications per training (avoid suspected skull-base/major facial injury). Use a suitable supraglottic device/LMA when indicated and escalate failed oxygenation.","Intubation needs trained staff, equipment checks, backup plan, monitoring and waveform capnography confirmation; device sizes depend on device and patient, not one universal size."]}]}],pages:[4],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-090",year:"2014",rotation:"Surgery",topic:"footulcer",title:"A patient with diabetes has a foot ulcer",case:"A patient with diabetes has a foot ulcer.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask duration, trauma/footwear, pain or numbness, discharge, fever, claudication/rest pain, prior ulcer/amputation and diabetes care."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Neuropathic, ischaemic/neuroischaemic ulcer, pressure injury or other pathology; lack of pain is not reassuring."]}]}],pages:[5],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-091",year:"2014",rotation:"Surgery",topic:"abdomen",title:"A 33-year-old woman has abdominal pain and an X-ray to discuss",case:"A 33-year-old woman has abdominal pain and an X-ray to discuss.",objectives:[{key:"x",label:"Describe and interpret the supplied image or findings",sections:[{heading:"Describe, then interpret",points:["Hand hygiene, consent, pain check and draping; inspect general state/abdomen; gentle systematic palpation away from pain, organ/mass assessment and percussion.","Auscultate as appropriate; assess hernia/genital/rectal regions only if indicated with specific consent, chaperone and supervision.","Organise gastrointestinal, hepatobiliary, pancreatic, vascular, urinary and gynaecological causes by location; do not infer a diagnosis from a short recall."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Explain what is known, uncertainty and when to return urgently.","ABCDE and urgent surgery/senior review for shock, peritonism, major bleeding or possible vascular catastrophe.","Give appropriate analgesia/antiemetic and investigate the cause; do not delay care to complete a routine checklist."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Observations, urine and pregnancy test when relevant; targeted FBC/renal/liver profile/lipase and imaging according to presentation."]},{heading:"Management",points:["ABCDE and urgent surgery/senior review for shock, peritonism, major bleeding or possible vascular catastrophe.","Give appropriate analgesia/antiemetic and investigate the cause; do not delay care to complete a routine checklist."]}]}],pages:[5],note:"No film or diagnosis is recorded, so do not invent a specific radiological answer.",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-092",year:"2014",rotation:"Surgery",topic:"hernia",title:"Examine a groin swelling and discuss differential diagnoses",case:"Examine a groin swelling and discuss differential diagnoses.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Model/supervised intimate exam: consent/chaperone and draping; inspect both groins standing only if safe and supine, locate relative to pubic tubercle/inguinal ligament.","Gently assess cough impulse/reducibility only if safe, tenderness/skin change, opposite groin and indicated scrotal/abdominal findings."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Inguinal/femoral hernia, lymph node, saphena varix, lipoma and scrotal pathology; clinical direct/indirect distinction is imperfect."]}]}],pages:[5],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-093",year:"2014",rotation:"Orthopaedics",topic:"knee",title:"Perform a knee examination",case:"Perform a knee examination.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect gait/alignment if safe then swelling/wasting, warmth/tenderness, effusion and comfortable active/passive range.","Assess Lachman/anterior drawer, posterior drawer and collateral stress when tolerated and trained; meniscal tests only if useful, not forced in an acutely painful joint.","Assess distal neurovascular status and adjacent joints; document findings."]}]}],pages:[5],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-094",year:"2014",rotation:"Orthopaedics",topic:"radius",title:"A father brings his eight-year-old after a distal radial fracture. Discuss the film, alternatives and care",case:"A father brings his eight-year-old after a distal radial fracture. Discuss the film, alternatives and care.",objectives:[{key:"x",label:"Describe and interpret the supplied image or findings",sections:[{heading:"Describe, then interpret",points:["Inspect deformity/skin, gently assess landmarks, median/ulnar/radial sensation and motor, pulses/capillary refill before/after intervention.","Distal radius fracture (dorsal displacement supports Colles), other wrist/forearm fractures and scaphoid injury; actual film is needed."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Distal radius fracture (dorsal displacement supports Colles), other wrist/forearm fractures and scaphoid injury; actual film is needed."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Discuss acute carpal tunnel/neurovascular compromise, stiffness, malunion, tendon injury, CRPS and surgical infection/nerve risks; avoid guarantees of full function.","Analgesia, immobilisation and reduction by trained staff if displaced; surgery for selected unstable/displaced/intra-articular patterns.","Repeat neurovascular checks, swelling/cast advice and fracture follow-up; assess fragility-fracture prevention when relevant."]}]}],pages:[5],note:"The film is not supplied. Paediatric fracture management depends on age, displacement and growth-plate involvement; the adult Colles pattern must not be assumed.",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-095",year:"2014",rotation:"Ophthalmology",topic:"visualfield",title:"Perform visual field examination",case:"Perform visual field examination.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Test each eye separately, match eye level/distance, ensure fixation, compare quadrants with finger counting/movement/appropriate target; assess blind spot if required.","State limitations of confrontation and need for formal fields; do not infer the field solely from symptom wording."]}]}],pages:[5],note:"No field defect or diagnosis is supplied.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-096",year:"2014",rotation:"Anaesthesia",topic:"airway",title:"Demonstrate airway management/intubation on a trauma manikin with head/neck injury",case:"Demonstrate airway management/intubation on a trauma manikin with head/neck injury.",objectives:[{key:"p",label:"Demonstrate or explain the procedure safely",sections:[{heading:"Safety and steps",points:["Model-only, trained practice: position airway appropriately (jaw thrust/manual in-line support for suspected cervical injury), remove visible obstruction/suction, oxygen and correct mask size.","Use effective seal and jaw lift (two-person BVM preferred when possible), ventilate to visible chest rise without excessive rate/volume, reassess chest rise/oxygenation/capnography if available.","OPA for deeply unresponsive patient without gag; NPA sizing/contraindications per training (avoid suspected skull-base/major facial injury). Use a suitable supraglottic device/LMA when indicated and escalate failed oxygenation.","Intubation needs trained staff, equipment checks, backup plan, monitoring and waveform capnography confirmation; device sizes depend on device and patient, not one universal size."]},{heading:"Checks and samples",points:["Call emergency/resuscitation team, assess ABCDE, attach monitoring/defibrillator; glucose and ECG as appropriate.","If unresponsive and not breathing normally, start CPR/use defibrillator per current training—ventilation alone is not sufficient."]}]}],pages:[5],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-097",year:"2015",rotation:"Surgery",topic:"pad",title:"Take a history of a painful possibly ischaemic limb and discuss alternatives",case:"Take a history of a painful possibly ischaemic limb and discuss alternatives.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Characterise exertional reproducible calf pain and relief with rest, distance, rest/night pain, ulcers and tissue loss.","Ask vascular risk, smoking, diabetes, cardiac/cerebrovascular disease, medicines and neurological/musculoskeletal alternatives."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["PAD versus neurogenic claudication, venous or joint/muscle pain; rest pain/tissue loss suggests chronic limb-threatening ischaemia."]}]}],pages:[5],note:"",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-098",year:"2015",rotation:"Surgery",topic:"breast",title:"Take a history of a breast lump and discuss alternatives",case:"Take a history of a breast lump and discuss alternatives.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask duration/change, pain/cycle relation, nipple discharge/retraction, skin change, pregnancy/lactation, systemic symptoms and family/personal breast history."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Fibroadenoma, cyst, malignancy, fat necrosis or infection; young age and mobility do not by themselves exclude cancer."]}]}],pages:[5],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-099",year:"2015",rotation:"Surgery",topic:"hepatomegaly",title:"Perform an abdominal examination and describe a liver-region mass",case:"Perform an abdominal examination and describe a liver-region mass.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect general state, hands/face and abdomen; palpate from right iliac fossa during inspiration and characterise liver edge, span, tenderness, surface and pulsatility.","Assess spleen, ascites, nodes, JVP and oedema; maintain dignity and avoid painful repeated palpation."]}]}],pages:[5],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-100",year:"2015",rotation:"Surgery",topic:"renal",title:"Examine the kidneys/renal angles and explain the supplied image to examiner and patient",case:"Examine the kidneys/renal angles and explain the supplied image to examiner and patient.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Assess vitals/sepsis, hydration, abdomen and gentle renal angle tenderness; avoid repeated painful percussion.","Assess mass if present; offer indicated genital/hernia examination with consent. A new non-reducing left varicocele with concerning signs can prompt renal assessment."]}]},{key:"x",label:"Describe and interpret the supplied image or findings",sections:[{heading:"Describe, then interpret",points:["Assess vitals/sepsis, hydration, abdomen and gentle renal angle tenderness; avoid repeated painful percussion.","Assess mass if present; offer indicated genital/hernia examination with consent. A new non-reducing left varicocele with concerning signs can prompt renal assessment.","Ureteric stone, pyelonephritis, obstruction, renal mass and non-urinary causes; reconcile the side of pain with imaging rather than silently changing it."]}]}],pages:[5],note:"The image and its findings are not supplied.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-101",year:"2015",rotation:"Orthopaedics",topic:"back",title:"Examine a patient with back pain and suggest a diagnosis",case:"Examine a patient with back pain and suggest a diagnosis.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Observe supported gait/posture; inspect/palpate spine, comfortable range; assess lower-limb power, tone, reflexes and dermatomal sensation.","Straight leg raise with consent if radicular symptoms; assess heel/toe gait only if safe.","Do not routinely perform rectal examination for all back pain; normal anal tone cannot exclude cauda equina syndrome."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Mechanical pain, disc-related radiculopathy, spinal stenosis, inflammatory disease; exclude fracture, malignancy, infection and cauda equina compression."]}]}],pages:[5],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-102",year:"2015",rotation:"Orthopaedics",topic:"fracture",title:"Explain a fracture film, examine neurovascular status and discuss treatment and complications",case:"Explain a fracture film, examine neurovascular status and discuss treatment and complications.",objectives:[{key:"x",label:"Describe and interpret the supplied image or findings",sections:[{heading:"Describe, then interpret",points:["Document wounds, deformity, pulses, capillary refill, motor/sensation and pain on passive stretch; normal pulses do not exclude compartment syndrome.","Describe exact fracture location, pattern, joint involvement and displacement from actual films; do not infer a named pattern from a short note."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Document wounds, deformity, pulses, capillary refill, motor/sensation and pain on passive stretch; normal pulses do not exclude compartment syndrome."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["ABCDE for major trauma, repeated distal neurovascular and compartment assessment; orthogonal X-rays including adjacent joints; CT if complex intra-articular planning."]},{heading:"Management",points:["Analgesia, splint, elevate appropriately and urgent orthopaedics; open fracture: sterile cover, antibiotics/tetanus and operative pathway.","Closed reduction/fixation or cast depends on stability/alignment/joint involvement and soft tissues.","Discuss immediate neurovascular/compartment injury and later infection, nonunion/malunion, stiffness and post-traumatic arthritis; complication frequency varies by pattern."]}]}],pages:[5],note:"Fracture site and X-ray are not specified.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-103",year:"2015",rotation:"Ophthalmology",topic:"eom",title:"Assess eye movements and explain the affected muscle and causes of a sixth-nerve palsy",case:"Assess eye movements and explain the affected muscle and causes of a sixth-nerve palsy.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect alignment/ptosis, assess acuity and pupils; ask the patient to follow a target in an H pattern without moving the head.","Ask when diplopia occurs, observe restriction and nystagmus; test convergence if appropriate. Do not claim a normal fundus rules out serious disease."]}]},{key:"x",label:"Describe and interpret the supplied image or findings",sections:[{heading:"Describe, then interpret",points:["Inspect alignment/ptosis, assess acuity and pupils; ask the patient to follow a target in an H pattern without moving the head.","Ask when diplopia occurs, observe restriction and nystagmus; test convergence if appropriate. Do not claim a normal fundus rules out serious disease.","III/IV/VI nerve palsy, thyroid eye disease, myasthenia and orbital/brainstem disease.","VI palsy causes impaired abduction; III palsy may cause ptosis and a down-and-out eye with or without pupil involvement."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["LR6 SO4, all other extraocular muscles III. In adduction, superior oblique depresses and inferior oblique elevates; in abduction, superior/inferior rectus elevate/depress.","Explain that double vision has several causes and some require urgent imaging.","Urgent referral for painful/pupil-involving third-nerve palsy, acute neurological signs or vision loss.","Treat cause; temporary occlusion/prisms may relieve diplopia under eye-team advice.","Advise not to drive with uncontrolled diplopia; apply local licensing rules."]}]}],pages:[5],note:"Recalled diagram absent.",adapted:true,set:"2012–2015 summary tables",images:[]},{id:"jcs-104",year:"2015",rotation:"Anaesthesia",topic:"airway",title:"A deeply unresponsive manikin requires airway support and bag-mask ventilation",case:"A deeply unresponsive manikin requires airway support and bag-mask ventilation.",objectives:[{key:"p",label:"Demonstrate or explain the procedure safely",sections:[{heading:"Safety and steps",points:["Model-only, trained practice: position airway appropriately (jaw thrust/manual in-line support for suspected cervical injury), remove visible obstruction/suction, oxygen and correct mask size.","Use effective seal and jaw lift (two-person BVM preferred when possible), ventilate to visible chest rise without excessive rate/volume, reassess chest rise/oxygenation/capnography if available.","OPA for deeply unresponsive patient without gag; NPA sizing/contraindications per training (avoid suspected skull-base/major facial injury). Use a suitable supraglottic device/LMA when indicated and escalate failed oxygenation.","Intubation needs trained staff, equipment checks, backup plan, monitoring and waveform capnography confirmation; device sizes depend on device and patient, not one universal size."]},{heading:"Checks and samples",points:["Call emergency/resuscitation team, assess ABCDE, attach monitoring/defibrillator; glucose and ECG as appropriate.","If unresponsive and not breathing normally, start CPR/use defibrillator per current training—ventilation alone is not sufficient."]}]}],pages:[5],note:"",adapted:false,set:"2012–2015 summary tables",images:[]},{id:"jcs-105",year:"2016",rotation:"Medicine",topic:"bronchiectasis",title:"A man around 50 requires posterior respiratory and relevant peripheral examination. Recalled signs include clubbing, reduced expansion/air entry, crackles and sometimes wheeze",case:"A man around 50 requires posterior respiratory and relevant peripheral examination. Recalled signs include clubbing, reduced expansion/air entry, crackles and sometimes wheeze.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect work of breathing and sputum, clubbing, pulse and SpO2; examine trachea and expansion.","Compare percussion, auscultation and vocal resonance anteriorly/posteriorly including bases; describe coarse crackles/wheeze without inventing signs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Bronchiectasis is suggested by chronic productive cough with coarse crackles/clubbing; consider COPD, TB, lung cancer and interstitial disease."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Observations/SpO2, sputum culture and chest radiograph initially.","High-resolution CT confirms bronchiectasis; spirometry and cause-directed immune/CF testing as appropriate."]},{heading:"Management",points:["Assess exacerbation severity and sepsis; culture-guided antibiotics according to previous organisms and local policy.","Airway clearance with physiotherapy, vaccinations, exercise and smoking cessation.","Specialist management for frequent exacerbations or chronic colonisation; significant haemoptysis is urgent."]}]}],pages:[6],note:"Variants include bilateral changes or right basal changes. Do not assume a single cause from clubbing alone.",adapted:false,set:"2016 · cohort 2011",images:[]},{id:"jcs-106",year:"2016",rotation:"Medicine",topic:"valves",title:"A man around 50 requires a focused precordial examination; assess relevant scars and describe sounds/murmurs",case:"A man around 50 requires a focused precordial examination; assess relevant scars and describe sounds/murmurs.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Consent, pain check, appropriate exposure; inspect scars, hands and face; pulse rate/rhythm/character and BP.","Assess JVP, apex, heaves/thrills; auscultate all areas with diaphragm/bell and appropriate positioning; time a murmur against pulse.","Describe timing, site, radiation, intensity and associated sounds; examine lung bases and oedema."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Characterise the murmur before naming a lesion: systolic versus diastolic, loudest site, radiation and associated pulse/JVP changes.","Consider regurgitation/stenosis, prosthetic valve sounds and infective endocarditis if systemic features; a scar alone does not establish the operation."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["AR: early diastolic decrescendo, often bounding/collapsing pulse and wide pulse pressure in chronic disease. MR: apical pansystolic murmur radiating to axilla.","Do not diagnose endocarditis from two murmurs alone; integrate cultures, imaging and clinical features.","Explain suspected valve dysfunction in plain language, the need for echo and red flags; check understanding.","Treat acute instability using ABCDE and urgent cardiology input.","Stable management depends on lesion, severity, symptoms and echo; discuss surveillance versus valve intervention, not a generic drug prescription.","Manage heart failure/arrhythmia and cardiovascular risk with supervision."]}]}],pages:[6,7],note:"One variant had early diastolic and apical pansystolic murmurs; another a metallic mitral-area click. The recall’s attribution to endocarditis requires cultures/imaging, not murmurs alone.",adapted:false,set:"2016 · cohort 2011",images:[]},{id:"jcs-107",year:"2016",rotation:"Medicine",topic:"motor",title:"A man in his twenties has lower-limb weakness. Examine motor function, localise and offer completion",case:"A man in his twenties has lower-limb weakness. Examine motor function, localise and offer completion.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Consent, exposure and pain check; inspect posture, wasting/fasciculations; assess tone and MRC power systematically comparing sides.","Test relevant tendon reflexes and plantar responses; assess coordination; complete sensation and supported gait.","Describe distribution and UMN/LMN pattern rather than giving a disease label without evidence."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Localise: UMN pattern (increased tone/brisk reflexes/extensor plantars), LMN pattern (wasting/fasciculation/reduced tone/reflexes), myopathy (often proximal) or neuromuscular junction disease.","Acute stroke/spinal compression and rapidly ascending weakness are urgent; a single sign does not establish the cause."]}]}],pages:[7],note:"",adapted:false,set:"2016 · cohort 2011",images:[]},{id:"jcs-108",year:"2016",rotation:"Procedures",topic:"paracentesis",title:"Perform diagnostic paracentesis on a model",case:"Perform diagnostic paracentesis on a model.",objectives:[{key:"p",label:"Demonstrate or explain the procedure safely",sections:[{heading:"Safety and steps",points:["Model/supervised procedure only: assess stability, empty bladder if needed, ultrasound-guided/safe site selection by trained staff, aseptic technique, local anaesthetic and sample collection.","Do not choose a puncture site solely from a memorised landmark or puncture through infected skin/visible vessels.","Label, send promptly, dress, document and monitor; diagnostic tap differs from large-volume therapeutic drainage and its albumin requirements."]},{heading:"Checks and samples",points:["Ascitic cell count/differential, albumin with paired serum albumin, protein and culture (bedside inoculation into blood-culture bottles where indicated).","Other studies guided by suspicion; neutrophils ≥250 cells/mm³ support SBP and require prompt treatment."]}]}],pages:[7],note:"",adapted:false,set:"2016 · cohort 2011",images:[]},{id:"jcs-109",year:"2016",rotation:"Paediatrics",topic:"itp",title:"An 11-year-old has one episode of epistaxis and a skin rash. Take a history from the mother and give two differentials",case:"An 11-year-old has one episode of epistaxis and a skin rash. Take a history from the mother and give two differentials.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask duration/severity of bleeding, bruises/petechiae, mucosal/other bleeding, recent viral illness/vaccine, medicines, family bleeding and systemic symptoms."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["ITP, von Willebrand/other bleeding disorder, local nasal trauma, marrow disease/leukaemia or infection; fever/unwellness/bone pain/organomegaly is atypical for uncomplicated ITP."]}]}],pages:[7],note:"",adapted:false,set:"2016 · cohort 2011",images:[]},{id:"jcs-110",year:"2016",rotation:"Paediatrics",topic:"neonatalsepsis",title:"A two-day-old newborn is excessively sleepy and feeding poorly. Take a maternal history and give two differentials",case:"A two-day-old newborn is excessively sleepy and feeding poorly. Take a maternal history and give two differentials.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask gestation/birth, maternal fever/GBS, rupture of membranes, feeding/urine, temperature, breathing, jaundice and onset.","Ask hypoglycaemia/metabolic clues and family neonatal deaths/consanguinity sensitively."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Neonatal sepsis, hypoglycaemia, metabolic disease, jaundice complications, cardiac disease or dehydration; sleepiness is not assumed normal."]}]}],pages:[7],note:"",adapted:false,set:"2016 · cohort 2011",images:[]},{id:"jcs-111",year:"2016",rotation:"Paediatrics",topic:"development",title:"A five-year-old has developmental concerns, with no reported perinatal/postnatal illness. A video assessed fine motor, social and speech domains",case:"A five-year-old has developmental concerns, with no reported perinatal/postnatal illness. A video assessed fine motor, social and speech domains.",objectives:[{key:"dev",label:"Describe development and estimate the developmental level",sections:[{heading:"Assess the observed domains",points:["Describe each observed skill by domain, then estimate a developmental range using validated age norms.","Do not infer exact developmental age or diagnosis without the recalled video; compare all assessed domains and account for cooperation.","Confirm chronological age and prematurity correction; ask gross motor, fine motor/vision, language/hearing and social/adaptive milestones.","Ask pregnancy/birth history, regression, seizures, hearing/vision, family history, environment and opportunities for learning."]},{heading:"Interpret with limitations",points:["Consider global versus isolated delay, hearing/vision impairment, autism, cerebral palsy and genetic/metabolic causes; developmental variation is not diagnosed from one task."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Consider global versus isolated delay, hearing/vision impairment, autism, cerebral palsy and genetic/metabolic causes; developmental variation is not diagnosed from one task."]}]}],pages:[7],note:"The recall estimates approximately three-year developmental skills, but the video is missing; this cannot be independently verified.",adapted:false,set:"2016 · cohort 2011",images:[]},{id:"jcs-112",year:"2016",rotation:"Genetics",topic:"achondroplasia",title:"The mother of a child newly diagnosed with achondroplasia attends for counselling; she has been told it is autosomal dominant with full penetrance",case:"The mother of a child newly diagnosed with achondroplasia attends for counselling; she has been told it is autosomal dominant with full penetrance.",objectives:[{key:"g",label:"Take a genetic history, draw a pedigree and explain recurrence risk",sections:[{heading:"History and pedigree",points:["Take family stature/skeletal history and three-generation pedigree; review child/parental FGFR3 results and antenatal history.","Draw at least three generations where possible: proband, relationships, ages, affected status, relevant test results, miscarriages and consanguinity; include a legend and distinguish known results from assumptions."]},{heading:"Inheritance, recurrence and choices",points:["Autosomal dominant FGFR3-related condition, often de novo; distinguish it from other skeletal dysplasias.","One heterozygous affected parent and unaffected partner: 50% transmission in each pregnancy.","Unaffected parents with a de novo affected child have low but non-zero recurrence risk because of germline mosaicism—not exactly the population baseline.","If both parents have achondroplasia, discuss 25% unaffected, 50% heterozygous achondroplasia and 25% biallelic severe usually lethal disease with genetics.","Prenatal targeted testing (CVS/amniocentesis) and preimplantation testing may be options when a variant is known; ultrasound is not equivalent to a molecular exclusion test.","An affected child will have their own future reproductive risks; discuss autonomy and offer genetics follow-up."]}]}],pages:[8],note:"Source names achondroplasia. Its statement that de novo recurrence equals population risk is corrected in the answer.",adapted:false,set:"2016 · cohort 2011",images:[]},{id:"jcs-113",year:"2016",rotation:"Psychiatry",topic:"depression",title:"A patient has low mood and loss of interest",case:"A patient has low mood and loss of interest.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask low mood/anhedonia, duration, sleep, appetite/weight, energy, concentration, guilt, function and psychotic symptoms.","Screen previous mania/hypomania, substances, medicines, physical causes and stressors.","Directly ask self-harm/suicide thoughts, intent, plans, access to means, previous acts, supports and immediate safety."]}]}],pages:[8],note:"",adapted:false,set:"2016 · cohort 2011",images:[]},{id:"jcs-114",year:"2016",rotation:"Psychiatry",topic:"dementia",title:"Take collateral history from the son of an older person with confusion and memory loss, and discuss the likely cause",case:"Take collateral history from the son of an older person with confusion and memory loss, and discuss the likely cause.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Obtain patient and collateral accounts with permission: gradual versus acute/fluctuating onset, memory/language/executive changes and daily function.","Ask mood, psychosis, medicines, alcohol, neurological events, sensory problems, driving, finances, medication safety and caregiver needs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Alzheimer disease, vascular/mixed and other dementias; exclude delirium, depression and reversible medical/drug causes.","A history of stroke alone does not establish vascular dementia; time course and neurological/cognitive pattern matter."]}]}],pages:[8],note:"",adapted:false,set:"2016 · cohort 2011",images:[]},{id:"jcs-115",year:"2016",rotation:"Psychiatry",topic:"autism",title:"Take a history from a father about suspected autism and counsel him",case:"Take a history from a father about suspected autism and counsel him.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Take developmental and language/hearing history, social communication/reciprocity, play, repetitive behaviours, restricted interests and sensory differences.","Establish onset and impact across settings, regression, school function, strengths, sleep, feeding and family history; ask parent concerns without blame."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Use respectful neurodevelopmental language, explain there is no parental blame, agree practical supports and avoid unsupported causal claims.","Early communication/educational and environmental support tailored to strengths/needs, parent support and treatment of coexisting conditions.","No medicine cures core autism; use specialist medication only for specific significant comorbid symptoms when appropriate."]}]}],pages:[8],note:"",adapted:true,set:"2016 · cohort 2011",images:[]},{id:"jcs-116",year:"2016",rotation:"Psychiatry",topic:"psychosis",title:"A patient presents with disturbed behaviour. Explore relapse and treatment adherence",case:"A patient presents with disturbed behaviour. Explore relapse and treatment adherence.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Explore hallucinations (including commands), delusional beliefs, thought disorder, negative symptoms, mood, sleep and functioning non-judgementally.","Ask medication adherence and reasons, adverse effects, substance use, relapse triggers and collateral with consent.","Assess self-harm, harm to others, self-neglect, vulnerability and access to support."]}]}],pages:[9],note:"",adapted:false,set:"2016 · cohort 2011",images:[]},{id:"jcs-117",year:"2016",rotation:"FAMCO",topic:"anaemia",title:"A woman has fatigue and palpitations; variants include heavy menstrual loss or inadequate dietary iron",case:"A woman has fatigue and palpitations; variants include heavy menstrual loss or inadequate dietary iron.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask fatigue, exertional dyspnoea/palpitations, bleeding including menstruation/GI loss, diet, pica, pregnancy, malabsorption and chronic disease.","In children ask milk/diet, growth, stool loss/parasites risks and family haemoglobinopathy history; jaundice raises haemolysis/liver alternatives."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Iron deficiency, haemoglobinopathy, chronic inflammation, B12/folate deficiency and haemolysis; pallor alone does not prove anaemia."]}]}],pages:[9],note:"",adapted:false,set:"2016 · cohort 2011",images:[]},{id:"jcs-118",year:"2016",rotation:"FAMCO",topic:"back",title:"Perform a focused examination for lower back pain, including relevant neurological assessment, and discuss the likely cause",case:"Perform a focused examination for lower back pain, including relevant neurological assessment, and discuss the likely cause.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Observe supported gait/posture; inspect/palpate spine, comfortable range; assess lower-limb power, tone, reflexes and dermatomal sensation.","Straight leg raise with consent if radicular symptoms; assess heel/toe gait only if safe.","Do not routinely perform rectal examination for all back pain; normal anal tone cannot exclude cauda equina syndrome."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Mechanical pain, disc-related radiculopathy, spinal stenosis, inflammatory disease; exclude fracture, malignancy, infection and cauda equina compression."]}]}],pages:[9],note:"Variants include LMN signs, radicular pain with positive SLR, or mechanical tenderness without focal deficit.",adapted:false,set:"2016 · cohort 2011",images:[]},{id:"jcs-119",year:"2016",rotation:"Dermatology",topic:"urticaria",title:"A woman has itching. Take history, describe the supplied lesions and counsel her",case:"A woman has itching. Take history, describe the supplied lesions and counsel her.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask transient wheals, duration of each lesion, angioedema, airway symptoms, triggers, medicines including NSAIDs, infection and recurrence."]}]},{key:"x",label:"Describe and interpret the supplied image or findings",sections:[{heading:"Describe, then interpret",points:["Describe raised transient blanching wheals and distribution; examine for angioedema without delaying emergency treatment.","Urticaria versus insect bites, eczema and urticarial vasculitis if lesions persist >24 hours, bruise or hurt."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Explain wheals may move and disappear; many cases are not a specific food allergy. Give clear emergency advice.","Exclude anaphylaxis first; non-sedating H1 antihistamine and trigger review according to guideline.","Persistent/chronic symptoms or angioedema need follow-up; emergency care for airway/breathing/circulatory symptoms."]}]}],pages:[9],note:"Source identifies urticaria; photographs are absent.",adapted:false,set:"2016 · cohort 2011",images:[]},{id:"jcs-120",year:"2016",rotation:"Oral health",topic:"xerostomia",title:"A woman with SLE has altered taste and tooth pain. Take a history, explain the likely problem, discuss oral hygiene and answer questions",case:"A woman with SLE has altered taste and tooth pain. Take a history, explain the likely problem, discuss oral hygiene and answer questions.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask dryness duration, dry eyes, swallowing/speech/taste difficulties, dental pain, parotid swelling and fluid intake.","Review anticholinergics (e.g. amitriptyline), other medicines, SLE/autoimmune symptoms, diabetes, radiation and tobacco."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Explain increased caries risk and that changing medication may help; discuss symptom relief and ongoing oral care.","Review/change offending medicine only with prescriber; frequent water sips, sugar-free gum if suitable and saliva substitutes.","High-fluoride preventive dental care as advised, regular dental review and treat caries/candidiasis when present.","Avoid sugary/acidic drinks, alcohol-containing mouthwash and smoking; refer suspected systemic disease."]}]}],pages:[10],note:"",adapted:false,set:"2016 · cohort 2011",images:[]},{id:"jcs-121",year:"2016",rotation:"Surgery",topic:"breast",title:"Perform a focused breast-lump examination on a manikin and describe the findings",case:"Perform a focused breast-lump examination on a manikin and describe the findings.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Model or supervised setting: explain, explicit consent, chaperone offer, privacy and draping.","Inspect symmetry, skin/nipple change with appropriate arm positions; systematic palpation of all tissue, characterise lump, assess axillary/supraclavicular nodes and other breast."]}]}],pages:[10],note:"",adapted:false,set:"2016 · cohort 2011",images:[]},{id:"jcs-122",year:"2016",rotation:"Surgery",topic:"renal",title:"A patient has haematuria and lower abdominal pain. Perform a focused examination; discuss renal-angle findings, a left varicocele and splenic versus renal mass",case:"A patient has haematuria and lower abdominal pain. Perform a focused examination; discuss renal-angle findings, a left varicocele and splenic versus renal mass.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Assess vitals/sepsis, hydration, abdomen and gentle renal angle tenderness; avoid repeated painful percussion.","Assess mass if present; offer indicated genital/hernia examination with consent. A new non-reducing left varicocele with concerning signs can prompt renal assessment."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Left gonadal vein drains into left renal vein; venous obstruction can contribute to varicocele, but most varicoceles are not due to cancer.","Explain options, return for fever/rigors or poor urine output, and later prevention; do not promise a 7 mm stone will pass spontaneously.","Sepsis with obstruction, anuria/AKI, solitary kidney or uncontrolled symptoms needs urgent urology; infected obstruction requires antibiotics plus urgent decompression, not antibiotics alone.","Analgesia (NSAID if safe), antiemetic, hydration to need and stone-size/location-based passage versus intervention plan.","Uric acid stones: metabolic assessment and specialist-guided urine alkalinisation may dissolve selected stones; do not prescribe it indiscriminately."]}]}],pages:[10],note:"",adapted:false,set:"2016 · cohort 2011",images:[]},{id:"jcs-123",year:"2016",rotation:"Surgery",topic:"neck",title:"Examine a neck swelling. Describe functional and structural thyroid findings, possible causes and initial tests",case:"Examine a neck swelling. Describe functional and structural thyroid findings, possible causes and initial tests.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect general thyroid status/hands/pulse/eyes; neck scars and swelling movement on swallowing if safe.","Palpate thyroid/nodes gently, describe size/consistency/nodules/tenderness, assess trachea and bruit if indicated.","Summarise separately functional state (hyper/hypo/euthyroid) and structural findings; do not provoke prolonged compressive manoeuvres."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Thyroid goitre/nodule, lymph node, salivary or congenital mass; malignancy risk depends on clinical and imaging features."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["TSH with free hormones as appropriate; thyroid ultrasound and ultrasound-risk-based FNA if indicated—not every goitre needs aspiration.","Cervical node evaluation/ENT assessment for suspicious features."]},{heading:"Management",points:["Airway/compressive signs require urgent review; otherwise endocrine/ENT/surgical management based on function, structure and malignancy risk.","Explain medical, surveillance and surgical options depend on the established cause."]}]}],pages:[11],note:"",adapted:false,set:"2016 · cohort 2011",images:[]},{id:"jcs-124",year:"2016",rotation:"Surgery",topic:"pad",title:"Take a focused history from a 45-year-old with calf pain and suggest the diagnosis",case:"Take a focused history from a 45-year-old with calf pain and suggest the diagnosis.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Characterise exertional reproducible calf pain and relief with rest, distance, rest/night pain, ulcers and tissue loss.","Ask vascular risk, smoking, diabetes, cardiac/cerebrovascular disease, medicines and neurological/musculoskeletal alternatives."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["PAD versus neurogenic claudication, venous or joint/muscle pain; rest pain/tissue loss suggests chronic limb-threatening ischaemia."]}]}],pages:[11],note:"",adapted:false,set:"2016 · cohort 2011",images:[]},{id:"jcs-125",year:"2016",rotation:"Orthopaedics",topic:"knee",title:"A patient has knee pain after falling while playing football; effusion, crepitus and combined ligament/meniscal injury were recalled",case:"A patient has knee pain after falling while playing football; effusion, crepitus and combined ligament/meniscal injury were recalled.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect gait/alignment if safe then swelling/wasting, warmth/tenderness, effusion and comfortable active/passive range.","Assess Lachman/anterior drawer, posterior drawer and collateral stress when tolerated and trained; meniscal tests only if useful, not forced in an acutely painful joint.","Assess distal neurovascular status and adjacent joints; document findings."]}]}],pages:[11],note:"",adapted:false,set:"2016 · cohort 2011",images:[]},{id:"jcs-126",year:"2016",rotation:"Orthopaedics",topic:"femur",title:"A father attends after his ten-year-old fell. A displaced femoral shaft fracture was recalled on the film. Explain options, complications and future walking/function",case:"A father attends after his ten-year-old fell. A displaced femoral shaft fracture was recalled on the film. Explain options, complications and future walking/function.",objectives:[{key:"x",label:"Describe and interpret the supplied image or findings",sections:[{heading:"Describe, then interpret",points:["Inspect wounds/deformity, palpate gently without repeatedly moving fracture, document pulses/sensation/motor before/after immobilisation.","Femoral shaft fracture and associated trauma; exact pattern/displacement requires the supplied films, which are not included in this recall."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Explain X-ray by patient/side/view/site/pattern/displacement; acknowledge uncertainty about future disability until injury and healing are assessed.","Splint/immobilise and urgent orthopaedic review; assess blood loss and open injury.","Paediatric treatment depends on age, weight, displacement and stability: harness/cast/traction or fixation as selected, not one method for all 10-year-olds.","Discuss infection, bleeding, malunion/nonunion, growth/length differences, stiffness and fixation-specific risks; weight-bearing only per treating team."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Explain X-ray by patient/side/view/site/pattern/displacement; acknowledge uncertainty about future disability until injury and healing are assessed.","Splint/immobilise and urgent orthopaedic review; assess blood loss and open injury.","Paediatric treatment depends on age, weight, displacement and stability: harness/cast/traction or fixation as selected, not one method for all 10-year-olds.","Discuss infection, bleeding, malunion/nonunion, growth/length differences, stiffness and fixation-specific risks; weight-bearing only per treating team."]}]}],pages:[11],note:"Original X-ray is absent.",adapted:false,set:"2016 · cohort 2011",images:[]},{id:"jcs-127",year:"2016",rotation:"Anaesthesia",topic:"airway",title:"A woman is prepared for elective D&C. Insert an LMA on a model and perform bag-mask ventilation, describing the steps",case:"A woman is prepared for elective D&C. Insert an LMA on a model and perform bag-mask ventilation, describing the steps.",objectives:[{key:"p",label:"Demonstrate or explain the procedure safely",sections:[{heading:"Safety and steps",points:["Model-only, trained practice: position airway appropriately (jaw thrust/manual in-line support for suspected cervical injury), remove visible obstruction/suction, oxygen and correct mask size.","Use effective seal and jaw lift (two-person BVM preferred when possible), ventilate to visible chest rise without excessive rate/volume, reassess chest rise/oxygenation/capnography if available.","OPA for deeply unresponsive patient without gag; NPA sizing/contraindications per training (avoid suspected skull-base/major facial injury). Use a suitable supraglottic device/LMA when indicated and escalate failed oxygenation.","Intubation needs trained staff, equipment checks, backup plan, monitoring and waveform capnography confirmation; device sizes depend on device and patient, not one universal size."]},{heading:"Checks and samples",points:["Call emergency/resuscitation team, assess ABCDE, attach monitoring/defibrillator; glucose and ECG as appropriate.","If unresponsive and not breathing normally, start CPR/use defibrillator per current training—ventilation alone is not sufficient."]}]}],pages:[12],note:"",adapted:false,set:"2016 · cohort 2011",images:[]},{id:"jcs-128",year:"2016",rotation:"Ophthalmology",topic:"fundus",title:"A 50-year-old with diabetes and hypertension attends for fundoscopy. Describe findings and interpret a supplied retinal photograph",case:"A 50-year-old with diabetes and hypertension attends for fundoscopy. Describe findings and interpret a supplied retinal photograph.",objectives:[{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Consent, acuity first, dim lights, check instrument/red reflex, examine disc/vessels/macula systematically within competence.","Do not dilate an undifferentiated painful red eye without assessment; supplied photos/videos are absent in many recalls, so do not invent findings."]}]},{key:"x",label:"Describe and interpret the supplied image or findings",sections:[{heading:"Describe, then interpret",points:["Consent, acuity first, dim lights, check instrument/red reflex, examine disc/vessels/macula systematically within competence.","Do not dilate an undifferentiated painful red eye without assessment; supplied photos/videos are absent in many recalls, so do not invent findings.","Diabetic retinopathy, hypertensive change, retinal occlusion and other fundus pathology; direct examination cannot reliably grade all retinal disease."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Diabetic retinopathy, hypertensive change, retinal occlusion and other fundus pathology; direct examination cannot reliably grade all retinal disease."]}]}],pages:[12],note:"Microaneurysms and hard/soft exudates were recalled; original retinal image absent.",adapted:false,set:"2016 · cohort 2011",images:[]},{id:"jcs-129",year:"2017",rotation:"Surgery",topic:"breast",title:"A 38-year-old woman presents with a breast lump",case:"A 38-year-old woman presents with a breast lump.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask duration/change, pain/cycle relation, nipple discharge/retraction, skin change, pregnancy/lactation, systemic symptoms and family/personal breast history."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Model or supervised setting: explain, explicit consent, chaperone offer, privacy and draping.","Inspect symmetry, skin/nipple change with appropriate arm positions; systematic palpation of all tissue, characterise lump, assess axillary/supraclavicular nodes and other breast."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Fibroadenoma, cyst, malignancy, fat necrosis or infection; young age and mobility do not by themselves exclude cancer."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Triple assessment when indicated: clinical exam, age/risk-appropriate imaging (often ultrasound in younger patients) and tissue sampling as needed.","Urgent breast pathway for suspicious features; do not diagnose a lump solely by palpation."]},{heading:"Management",points:["Management depends on concordant assessment: reassurance/surveillance or excision for selected confirmed benign lesions versus cancer treatment pathway.","Discuss options, growth/symptom concerns and follow-up."]}]}],pages:[13],note:"",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-130",year:"2017",rotation:"Surgery",topic:"renal",title:"A 45-year-old man presents with flank pain and has a history of gout",case:"A 45-year-old man presents with flank pain and has a history of gout.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask colicky radiation to groin, haematuria, fever/rigors, dysuria, vomiting, stone history, solitary kidney, gout and fluid intake.","Assess pregnancy, retention, trauma and malignancy risks as relevant."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Assess vitals/sepsis, hydration, abdomen and gentle renal angle tenderness; avoid repeated painful percussion.","Assess mass if present; offer indicated genital/hernia examination with consent. A new non-reducing left varicocele with concerning signs can prompt renal assessment."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Ureteric stone, pyelonephritis, obstruction, renal mass and non-urinary causes; reconcile the side of pain with imaging rather than silently changing it."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Urinalysis/culture, renal function/electrolytes, FBC and pregnancy test when appropriate.","Non-contrast low-dose CT KUB is typical adult stone imaging; ultrasound first in pregnancy/children or selected pathways. Uric acid stones can be radiolucent on plain film but visible on CT."]},{heading:"Management",points:["Sepsis with obstruction, anuria/AKI, solitary kidney or uncontrolled symptoms needs urgent urology; infected obstruction requires antibiotics plus urgent decompression, not antibiotics alone.","Analgesia (NSAID if safe), antiemetic, hydration to need and stone-size/location-based passage versus intervention plan.","Uric acid stones: metabolic assessment and specialist-guided urine alkalinisation may dissolve selected stones; do not prescribe it indiscriminately."]}]}],pages:[13],note:"Recall names uric acid stones and asks particularly about imaging and treatment.",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-131",year:"2017",rotation:"Surgery",topic:"appendicitis",title:"A man presents with two hours of right lower abdominal pain",case:"A man presents with two hours of right lower abdominal pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask onset/migration to RIF, anorexia, nausea/vomiting, fever, bowel/urinary symptoms and pregnancy/sexual-gynaecological context when relevant."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Vitals/general assessment and gentle abdomen away from pain, local tenderness/guarding; do not repeatedly provoke rebound; relevant genital/hernia/gynaecological exam only if indicated/consented."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Appendicitis versus gastroenteritis, mesenteric adenitis, urinary stone/infection, IBD and ectopic/ovarian pathology."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Observations, urine/pregnancy test, FBC/CRP/renal tests; ultrasound or CT based on age/pregnancy/risk and surgical assessment."]},{heading:"Management",points:["Analgesia, antiemetic and hydration as needed, nil by mouth pending surgery plan and prompt surgical review.","Antibiotics/appendicectomy versus selected nonoperative treatment depends on imaging, complications and patient/team decision; sepsis/peritonitis needs urgent care."]}]}],pages:[13],note:"",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-132",year:"2017",rotation:"Surgery",topic:"graves",title:"A young woman presents with a neck mass",case:"A young woman presents with a neck mass.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask weight loss, heat intolerance, palpitations, bowel change, tremor, menstrual change and neck compression.","Assess eye pain/diplopia/vision, smoking, pregnancy, medicines, cardiac symptoms and family autoimmune disease."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Warm moist hands, tremor, tachycardia/AF, proximal power/reflexes, diffuse goitre/bruit; assess eye movements, acuity and corneal exposure if eye signs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Graves versus toxic nodules, thyroiditis and exogenous hormone; eye disease/diffuse vascular goitre supports Graves but tests confirm."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["TSH, free T4/T3, TSH receptor antibodies when indicated; ECG, baseline FBC/liver tests before relevant medicines.","Ultrasound for structural questions; radionuclide testing selected by specialists and avoided in pregnancy."]},{heading:"Management",points:["Symptom control with a suitable beta-blocker if safe; antithyroid medicine, radioiodine or surgery based on cause, preference, pregnancy and specialist input.","Carbimazole can cause agranulocytosis: fever/sore throat requires stopping it and urgent medical/FBC assessment per safety instructions; liver symptoms also require urgent review.","Thyroid storm is emergency treatment; severe/sight-threatening thyroid eye disease needs urgent eye/endocrine care. Smoking cessation matters."]}]}],pages:[13],note:"",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-133",year:"2017",rotation:"Orthopaedics",topic:"knee",title:"A 25-year-old man presents with leg/knee instability",case:"A 25-year-old man presents with leg/knee instability.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask mechanism (twist/contact/hyperextension), pop, immediate/delayed swelling, instability, locking, weight-bearing and prior injury.","Check fracture, infection and neurovascular red flags; assess sport/work goals."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect gait/alignment if safe then swelling/wasting, warmth/tenderness, effusion and comfortable active/passive range.","Assess Lachman/anterior drawer, posterior drawer and collateral stress when tolerated and trained; meniscal tests only if useful, not forced in an acutely painful joint.","Assess distal neurovascular status and adjacent joints; document findings."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["ACL/MCL/meniscal injury, patellar injury, fracture or other internal derangement; combined injury is possible but not assumed from one sign."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Plain films when fracture criteria/clinical concern indicate; MRI for selected soft-tissue assessment and management planning."]},{heading:"Management",points:["Analgesia, protection/support and early appropriate rehabilitation; urgent referral for dislocation/neurovascular compromise, locked knee or major instability.","MCL injuries are often treated nonoperatively; surgery is reserved for selected severe/combined injuries, not all “severe” tears automatically.","ACL reconstruction versus rehabilitation depends on instability, activity and associated injury; shared orthopaedic plan."]}]}],pages:[14],note:"",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-134",year:"2017",rotation:"Orthopaedics",topic:"radius",title:"A 35-year-old woman fell onto her outstretched hand. Explain the wrist film, treatment options and short/long-term complications",case:"A 35-year-old woman fell onto her outstretched hand. Explain the wrist film, treatment options and short/long-term complications.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask fall mechanism, dominant hand, occupation/function, osteoporosis risk, wounds, numbness and other injury."]}]},{key:"x",label:"Describe and interpret the supplied image or findings",sections:[{heading:"Describe, then interpret",points:["Inspect deformity/skin, gently assess landmarks, median/ulnar/radial sensation and motor, pulses/capillary refill before/after intervention.","Distal radius fracture (dorsal displacement supports Colles), other wrist/forearm fractures and scaphoid injury; actual film is needed."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["AP/lateral wrist films and neurovascular assessment, especially median nerve; post-reduction imaging where performed."]},{heading:"Management",points:["Analgesia, immobilisation and reduction by trained staff if displaced; surgery for selected unstable/displaced/intra-articular patterns.","Repeat neurovascular checks, swelling/cast advice and fracture follow-up; assess fragility-fracture prevention when relevant."]}]}],pages:[14],note:"Colles fracture recalled, original image absent.",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-135",year:"2017",rotation:"Anaesthesia",topic:"airway",title:"A patient with asthma presents with dyspnoea and palpitations, then loses consciousness during history",case:"A patient with asthma presents with dyspnoea and palpitations, then loses consciousness during history.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Before collapse, obtain key chest-pain/dyspnoea, cardiac/respiratory, allergy, medicine and event history if time permits.","Once collapse occurs, stop routine history and assess responsiveness and breathing immediately."]}]},{key:"p",label:"Demonstrate or explain the procedure safely",sections:[{heading:"Safety and steps",points:["Model-only, trained practice: position airway appropriately (jaw thrust/manual in-line support for suspected cervical injury), remove visible obstruction/suction, oxygen and correct mask size.","Use effective seal and jaw lift (two-person BVM preferred when possible), ventilate to visible chest rise without excessive rate/volume, reassess chest rise/oxygenation/capnography if available.","OPA for deeply unresponsive patient without gag; NPA sizing/contraindications per training (avoid suspected skull-base/major facial injury). Use a suitable supraglottic device/LMA when indicated and escalate failed oxygenation.","Intubation needs trained staff, equipment checks, backup plan, monitoring and waveform capnography confirmation; device sizes depend on device and patient, not one universal size."]},{heading:"Checks and samples",points:["Call emergency/resuscitation team, assess ABCDE, attach monitoring/defibrillator; glucose and ECG as appropriate.","If unresponsive and not breathing normally, start CPR/use defibrillator per current training—ventilation alone is not sufficient."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Equipment: oxygen, suction, BVM/masks, airway adjuncts, appropriate laryngoscope/tubes or supraglottic device, cuff syringe, fixation, capnography and rescue equipment.","Explain actions to team and relatives where possible; debrief after stabilisation.","Model-only, trained practice: position airway appropriately (jaw thrust/manual in-line support for suspected cervical injury), remove visible obstruction/suction, oxygen and correct mask size.","Use effective seal and jaw lift (two-person BVM preferred when possible), ventilate to visible chest rise without excessive rate/volume, reassess chest rise/oxygenation/capnography if available.","OPA for deeply unresponsive patient without gag; NPA sizing/contraindications per training (avoid suspected skull-base/major facial injury). Use a suitable supraglottic device/LMA when indicated and escalate failed oxygenation.","Intubation needs trained staff, equipment checks, backup plan, monitoring and waveform capnography confirmation; device sizes depend on device and patient, not one universal size."]}]}],pages:[14],note:"",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-136",year:"2017",rotation:"Ophthalmology",topic:"visualfield",title:"A 45-year-old woman has headache and blurred vision. Assess visual fields, discuss alternatives and management",case:"A 45-year-old woman has headache and blurred vision. Assess visual fields, discuss alternatives and management.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask visual onset/progression, peripheral loss, headache, diplopia and pituitary hormone symptoms (menses, libido, galactorrhoea, body changes)."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Test each eye separately, match eye level/distance, ensure fixation, compare quadrants with finger counting/movement/appropriate target; assess blind spot if required.","State limitations of confrontation and need for formal fields; do not infer the field solely from symptom wording."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Bitemporal hemianopia suggests optic chiasm pathology, often pituitary mass; other field patterns have different localisations.","Optic-disc oedema and headache require urgent consideration, not automatic reassurance about a benign adenoma."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Acuity, pupils, confrontation fields, fundus; formal perimetry, pituitary MRI and endocrine hormone assessment through specialists."]},{heading:"Management",points:["Urgent eye/endocrine/neurosurgical review for field defect; sudden severe headache/vision loss/ophthalmoplegia suggests pituitary apoplexy and is an emergency.","Management (medicine/surgery/surveillance) depends on tumour type and compression; do not presume all pituitary lesions need the same operation."]}]}],pages:[14],note:"Pituitary lesion/bitemporal field loss recalled; original field picture absent.",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-137",year:"2017",rotation:"Medicine",topic:"myopathy",title:"A young man has limb weakness and difficulty walking",case:"A young man has limb weakness and difficulty walking.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask age/onset, progression, proximal tasks, falls/Gowers, family pattern, muscle pain, exercise and cardiac/respiratory/bulbar symptoms."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Compare proximal/distal power, bulk, tone/reflexes and sensation; assess Gowers if appropriate without exhausting patient.","For cerebellar variant assess speech, nystagmus, finger–nose/heel–shin and guarded gait; do not invent findings for a missing variant."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Muscular dystrophy/myopathy versus neuropathy, motor neurone, junctional or cerebellar disorder; ataxia and weakness are not interchangeable."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["CK and targeted biochemical tests; neurology-directed genetic/EMG/imaging; cardiac/respiratory testing if dystrophy suspected."]},{heading:"Management",points:["Specialist diagnosis, genetic counselling where relevant, physiotherapy/assistive support and cardiopulmonary surveillance.","Respiratory/bulbar dysfunction requires urgent review; disease-specific treatment depends on diagnosis."]}]}],pages:[15],note:"Two variants recalled: muscular dystrophy or cerebellar ataxia. Localise before diagnosing.",adapted:false,set:"2017 · cohort 2012 · group B",images:[]},{id:"jcs-138",year:"2017",rotation:"Medicine",topic:"bronchiectasis",title:"A middle-aged man has breathlessness and cough",case:"A middle-aged man has breathlessness and cough.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Characterise chronic cough, daily sputum volume/purulence, recurrent infection, haemoptysis, breathlessness and exacerbations.","Ask childhood disease/CF, aspiration, immune/connective-tissue disease, smoking, TB exposure and previous cultures/treatment."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect work of breathing and sputum, clubbing, pulse and SpO2; examine trachea and expansion.","Compare percussion, auscultation and vocal resonance anteriorly/posteriorly including bases; describe coarse crackles/wheeze without inventing signs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Important points",points:["Bronchiectasis is suggested by chronic productive cough with coarse crackles/clubbing; consider COPD, TB, lung cancer and interstitial disease."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Observations/SpO2, sputum culture and chest radiograph initially.","High-resolution CT confirms bronchiectasis; spirometry and cause-directed immune/CF testing as appropriate."]},{heading:"Management",points:["Assess exacerbation severity and sepsis; culture-guided antibiotics according
