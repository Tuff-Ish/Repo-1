refs:[]}},{id:"jcs-246",year:"Unstated",rotation:"Psychiatry",topic:"gad",title:"A patient has persistent excessive worry",case:"A patient has persistent excessive worry.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask domains, duration, uncontrollability, restlessness, muscle tension, sleep, irritability, concentration and function.","Ask panic, OCD, depression/suicidality, trauma, caffeine/substances and physical/medicine causes."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["MSE and targeted physical/thyroid/other tests if symptoms suggest a medical cause."]},{heading:"Management",points:["Psychoeducation, self-help and CBT/applied relaxation; consider an SSRI based on persistent impairment and shared decisions.","Discuss activation, GI/sexual side effects, delayed benefit and follow-up; avoid routine long-term benzodiazepine dependence."]}]}],pages:[72,80],note:"Topic-only recall: no patient age, case details or objectives were recorded. The practice stem and objectives are added, not quoted from an original exam. Clear duplicate topic list merged.",adapted:true,set:"Undated · repeated day 1 / day 2 set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-246",diagnoses:["GAD"],differentials:[],evidence:[{page:72,quote:"Station 7: GAD"}],mode:"document-context"},aiNotes:{title:"GAD",safety:"",refs:[]}},{id:"jcs-247",year:"Unstated",rotation:"Psychiatry",topic:"adhd",title:"A child has attention and activity concerns",case:"A child has attention and activity concerns.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Assess inattention and hyperactivity/impulsivity with examples, onset before age 12, persistence and impairment in at least two settings.","Obtain parent/school reports, developmental/hearing/vision history, sleep, learning, autism, anxiety, trauma and family history."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Specialist developmental/ADHD assessment with structured rating information across settings; no single blood test or IQ test confirms ADHD.","Before medication, assess height/weight, pulse/BP, cardiac/family history and other baseline requirements."]},{heading:"Management",points:["Parent/carer training and school/environmental adjustments, predictable routines and sleep support.","Medication for persistent significant impairment through specialists: stimulants such as methylphenidate and selected non-stimulants such as atomoxetine/guanfacine according to age/local pathway.","Monitor response, appetite/growth, sleep, pulse/BP and mood; not every family must begin with medication."]}]}],pages:[72,80],note:"Topic-only recall: no patient age, case details or objectives were recorded. The practice stem and objectives are added, not quoted from an original exam. Clear duplicate topic list merged.",adapted:true,set:"Undated · repeated day 1 / day 2 set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-247",diagnoses:["ADHD"],differentials:[],evidence:[{page:72,quote:"Station 8: ADHD"}],mode:"document-context"},aiNotes:{title:"ADHD",safety:"",refs:[]}},{id:"jcs-248",year:"Unstated",rotation:"Psychiatry",topic:"dementia",title:"An older person has progressive memory difficulty",case:"An older person has progressive memory difficulty.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Obtain patient and collateral accounts with permission: gradual versus acute/fluctuating onset, memory/language/executive changes and daily function.","Ask mood, psychosis, medicines, alcohol, neurological events, sensory problems, driving, finances, medication safety and caregiver needs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Physical/neurological exam, validated language/culture-appropriate cognitive assessment, sensory review and collateral.","Reversible-cause blood tests and specialist-selected structural imaging; refer to memory/neurology service as appropriate."]},{heading:"Management",points:["Agree support, medication simplification, safeguarding/driving assessment and advance planning while preserving autonomy.","Specialist subtype-based medication: cholinesterase inhibitors and/or memantine when indicated; discuss adverse effects and limits.","Support caregivers and arrange community/functional assessment."]}]}],pages:[72,73,80],note:"Topic-only recall: no patient age, case details or objectives were recorded. The practice stem and objectives are added, not quoted from an original exam. Clear duplicate topic list merged.",adapted:true,set:"Undated · repeated day 1 / day 2 set",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-248",diagnoses:["Alzheimer dementia"],differentials:[],evidence:[{page:73,quote:"Station 9: Dementia (Alzheimers)"}],mode:"document-context"},aiNotes:{title:"Alzheimer dementia",safety:"",refs:[]}},{id:"jcs-249",year:"2023",rotation:"Medicine",topic:"hepa",title:"A 35-year-old woman presents with jaundice for one week",case:"A 35-year-old woman presents with jaundice for one week.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask jaundice, dark urine/pale stool, itching, RUQ pain, nausea, fever, exposure timing, travel/food/water/contacts, medicines/alcohol and other hepatitis risks."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Liver profile, bilirubin, INR, glucose and renal function; anti-HAV IgM supports recent infection, IgG indicates past infection/vaccination.","Interpret HBV using HBsAg, anti-HBc IgM/total and anti-HBs pattern; HCV antibody may need RNA confirmation. Ultrasound if obstruction possible."]},{heading:"Management",points:["Most uncomplicated hepatitis A: supportive fluids/nutrition, avoid alcohol/hepatotoxic medicines and appropriate symptom relief.","Analgesic choice/dose must consider liver injury; do not automatically give full-dose paracetamol or NSAIDs without clinical assessment.","Encephalopathy, bleeding/prolonged INR, hypoglycaemia or worsening illness needs urgent liver/emergency assessment; public-health/contact prophylaxis per policy."]}]},{key:"v",label:"Address the recalled follow-up questions",sections:[{heading:"Important follow-up points",points:["Explain faeco-oral spread, hand hygiene and vaccination/contact advice; most recover but liver failure warnings include confusion, abnormal bleeding and severe deterioration.","Most uncomplicated hepatitis A: supportive fluids/nutrition, avoid alcohol/hepatotoxic medicines and appropriate symptom relief.","Analgesic choice/dose must consider liver injury; do not automatically give full-dose paracetamol or NSAIDs without clinical assessment.","Encephalopathy, bleeding/prolonged INR, hypoglycaemia or worsening illness needs urgent liver/emergency assessment; public-health/contact prophylaxis per policy."]}]}],pages:[73],note:"",adapted:false,set:"2023 · cohort 2018",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A 35-year-old woman has one week of jaundice after returning from India and possible contaminated food/water. Interpret hepatitis serology.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Travel and exposure history",items:["Recent return from India, with intake of contaminated food and water reported."]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-249",diagnoses:["Hepatitis A"],differentials:[],evidence:[{page:73,quote:"case of hepatitis A"}],mode:"document-context"},aiNotes:{title:"Hepatitis A",safety:"",refs:[]}},{id:"jcs-250",year:"2023",rotation:"Medicine",topic:"bronchiectasis",title:"A 45-year-old man has chronic cough",case:"A 45-year-old man has chronic cough.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Characterise chronic cough, daily sputum volume/purulence, recurrent infection, haemoptysis, breathlessness and exacerbations.","Ask childhood disease/CF, aspiration, immune/connective-tissue disease, smoking, TB exposure and previous cultures/treatment."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect work of breathing and sputum, clubbing, pulse and SpO2; examine trachea and expansion.","Compare percussion, auscultation and vocal resonance anteriorly/posteriorly including bases; describe coarse crackles/wheeze without inventing signs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Observations/SpO2, sputum culture and chest radiograph initially.","High-resolution CT confirms bronchiectasis; spirometry and cause-directed immune/CF testing as appropriate."]},{heading:"Management",points:["Assess exacerbation severity and sepsis; culture-guided antibiotics according to previous organisms and local policy.","Airway clearance with physiotherapy, vaccinations, exercise and smoking cessation.","Specialist management for frequent exacerbations or chronic colonisation; significant haemoptysis is urgent."]}]}],pages:[73],note:"",adapted:false,set:"2023 · cohort 2018",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-250",diagnoses:["Bronchiectasis"],differentials:[],evidence:[{page:73,quote:"case of bronchiectasis"}],mode:"document-context"},aiNotes:{title:"Bronchiectasis",safety:"",refs:[]}},{id:"jcs-251",year:"2023",rotation:"Medicine",topic:"tia",title:"A 55-year-old man presents with weakness",case:"A 55-year-old man presents with weakness.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Establish exact onset/last known well, symptom duration/resolution, face/limb/speech/vision/balance symptoms and residual deficit.","Ask AF/vascular risks, anticoagulation, seizure/migraine and glucose-related symptoms."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["ABCDE, glucose, focused neurological exam and immediate stroke pathway if ongoing/recent deficit.","Specialist TIA/stroke assessment, brain/vascular imaging as indicated, ECG/rhythm and risk-factor tests; do not use ABCD2 alone to decide urgency."]},{heading:"Management",points:["Acute stroke requires time-critical specialist reperfusion/haemorrhage evaluation; no oral intake before swallow safety assessment.","Suspected resolved TIA needs urgent specialist assessment (often within 24 hours); antiplatelet and prevention per current pathway and contraindications.","Address AF, carotids, BP/lipids, smoking and driving guidance after diagnosis."]}]}],pages:[73],note:"TIA is recalled, but symptom duration/resolution is unspecified; ongoing deficit requires the acute stroke pathway.",adapted:false,set:"2023 · cohort 2018",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-251",diagnoses:["TIA"],differentials:[],evidence:[{page:73,quote:"case of TIA"}],mode:"document-context"},aiNotes:{title:"TIA",safety:"",refs:[]}},{id:"jcs-252",year:"2023",rotation:"Paediatrics",topic:"tga",title:"A five-day-old newborn presents with cyanosis",case:"A five-day-old newborn presents with cyanosis.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Establish early neonatal cyanosis, feeding distress, timing after birth and antenatal/birth history; assess fever/poor perfusion."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Immediate pre/postductal oxygenation assessment, glucose/blood gas and urgent echo; ECG/CXR support but do not exclude disease."]},{heading:"Management",points:["Urgent neonatal/cardiology stabilisation and transfer; specialist-directed prostaglandin to maintain ductal patency when indicated.","Inadequate mixing may require urgent balloon atrial septostomy; definitive correction is usually an arterial switch procedure."]}]}],pages:[73,74],note:"",adapted:false,set:"2023 · cohort 2018",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-252",diagnoses:["Transposition of great arteries"],differentials:[],evidence:[{page:74,quote:"case of transposition of great arteries"}],mode:"document-context"},aiNotes:{title:"Transposition of great arteries",safety:"",refs:[]}},{id:"jcs-253",year:"2023",rotation:"Paediatrics",topic:"meningitis",title:"A four-year-old has fever and fussiness",case:"A four-year-old has fever and fussiness.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask fever duration, feeding, irritability/lethargy, rash, neck symptoms, vomiting, seizures (duration/focality/recovery), immunisation and exposure.","In infants consider subtle poor feeding, apnoea or reduced responsiveness; do not require neck stiffness."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["ABCDE, glucose, blood cultures and urgent blood tests; CSF only when safe and without delaying treatment; imaging according to indication."]},{heading:"Management",points:["Immediate senior paediatric/emergency care, age-appropriate empirical IV antimicrobials per protocol and seizure treatment if prolonged; do not wait for LP.","Manage shock/glucose/airway and monitor; isolate/public-health measures and contact prophylaxis for relevant organisms.","Arrange hearing/neurodevelopmental follow-up; discuss potential seizures/sequelae without guaranteeing epilepsy or no sequelae."]}]}],pages:[74],note:"",adapted:false,set:"2023 · cohort 2018",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-253",diagnoses:["Meningitis"],differentials:[],evidence:[{page:74,quote:"case of meningitis"}],mode:"document-context"},aiNotes:{title:"Meningitis",safety:"Seizure, reduced consciousness, shock or suspected meningitis needs emergency assessment.",refs:["meningitis"]}},{id:"jcs-254",year:"2023",rotation:"Paediatrics",topic:"uti",title:"An 18-month-old has fever",case:"An 18-month-old has fever.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask dysuria, frequency, urgency, suprapubic pain, haematuria, duration, fever/flank pain, pregnancy, discharge/STI risk, stones and previous cultures."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Urine testing/culture according to sex/pregnancy/age/complexity and local policy; pregnancy/STI testing when relevant.","Fever/obstruction concern: renal tests and appropriate imaging; consider stone imaging if clinical pattern suggests."]},{heading:"Management",points:["Pregnancy, male/paediatric or complicated disease needs an appropriate specific pathway; choose antibiotics using local resistance/culture, renal function and allergy.","Simple lower UTI may be treated with first-line local options, analgesia/hydration and review; fever, vomiting or sepsis requires urgent assessment.","Stone with infected obstruction needs urgent drainage/urology, not antibiotics alone."]},{heading:"Paediatric upper UTI emphasis",points:["Febrile 18-month-old: assess sepsis, hydration, feeding and urine output; obtain appropriately collected urine for culture before antibiotics if feasible without delay.","Use paediatric pyelonephritis antibiotic/admission guidance and weight-based formulary; vomiting, sepsis or poor intake may require hospital treatment. Arrange age/risk-based imaging/follow-up, not routine adult cystitis advice."]}]}],pages:[74],note:"Pyelonephritis was recalled. Use age-appropriate febrile-child assessment, properly collected urine culture and paediatric upper-UTI treatment/admission criteria, not an adult uncomplicated-cystitis regimen.",adapted:false,set:"2023 · cohort 2018",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-254",diagnoses:["Pyelonephritis"],differentials:[],evidence:[{page:74,quote:"case of pyelonephritis"}],mode:"document-context"},aiNotes:{title:"Pyelonephritis",safety:"",refs:[]}},{id:"jcs-255",year:"2023",rotation:"Psychiatry",topic:"autism",title:"A three-year-old presents with speech delay",case:"A three-year-old presents with speech delay.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Take developmental and language/hearing history, social communication/reciprocity, play, repetitive behaviours, restricted interests and sensory differences.","Establish onset and impact across settings, regression, school function, strengths, sleep, feeding and family history; ask parent concerns without blame."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Formal hearing/vision and multidisciplinary developmental/autism assessment, school information and developmental/cognitive profile as indicated."]},{heading:"Management",points:["Early communication/educational and environmental support tailored to strengths/needs, parent support and treatment of coexisting conditions.","No medicine cures core autism; use specialist medication only for specific significant comorbid symptoms when appropriate."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Use respectful neurodevelopmental language, explain there is no parental blame, agree practical supports and avoid unsupported causal claims.","Early communication/educational and environmental support tailored to strengths/needs, parent support and treatment of coexisting conditions.","No medicine cures core autism; use specialist medication only for specific significant comorbid symptoms when appropriate."]}]}],pages:[74],note:"",adapted:false,set:"2023 · cohort 2018",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A three-year-old has speech delay. Take history and discuss care with the mother.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-255",diagnoses:["ASD"],differentials:[],evidence:[{page:74,quote:"case of ASD"}],mode:"document-context"},aiNotes:{title:"ASD",safety:"",refs:[]}},{id:"jcs-256",year:"2023",rotation:"Psychiatry",topic:"bipolar",title:"A 35-year-old man has sleep disturbance for three weeks",case:"A 35-year-old man has sleep disturbance for three weeks.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Establish current low versus elevated/irritable mood, sleep need, energy, speech/thought acceleration, impulsivity, psychosis and functioning.","Ask past mania/hypomania/depression, episodes/medicines including antidepressants, adherence, substances and collateral.","Assess suicide, spending/sexual/driving risks, vulnerability and ability to care for self."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["MSE and physical review; renal/thyroid/calcium and lithium level when appropriate, plus medication-specific monitoring.","Check pregnancy possibility and drug interactions; urgent level/electrolytes if toxicity suspected."]},{heading:"Management",points:["Acute mania/psychosis or major safety risk: urgent psychiatric review; review/stop triggering antidepressants only through an appropriate prescriber.","Treatment may include an antipsychotic and/or mood stabiliser selected for phase, prior response and reproductive risk.","Bipolar depression requires specialist phase-specific treatment; avoid routine antidepressant monotherapy. Valproate carries major reproductive restrictions."]}]}],pages:[74],note:"",adapted:false,set:"2023 · cohort 2018",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-256",diagnoses:["Bipolar disorder"],differentials:[],evidence:[{page:74,quote:"case of bipolar disorder"}],mode:"document-context"},aiNotes:{title:"Bipolar disorder",safety:"",refs:[]}},{id:"jcs-257",year:"2023",rotation:"Psychiatry",topic:"ocd",title:"A 40-year-old man has worrying thoughts for eight months",case:"A 40-year-old man has worrying thoughts for eight months.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask intrusive unwanted thoughts/images/urges and repetitive acts/mental rituals, time consumed, distress, avoidance and functional effect.","Assess insight, resistance, triggers, reassurance seeking, depression, suicide risk, psychosis and substance use."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["MSE and functional/risk assessment; targeted physical investigations only if indicated, not a test to prove OCD."]},{heading:"Management",points:["CBT with exposure and response prevention; SSRIs depending on severity, preference and specialist assessment.","Explain that response may take time and OCD may need a different dose/duration strategy under supervision; review adherence and side effects.","Severe impairment/risk or nonresponse needs specialist input."]}]}],pages:[74,75],note:"",adapted:false,set:"2023 · cohort 2018",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-257",diagnoses:["OCD"],differentials:[],evidence:[{page:75,quote:"case of OCD"}],mode:"document-context"},aiNotes:{title:"OCD",safety:"",refs:[]}},{id:"jcs-258",year:"2023",rotation:"FAMCO",topic:"migraine",title:"A 32-year-old woman presents with headache",case:"A 32-year-old woman presents with headache.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Characterise onset, time course, location, quality, severity, duration, aura, nausea, light/sound sensitivity and activity effect.","Ask thunderclap onset, fever/meningism, new neurological deficit, pregnancy/postpartum, cancer/immunosuppression, trauma, positional/exertional change and medication overuse."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Vitals and focused neurological/fundal assessment; targeted urgent imaging/LP pathway for red flags.","Routine MRI is not indicated solely for reassurance after a typical primary headache and normal appropriate assessment."]},{heading:"Management",points:["Explain working diagnosis and safety-net; headache diary, sleep/hydration/regular meals and trigger management.","Acute migraine: suitable simple analgesic/NSAID and/or triptan ± antiemetic after contraindications; tension-type generally simple analgesia; avoid opioids.","Discuss prevention if frequent/disabling, with pregnancy and reproductive-safety considerations. Any prescription requires allergy, pregnancy, interaction, dose/duration and follow-up checks."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Explore why MRI is requested, explain benefits/harms and red flags without dismissing concern.","Explain working diagnosis and safety-net; headache diary, sleep/hydration/regular meals and trigger management.","Acute migraine: suitable simple analgesic/NSAID and/or triptan ± antiemetic after contraindications; tension-type generally simple analgesia; avoid opioids.","Discuss prevention if frequent/disabling, with pregnancy and reproductive-safety considerations. Any prescription requires allergy, pregnancy, interaction, dose/duration and follow-up checks."]}]}],pages:[75],note:"",adapted:false,set:"2023 · cohort 2018",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-258",diagnoses:["Migraine headache"],differentials:[],evidence:[{page:75,quote:"case of migraine headache"}],mode:"document-context"},aiNotes:{title:"Migraine headache",safety:"",refs:[]}},{id:"jcs-259",year:"2023",rotation:"FAMCO",topic:"diabetes",title:"A 45-year-old woman has an abnormal random blood sugar reading",case:"A 45-year-old woman has an abnormal random blood sugar reading.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask polyuria, polydipsia, weight loss, fatigue, infections, visual symptoms, duration and symptoms of hyperglycaemic crisis.","Assess diet/activity, family history, pregnancy, medicines/steroids, cardiovascular/renal disease and patient concerns."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["HbA1c or appropriate plasma glucose confirmation, renal function/eGFR, urine ACR, lipids/BP and complications screening.","Ketones/urgent metabolic work-up if weight loss, illness or possible insulin deficiency."]},{heading:"Management",points:["Individualised education, nutrition/activity support and medication based on HbA1c, renal function, cardiovascular/heart failure risk and preferences.","Metformin may be appropriate; SGLT2 inhibitors and GLP-1-based treatments have selected cardiorenal/metabolic indications; insulin if clinically needed.","Persistent albuminuria: optimise BP/glucose; ACE inhibitor/ARB and/or SGLT2 therapy when indicated with eGFR, potassium, pregnancy and contraindication checks—not automatically for everyone."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Explain microvascular and cardiovascular complications without fatalism; kidney failure is not inevitable. Discuss smoking cessation, monitoring, annual reviews and sick-day/hypoglycaemia advice tailored to medicines.","Individualised education, nutrition/activity support and medication based on HbA1c, renal function, cardiovascular/heart failure risk and preferences.","Metformin may be appropriate; SGLT2 inhibitors and GLP-1-based treatments have selected cardiorenal/metabolic indications; insulin if clinically needed.","Persistent albuminuria: optimise BP/glucose; ACE inhibitor/ARB and/or SGLT2 therapy when indicated with eGFR, potassium, pregnancy and contraindication checks—not automatically for everyone."]}]}],pages:[75],note:"",adapted:false,set:"2023 · cohort 2018",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-259",diagnoses:["Type 2 diabetes"],differentials:[],evidence:[{page:75,quote:"case of DM2"}],mode:"document-context"},aiNotes:{title:"Type 2 diabetes",safety:"",refs:["diabetes"]}},{id:"jcs-260",year:"2023",rotation:"Dermatology",topic:"shingles",title:"A 58-year-old man presents with a painful skin eruption",case:"A 58-year-old man presents with a painful skin eruption.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask pain before rash, onset, dermatome, prior chickenpox/vaccine, immunosuppression, eye/ear symptoms and systemic illness."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Usually clinical; PCR if atypical/immunocompromised; urgent eye/ENT assessment with relevant involvement."]},{heading:"Management",points:["Antiviral treatment when indicated, ideally early and using current age/renal/local criteria; analgesia and skin care.","Ophthalmic zoster, facial palsy/ear disease, dissemination or immunosuppression requires urgent specialist assessment.","Discuss postherpetic neuralgia and vaccination eligibility after recovery."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Vesicle fluid can transmit varicella to non-immune people; cover lesions and avoid high-risk susceptible contacts until crusted.","Antiviral treatment when indicated, ideally early and using current age/renal/local criteria; analgesia and skin care.","Ophthalmic zoster, facial palsy/ear disease, dissemination or immunosuppression requires urgent specialist assessment.","Discuss postherpetic neuralgia and vaccination eligibility after recovery."]}]}],pages:[75],note:"The clinical photo is not included in the PDF.",adapted:false,set:"2023 · cohort 2018",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A 58-year-old man has a painful skin eruption. Describe the photograph, discuss alternatives, care and complications.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-260",diagnoses:["Shingles"],differentials:[],evidence:[{page:75,quote:"case of shingles"}],mode:"document-context"},aiNotes:{title:"Shingles",safety:"",refs:[]}},{id:"jcs-261",year:"2023",rotation:"Anaesthesia",topic:"airway",title:"A 58-year-old man presents with chest pain and breathlessness",case:"A 58-year-old man presents with chest pain and breathlessness.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Before collapse, obtain key chest-pain/dyspnoea, cardiac/respiratory, allergy, medicine and event history if time permits.","Once collapse occurs, stop routine history and assess responsiveness and breathing immediately."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Identify the key discriminating features in the history and examination, and select investigations to guide clinical reasoning."]}]},{key:"p",label:"Demonstrate or explain the procedure safely",sections:[{heading:"Safety and steps",points:["Model-only, trained practice: position airway appropriately (jaw thrust/manual in-line support for suspected cervical injury), remove visible obstruction/suction, oxygen and correct mask size.","Use effective seal and jaw lift (two-person BVM preferred when possible), ventilate to visible chest rise without excessive rate/volume, reassess chest rise/oxygenation/capnography if available.","OPA for deeply unresponsive patient without gag; NPA sizing/contraindications per training (avoid suspected skull-base/major facial injury). Use a suitable supraglottic device/LMA when indicated and escalate failed oxygenation.","Intubation needs trained staff, equipment checks, backup plan, monitoring and waveform capnography confirmation; device sizes depend on device and patient, not one universal size."]},{heading:"Checks and samples",points:["Call emergency/resuscitation team, assess ABCDE, attach monitoring/defibrillator; glucose and ECG as appropriate.","If unresponsive and not breathing normally, start CPR/use defibrillator per current training—ventilation alone is not sufficient."]}]}],pages:[75],note:"",adapted:false,set:"2023 · cohort 2018",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A 58-year-old man has chest pain and breathlessness, then collapses; demonstrate airway adjunct and bag-mask ventilation on a manikin.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"During the assessment",items:["The patient collapses during the station."]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-261",diagnoses:[],differentials:[],evidence:[],mode:"neutral"},aiNotes:{title:"Airway assessment and support",safety:"Unresponsive and not breathing normally: activate emergency response, CPR and defibrillator per training.",refs:["abcde"]}},{id:"jcs-262",year:"2023",rotation:"Orthopaedics",topic:"shoulder",title:"A man in his thirties has shoulder pain",case:"A man in his thirties has shoulder pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Clarify the site, onset, injury mechanism if any, pain pattern, stiffness, swelling, weakness, sensory change and functional limitation.","Ask systemic symptoms, previous episodes, relevant activities, medicines and effect on work or daily living; screen for urgent neurological or neurovascular symptoms when relevant."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Compare sides and describe inspection, palpation, movement, function and relevant neurovascular findings. Use focused special tests only when indicated and safe.","Describe visible swelling, colour, alignment and deformity, and correlate these with movement and function."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Identify the key discriminating features in the history and examination, and select investigations to guide clinical reasoning."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Assessment and investigations",points:["Select imaging or laboratory tests from the mechanism and actual examination findings, and explain what each test would establish."]},{heading:"Care pending assessment",points:["Offer appropriate pain relief and protection/support based on the assessment. Escalate acute neurovascular impairment, severe systemic illness or inability to function safely.","Discuss treatment options, referral and rehabilitation according to the examination and investigation findings."]}]}],pages:[76],note:"",adapted:false,set:"2023 · cohort 2018",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-262",diagnoses:[],differentials:[],evidence:[],mode:"neutral"},aiNotes:{title:"Musculoskeletal assessment",safety:"",refs:[]}},{id:"jcs-263",year:"2023",rotation:"Orthopaedics",topic:"footdrop",title:"A man in his twenties has an incompletely recalled limb complaint",case:"A man in his twenties has an incompletely recalled limb complaint.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask onset, back/radicular pain, leg crossing/pressure, trauma, surgery, weight loss, sensory symptoms and bladder/bowel red flags."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Test dorsiflexion/toe extension, eversion and inversion, proximal hip abduction, reflexes and sensory map.","Weak inversion/hip abduction suggests L5 involvement rather than isolated common fibular lesion; gait only with guarding."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Focused neurological exam; nerve conduction/EMG and imaging guided by localisation; urgent MRI for spinal emergency signs."]},{heading:"Management",points:["Address compression/cause, falls support and ankle-foot orthosis/physiotherapy; urgent review of new/progressive or traumatic deficit.","Spinal compression/cauda equina signs require emergency pathway."]}]}],pages:[76],note:"The recall names foot drop, but onset/cause and exact presenting words are missing.",adapted:false,set:"2023 · cohort 2018",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Recorded finding",items:["Foot drop is recorded."]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-263",diagnoses:["Foot drop"],differentials:[],evidence:[{page:76,quote:"case of foot drop"}],mode:"document-context"},aiNotes:{title:"Foot drop",safety:"",refs:[]}},{id:"jcs-264",year:"2023",rotation:"Surgery",topic:"ugib",title:"A 45-year-old man presents with haematemesis",case:"A 45-year-old man presents with haematemesis.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Clarify vomiting blood/coffee grounds versus coughing blood; quantity, melaena, syncope, shock, pain, retching, ulcers, liver disease, NSAIDs/anticoagulants and alcohol."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["ABCDE, serial observations, FBC/renal/liver/coagulation, group/crossmatch and ECG if appropriate.","Validated pathway risk assessment and urgent endoscopy after resuscitation; unstable bleeding requires immediate specialist intervention."]},{heading:"Management",points:["Emergency help, IV access, monitored resuscitation and blood products according to severity/local protocol, early gastro/surgery input.","Endoscopic haemostasis and cause-specific treatment; suspected varices needs appropriate vasoactive/antibiotic pathway through team.","Review anticoagulation/NSAIDs with senior team; later H. pylori testing/eradication when indicated."]}]}],pages:[76],note:"Peptic ulcer was only a tentative recalled cause; assess all UGIB causes and severity.",adapted:false,set:"2023 · cohort 2018",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-264",diagnoses:["Upper GI bleeding; peptic ulcer queried"],differentials:[],evidence:[{page:76,quote:"case of UGIB (PUD??"}],mode:"document-context",tentative:true},aiNotes:{title:"Upper GI bleeding; peptic ulcer queried",safety:"",refs:[]}},{id:"jcs-265",year:"2023",rotation:"Surgery",topic:"diverticulitis",title:"A 60-year-old man has left lower abdominal pain",case:"A 60-year-old man has left lower abdominal pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask pain onset/localisation, fever, bowel change, bleeding, vomiting, urinary symptoms, prior episodes and immune status."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["General observations and gentle abdominal localisation/guarding/mass; other examination only when indicated."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Vitals, FBC/CRP/renal tests/urine and relevant pregnancy test; CT for complicated/uncertain disease and appropriate secondary-care assessment."]},{heading:"Management",points:["Assess sepsis/peritonism/obstruction for urgent admission; antibiotics and drainage/surgery depend on severity/complications and local pathway.","Selected uncomplicated well patients may have outpatient supportive care with clear review; avoid assuming antibiotics for every mild episode.","Plan appropriate later colonic assessment when indicated; avoid colonoscopy during acute severe inflammation."]}]}],pages:[76],note:"",adapted:false,set:"2023 · cohort 2018",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-265",diagnoses:["Diverticulitis"],differentials:[],evidence:[{page:76,quote:"case of diverticulitis"}],mode:"document-context"},aiNotes:{title:"Diverticulitis",safety:"",refs:[]}},{id:"jcs-266",year:"2023",rotation:"Surgery",topic:"retention",title:"A 64-year-old man has been unable to pass urine for 12 hours",case:"A 64-year-old man has been unable to pass urine for 12 hours.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Clarify the presenting concern, onset, duration, course, severity and effect on daily function.","Ask relevant associated symptoms, previous episodes, medical/surgical history, medicines, allergies and exposures.","Explore the patient's concerns and expectations; obtain collateral history with permission when appropriate."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Identify the key discriminating features in the history and examination, and select investigations to guide clinical reasoning."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Assessment and investigations",points:["Request the relevant examination findings and investigation results.","Select and justify tests using the history and examination."]},{heading:"Care pending assessment",points:["Assess immediate stability and treat urgent symptoms while seeking appropriate senior help for concerning findings.","Agree supportive care, further assessment and review based on the findings.","Explain uncertainty, arrange follow-up and give clear advice about deterioration or new red flags."]}]},{key:"p",label:"Demonstrate or explain the procedure safely",sections:[{heading:"Important points",points:["Clarify the presenting concern, onset, duration, course, severity and effect on daily function.","Ask relevant associated symptoms, previous episodes, medical/surgical history, medicines, allergies and exposures.","Explore the patient's concerns and expectations; obtain collateral history with permission when appropriate.","Introduce yourself, obtain consent, assess pain and record relevant observations; use an age-appropriate, focused examination.","Describe the examination findings and relevant negatives.","Assess immediate stability and treat urgent symptoms while seeking appropriate senior help for concerning findings.","Agree supportive care, further assessment and review based on the findings.","Explain uncertainty, arrange follow-up and give clear advice about deterioration or new red flags."]}]}],pages:[76,77],note:"",adapted:false,set:"2023 · cohort 2018",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A 64-year-old man has been unable to pass urine for 12 hours. Demonstrate Foley catheterisation on a model.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-266",diagnoses:[],differentials:[],evidence:[],mode:"neutral"},aiNotes:{title:"Assessment outline",safety:"",refs:[]}},{id:"jcs-267",year:"2024",rotation:"Medicine",topic:"valves",title:"A 35-year-old man presents with chest pain",case:"A 35-year-old man presents with chest pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Clarify exertional dyspnoea, chest pain, syncope, palpitations and oedema.","Ask rheumatic fever, fever/dental or bloodstream infection, cardiac surgery, valve type, anticoagulants and functional limitation."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Consent, pain check, appropriate exposure; inspect scars, hands and face; pulse rate/rhythm/character and BP.","Assess JVP, apex, heaves/thrills; auscultate all areas with diaphragm/bell and appropriate positioning; time a murmur against pulse.","Describe timing, site, radiation, intensity and associated sounds; examine lung bases and oedema."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["ECG and transthoracic echocardiography to define valve anatomy/severity and ventricular function.","FBC, renal function and chest radiograph if indicated; blood cultures before antibiotics if endocarditis suspected and this does not delay urgent care."]},{heading:"Management",points:["Treat acute instability using ABCDE and urgent cardiology input.","Stable management depends on lesion, severity, symptoms and echo; discuss surveillance versus valve intervention, not a generic drug prescription.","Manage heart failure/arrhythmia and cardiovascular risk with supervision."]}]}],pages:[81],note:"",adapted:false,set:"2024 · cohort 2019",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A 35-year-old man presents with chest pain. A mitral regurgitation murmur and rheumatic heart disease were recalled.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Cardiovascular examination",items:["A mitral-regurgitation murmur is recorded."]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-267",diagnoses:["Rheumatic heart disease / mitral regurgitation"],differentials:[],evidence:[{page:81,quote:"Case of rheumatic heart disease) \n{Mitral regurgitation murmur}"}],mode:"document-context"},aiNotes:{title:"Rheumatic heart disease / mitral regurgitation",safety:"Syncope, acute pulmonary oedema, shock or a new murmur with sepsis needs urgent assessment.",refs:[]}},{id:"jcs-268",year:"2024",rotation:"Medicine",topic:"tb",title:"A 26-year-old woman presents with cough and fever",case:"A 26-year-old woman presents with cough and fever.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask cough duration, sputum/haemoptysis, fever/night sweats, weight loss, contacts, travel/residence, previous TB/treatment and immunosuppression/HIV risk."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Appropriate infection precautions, chest radiograph and sputum molecular testing/microscopy/culture with susceptibility; HIV testing with consent and targeted baseline tests."]},{heading:"Management",points:["Prompt TB/respiratory team and public-health pathway; use a susceptibility-based multidrug regimen, adherence support and monitoring.","Discuss hepatotoxicity and drug interactions; ethambutol-related visual symptoms require urgent review. Do not prescribe a single antibiotic for suspected active TB."]}]}],pages:[81],note:"",adapted:false,set:"2024 · cohort 2019",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-268",diagnoses:["TB"],differentials:[],evidence:[{page:81,quote:"Case of TB"}],mode:"document-context"},aiNotes:{title:"TB",safety:"",refs:[]}},{id:"jcs-269",year:"2024",rotation:"Medicine",topic:"haemoptysis",title:"A 33-year-old man has one week of “coughing blood”",case:"A 33-year-old man has one week of “coughing blood”.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Clarify whether blood was coughed up, vomited or came from elsewhere; assess amount, ongoing bleeding, circulation and associated symptoms. Clarify the discrepancy between the described symptom and the recorded label.","Clarify the presenting concern, onset, duration, course, severity and effect on daily function.","Ask relevant associated symptoms, previous episodes, medical/surgical history, medicines, allergies and exposures.","Explore the patient's concerns and expectations; obtain collateral history with permission when appropriate."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Assessment and investigations",points:["Request the relevant examination findings and investigation results.","Select and justify tests using the history and examination."]},{heading:"Care pending assessment",points:["Assess immediate stability and treat urgent symptoms while seeking appropriate senior help for concerning findings.","Agree supportive care, further assessment and review based on the findings.","Explain uncertainty, arrange follow-up and give clear advice about deterioration or new red flags."]}]}],pages:[82],note:"",adapted:false,set:"2024 · cohort 2019",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-269",diagnoses:["Peptic ulcer (source conflicts with “coughing blood”)"],differentials:[],evidence:[{page:82,quote:"Case of peptic ulcer"}],mode:"neutral"},aiNotes:{title:"Bleeding assessment",safety:"",refs:[]}},{id:"jcs-270",year:"2024",rotation:"Paediatrics",topic:"aom",title:"An eight-month-old has had fever for three days",case:"An eight-month-old has had fever for three days.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask ear pain/fever duration, discharge, hearing change, preceding URTI, age, feeding/hydration, prior infections and medicines/doses already used.","Check mastoid swelling, severe headache, facial weakness, toxic appearance and immunocompromise."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Vitals/hydration, ear examination with appropriate clean speculum and braced hand; bulging inflamed drum/effusion supports AOM."]},{heading:"Management",points:["Appropriate age/weight-based paracetamol or ibuprofen if safe; no aspirin in children. Check exact formulation, dose, interval/max and contraindications in current paediatric formulary rather than guessing.","Many cases are self-limiting; no/back-up/immediate antibiotics depend on age, severity, duration, otorrhoea/bilateral disease and risk per local guidance.","Urgent care for mastoiditis/systemic complication; reassess if worsening/not improving."]}]}],pages:[82],note:"",adapted:false,set:"2024 · cohort 2019",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-270",diagnoses:["Acute otitis media"],differentials:[],evidence:[{page:82,quote:"Case of acute otitis media"}],mode:"document-context"},aiNotes:{title:"Acute otitis media",safety:"",refs:["aom"]}},{id:"jcs-271",year:"2024",rotation:"Paediatrics",topic:"jia",title:"A five-year-old has an abnormal gait",case:"A five-year-old has an abnormal gait.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask swelling, morning stiffness, limp, duration (often ≥6 weeks for classification), systemic fever/rash and impact on play/school.","Assess eye symptoms (uveitis may be silent), psoriasis/IBD features and infection/trauma."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Paediatric rheumatology assessment; FBC/inflammation and selected antibodies/imaging help subtype/exclude alternatives, not one diagnostic blood test."]},{heading:"Management",points:["Physiotherapy/OT and appropriate anti-inflammatory treatment; disease-modifying medicines/biologics through specialists.","Ophthalmology slit-lamp screening according to risk; joint/growth monitoring and family/school support."]}]}],pages:[82,83],note:"",adapted:false,set:"2024 · cohort 2019",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-271",diagnoses:["JIA"],differentials:[],evidence:[{page:83,quote:"Case of JIA"}],mode:"document-context"},aiNotes:{title:"JIA",safety:"",refs:[]}},{id:"jcs-272",year:"2024",rotation:"Paediatrics",topic:"cf",title:"A ten-month-old presents with failure to thrive",case:"A ten-month-old presents with failure to thrive.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask recurrent chest infection/chronic cough, greasy bulky stools, feeding/growth, meconium ileus, salt-loss symptoms, siblings and screening results."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Growth/nutrition and respiratory assessment, sweat chloride at an experienced centre and CFTR testing; relevant sputum/other testing.","For family counselling confirm both parental and child variants; CF is autosomal recessive."]},{heading:"Management",points:["Specialist CF team: airway clearance, infection treatment, nutrition/pancreatic enzymes and fat-soluble vitamins when needed; genotype-appropriate modulators through specialists.","If both parents are carriers: 25% affected, 50% carrier, 25% neither each pregnancy; offer genetic/reproductive counselling and partner testing."]}]}],pages:[83],note:"",adapted:false,set:"2024 · cohort 2019",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-272",diagnoses:["Cystic fibrosis"],differentials:[],evidence:[{page:83,quote:"Case of cystic fibrosis"}],mode:"document-context"},aiNotes:{title:"Cystic fibrosis",safety:"",refs:[]}},{id:"jcs-273",year:"2024",rotation:"Psychiatry",topic:"selfharm",title:"A 29-year-old woman is referred from the emergency department for a detailed risk/safety assessment",case:"A 29-year-old woman is referred from the emergency department for a detailed risk/safety assessment.",objectives:[{key:"r",label:"Perform a detailed psychosocial and safety assessment",sections:[{heading:"Elicit and formulate safety needs",points:["Attend physical injury/possible ingestion first; ask what happened, timing, intent, planning, expected lethality, substances, rescue and regret.","Ask current suicidal thoughts, plans/means, past attempts, triggers, supports, trauma/abuse, vulnerability and protective factors.","Explore long-standing emotion/interpersonal difficulties non-judgementally; do not diagnose a personality disorder from cutting alone.","Physical/toxicology assessment guided by injury/ingestion, MSE and comprehensive psychosocial formulation.","Do not use a numerical risk score or low/medium/high category to predict suicide or decide discharge."]},{heading:"Act on findings",points:["Immediate intent, serious injury/poisoning or inability to maintain safety: urgent emergency/crisis assessment and appropriate observation/support.","Collaborative safety plan: warning signs, coping, trusted contacts, crisis access and reducing access to lethal means.","Arrange timely aftercare and evidence-based therapy; structured therapies such as DBT may be considered for recurrent self-harm/emotion dysregulation. Do not prescribe solely to treat a personality label."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Physical/toxicology assessment guided by injury/ingestion, MSE and comprehensive psychosocial formulation.","Do not use a numerical risk score or low/medium/high category to predict suicide or decide discharge."]},{heading:"Management",points:["Immediate intent, serious injury/poisoning or inability to maintain safety: urgent emergency/crisis assessment and appropriate observation/support.","Collaborative safety plan: warning signs, coping, trusted contacts, crisis access and reducing access to lethal means.","Arrange timely aftercare and evidence-based therapy; structured therapies such as DBT may be considered for recurrent self-harm/emotion dysregulation. Do not prescribe solely to treat a personality label."]}]}],pages:[83],note:"Borderline personality disorder is named in the recall, but cannot be established from this referral alone.",adapted:false,set:"2024 · cohort 2019",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-273",diagnoses:["Borderline personality disorder (collector’s label)"],differentials:[],evidence:[{page:83,quote:"Case of borderline personality disorder"}],mode:"document-context"},aiNotes:{title:"Borderline personality disorder",safety:"",refs:["selfharm"]}},{id:"jcs-274",year:"2024",rotation:"Psychiatry",topic:"dementia",title:"An 80-year-old man presents with forgetfulness. His son is available for a collateral history",case:"An 80-year-old man presents with forgetfulness. His son is available for a collateral history.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Obtain patient and collateral accounts with permission: gradual versus acute/fluctuating onset, memory/language/executive changes and daily function.","Ask mood, psychosis, medicines, alcohol, neurological events, sensory problems, driving, finances, medication safety and caregiver needs."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Physical/neurological exam, validated language/culture-appropriate cognitive assessment, sensory review and collateral.","Reversible-cause blood tests and specialist-selected structural imaging; refer to memory/neurology service as appropriate."]},{heading:"Management",points:["Agree support, medication simplification, safeguarding/driving assessment and advance planning while preserving autonomy.","Specialist subtype-based medication: cholinesterase inhibitors and/or memantine when indicated; discuss adverse effects and limits.","Support caregivers and arrange community/functional assessment."]}]}],pages:[84],note:"",adapted:false,set:"2024 · cohort 2019",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"An 80-year-old man has forgetfulness; take history from his son and discuss care.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-274",diagnoses:["Dementia"],differentials:[],evidence:[{page:84,quote:"Case of dementia"}],mode:"document-context"},aiNotes:{title:"Dementia",safety:"",refs:[]}},{id:"jcs-275",year:"2024",rotation:"Psychiatry",topic:"depression",title:"A 19-year-old has sleep disturbance for two weeks",case:"A 19-year-old has sleep disturbance for two weeks.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask low mood/anhedonia, duration, sleep, appetite/weight, energy, concentration, guilt, function and psychotic symptoms.","Screen previous mania/hypomania, substances, medicines, physical causes and stressors.","Directly ask self-harm/suicide thoughts, intent, plans, access to means, previous acts, supports and immediate safety."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["MSE, psychosocial/risk formulation and targeted physical investigation (e.g. FBC/thyroid if indicated).","Severity is clinical and functional, not determined by a questionnaire alone."]},{heading:"Management",points:["Collaborative safety plan and urgent crisis help if immediate risk; do not leave someone at imminent risk unsupported.","Discuss psychological therapy, social/activity/sleep support and antidepressants depending on severity/preferences and local guidance.","If an SSRI is considered, explain delayed benefit, GI/sexual effects, activation, discontinuation and early review; reconsider antidepressant monotherapy if bipolar disorder suspected."]}]}],pages:[84],note:"",adapted:false,set:"2024 · cohort 2019",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-275",diagnoses:["Depression"],differentials:[],evidence:[{page:84,quote:"Case of depression"}],mode:"document-context"},aiNotes:{title:"Depression",safety:"Current intent/plan, inability to maintain safety, severe self-neglect or psychosis needs urgent specialist assessment.",refs:[]}},{id:"jcs-276",year:"2024",rotation:"FAMCO",topic:"back",title:"A 40-year-old man presents with back pain",case:"A 40-year-old man presents with back pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Characterise onset, trauma/lifting, radiation, mechanical/inflammatory features, neurological symptoms and functional limitation.","Ask cancer/infection/steroid risks and red flags: saddle sensory change, new bladder/bowel/sexual dysfunction, bilateral weakness or systemic illness."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["No routine imaging for uncomplicated mechanical pain; investigate red flags and consider MRI when it changes management.","Urgent emergency MRI/spinal pathway if cauda equina or cord compression suspected."]},{heading:"Management",points:["Explain likely cause after assessment; encourage activity, avoid prolonged bed rest, offer supported exercise/physiotherapy and suitable analgesia after contraindication review.","Progressive deficit, suspected compression, infection or fracture requires urgent specialist assessment."]}]}],pages:[84,85],note:"",adapted:false,set:"2024 · cohort 2019",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-276",diagnoses:["Disc herniation"],differentials:[],evidence:[{page:85,quote:"Case of disc herniation"}],mode:"document-context"},aiNotes:{title:"Disc herniation",safety:"New saddle symptoms or bladder/bowel dysfunction with back/radicular symptoms requires emergency assessment.",refs:[]}},{id:"jcs-277",year:"2024",rotation:"FAMCO",topic:"anc",title:"A 27-year-old pregnant woman attends her booking appointment",case:"A 27-year-old pregnant woman attends her booking appointment.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Confirm pregnancy/LMP, cycle regularity, gestation and red flags; ask previous pregnancies/complications, medical/surgical/genetic history, medicines/allergies and support.","Assess smoking/alcohol/substances, mental health, domestic safety sensitively, infection/travel risks and patient preferences."]}]},{key:"c",label:"Counsel the patient or family",sections:[{heading:"Explain and agree a plan",points:["Promote informed choices, confidentiality, who to contact for bleeding, pain, severe headache or reduced fetal movements when applicable.","Review medicines for pregnancy safety, folic acid and other supplementation per risk/local guidance; healthy diet/activity and food/infection precautions.","Treat confirmed bacteriuria with pregnancy-appropriate antibiotics and follow-up culture per policy; assess/treat anaemia.","Explain visit schedule, maternity record/green card, screening choices and red flags; no live rubella/MMR vaccine during pregnancy—plan postpartum if non-immune."]}]}],pages:[85],note:"",adapted:false,set:"2024 · cohort 2019",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"A 27-year-old pregnant woman attends her booking visit and requests a green card/maternity record.",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[{heading:"Patient’s request",items:["She requests a green card."]}],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-277",diagnoses:[],differentials:[],evidence:[],mode:"neutral"},aiNotes:{title:"Antenatal booking",safety:"",refs:["anc"]}},{id:"jcs-278",year:"2024",rotation:"Oral health",topic:"aphthous",title:"A 27-year-old woman has recurrent mouth ulcers",case:"A 27-year-old woman has recurrent mouth ulcers.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask recurrence, duration, pain, site, trauma, systemic/genital/eye/GI symptoms, medicines, diet/anaemia and immunosuppression."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Oral examination; FBC/ferritin/B12/folate and cause-directed tests if recurrent/severe/systemic features.","Persistent unexplained ulcer beyond about 3 weeks or suspicious induration requires urgent dental/oral specialist assessment."]},{heading:"Management",points:["Pain relief, avoid trauma/irritants and maintain oral hygiene; topical anti-inflammatory treatment such as an oral corticosteroid preparation when diagnosis supports it.","Correct documented deficiency and investigate systemic disease; do not give antibiotics for uncomplicated aphthae."]}]}],pages:[85,86],note:"",adapted:false,set:"2024 · cohort 2019",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-278",diagnoses:["Aphthous ulcer"],differentials:[],evidence:[{page:86,quote:"Case of aphthous ulcer"}],mode:"document-context"},aiNotes:{title:"Aphthous ulcer",safety:"",refs:[]}},{id:"jcs-279",year:"2024",rotation:"Ophthalmology",topic:"redeye",title:"A 36-year-old woman has one day of eye pain and redness",case:"A 36-year-old woman has one day of eye pain and redness.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask pain, photophobia, acuity loss, discharge/itch, contact lenses, trauma/chemical exposure, headache/haloes/nausea and prior episodes."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Assess acuity, pupils, corneal appearance and pressure using appropriate equipment and expertise; describe the examination findings."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Urgent assessment",points:["Check visual acuity, pupils, cornea and pressure through a trained clinician; obtain immediate ophthalmology assessment urgently."]},{heading:"Management",points:["Follow the eye team's acute angle-closure protocol for urgent pressure reduction and definitive treatment; do not substitute topical steroid alone or delay referral."]}]}],pages:[86],note:"",adapted:false,set:"2024 · cohort 2019",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-279",diagnoses:["Acute angle-closure glaucoma"],differentials:[],evidence:[{page:86,quote:"Case of acute angle closure glaucoma"}],mode:"document-context"},aiNotes:{title:"Acute angle-closure glaucoma",safety:"",refs:[]}},{id:"jcs-280",year:"2024",rotation:"Orthopaedics",topic:"scaphoid",title:"A 23-year-old man has right hand pain",case:"A 23-year-old man has right hand pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask FOOSH, radial-sided pain, timing, dominant hand, function and prior injury; assess trauma elsewhere."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect swelling, assess anatomical snuffbox and scaphoid tubercle tenderness gently, wrist movement only as safe, and distal neurovascular status."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Appropriate wrist/scaphoid imaging; MRI is considered early when suspicion persists per pathway; CT for selected union/displacement questions."]},{heading:"Management",points:["Immobilise if suspected and arrange timely fracture/hand review even if initial radiographs are normal.","Management depends on site/displacement/vascular risk; selected injuries need fixation.","Discuss nonunion, avascular necrosis (particularly proximal pole), collapse and arthritis; smoking cessation helps healing."]}]}],pages:[86],note:"",adapted:false,set:"2024 · cohort 2019",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-280",diagnoses:["Scaphoid fracture"],differentials:[],evidence:[{page:86,quote:"Case of scaphoid fracture"}],mode:"document-context"},aiNotes:{title:"Scaphoid fracture",safety:"",refs:["fracture"]}},{id:"jcs-281",year:"2024",rotation:"Orthopaedics",topic:"ulnar",title:"A 34-year-old man has hand weakness",case:"A 34-year-old man has hand weakness.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask ring/little finger numbness, grip/fine motor problems, elbow flexion/pressure, trauma, job and neck symptoms."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Inspect intrinsic wasting/clawing, test finger abduction/adduction and Froment sign; map palmar and dorsal ulnar sensation.","Assess FCU/FDP as relevant, other nerves and cervical findings; localise using the whole pattern."]}]},{key:"d",label:"Discuss the differential diagnosis",sections:[{heading:"Clinical reasoning",points:["Relate the documented diagnosis to the history, examination and investigation findings."]}]},{key:"m",label:"Outline investigations and management",sections:[{heading:"Investigations",points:["Clinical localisation and nerve conduction/EMG when indicated; imaging for structural/traumatic concern."]},{heading:"Management",points:["Avoid prolonged elbow flexion/pressure, ergonomic/night positioning support; specialist review for progressive weakness/wasting or persistent significant symptoms.","Discuss selected decompression/transposition with hand/orthopaedic team."]}]}],pages:[87],note:"",adapted:false,set:"2024 · cohort 2019",images:[],taskType:"history-and-assessment",caseReviewed:true,recallContext:"",imageStage:"candidate",recallContextOrigin:"assistant-paraphrase",furtherInfo:[],documentInfoOrigin:"station-specific-source-backed-paraphrase-and-original-images",diagnosticGrounding:{id:"jcs-281",diagnoses:["Cubital tunnel syndrome"],differentials:[],evidence:[{page:87,quote:"Case of cubital tunnel syndrome"}],mode:"document-context"},aiNotes:{title:"Cubital tunnel syndrome",safety:"",refs:[]}},{id:"jcs-282",year:"2024",rotation:"Surgery",topic:"cholecystitis",title:"A 30-year-old man has right upper abdominal pain",case:"A 30-year-old man has right upper abdominal pain.",objectives:[{key:"h",label:"Take a focused history",sections:[{heading:"Important points",points:["Ask RUQ pain duration/radiation, fever, vomiting, food association, jaundice, dark urine/pale stool and prior episodes.","Assess sepsis and distinguish pancreatitis/cholangitis; review pregnancy/medicines/comorbidity."]}]},{key:"e",label:"Perform the relevant examination",sections:[{heading:"Important points",points:["Assess general/sepsis signs, jaundice and gent
